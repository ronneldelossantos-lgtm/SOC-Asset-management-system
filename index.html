function cageInventoryShipment(cage){
  if(!cage) return null;
  const shipments=DB.cages.filter(cg=>cg.status!=='Received'&&((cage.currentShipmentId&&cg.id===cage.currentShipmentId)||(cg.cageAssetId&&cg.cageAssetId===cage.id)||cageAssetTagKey(cg.cageAssetTag||cg.cageId)===cageAssetTagKey(cage.assetTag)));
  return shipments.slice().sort((a,b)=>(Date.parse(b.dispatchedAt||'')||0)-(Date.parse(a.dispatchedAt||'')||0))[0]||null;
}
function cageInventoryCurrentLocation(cage){
  const shipment=cageInventoryShipment(cage);
  if(shipment) return cageDestinationName(shipment)||cage.location||cage.soc||'';
  const receipt=cageInventoryLatestReceipt(cage);
  return receipt?(receipt.receivedHubName||cageDestinationName(receipt)||cage.location||cage.soc||''):(cage.location||cage.soc||'');
}
function cageInventoryEffectiveStatus(cage){
  if(cageInventoryShipment(cage)) return 'In Transit';
  const receipt=cageInventoryLatestReceipt(cage);
  if(receipt){
    const receivedAt=Date.parse(receipt.receivedAt||'')||0;
    const issuedAt=Date.parse(cage.lastIssuedAt||'')||0;
    if(receivedAt>=issuedAt){
      if(receipt.receivedByRole==='hub') return 'At HUB';
      const destination=receipt.receivedHubName||cageDestinationName(receipt)||'';
      if(cageDestinationType(receipt)==='HUB') return 'At HUB';
      return cageAssetTagKey(destination)===cageAssetTagKey(cage.soc)?'Available':'At SOC';
    }
  }
  return cage.status||'Available';
}
function cageInventoryStatusTag(cage){
  const status=cageInventoryEffectiveStatus(cage);
  if(status==='Available') return '<span class="tag tag-ok">Available at SOC</span>';
  if(status==='In Transit') return '<span class="tag tag-pending">In Transit</span>';
  if(status==='At SOC') return '<span class="tag tag-approved">At destination SOC</span>';
  return '<span class="tag tag-approved">At HUB</span>';
}
function cageInventoryLatestReceipt(cage){
  if(!cage) return null;
  const tag=cageAssetTagKey(cage.assetTag);
  return (DB.cages||[]).filter(cg=>cg.status==='Received'&&((cg.cageAssetId&&cg.cageAssetId===cage.id)||(tag&&cageAssetTagKey(cg.cageAssetTag||cg.cageId)===tag))).slice().sort((a,b)=>new Date(b.receivedAt||0)-new Date(a.receivedAt||0))[0]||null;
}
function cageMasterlistRowsHtml(query){
  const q=String(query||'').trim().toLowerCase();
  const rows=cageMasterlistVisibleRows().slice().sort((a,b)=>String(a.assetTag||'').localeCompare(String(b.assetTag||''))).filter(c=>{
    if(!q) return true;
    const shipment=cageInventoryShipment(c);
    const lastReceipt=cageInventoryLatestReceipt(c);
    return [c.assetTag,c.soc,c.status,c.location,shipment&&shipment.lhTripNumber,shipment&&shipment.hubName,lastReceipt&&lastReceipt.lhTripNumber,lastReceipt&&lastReceipt.hubName,lastReceipt&&lastReceipt.receivedHubName].some(v=>String(v||'').toLowerCase().includes(q));
  });
  if(!rows.length) return '<div class="empty"><div class="ic">&#128230;</div>No cages in the masterlist match your search.</div>';
  return '<div class="tbl-wrap"><table><tr><th>Asset tag</th><th>SOC</th><th>Status</th><th>Current location / destination</th><th>Last received / returned</th><th>Added</th><th></th></tr>'+rows.map(c=>{
    const shipment=cageInventoryShipment(c);
    const lastReceipt=cageInventoryLatestReceipt(c);
    const status=cageInventoryStatusTag(c);
    const receivedLocation=lastReceipt&&(lastReceipt.hubName||lastReceipt.receivedHubName);
    const location=shipment?'To '+cageDestinationLabel(shipment):(c.location?'At '+c.location:(receivedLocation?'At '+receivedLocation:(c.soc||'—')));
    const effectiveStatus=cageInventoryEffectiveStatus(c);
    const action=!canManageCageMasterlistItem(c)?'<span class="small-note">View only</span>':effectiveStatus==='Available'?`<button class="btn btn-sm" onclick="openEditCageMasterlistTag('${esc(c.id)}')">Edit tag</button>`:(effectiveStatus==='At HUB'||effectiveStatus==='At SOC')?`<button class="btn btn-sm" onclick="openReturnCageToSourceSoc('${esc(c.id)}')">Return to source SOC</button>`:'<span class="small-note">Away</span>';
    const deleteAction=session.role==='admin'?` <button class="icon-btn" title="Delete cage from masterlist" aria-label="Delete cage ${esc(c.assetTag)} from masterlist" ${effectiveStatus!=='Available'?'disabled':''} onclick="deleteCageMasterlistItem('${esc(c.id)}')">&times;</button>`:'';
    const lastMovedAt=c.lastReturnedAt||c.lastReceivedAt;
    return `<tr><td class="mono">${esc(c.assetTag)}</td><td>${esc(c.soc||'—')}</td><td>${status}</td><td>${esc(location)}${shipment?`<div class="small-note">Trip ${esc(shipment.lhTripNumber||'—')}</div>`:''}</td><td>${lastMovedAt?fmtDateTime(lastMovedAt):'<span class="small-note">—</span>'}</td><td>${c.addedAt?fmtDateTime(c.addedAt):'<span class="small-note">—</span>'}</td><td>${action}${deleteAction}</td></tr>`;
  }).join('')+'</table></div>';
}
function renderCageMasterlistRows(){
  const rowsEl=document.getElementById('cage-masterlist-rows');
  const searchEl=document.getElementById('cage-masterlist-search');
  if(rowsEl) rowsEl.innerHTML=cageMasterlistRowsHtml(searchEl?searchEl.value:'');
}
function deleteCageMasterlistItem(id){
  if(!session||session.role!=='admin') return;
  const cage=DB.cageMasterlist.find(item=>item.id===id);
  if(!cage) return;
  if(cageInventoryEffectiveStatus(cage)!=='Available'){
    toast('Only cages available at their source SOC can be deleted from the masterlist.');
    return;
  }
  confirmAction(`Delete cage ${cage.assetTag} from the masterlist? Its cage log history will be kept. This cannot be undone.`,async()=>{
    let unavailable=false;
    const saved=await saveDBWithRetry(()=>{
      const current=DB.cageMasterlist.find(item=>item.id===id);
      if(!current||cageInventoryEffectiveStatus(current)!=='Available'){unavailable=true;return;}
      DB.cageMasterlist=DB.cageMasterlist.filter(item=>item.id!==id);
    });
    if(!saved){restoreCageSectionsAfterFailedSave();return;}
    if(unavailable){toast('This cage is no longer available at its source SOC. Refreshing the masterlist.');navigate('cageloading','masterlist');return;}
    toast('Cage removed from the masterlist. Its log history was kept.');
    navigate('cageloading','masterlist');
  });
}
function openReturnCageToSourceSoc(id){
  const cage=(DB.cageMasterlist||[]).find(item=>item.id===id);
  if(!cage||!canManageCageMasterlistItem(cage)||!['At HUB','At SOC'].includes(cageInventoryEffectiveStatus(cage))){toast('Only the source SOC can confirm a cage return from its destination.');return;}
  showModal(`<h3>Return cage to ${esc(cage.soc||'source SOC')}</h3><div class="card-sub">Scan the cage asset tag after it physically arrives back at its original SOC.</div><div class="field" style="margin-top:14px;"><label>Cage asset tag</label><input id="return-cage-to-soc-tag" placeholder="Scan ${esc(cage.assetTag)}"></div><div class="footer-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmReturnCageToSourceSoc('${esc(cage.id)}')">Confirm return</button></div>`);
  const input=document.getElementById('return-cage-to-soc-tag');
  if(input) input.focus();
}
async function confirmReturnCageToSourceSoc(id){
  const input=document.getElementById('return-cage-to-soc-tag');
  const scannedTag=(input&&input.value||'').trim();
  if(!scannedTag){toast('Scan the cage asset tag to confirm its return.');if(input)input.focus();return;}
  let unavailable=false,tagMismatch=false;
  const returnedAt=nowISO();
  const applyReturn=()=>{
    unavailable=false;tagMismatch=false;
    const cage=(DB.cageMasterlist||[]).find(item=>item.id===id);
    if(!cage||!canManageCageMasterlistItem(cage)||!['At HUB','At SOC'].includes(cageInventoryEffectiveStatus(cage))){unavailable=true;return;}
    if(cageAssetTagKey(scannedTag)!==cageAssetTagKey(cage.assetTag)){tagMismatch=true;return;}
    cage.status='Available';
    cage.currentShipmentId='';
    cage.location=cage.soc||'';
    cage.lastReceivedAt=returnedAt;
    cage.lastReturnedAt=returnedAt;
    cage.lastReturnedBy=session.fullName;
  };
  const saved=await saveDBWithRetry(applyReturn);
  if(!saved){restoreCageSectionsAfterFailedSave();return;}
  if(unavailable){toast('This cage is no longer recorded at a HUB. Refreshing the masterlist.');closeModal();navigate('cageloading','masterlist');return;}
  if(tagMismatch){toast('The scanned tag does not match this cage. Check the tag and try again.');if(input){input.value='';input.focus();}return;}
  const cage=(DB.cageMasterlist||[]).find(item=>item.id===id);
  closeModal();
  toast('Cage '+(cage&&cage.assetTag||scannedTag)+' returned to '+(cage&&cage.soc||'its source SOC')+' and is available in the masterlist.');
  navigate('cageloading','masterlist');
}
function restoreCageSectionsAfterFailedSave(){
  ['cages','cageMasterlist','cageCycleCounts','counters'].forEach(key=>{
    const snapshot=lastKnownSnapshot[key];
    DB[key]=snapshot?JSON.parse(snapshot):defaultDB()[key];
  });
  migrateDB();
}
async function addCagesToMasterlist(){
  if(session.role==='hub'){toast('HUB accounts can view the cage masterlist but cannot add inventory.');return;}
  const input=document.getElementById('new-cage-asset-tags');
  if(!input) return;
  const tags=input.value.split(/[,;\n]+/).map(tag=>tag.trim()).filter(Boolean);
  if(!tags.length){toast('Enter or scan at least one cage asset tag.');return;}
  const duplicateInput=tags.filter((tag,i)=>tags.findIndex(other=>cageAssetTagKey(other)===cageAssetTagKey(tag))!==i);
  if(duplicateInput.length){toast('Remove duplicate tags from this list: '+[...new Set(duplicateInput)].join(', '));return;}
  const existing=new Set(DB.cageMasterlist.map(c=>cageAssetTagKey(c.assetTag)));
  const alreadyAdded=tags.filter(tag=>existing.has(cageAssetTagKey(tag)));
  if(alreadyAdded.length){toast('Already in the cage masterlist: '+alreadyAdded.join(', '));return;}
  const soc=session.role==='admin'?(document.getElementById('cage-inventory-soc')||{}).value||'':currentSoc();
  if(!soc){toast(session.role==='admin'?'Select an SOC before adding cage inventory.':'Your login has no assigned SOC. Ask an admin to assign one before adding cages.');return;}
  let collision=[];
  const applyAdd=()=>{
    collision=[];
    const latest=new Set(DB.cageMasterlist.map(c=>cageAssetTagKey(c.assetTag)));
    collision=tags.filter(tag=>latest.has(cageAssetTagKey(tag)));
    if(collision.length) return;
    tags.forEach(assetTag=>DB.cageMasterlist.push({id:nextCode('CGA','cga'),assetTag,soc,status:'Available',addedAt:nowISO(),addedBy:session.fullName,currentShipmentId:'',location:soc,lastIssuedAt:'',lastReceivedAt:''}));
  };
  const saved=await saveDBWithRetry(applyAdd);
  if(!saved){restoreCageSectionsAfterFailedSave();return;}
  if(collision.length){toast('Another user added these tags first: '+collision.join(', '));return;}
  input.value='';
  toast('Added '+tags.length+' cage(s) to the masterlist.');
  navigate('cageloading','masterlist');
}
function openEditCageMasterlistTag(id){
  const cage=DB.cageMasterlist.find(c=>c.id===id);
  if(!cage||!canManageCageMasterlistItem(cage)||cage.status!=='Available'){toast('Only available cages at the source SOC can be edited.');return;}
  showModal(`<h3>Edit cage asset tag</h3><div class="card-sub">This cage must be available before its asset tag can be changed.</div><div class="field" style="margin-top:14px;"><label>Asset tag</label><input id="edit-cage-masterlist-tag" value="${esc(cage.assetTag)}"></div><div class="footer-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCageMasterlistTag('${esc(cage.id)}')">Save tag</button></div>`);
}
async function saveCageMasterlistTag(id){
  const input=document.getElementById('edit-cage-masterlist-tag');
  const cage=DB.cageMasterlist.find(c=>c.id===id);
  if(!input||!cage||!canManageCageMasterlistItem(cage)) return;
  const assetTag=input.value.trim();
  if(!assetTag){toast('Enter a cage asset tag.');return;}
  let unavailable=false,duplicate=false;
  const applyEdit=()=>{
    unavailable=false;duplicate=false;
    const current=DB.cageMasterlist.find(c=>c.id===id);
    if(!current||current.status!=='Available'){unavailable=true;return;}
    duplicate=DB.cageMasterlist.some(c=>c.id!==id&&cageAssetTagKey(c.assetTag)===cageAssetTagKey(assetTag));
    if(!duplicate) current.assetTag=assetTag;
  };
  const saved=await saveDBWithRetry(applyEdit);
  if(!saved){restoreCageSectionsAfterFailedSave();return;}
  if(unavailable){toast('This cage is now in transit. Its tag was not changed.');closeModal();navigate('cageloading','masterlist');return;}
  if(duplicate){toast('That asset tag is already in the cage masterlist.');return;}
  closeModal();toast('Cage asset tag updated.');navigate('cageloading','masterlist');
}
function exportCages(){
  const rows = cageLogVisibleRows().map(cg=>[cg.cageAssetTag||cg.cageId,cg.id,cg.lhTripNumber||'',cageDestinationType(cg),cageDestinationName(cg),cg.plateNumber||'',cg.issuedBy||'',cg.status||'In Transit',fmtDateTime(cg.dispatchedAt),cg.receivedAt?fmtDateTime(cg.receivedAt):'',cg.receivedBy||'',cg.receivedLhTripNumber||'',cg.receivedHubName||'']);
  downloadCSV('cage-loading-log.csv', ['Cage Asset Tag','Load Ref','LH Trip #','Destination Type','Destination','Plate #','Issued By','Status','Issued','Received At','Received By','Received LH Trip #','Received Location'], rows);
}
/* ---------- Cage Cycle Count: count physical cage assets at their current
   SOC or HUB location. The masterlist remains owned by its source SOC while
   the location follows the cage to the destination HUB. ---------- */
let cageCycleScanned = []; // cage asset tags scanned so far this count session
let cageCycleScanTimer = null;
let cageAmsCycleScanned = []; // loaded AMS tags scanned so far this count session
let cageAmsCycleScanTimer = null;
function cageCycleCountInventory(){
  const scope=session&&session.role==='hub'?cageCurrentDestinationName():currentSoc();
  return (DB.cageMasterlist||[]).filter(cage=>{
    const location=cageInventoryCurrentLocation(cage);
    return !scope||cageAssetTagKey(location)===cageAssetTagKey(scope);
  }).filter(cage=>String(cage.assetTag||'').trim()).slice().sort((a,b)=>String(a.assetTag||'').localeCompare(String(b.assetTag||'')));
}

  const locationLabel=(session&&session.role==='hub'?cageCurrentDestinationName():currentSoc())||'all SOC and HUB locations';
  const expected=cageCycleCountInventory();
  return `<div class="card">
    <h3>Scan cage asset tags on hand</h3>
    <div class="card-sub">Expected cages are based on current location: <b>${esc(locationLabel)}</b>. Cages issued to a HUB stay on their source SOC masterlist and appear in the count for their destination HUB.</div>
    <div class="field scan-field">
      <label>Cage asset tag</label>
      <input id="cage-cyclecount-scan" placeholder="Scan cage asset tag" oninput="onCageCycleScanInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();addCageCycleScan();}">
    </div>
    <div class="field" style="max-width:260px;margin-top:10px;"><label>Counted by</label><input id="cage-cyclecount-by" value="${esc(session.fullName)}"></div>
    <div class="footer-actions">
      <button class="btn" onclick="cageCycleScanned=[];refreshCageCycleCountView();">Clear scanned</button>
      <button class="btn btn-primary" onclick="saveCageCycleCount()">Save cycle count</button>
    </div>
  </div>
  <div class="card">
    <div class="list-head"><h3>Expected cages at ${esc(locationLabel)} (${expected.length})</h3></div>
    ${expected.length===0?'<div class="empty"><div class="ic">&#128230;</div>No cages are currently assigned to this location.</div>':'<div class="tbl-wrap"><table><tr><th>Cage asset tag</th><th>Source SOC</th><th>Current location</th><th>Status</th></tr>'+expected.map(c=>`<tr><td class="mono">${esc(c.assetTag)}</td><td>${esc(c.soc||'—')}</td><td>${esc(cageInventoryCurrentLocation(c)||'—')}</td><td>${cageInventoryStatusTag(c)}</td></tr>`).join('')+'</table></div>'}
  </div>
  <div id="cage-cyclecount-summary"></div>
  <div class="card">
    <h3>AMS cargo tag check</h3>
    <div class="card-sub">This check compares AMS tags scanned at the source SOC with tags on cages that have not yet been received.</div>
    <div class="field scan-field"><label>AMS tag</label><input id="cage-ams-cyclecount-scan" placeholder="Scan AMS tag" oninput="onCageAmsCycleScanInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();addCageAmsCycleScan();}"></div>
    <div class="field" style="max-width:260px;margin-top:10px;"><label>Counted by</label><input id="cage-ams-cyclecount-by" value="${esc(session.fullName)}"></div>
    <div class="footer-actions"><button class="btn" onclick="cageAmsCycleScanned=[];refreshCageAmsCycleCountView();">Clear scanned</button><button class="btn btn-primary" onclick="saveCageAmsCycleCount()">Save AMS tag check</button></div>
    <div id="cage-ams-cyclecount-summary" style="margin-top:14px;"></div>
  </div>
  <div class="card">
    <div class="list-head"><h3>Recent cycle counts</h3>${dlBtn('exportCageCycleCounts')}</div>
    <div id="cage-cyclecount-history">${cageCycleCountHistoryHtml()}</div>
  </div>`;
}
function cageExpectedAmsTags(){
  const seen = new Set();
  socFilter(DB.cages).filter(cg=>cg.status!=='Received').forEach(cg=>cageCargoAmsTagsOf(cg).forEach(tag=>{ if(tag) seen.add(tag); }));
  return seen;
}
function onCageAmsCycleScanInput(){
  const el=document.getElementById('cage-ams-cyclecount-scan');
  if(!el) return;
  clearTimeout(cageAmsCycleScanTimer);
  const value=el.value.trim();
  if(!value) return;
  cageAmsCycleScanTimer=setTimeout(()=>{
    const current=document.getElementById('cage-ams-cyclecount-scan');
    if(current&&current.value.trim()===value) addCageAmsCycleScan();
  },150);
}
function addCageAmsCycleScan(){
  clearTimeout(cageAmsCycleScanTimer);
  const el=document.getElementById('cage-ams-cyclecount-scan');
  const value=(el?el.value:'').trim();
  if(!value){toast('Scan or enter an AMS tag first.');return;}
  if(cageAmsCycleScanned.some(tag=>String(tag).trim().toUpperCase()===value.toUpperCase())){toast('That AMS tag has already been scanned this check.');if(el){el.value='';el.focus();}return;}
  cageAmsCycleScanned.push(value);
  if(el){el.value='';el.focus();}
  refreshCageAmsCycleCountView();
}
function removeCageAmsCycleScan(index){cageAmsCycleScanned.splice(index,1);refreshCageAmsCycleCountView();}
function refreshCageAmsCycleCountView(){
  const el=document.getElementById('cage-ams-cyclecount-summary');
  if(!el) return;
  const expected=[...cageExpectedAmsTags()];
  const expectedKeys=new Set(expected.map(tag=>String(tag).toUpperCase()));
  const scannedKeys=new Set(cageAmsCycleScanned.map(tag=>String(tag).toUpperCase()));
  const matched=cageAmsCycleScanned.filter(tag=>expectedKeys.has(String(tag).toUpperCase()));
  const unexpected=cageAmsCycleScanned.filter(tag=>!expectedKeys.has(String(tag).toUpperCase()));
  const missing=expected.filter(tag=>!scannedKeys.has(String(tag).toUpperCase()));
  el.innerHTML=`<div class="grid g3" style="margin-bottom:14px;"><div class="metric"><div class="lbl">Expected AMS tags</div><div class="val">${expected.length}</div></div><div class="metric success"><div class="lbl">Matched</div><div class="val">${matched.length}</div></div><div class="metric ${unexpected.length?'danger':''}"><div class="lbl">Unexpected</div><div class="val">${unexpected.length}</div></div></div>
    <div class="section-title">Scanned this check (${cageAmsCycleScanned.length})</div>
    ${cageAmsCycleScanned.length===0?'<div class="empty"><div class="ic">&#128230;</div>No AMS tags scanned yet.</div>':'<div class="tbl-wrap" style="max-height:220px;overflow-y:auto;"><table><tr><th>#</th><th>AMS tag</th><th>Result</th><th></th></tr>'+cageAmsCycleScanned.map((tag,index)=>`<tr><td>${index+1}</td><td class="mono">${esc(tag)}</td><td>${expectedKeys.has(String(tag).toUpperCase())?'<span class="tag tag-ok">Matched</span>':'<span class="tag tag-rejected">Unexpected</span>'}</td><td><button class="icon-btn" onclick="removeCageAmsCycleScan(${index})" title="Remove">&times;</button></td></tr>`).reverse().join('')+'</table></div>'}
    ${missing.length?'<div class="section-title">Missing AMS tags ('+missing.length+')</div><div class="tbl-wrap"><table><tr><th>AMS tag</th></tr>'+missing.map(tag=>`<tr><td class="mono">${esc(tag)}</td></tr>`).join('')+'</table></div>':''}`;
}
async function saveCageAmsCycleCount(){
  const expected=[...cageExpectedAmsTags()];
  const expectedKeys=new Set(expected.map(tag=>String(tag).toUpperCase()));
  const scannedKeys=new Set(cageAmsCycleScanned.map(tag=>String(tag).toUpperCase()));
  const matched=cageAmsCycleScanned.filter(tag=>expectedKeys.has(String(tag).toUpperCase()));
  const unexpected=cageAmsCycleScanned.filter(tag=>!expectedKeys.has(String(tag).toUpperCase()));
  const missing=expected.filter(tag=>!scannedKeys.has(String(tag).toUpperCase()));
  if(cageAmsCycleScanned.length===0&&expected.length===0){toast('Nothing to check — no AMS tags are loaded in cages still in transit.');return;}
  const byEl=document.getElementById('cage-ams-cyclecount-by');
  const countedBy=(byEl&&byEl.value.trim())||session.fullName;
  const countLocation=session&&session.role==='hub'?cageCurrentDestinationName():currentSoc();
  DB.cageCycleCounts.push({id:nextCode('CC','ccage'),countType:'amsTags',soc:countLocation,countLocation:countLocation||'All source SOCs',expectedCount:expected.length,scannedCount:cageAmsCycleScanned.length,matchedCount:matched.length,expectedAmsTags:expected,missing,unexpected,countedBy,date:nowISO()});
  cageAmsCycleScanned=[];
  await saveDB();
  toast('AMS tag check saved — '+matched.length+' matched, '+missing.length+' missing, '+unexpected.length+' unexpected.');
  refreshCageAmsCycleCountView();
  const hist=document.getElementById('cage-cyclecount-history');
  if(hist) hist.innerHTML=cageCycleCountHistoryHtml();
}
// Fires on every keystroke — once the scanner's burst of input goes quiet,
// treat it as "a tag has been scanned" and check it off automatically, the
// same debounce pattern used for the AMS tag batch scans elsewhere in this
// module. Works for every scan in the session, not just the first couple.
function onCageCycleScanInput(){
  const el = document.getElementById('cage-cyclecount-scan');
  if(!el) return;
  clearTimeout(cageCycleScanTimer);
  const v = el.value.trim();
  if(!v) return;
  cageCycleScanTimer = setTimeout(()=>{
    const cur = document.getElementById('cage-cyclecount-scan');
    if(cur && cur.value.trim()===v) addCageCycleScan();
  }, 150);
}
function addCageCycleScan(){
  clearTimeout(cageCycleScanTimer);
  const el = document.getElementById('cage-cyclecount-scan');
  const v = (el?el.value:'').trim();
  if(!v){ toast('Scan or enter a cage asset tag first.'); return; }
  if(cageCycleScanned.some(t=>cageAssetTagKey(t)===cageAssetTagKey(v))){ toast('That cage asset tag has already been scanned this count.'); if(el){ el.value=''; el.focus(); } return; }
  cageCycleScanned.push(v);
  if(el){ el.value=''; el.focus(); }
  refreshCageCycleCountView();
}
function removeCageCycleScan(i){ cageCycleScanned.splice(i,1); refreshCageCycleCountView(); }
function refreshCageCycleCountView(){
  const el = document.getElementById('cage-cyclecount-summary');
  if(!el) return;
  const expectedCages = cageCycleCountInventory();
  const expectedByKey = new Set(expectedCages.map(c=>cageAssetTagKey(c.assetTag)));
  const scannedKeys = new Set(cageCycleScanned.map(cageAssetTagKey));
  const matched = cageCycleScanned.filter(tag=>expectedByKey.has(cageAssetTagKey(tag)));
  const unexpected = cageCycleScanned.filter(tag=>!expectedByKey.has(cageAssetTagKey(tag)));
  const missing = expectedCages.filter(c=>!scannedKeys.has(cageAssetTagKey(c.assetTag))).map(c=>c.assetTag);
  el.innerHTML = `<div class="card">
    <div class="grid g3" style="margin-bottom:14px;">
      <div class="metric"><div class="lbl">Expected cages</div><div class="val">${expectedCages.length}</div><div class="sub">at this SOC or HUB</div></div>
      <div class="metric success"><div class="lbl">Matched</div><div class="val">${matched.length}</div><div class="sub">scanned &amp; expected</div></div>
      <div class="metric ${unexpected.length?'danger':''}"><div class="lbl">Unexpected</div><div class="val">${unexpected.length}</div><div class="sub">scanned, not expected</div></div>
    </div>
    <div class="section-title">Scanned this session (${cageCycleScanned.length})</div>
    ${cageCycleScanned.length===0 ? '<div class="empty"><div class="ic">&#128230;</div>No cage asset tags scanned yet.</div>' :
      '<div class="tbl-wrap" style="max-height:260px;overflow-y:auto;"><table><tr><th>#</th><th>Cage asset tag</th><th>Result</th><th></th></tr>' +
      cageCycleScanned.map((t,i)=>{
        const isExpected = expectedByKey.has(cageAssetTagKey(t));
        return `<tr><td class="mono small-note">${i+1}</td><td class="mono">${esc(t)}</td><td>${isExpected?'<span class="tag tag-ok">Matched</span>':'<span class="tag tag-rejected">Unexpected</span>'}</td><td style="text-align:right;"><button class="icon-btn" onclick="removeCageCycleScan(${i})" title="Remove">&times;</button></td></tr>`;
      }).reverse().join('') + '</table></div>'}

async function saveCageCycleCount(){
  const expectedCages = cageCycleCountInventory();
  const expectedByKey = new Set(expectedCages.map(c=>cageAssetTagKey(c.assetTag)));
  const scannedKeys = new Set(cageCycleScanned.map(cageAssetTagKey));
  const matched = cageCycleScanned.filter(tag=>expectedByKey.has(cageAssetTagKey(tag)));
  const unexpected = cageCycleScanned.filter(tag=>!expectedByKey.has(cageAssetTagKey(tag)));
  const missing = expectedCages.filter(c=>!scannedKeys.has(cageAssetTagKey(c.assetTag))).map(c=>c.assetTag);
  if(cageCycleScanned.length===0 && expectedCages.length===0){ toast('Nothing to count — no cages are currently at this SOC or HUB.'); return; }
  const byEl = document.getElementById('cage-cyclecount-by');
  const countedBy = (byEl && byEl.value.trim()) || session.fullName;
  const countLocation=session&&session.role==='hub'?cageCurrentDestinationName():currentSoc();
  const expectedSnapshot=expectedCages.map(c=>({assetTag:c.assetTag,soc:c.soc||'',location:cageInventoryCurrentLocation(c),status:c.status||'Available'}));
  DB.cageCycleCounts.push({id: nextCode('CC','ccage'), countType:'cages', soc: countLocation, countLocation:countLocation||'All locations', expectedCount: expectedCages.length, scannedCount: cageCycleScanned.length, matchedCount: matched.length, expectedCages:expectedSnapshot, missing, unexpected, countedBy, date: nowISO()});
  cageCycleScanned = [];
  await saveDB();
  toast('Cycle count saved — '+matched.length+' matched, '+missing.length+' missing, '+unexpected.length+' unexpected.');
  refreshCageCycleCountView();
  const hist = document.getElementById('cage-cyclecount-history');
  if(hist) hist.innerHTML = cageCycleCountHistoryHtml();
}
function cageCycleCountHistoryHtml(){

    rows.map(r=>`<tr><td>${fmtDateTime(r.date)}</td><td>${r.countType==='cages'?'Cage assets':'AMS tags'}</td><td>${esc(r.countLocation||r.soc||'All locations')}</td><td>${r.expectedCount}</td><td>${r.scannedCount}</td>

function exportCageCycleCounts(){

function onReusableSackTagScanInput(){

function addReusableSackTagToBatch(){
  clearTimeout(reusableSackTagScanTimer);
  const el = document.getElementById('reusable-sack-tag-scan');
  const v = (el?el.value:'').trim();
  if(!v){ toast('Scan or enter an AMS tag first.'); return; }
  if(reusableSackTagBatch.some(t=>t.toLowerCase()===v.toLowerCase())){ toast('That AMS tag is already in this batch.'); if(el){ el.value=''; el.focus(); } return; }
  reusableSackTagBatch.push(v);
  if(el){ el.value=''; el.focus(); }
  refreshReusableSackBatchTable();
}
function removeReusableSackTagFromBatch(i){ reusableSackTagBatch.splice(i,1); refreshReusableSackBatchTable(); }

async function submitReusableSackIssuance(){
  const lhTripNumber = document.getElementById('reusable-sack-lhtrip').value.trim();
  const hubName = document.getElementById('reusable-sack-hub').value.trim();
  const plateNumber = document.getElementById('reusable-sack-plate').value.trim();
  if(reusableSackTagBatch.length===0){ toast('Scan at least one AMS tag first.'); return; }
  if(!lhTripNumber){ toast('Enter the LH trip number.'); return; }
  if(!hubName){ toast('Choose or type a hub name.'); return; }
  if(!plateNumber){ toast('Enter the vehicle plate number.'); return; }
  const loadedAmsTags = reusableSackTagBatch.slice();
  let issuedAssetTag='';
  let sackUnavailable=false;
  const applyIssue=()=>{
    sackUnavailable=false;
    const inventory=nextAvailableReusableSackInventory();
    if(!inventory){
      sackUnavailable=true;
      return;
    }
    const id=nextCode('RS','rs');
    const dispatchedAt=nowISO();
    inventory.status='In Transit';
    inventory.currentShipmentId=id;
    inventory.lastIssuedAt=dispatchedAt;
    const sackSoc=inventory.soc||currentSoc();
    DB.reusableSacks.push({id, sackId:inventory.assetTag, sackAssetId:inventory.id, sackAssetTag:inventory.assetTag, loadedAmsTags, lhTripNumber, hubName, plateNumber, issuedBy:session.fullName, status:'In Transit', dispatchedAt, receivedBy:null, receivedAt:null, soc:sackSoc});
    issuedAssetTag=inventory.assetTag;
  };
  const saved=await saveDBWithRetry(applyIssue);
  if(!saved){ restoreReusableSackSectionsAfterFailedSave(); return; }
  if(sackUnavailable){ toast('No available sack remains in the Reusable Sack Masterlist for this SOC view.'); navigate('reusablesacks','new'); return; }
  reusableSackTagBatch = [];
  toast('Sack '+issuedAssetTag+' auto-assigned from the Reusable Sack Masterlist and issued with '+loadedAmsTags.length+' AMS asset tag(s) — now in transit.');
  navigate('reusablesacks','list');
}

  const key=reusableSackTagKey(v);

function returnReusableSackToMasterlist(shipment,receivedHubName,receivedAt){
  const assetTag=shipment.sackAssetTag||shipment.sackId||'';
  let item=(DB.reusableSackMasterlist||[]).find(c=>c.id===shipment.sackAssetId);
  if(!item && assetTag) item=(DB.reusableSackMasterlist||[]).find(c=>reusableSackTagKey(c.assetTag)===reusableSackTagKey(assetTag));
  if(!item && assetTag){
    item={id:nextCode('RSA','rsa'),assetTag,soc:shipment.soc||'',status:'Available',addedAt:receivedAt,addedBy:'Received sack',currentShipmentId:'',location:receivedHubName||shipment.soc||'',lastReceivedAt:receivedAt,lastIssuedAt:''};
    DB.reusableSackMasterlist.push(item);
  }
  if(!item) return;
  item.status='Available';
  item.currentShipmentId='';
  item.lastReceivedAt=receivedAt;
  item.location=receivedHubName||item.location||item.soc||'';
  const destinationSoc=(DB.warehouses||[]).find(site=>reusableSackTagKey(site)===reusableSackTagKey(receivedHubName));
  if(destinationSoc) item.soc=destinationSoc;
}
async function receiveScannedReusableSack(sackId){
  const now=nowISO();
  let receipt=null;
  let outcome='pending';
  const applyReceive=()=>{
    receipt=null;
    const current=DB.reusableSacks.find(cg=>cg.id===sackId);
    if(!current){outcome='missing';return;}
    if(current.status==='Received'){outcome='received';return;}
    outcome='pending';
    const receivedHubName=current.hubName||currentSoc()||'';
    current.status='Received';current.receivedBy=session.fullName;current.receivedAt=now;current.receivedLhTripNumber=current.lhTripNumber||'';current.receivedHubName=receivedHubName;
    returnReusableSackToMasterlist(current,receivedHubName,now);
    receipt={sackAssetTag:current.sackAssetTag||current.sackId,lhTripNumber:current.lhTripNumber||'',plateNumber:current.plateNumber||'',hubName:current.hubName||'',receivedAt:now};
  };
  applyReceive();
  const saved=await saveDBWithRetry(applyReceive);
  if(!saved){restoreReusableSackSectionsAfterFailedSave();navigate('reusablesacks','receive');return;}
  if(outcome==='missing'){toast('This sack record no longer exists. Refreshing the list.');navigate('reusablesacks','receive');return;}
  if(!receipt){toast('This sack was already received. Refreshing the list.');navigate('reusablesacks','receive');return;}
  reusableSackReceiveLastReceipt=receipt;
  toast('Sack '+receipt.sackAssetTag+' received. LH Trip '+(receipt.lhTripNumber||'—')+' · Plate '+(receipt.plateNumber||'—')+'.');
  navigate('reusablesacks','receive');
  const input=document.getElementById('receive-reusable-sack-asset-scan');
  if(input)input.focus();
}

function reusableSackInventoryLatestReceipt(sack){

async function addReusableSacksToMasterlist(){
  const input=document.getElementById('new-reusable-sack-asset-tags');
  if(!input) return;
  const tags=input.value.split(/[,;\n]+/).map(tag=>tag.trim()).filter(Boolean);
  if(!tags.length){toast('Enter or scan at least one sack asset tag.');return;}
  const duplicateInput=tags.filter((tag,i)=>tags.findIndex(other=>reusableSackTagKey(other)===reusableSackTagKey(tag))!==i);
  if(duplicateInput.length){toast('Remove duplicate tags from this list: '+[...new Set(duplicateInput)].join(', '));return;}
  const existing=new Set(DB.reusableSackMasterlist.map(c=>reusableSackTagKey(c.assetTag)));
  const alreadyAdded=tags.filter(tag=>existing.has(reusableSackTagKey(tag)));
  if(alreadyAdded.length){toast('Already in the Reusable Sack Masterlist: '+alreadyAdded.join(', '));return;}
  const soc=session.role==='admin'?(document.getElementById('reusable-sack-inventory-soc')||{}).value||'':currentSoc();
  if(!soc){toast(session.role==='admin'?'Select an SOC before adding sack inventory.':'Your login has no assigned SOC. Ask an admin to assign one before adding sacks.');return;}
  let collision=[];
  const applyAdd=()=>{
    collision=[];
    const latest=new Set(DB.reusableSackMasterlist.map(c=>reusableSackTagKey(c.assetTag)));
    collision=tags.filter(tag=>latest.has(reusableSackTagKey(tag)));
    if(collision.length) return;
    tags.forEach(assetTag=>DB.reusableSackMasterlist.push({id:nextCode('RSA','rsa'),assetTag,soc,status:'Available',addedAt:nowISO(),addedBy:session.fullName,currentShipmentId:'',location:soc,lastIssuedAt:'',lastReceivedAt:''}));
  };
  const saved=await saveDBWithRetry(applyAdd);
  if(!saved){restoreReusableSackSectionsAfterFailedSave();return;}
  if(collision.length){toast('Another user added these tags first: '+collision.join(', '));return;}
  input.value='';
  toast('Added '+tags.length+' sack(s) to the masterlist.');
  navigate('reusablesacks','masterlist');
}
function openEditReusableSackMasterlistTag(id){
  const sack=DB.reusableSackMasterlist.find(c=>c.id===id);
  if(!sack||sack.status!=='Available'){toast('Only available sacks can be edited.');return;}
  showModal(`<h3>Edit sack asset tag</h3><div class="card-sub">This sack must be available before its asset tag can be changed.</div><div class="field" style="margin-top:14px;"><label>Asset tag</label><input id="edit-reusable-sack-masterlist-tag" value="${esc(sack.assetTag)}"></div><div class="footer-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveReusableSackMasterlistTag('${esc(sack.id)}')">Save tag</button></div>`);
}
async function saveReusableSackMasterlistTag(id){
  const input=document.getElementById('edit-reusable-sack-masterlist-tag');
  const sack=DB.reusableSackMasterlist.find(c=>c.id===id);
  if(!input||!sack) return;
  const assetTag=input.value.trim();
  if(!assetTag){toast('Enter a sack asset tag.');return;}
  let unavailable=false,duplicate=false;
  const applyEdit=()=>{
    unavailable=false;duplicate=false;
    const current=DB.reusableSackMasterlist.find(c=>c.id===id);
    if(!current||current.status!=='Available'){unavailable=true;return;}
    duplicate=DB.reusableSackMasterlist.some(c=>c.id!==id&&reusableSackTagKey(c.assetTag)===reusableSackTagKey(assetTag));
    if(!duplicate) current.assetTag=assetTag;
  };
  const saved=await saveDBWithRetry(applyEdit);
  if(!saved){restoreReusableSackSectionsAfterFailedSave();return;}
  if(unavailable){toast('This sack is now in transit. Its tag was not changed.');closeModal();navigate('reusablesacks','masterlist');return;}
  if(duplicate){toast('That asset tag is already in the Reusable Sack Masterlist.');return;}
  closeModal();toast('Sack asset tag updated.');navigate('reusablesacks','masterlist');
}

   every AMS tag the system still expects to be out there (sacks that
   haven't been marked Received yet, scoped to the current SOC). ---------- */
let sackCycleScanned = []; // AMS tags scanned so far this count session
let sackCycleScanTimer = null;
function reusableSackExpectedTags(){
  const seen = new Set();
  socFilter(DB.reusableSacks).filter(cg=>cg.status!=='Received').forEach(cg=>reusableSackAmsTagsOf(cg).forEach(t=>{ if(t) seen.add(t); }));
  return seen;
}
function reusableSackCycleCountHtml(){
  return `<div class="card">

    <div class="field scan-field">
      <label>AMS Tag</label>
      <input id="reusable-sack-cyclecount-scan" placeholder="Scan AMS tag" oninput="onReusableSackCycleScanInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();addReusableSackCycleScan();}">
    </div>
    <div class="field" style="max-width:260px;margin-top:10px;"><label>Counted by</label><input id="reusable-sack-cyclecount-by" value="${esc(session.fullName)}"></div>
    <div class="footer-actions">
      <button class="btn" onclick="sackCycleScanned=[];refreshReusableSackCycleCountView();">Clear scanned</button>
      <button class="btn btn-primary" onclick="saveReusableSackCycleCount()">Save cycle count</button>
    </div>
  </div>
  <div id="reusable-sack-cyclecount-summary"></div>

    <div class="list-head"><h3>Recent cycle counts</h3>${dlBtn('exportReusableSackCycleCounts')}</div>
    <div id="reusable-sack-cyclecount-history">${reusableSackCycleCountHistoryHtml()}</div>
  </div>`;
}
// Fires on every keystroke — once the scanner's burst of input goes quiet,
// treat it as "a tag has been scanned" and check it off automatically, the
// same debounce pattern used for the AMS tag batch scans elsewhere in this
// module. Works for every scan in the session, not just the first couple.
function onReusableSackCycleScanInput(){
  const el = document.getElementById('reusable-sack-cyclecount-scan');
  if(!el) return;
  clearTimeout(sackCycleScanTimer);
  const v = el.value.trim();
  if(!v) return;
  sackCycleScanTimer = setTimeout(()=>{
    const cur = document.getElementById('reusable-sack-cyclecount-scan');
    if(cur && cur.value.trim()===v) addReusableSackCycleScan();
  }, 150);
}
function addReusableSackCycleScan(){
  clearTimeout(sackCycleScanTimer);
  const el = document.getElementById('reusable-sack-cyclecount-scan');
  const v = (el?el.value:'').trim();
  if(!v){ toast('Scan or enter an AMS tag first.'); return; }
  if(sackCycleScanned.some(t=>t.toLowerCase()===v.toLowerCase())){ toast('That AMS tag has already been scanned this count.'); if(el){ el.value=''; el.focus(); } return; }
  sackCycleScanned.push(v);
  if(el){ el.value=''; el.focus(); }
  refreshReusableSackCycleCountView();
}
function removeReusableSackCycleScan(i){ sackCycleScanned.splice(i,1); refreshReusableSackCycleCountView(); }
function refreshReusableSackCycleCountView(){
  const el = document.getElementById('reusable-sack-cyclecount-summary');
  if(!el) return;
  const expected = reusableSackExpectedTags();
  const expectedArr = [...expected];
  const scannedUpper = sackCycleScanned.map(t=>t.toUpperCase());
  const matched = sackCycleScanned.filter(t=>expected.has(t) || [...expected].some(e=>e.toUpperCase()===t.toUpperCase()));
  const unexpected = sackCycleScanned.filter(t=>!expectedArr.some(e=>e.toUpperCase()===t.toUpperCase()));
  const missing = expectedArr.filter(e=>!scannedUpper.includes(e.toUpperCase()));
  el.innerHTML = `<div class="card">
    <div class="grid g3" style="margin-bottom:14px;">
      <div class="metric"><div class="lbl">Expected</div><div class="val">${expectedArr.length}</div><div class="sub">AMS tags still in transit</div></div>
      <div class="metric success"><div class="lbl">Matched</div><div class="val">${matched.length}</div><div class="sub">scanned &amp; expected</div></div>
      <div class="metric ${unexpected.length?'danger':''}"><div class="lbl">Unexpected</div><div class="val">${unexpected.length}</div><div class="sub">scanned, not expected</div></div>
    </div>
    <div class="section-title">Scanned this session (${sackCycleScanned.length})</div>
    ${sackCycleScanned.length===0 ? '<div class="empty"><div class="ic">&#128230;</div>No AMS tags scanned yet.</div>' :
      '<div class="tbl-wrap" style="max-height:260px;overflow-y:auto;"><table><tr><th>#</th><th>AMS Tag</th><th>Result</th><th></th></tr>' +
      sackCycleScanned.map((t,i)=>{
        const isExpected = expectedArr.some(e=>e.toUpperCase()===t.toUpperCase());
        return `<tr><td class="mono small-note">${i+1}</td><td class="mono">${esc(t)}</td><td>${isExpected?'<span class="tag tag-ok">Matched</span>':'<span class="tag tag-rejected">Unexpected</span>'}</td><td style="text-align:right;"><button class="icon-btn" onclick="removeReusableSackCycleScan(${i})" title="Remove">&times;</button></td></tr>`;
      }).reverse().join('') + '</table></div>'}
    ${missing.length ? '<div class="section-title">Missing (' + missing.length + ') — expected but not yet scanned</div><div class="tbl-wrap" style="max-height:220px;overflow-y:auto;"><table><tr><th>AMS Tag</th></tr>' + missing.map(t=>`<tr><td class="mono">${esc(t)}</td></tr>`).join('') + '</table></div>' : ''}
  </div>`;
}
async function saveReusableSackCycleCount(){
  const expectedArr = [...reusableSackExpectedTags()];
  const scannedUpper = sackCycleScanned.map(t=>t.toUpperCase());
  const matched = sackCycleScanned.filter(t=>expectedArr.some(e=>e.toUpperCase()===t.toUpperCase()));
  const unexpected = sackCycleScanned.filter(t=>!expectedArr.some(e=>e.toUpperCase()===t.toUpperCase()));
  const missing = expectedArr.filter(e=>!scannedUpper.includes(e.toUpperCase()));
  if(sackCycleScanned.length===0 && expectedArr.length===0){ toast('Nothing to count — no AMS tags are currently in transit.'); return; }
  const byEl = document.getElementById('reusable-sack-cyclecount-by');
  const countedBy = (byEl && byEl.value.trim()) || session.fullName;
  DB.reusableSackCycleCounts.push({id: nextCode('RSC','ccsack'), soc: currentSoc(), expectedCount: expectedArr.length, scannedCount: sackCycleScanned.length, matchedCount: matched.length, missing, unexpected, countedBy, date: nowISO()});
  sackCycleScanned = [];
  await saveDB();
  toast('Cycle count saved — '+matched.length+' matched, '+missing.length+' missing, '+unexpected.length+' unexpected.');
  refreshReusableSackCycleCountView();
  const hist = document.getElementById('reusable-sack-cyclecount-history');
  if(hist) hist.innerHTML = reusableSackCycleCountHistoryHtml();
}
function reusableSackCycleCountHistoryHtml(){
  const rows = socFilter(DB.reusableSackCycleCounts).slice().reverse().slice(0,15);
  if(rows.length===0) return '<div class="empty"><div class="ic">&#8635;</div>No cycle counts recorded yet.</div>';
  return '<div class="tbl-wrap"><table><tr><th>Date</th><th>SOC</th><th>Expected</th><th>Scanned</th><th>Matched</th><th>Missing</th><th>Unexpected</th><th>Counted by</th></tr>' +
    rows.map(r=>`<tr><td>${fmtDateTime(r.date)}</td><td>${esc(r.soc||'—')}</td><td>${r.expectedCount}</td><td>${r.scannedCount}</td>
      <td>${r.matchedCount}</td><td>${(r.missing||[]).length?'<span class="tag tag-pending">'+(r.missing||[]).length+'</span>':'0'}</td>
      <td>${(r.unexpected||[]).length?'<span class="tag tag-rejected">'+(r.unexpected||[]).length+'</span>':'0'}</td><td>${esc(r.countedBy)}</td></tr>`).join('') + '</table></div>';
}
function exportReusableSackCycleCounts(){
  const rows = socFilter(DB.reusableSackCycleCounts).map(r=>[fmtDateTime(r.date), r.soc||'', r.expectedCount, r.scannedCount, r.matchedCount, (r.missing||[]).join('; '), (r.unexpected||[]).join('; '), r.countedBy]);
  downloadCSV('reusable-sack-cycle-count.csv', ['Date','SOC','Expected','Scanned','Matched','Missing AMS Tags','Unexpected AMS Tags','Counted By'], rows);
}

function addItCycleScan(kind){

  const key=matched?matched.key:'UNEXPECTED:'+value.toUpperCase();
  const scans=itCycleScanSessions[kind];
  if(scans.some(scan=>scan.key===key)){toast(matched?'That asset has already been scanned in this count.':'That identifier has already been scanned in this count.');if(el){el.value='';el.focus();}return;}

function removeItCycleScan(kind,index){itCycleScanSessions[kind].splice(index,1);refreshItCycleCountView(kind);}
function refreshItCycleCountView(kind){
  const dashboard=document.getElementById('it-cycle-dashboard-'+kind);
  const details=document.getElementById('it-cycle-details-'+kind);
  if(!dashboard||!details)return;
  const expected=itCycleExpectedItems(kind);
  const expectedByKey=new Map(expected.map(item=>[item.key,item]));
  const scans=itCycleScanSessions[kind]||[];
  const foundScanByKey=new Map();
  const unexpected=scans.map((scan,index)=>({scan,index})).filter(row=>!row.scan.key||!expectedByKey.has(row.scan.key));
  scans.forEach((scan,index)=>{if(scan.key&&expectedByKey.has(scan.key)&&!foundScanByKey.has(scan.key))foundScanByKey.set(scan.key,{value:scan.value,index});});
  const found=expected.filter(item=>foundScanByKey.has(item.key));
  const missing=expected.filter(item=>!foundScanByKey.has(item.key));
  const percent=expected.length?Math.round(found.length/expected.length*1000)/10:0;
  const title=kind==='pda'?'PDA daily cycle count':'IT asset monthly cycle count';
  dashboard.innerHTML=`<div class="card"><h3>${esc(title)} dashboard</h3>
    <div style="display:flex;flex-wrap:nowrap;gap:12px;margin-bottom:14px;overflow-x:auto;">
      <div class="metric" style="flex:1 0 180px;"><div class="lbl">For cycle count</div><div class="val">${expected.length}</div><div class="sub">from the masterlist</div></div>
      <div class="metric success" style="flex:1 0 180px;"><div class="lbl">Found</div><div class="val">${found.length}</div><div class="sub">expected assets scanned</div></div>
      <div class="metric ${missing.length?'danger':''}" style="flex:1 0 180px;"><div class="lbl">Missing</div><div class="val">${missing.length}</div><div class="sub">not scanned yet</div></div>
      <div class="metric" style="flex:1 0 180px;"><div class="lbl">Found progress</div><div class="val">${percent.toFixed(1)}%</div><div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" style="height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0;"><div style="height:100%;width:${percent}%;background:var(--success);border-radius:99px;"></div></div><div class="sub">${found.length} of ${expected.length} assets</div></div>
    </div></div>`;
  const foundRows=found.map(item=>{const scan=foundScanByKey.get(item.key);return `<tr><td class="mono">${esc(item.primaryCode||'—')}</td>${item.secondaryCode?`<td class="mono">${esc(item.secondaryCode)}</td>`:''}<td>${esc(item.description)}</td><td>${esc(item.status)}</td><td>${esc(item.department||'—')}</td><td>${esc(item.accountable||'—')}</td><td class="mono">${esc(scan.value)}</td><td><button class="icon-btn" onclick="removeItCycleScan('${kind}',${scan.index})" title="Remove">&times;</button></td></tr>`;});
  const missingRows=missing.map(item=>`<tr><td class="mono">${esc(item.primaryCode||'—')}</td>${item.secondaryCode?`<td class="mono">${esc(item.secondaryCode)}</td>`:''}<td>${esc(item.description)}</td><td>${esc(item.status)}</td><td>${esc(item.department||'—')}</td><td>${esc(item.accountable||'—')}</td></tr>`);
  details.innerHTML=`<div class="card"><div class="section-title">Found (${found.length})</div>
    ${foundRows.length?'<div class="tbl-wrap"><table><tr><th>Serial / PDA #</th>'+(kind==='pda'?'<th>Other identifier</th>':'')+'<th>Asset type</th><th>Status</th><th>Department</th><th>Accountable person</th><th>Scanned as</th><th></th></tr>'+foundRows.join('')+'</table></div>':'<div class="empty"><div class="ic">&#128247;</div>No expected assets scanned yet.</div>'}
    ${missing.length?'<div class="section-title">Missing ('+missing.length+')</div><div class="tbl-wrap"><table><tr><th>Serial / PDA #</th>'+(kind==='pda'?'<th>Other identifier</th>':'')+'<th>Asset type</th><th>Status</th><th>Department</th><th>Accountable person</th></tr>'+missingRows.join('')+'</table></div>':''}
    ${unexpected.length?'<div class="section-title">Unexpected scans ('+unexpected.length+')</div><div class="tbl-wrap"><table><tr><th>Scanned identifier</th><th></th></tr>'+unexpected.map(row=>`<tr><td class="mono">${esc(row.scan.value)}</td><td><button class="icon-btn" onclick="removeItCycleScan('${kind}',${row.index})" title="Remove">&times;</button></td></tr>`).join('')+'</table></div>':''}
  </div>`;
}
async function saveItCycleCount(kind){
  const expected=itCycleExpectedItems(kind);
  const expectedByKey=new Map(expected.map(item=>[item.key,item]));
  const scans=itCycleScanSessions[kind]||[];
  const foundKeys=new Set(scans.filter(scan=>scan.key&&expectedByKey.has(scan.key)).map(scan=>scan.key));
  const found=expected.filter(item=>foundKeys.has(item.key));
  const missing=expected.filter(item=>!foundKeys.has(item.key));
  const unexpected=scans.filter(scan=>!scan.key||!expectedByKey.has(scan.key)).map(scan=>scan.value);
  if(!expected.length&&!scans.length){toast('Nothing to count — the masterlist has no assets for this site.');return;}
  const byEl=document.getElementById('it-cycle-by-'+kind);
  const countedBy=(byEl&&byEl.value.trim())||session.fullName;
  const isPda=kind==='pda';
  const rec={id:nextCode(isPda?'PDA-CC':'IT-CC',isPda?'pcc':'itcc'),frequency:isPda?'Daily':'Monthly',period:isPda?localDateStr():localDateStr().slice(0,7),
    expectedCount:expected.length,foundCount:found.length,missingCount:missing.length,unexpectedCount:unexpected.length,
    expected:expected.map(item=>({key:item.key,code:item.primaryCode,secondaryCode:item.secondaryCode||'',description:item.description,status:item.status,department:item.department,accountable:item.accountable})),
    found:found.map(item=>({key:item.key,code:item.primaryCode,scannedAs:scans.find(scan=>scan.key===item.key)?.value||item.primaryCode})),
    missing:missing.map(item=>item.primaryCode),unexpected,scanned:scans.map(scan=>scan.value),countedBy,date:nowISO(),soc:currentSoc()};
  const target=itCycleCountsFor(kind);
  target.push(rec);
  await saveDB();
  itCycleScanSessions[kind]=[];
  toast((isPda?'PDA daily':'IT asset monthly')+' cycle count saved — '+found.length+' found, '+missing.length+' missing, '+unexpected.length+' unexpected.');
  refreshItCycleCountView(kind);
  const history=document.getElementById('it-cycle-history-'+kind);
  if(history)history.innerHTML=itCycleCountHistoryHtml(kind);
}

  let sourceChanged=false;

      const source=(DB.itAssetIssuances||[]).find(item=>itReturnSourceIdentity(item)===selected.identity);

    }else{
      const source=(DB.pdas||[]).find(item=>String(item.pdaNo)+'|'+String(item.soc||'')+'|'+String(item.serial||'')===selected.identity);
      if(!source||source.status==='Returned to IT'){sourceChanged=true;return;}

function newPdaLogId(){

    : Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  const id = 'PL-'+Date.now().toString(36).toUpperCase()+'-'+randomPart;
  return DB.pdaLogs.some(l=>l.id===id) ? newPdaLogId() : id;

function restorePdaSectionsAfterFailedSave(){

// Multiple accounts on the same SOC scan against this same shared PDA list at
// once, so a plain saveDB() here isn't safe: on a save conflict it would
// just discard this scan and make the staff member redo it, and worse, a
// naive retry could double-log a borrow if two people happened to scan the
// same device at nearly the same moment. applyBorrow() is written to be
// re-run safely — by saveDBWithRetry, against whatever the freshest synced
// data turns out to be — checking the PDA's live status and this log's id
// each time so it either applies exactly once or backs off cleanly if
// someone else's scan already claimed the device first.
async function confirmPdaBorrow(){
  if(pdaBorrowInProgress) return;
  const pda = pdaActiveTarget();
  const opsIdEl = document.getElementById('pda-ops-input');
  if(!pda){ toast('This PDA record changed while you were scanning. Scan it again.'); cancelPdaActiveSession(); refreshPdaLiveSections(); return; }
  if(!opsIdEl) return;
  const opsId = opsIdEl.value.trim();
  const emp = empInfo(opsId);
  if(!opsId || !emp) return;
  pdaBorrowInProgress = true;
  opsIdEl.disabled = true;
  const cancelEl = document.getElementById('pda-borrow-cancel');
  if(cancelEl) cancelEl.disabled = true;
  const pdaNo = pda.pdaNo, soc = pda.soc;
  const logId = newPdaLogId();
  const applyBorrow = ()=>{
    const target = DB.pdas.find(p=>p.pdaNo===pdaNo && p.soc===soc);
    if(!target || target.status==='Borrowed' || target.status==='Returned to IT') return false; // already taken or transferred to I.T.
    if(!DB.pdaLogs.some(l=>l.id===logId)){
      DB.pdaLogs.push({
        id: logId, pdaNo, opsId, borrowerName: emp.fullName, borrowerAgency: emp.agency||'', borrowerDepartment: emp.department||'',
        conditionOnBorrow: target.condition||'Good', issuedByUser:session.username||'',
        borrowedAt: nowISO(), returnedAt:'', returnedByOpsId:'', returnedByName:'', returnedByAgency:'', returnedByDepartment:'',
        conditionOnReturn:'', remarks:'', irFile:'', irFileData:'', status:'Borrowed', soc
      });
    }
    target.status = 'Borrowed';
    return true;
  };
  if(!applyBorrow()){
    pdaBorrowInProgress = false;
    toast(pdaNo+' is no longer available for floor issuance.');
    pdaActiveMode = null; pdaModalTarget = null; pdaModalIdentity = null;
    navigate(route, subroute);
    return;
  }
  let claimedByOther = false;
  const ok = await saveDBWithRetry(()=>{
    if(!applyBorrow()) claimedByOther = true; // fresh synced data shows someone else already borrowed it first
  });
  if(!ok) restorePdaSectionsAfterFailedSave();
  pdaBorrowInProgress = false;
  pdaActiveMode = null; pdaModalTarget = null; pdaModalIdentity = null;
  if(ok && !claimedByOther) toast(pdaNo+' issued to '+emp.fullName+'.');
  else if(claimedByOther) toast(pdaNo+' is no longer available for floor issuance — your scan was not saved.');
  navigate(route, subroute);
}
function pdaReturnOpsLookup(){
  if(pdaReturnInProgress) return;

  const status = document.getElementById('pda-return-ops-status');
  const details = document.getElementById('pda-return-employee-details');
  const raw = input ? input.value.trim() : '';
  const emp = raw ? empInfo(raw) : null;
  const borrowLog = pdaOpenBorrowLog();
  const isDirectoryMatch = emp && raw.toUpperCase()===String(emp.opsId||'').toUpperCase();
  const returnerOpsId = isDirectoryMatch ? String(emp.opsId).trim().toUpperCase() : '';
  const borrowerOpsId = String(borrowLog && borrowLog.opsId || '').trim().toUpperCase();
  const borrowerMismatch = !!(borrowLog && isDirectoryMatch && returnerOpsId!==borrowerOpsId);
  if(borrowerMismatch && pdaReturnMismatchApprovedOpsId!==returnerOpsId){
    pdaReturnEmployee = null;
    if(details) details.innerHTML = '';
    openPdaReturnMismatchModal(emp, borrowLog);
    return;
  }
  const canReturn=!!borrowLog || canRecoverMissingPdaBorrow();
  pdaReturnEmployee = canReturn && !!isDirectoryMatch ? emp : null;
  if(status){
    status.textContent = !canReturn ? 'No matching borrowing record is available. Ask an admin to resolve it or scan again.' : (pdaReturnEmployee ? 'Ops ID matched — recording the return.' : (raw ? 'Ops ID not found. Check the ID or update the Ops ID Directory.' : 'A valid Ops ID is required to continue.'));
    status.className = 'hint'+(pdaReturnEmployee?' hint-active':(raw?' hint-error':''));
  }

    ? `<div class="hint" style="margin-top:6px;"><strong>${esc(emp.fullName)}</strong> · ${esc(emp.agency||'—')} · ${esc(emp.department||'—')}</div>`

// The return completes after a valid returner ID is confirmed.
let pdaReturnInProgress = false;
async function confirmPdaReturn(){
  if(pdaActiveMode!=='return' || pdaReturnInProgress || !pdaReturnEmployee) return;
  const pda = pdaActiveTarget();
  if(!pda){ toast('This PDA record changed while you were scanning. Scan it again.'); cancelPdaActiveSession(); refreshPdaLiveSections(); return; }
  const pdaNo = pda.pdaNo, soc = pda.soc;
  const log0 = pdaOpenBorrowLog();
  const recovering=!log0 && canRecoverMissingPdaBorrow();
  if(!log0 && !recovering){ toast('The borrowing record changed or requires an admin correction. Scan it again.'); cancelPdaActiveSession(); refreshPdaLiveSections(); return; }
  const borrowLogIdentity = log0?{id:log0.id, borrowedAt:log0.borrowedAt}:null;
  const recoveryId=recovering?newPdaLogId():null;
  const recoverySnapshot=recovering?JSON.stringify(pda):null;
  const returner = {opsId:pdaReturnEmployee.opsId, name:pdaReturnEmployee.fullName, agency:pdaReturnEmployee.agency||'', department:pdaReturnEmployee.department||''};
  pdaReturnInProgress = true;
  const returnOpsInput = document.getElementById('pda-return-ops-input');
  if(returnOpsInput) returnOpsInput.disabled = true;
  document.querySelectorAll('#modal-root button').forEach(button=>button.disabled=true);
  const returnOpsStatus = document.getElementById('pda-return-ops-status');
  if(returnOpsStatus){ returnOpsStatus.textContent = 'Recording return for '+returner.name+'…'; returnOpsStatus.className='hint hint-active'; }
  // Same concurrency concern as confirmPdaBorrow(): another account on this
  // same SOC could process this exact PDA's return (or a fresh re-borrow) in
  // the moments around this save. applyReturn() re-finds the live PDA and its
  // still-open borrow log each time it runs — including on saveDBWithRetry's
  // retry after a conflict — so it either applies once against current data
  // or backs off if someone else already closed this same log out.
  const applyReturn = ()=>{
    const target = DB.pdas.find(p=>p.pdaNo===pdaNo && p.soc===soc);
    if(!target || target.status!=='Borrowed') return false;
    let log;
    if(recovering){
      if(!session || session.role!=='admin' || JSON.stringify(target)!==recoverySnapshot || DB.pdaLogs.some(l=>l.id===recoveryId || (l.pdaNo===pdaNo && l.soc===soc && l.status==='Borrowed'))) return false;
      log={id:recoveryId,pdaNo,soc,opsId:'',borrowerName:'',borrowerAgency:'',borrowerDepartment:'',borrowedAt:'',conditionOnBorrow:target.condition||'',missingBorrowHistory:true,recoveredBy:session.username,recoveredAt:nowISO()};
      DB.pdaLogs.push(log);
    }else{
      log=DB.pdaLogs.find(l=>l.pdaNo===pdaNo && l.soc===soc && l.status==='Borrowed' && (borrowLogIdentity.id ? l.id===borrowLogIdentity.id : l.borrowedAt===borrowLogIdentity.borrowedAt));
      if(!log) return false;
    }
    log.returnedAt = nowISO();
    log.returnedByOpsId = returner.opsId; log.returnedByName = returner.name; log.returnedByAgency = returner.agency; log.returnedByDepartment = returner.department;
    log.returnedByUser = session.username||'';
    log.conditionOnReturn = 'NotRecorded'; log.status = 'Returned';
    log.remarks = recovering?'Admin recorded return: original borrowing history is missing.':'';
    // Return processing leaves the PDA's current condition, remarks, and IR unchanged.
    target.status = 'Available';
    return true;
  };
  if(!applyReturn()){
    pdaReturnInProgress = false;
    closeModal();
    toast('This device was already returned — refreshing.');
    pdaActiveMode = null; pdaModalTarget = null; pdaModalIdentity = null; pdaReturnBorrowLogIdentity = null; pdaReturnEmployee = null;
    navigate(route, subroute);
    return;
  }
  let claimedByOther = false;
  const ok = await saveDBWithRetry(()=>{
    if(!applyReturn()) claimedByOther = true;
  });
  if(!ok) restorePdaSectionsAfterFailedSave();
  pdaReturnInProgress = false;
  if(ok) closeModal();

async function savePdaAllocations(){
  if(!DB.pdaAllocations) DB.pdaAllocations = {};
  if(!DB.pdaAllocationsBySoc) DB.pdaAllocationsBySoc = {};
  const oldBuckets = PDA_DEPT_BUCKETS();
  const sites = pdaAllocationEditorSocs();
  const newNames = oldBuckets.map((b,i)=>{
    const el = document.getElementById('pda-dept-name-'+i);
    const v = el ? el.value.trim() : '';
    return v || b;
  });
  const lower = newNames.map(n=>n.toLowerCase());
  const dupIdx = lower.findIndex((n,i)=>lower.indexOf(n)!==i);
  if(dupIdx!==-1){ toast('Department names must be unique — "'+newNames[dupIdx]+'" is used more than once.'); return; }
  if(newNames.some(n=>!n)){ toast('Department name can\'t be blank.'); return; }
  sites.forEach((site,siteIndex)=>{
    const newAllocations = {};
    const previous = DB.pdaAllocationsBySoc[String(site.key||'')]||{};
    Object.keys(previous).forEach(name=>{ if(!oldBuckets.includes(name) && !newNames.includes(name)) newAllocations[name]=previous[name]; });
    oldBuckets.forEach((oldName,i)=>{
      const el = document.getElementById('pda-alloc-'+siteIndex+'-'+i);
      const val = el ? parseInt(el.value,10) : pdaAllocationOf(oldName,site.key);
      newAllocations[newNames[i]] = isNaN(val) || val<0 ? 0 : val;
    });
    DB.pdaAllocationsBySoc[String(site.key||'')] = newAllocations;
  });
  DB.pdaDeptBuckets = newNames;
  await saveDB();
  toast('PDA allocation saved by SOC.');
  renderITAssets();
}
// A PDA number only has to be unique within the SOCs it's actually visible in:
// two specific sites can each run their own "PDA-001", but a shared/untagged
// (soc==='') entry is visible everywhere, so it still conflicts with any site.
function pdaNoConflict(pdaNo, soc, excludeIdx){
  const upper = pdaNo.toUpperCase();
  return DB.pdas.some((p,idx)=> idx!==excludeIdx && p.pdaNo.toUpperCase()===upper && (!p.soc || !soc || p.soc===soc));
}

function parsePdaConditionCsv(raw){
  const r = String(raw||'').trim().toLowerCase();
  if(!r) return 'Good';
  if(r.includes('not working') || r.includes('non-operational') || r.includes('non operational') || r.includes('nonoperational')) return 'DamagedNotWorking';
  if(r.includes('damaged')) return 'DamagedWorking';
  return 'Good';
}
async function importPdaCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  const isAdmin = session.role==='admin';
  const ownSoc = currentSoc();
  let added=0, skipped=0;
  rows.forEach(row=>{
    const pdaNo = csvField(row, ['PDA No','PDA Number','PDA','PDA#']).trim();
    const serial = csvField(row, ['Serial','Serial Number']).trim();
    const condition = parsePdaConditionCsv(csvField(row, ['Condition']));
    let soc = ownSoc;
    if(isAdmin){
      const socRaw = csvField(row, ['SOC','Site','Site (SOC)']).trim();
      const match = DB.warehouses.find(w=>w.toLowerCase()===socRaw.toLowerCase());
      soc = match || '';
    }
    if(!pdaNo || pdaNoConflict(pdaNo, soc, -1)){ skipped++; return; }
    DB.pdas.push({pdaNo, serial, condition, soc, exceptionStatus:'', status:'Available', remarks:'', irFile:'', irFileData:''});
    added++;
  });
  if(added){ await saveDB(); }
  toast('Imported '+added+' PDA'+(added===1?'':'s')+(skipped?(', skipped '+skipped+' (blank/duplicate for that SOC).'):'.'));
  renderITAssets();
}

    const siteLogs=logs.filter(l=>siteOf(l)===dashboardSocKey(site.key));
    const byBucket={}; buckets.forEach(b=>byBucket[b]=0);
    borrowed.forEach(p=>{
      const log=siteLogs.slice().reverse().find(l=>l.pdaNo===p.pdaNo&&siteOf(l)===siteOf(p)&&l.status==='Borrowed');
      const bucket=pdaDeptBucket(log?log.borrowerDepartment:'');
      byBucket[bucket]=(byBucket[bucket]||0)+1;
    });
    buckets.forEach(bucket=>{
      const isOther=bucket==='Other Department';
      const allocated=isOther?null:pdaAllocationOf(bucket,site.key);
      allocationRows.push(`<tr><td>${esc(site.label)}</td><td>${esc(bucket)}</td><td style="text-align:right;">${allocated===null?'—':allocated}</td><td style="text-align:right;">${byBucket[bucket]||0}</td><td style="text-align:right;${allocated!==null&&allocated-(byBucket[bucket]||0)<0?'color:var(--danger);font-weight:600;':''}">${allocated===null?'—':allocated-(byBucket[bucket]||0)}</td></tr>`);
    });
  });
  const daily={};
  logs.forEach(log=>{
    const key=siteOf(log);
    const site=sites.find(x=>dashboardSocKey(x.key)===key);
    const ensure=date=>{
      const rowKey=key+'|'+date;
      if(!daily[rowKey]) daily[rowKey]={site:site?site.label:(log.soc||'Shared / unassigned'),date,borrowed:0,returned:0,am:0,pm:0};
      return daily[rowKey];
    };
    if(log.borrowedAt){
      const row=ensure(localDateStr(log.borrowedAt));
      row.borrowed++;
      pdaShiftsAt(new Date(log.borrowedAt)).forEach(shift=>row[shift.toLowerCase()]++);
    }
    if(log.returnedAt) ensure(localDateStr(log.returnedAt)).returned++;
  });
  const dailyRows=Object.values(daily).sort((a,b)=>b.date.localeCompare(a.date)||a.site.localeCompare(b.site));
  return `<div class="card"><h3>Current PDA stock on hand by SOC</h3>
    <div class="tbl-wrap"><table><tr><th>SOC</th><th style="text-align:right;">On hand</th><th style="text-align:right;">Borrowed</th><th style="text-align:right;">Available</th><th style="text-align:right;">Damaged</th></tr>
      ${onHandRows||'<tr><td colspan="5"><div class="empty">No SOCs configured.</div></td></tr>'}
    </table></div>
  </div>
  <div class="card"><h3>PDA allocation by department and SOC</h3>
    <div class="card-sub">Allocated counts use the SOC-specific values set on PDA Masterlist; borrowed counts reflect devices currently out.</div>
    ${allocationRows.length?'<div class="tbl-wrap"><table><tr><th>SOC</th><th>Department</th><th style="text-align:right;">Allocated</th><th style="text-align:right;">Borrowed</th><th style="text-align:right;">Remaining</th></tr>'+allocationRows.join('')+'</table></div>':'<div class="empty">No PDA departments configured.</div>'}
  </div>
  <div class="card"><div class="list-head"><h3>Daily PDA report by SOC</h3></div>
    <div class="card-sub">Daily borrow and return activity, with AM / PM issuance counts (AM 5:00 AM–2:00 PM; PM 2:00 PM–8:00 AM next day). The 5:00–8:00 AM overlap is assigned to AM so each issuance counts once.</div>
    ${dailyRows.length?'<div class="tbl-wrap"><table><tr><th>Date</th><th>SOC</th><th style="text-align:right;">Borrowed</th><th style="text-align:right;">Returned</th><th style="text-align:right;">AM issued</th><th style="text-align:right;">PM issued</th></tr>'+dailyRows.map(r=>`<tr><td class="mono">${esc(r.date)}</td><td>${esc(r.site)}</td><td style="text-align:right;">${r.borrowed}</td><td style="text-align:right;">${r.returned}</td><td style="text-align:right;">${r.am}</td><td style="text-align:right;">${r.pm}</td></tr>`).join('')+'</table></div>':'<div class="empty"><div class="ic">&#128241;</div>No borrow/return activity yet.</div>'}
  </div>`;
}

/* ------------------------- PDA reports (AM/PM shift + department allocation) ------------------------- */
function localDateStr(d){
  const dt = d ? new Date(d) : new Date();
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
// AM: 5:00 AM–2:00 PM. PM: 2:00 PM–8:00 AM next day. Assign the 5:00–8:00 AM overlap to AM so each issuance counts once.
function pdaShiftsAt(dateObj){
  const minutes = dateObj.getHours()*60 + dateObj.getMinutes();
  const shifts = [];
  if(minutes>=5*60 && minutes<14*60) shifts.push('AM');
  if(minutes>=14*60 || minutes<5*60) shifts.push('PM');
  return shifts;
}
function pdaNextLocalDateStr(dateStr){
  const [year,month,day] = dateStr.split('-').map(Number);
  return localDateStr(new Date(year,month-1,day+1,12));
}
function pdaShiftForReportDate(dateObj,dateStr){
  const time = dateObj.getHours()*60 + dateObj.getMinutes();
  const issueDate = localDateStr(dateObj);
  if(issueDate===dateStr){
    if(time>=5*60 && time<14*60) return 'AM';
    if(time>=14*60) return 'PM';
  }
  if(issueDate===pdaNextLocalDateStr(dateStr) && time<5*60) return 'PM';
  return '';
}
let pdaShiftReportDate = localDateStr();
function pdaReportsHtml(){
  return `<div id="pda-shift-report-wrap">${pdaShiftReportHtml()}</div>
  <div id="pda-dept-report-wrap">${pdaDeptAllocationReportHtml()}</div>`;

  const amCount = dayLogs.filter(l=>pdaShiftForReportDate(new Date(l.borrowedAt),dateStr)==='AM').length;
  const pmCount = dayLogs.filter(l=>pdaShiftForReportDate(new Date(l.borrowedAt),dateStr)==='PM').length;
  return `<div class="card">
    <div class="list-head"><h3>AM / PM shift record</h3>${dlBtn('exportPdaShiftReport')}</div>
    <div class="card-sub">PDA issuances for the selected shift date — AM 5:00 AM to 2:00 PM; PM 2:00 PM to 8:00 AM next day. The 5:00–8:00 AM overlap is assigned to AM so each issuance counts once.</div>

    ${dayLogs.length===0 ? '<div class="empty"><div class="ic">&#128241;</div>No PDA issuances on this date.</div>' :
      '<div class="tbl-wrap"><table><tr><th>Shift</th><th>PDA #</th><th>Borrowed by</th><th>Department</th><th>Borrowed</th><th>Returned</th><th>Status</th></tr>' +
      dayLogs.map(l=>{
        const shift = pdaShiftForReportDate(new Date(l.borrowedAt),dateStr);
        return `<tr><td><span class="tag ${shift==='AM'?'tag-ok':'tag-pullout'}">${shift}</span></td>
          <td class="mono">${esc(l.pdaNo)}</td>

  const buckets = [...PDA_DEPT_BUCKETS(), 'Other Department'];
  const byBucket = {}; buckets.forEach(b=>byBucket[b]=[]);
  borrowed.forEach(p=>{
    const log = pdaLogs.slice().reverse().find(l=>l.pdaNo===p.pdaNo && l.soc===p.soc && l.status==='Borrowed');
    byBucket[pdaDeptBucket(log?log.borrowerDepartment:'')].push({pda:p, log});

      ${buckets.map(b=>{
        const isOther = b==='Other Department';

        const remaining = isOther ? '—' : (alloc - byBucket[b].length);
        return `<tr><td>${esc(b)}</td><td>${isOther?'—':alloc}</td><td>${byBucket[b].length}</td><td${!isOther && remaining<0?' style="color:var(--danger);font-weight:600;"':''}>${remaining}</td></tr>`;
      }).join('')}
      <tr><td>Remaining (available)</td><td>—</td><td>${available.length}</td><td>—</td></tr>
      <tr><td><strong>Total</strong></td><td><strong>${totalAllocated}</strong></td><td><strong>${borrowed.length}</strong></td><td><strong>${totalAllocated - PDA_DEPT_BUCKETS().reduce((s,b)=>s+byBucket[b].length,0)}</strong></td></tr>
    </table></div>
    <div class="section-title">Borrowed — by department</div>

      '<div class="tbl-wrap"><table><tr><th>Department</th><th>PDA #</th><th>Serial</th><th>Borrowed by</th><th>Since</th></tr>' +
      buckets.filter(b=>byBucket[b].length).map(b=>byBucket[b].map(x=>`<tr><td>${esc(b)}</td><td class="mono">${esc(x.pda.pdaNo)}</td><td class="mono">${esc(x.pda.serial||'—')}</td>
        <td>${x.log?esc(x.log.borrowerName)+' <span class="small-note">('+esc(x.log.opsId)+')</span>':'—'}</td>
        <td>${x.log?fmtDateTime(x.log.borrowedAt):'—'}</td></tr>`).join('')).join('') + '</table></div>'}
  </div>`;
}

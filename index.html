<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplies Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003049; --navy-2:#0A4463; --navy-3:#155A80;
  --amber:#F77F00; --amber-light:#FAB266; --amber-dark:#944C00;
  --bg:#F1F3F6; --card:#FFFFFF; --ink:#1B2430; --muted:#6B7686; --faint:#9AA3B0;
  --border:#E2E5EA;
  --success:#2F855A; --success-bg:#E7F5EC; --success-bd:#BFE3CD;
  --danger:#C1443D; --danger-bg:#FBEAEA; --danger-bd:#F1C3C0;
  --warn:#B7791F; --warn-bg:#FDF3DE; --warn-bd:#F2DBA5;
  --info:#2B6CB0; --info-bg:#E8F1FB; --info-bd:#BFDAF3;
  --mono:'JetBrains Mono',monospace; --sans:'Inter',system-ui,sans-serif; --display:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:600;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}
a{color:inherit;}
::placeholder{color:var(--faint);}

/* ---------- Login ---------- */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}
.login-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateY(-16px);}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
.login-brand .login-logo-wrap{width:68px;height:68px;border-radius:50%;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,0.3);}
.login-brand .login-logo{width:114%;height:114%;object-fit:cover;display:block;margin:-7% 0 0 -7%;}
.login-brand-text{width:fit-content;box-sizing:border-box;}
.login-brand .title{font-family:var(--sans);font-weight:700;-webkit-text-stroke:0.5px currentColor;font-size:22px;letter-spacing:-0.01em;color:#EE4D2D;line-height:1.3;white-space:nowrap;}
.login-brand .sub{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#fff;margin-top:3px;}
.login-card{width:380px;box-sizing:border-box;background:rgba(255,255,255,0.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.3);border-radius:14px;padding:30px 32px;box-shadow:0 20px 60px rgba(0,0,0,0.35);}
.login-card h2{font-size:19px;margin-bottom:4px;color:#fff;}
.login-card .lead{color:rgba(255,255,255,0.85);font-size:13px;margin-bottom:22px;}
.login-card .field label{color:rgba(255,255,255,0.85);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fbfbfc;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);background:#fff;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--ink);font-size:13px;font-weight:600;transition:all .12s;}
.btn:hover{border-color:var(--faint);}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);}
#login-screen .btn-primary{background:#EE4D2D;border-color:#EE4D2D;}
#login-screen .btn-primary:hover{background:#d4431f;border-color:#d4431f;}
.btn-primary:hover{background:var(--navy-2);}
.btn-amber{background:var(--amber);color:var(--navy);border-color:var(--amber);}
.btn-amber:hover{background:var(--amber-light);}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd);}
.btn-danger:hover{background:#f7d9d7;}
.btn-success{background:var(--success-bg);color:var(--success);border-color:var(--success-bd);}
.btn-success:hover{background:#d7f0e0;}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
.login-error{background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger);padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}
.login-hint{margin-top:18px;padding-top:16px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--faint);line-height:1.6;}
.login-hint code{background:#f0f1f4;padding:1px 5px;border-radius:4px;font-family:var(--mono);}
.back-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;margin-bottom:16px;}
.back-link:hover{color:var(--ink);}
.back-link-onDark{color:#9AA6BC;}
.back-link-onDark:hover{color:#fff;}

/* ---------- App shell ---------- */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:236px;flex-shrink:0;background:#000;color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;}
.side-brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.side-brand .side-logo-wrap{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.side-brand .side-logo{width:114%;height:114%;object-fit:cover;display:block;margin:-7% 0 0 -7%;}
.side-brand .t1{font-family:var(--display);font-weight:600;font-size:13.5px;color:#fff;line-height:1.25;}
.side-brand .t2{font-size:10px;color:#fff;letter-spacing:0.05em;text-transform:uppercase;}
.nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:#fff;padding:14px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:2px;border-left:3px solid transparent;transition:all .12s;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:rgba(247,127,0,0.14);color:#fff;border-left-color:var(--amber);}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);}
.side-user{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.side-user .av{width:30px;height:30px;border-radius:50%;background:var(--navy-3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.side-user .nm{font-size:12.5px;font-weight:600;color:#fff;line-height:1.3;}
.side-user .rl{font-size:10.5px;color:#fff;text-transform:uppercase;letter-spacing:0.04em;}
.logout-btn{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:8px;border-radius:7px;font-size:12px;font-weight:600;}
.logout-btn:hover{background:rgba(255,255,255,0.1);color:#fff;}

.main{margin-left:236px;flex:1;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
.topbar h1{font-size:19px;}
.topbar .crumbs{font-size:12px;color:var(--muted);margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:16px;}
.notif-wrap{position:relative;}
.notif-bell{width:38px;height:38px;border-radius:9px;background:#F5F6F8;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative;color:var(--ink);transition:all .12s;}
.notif-bell:hover{border-color:var(--faint);background:#EFF1F4;}
.notif-dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:20px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--sans);line-height:1;}
.notif-panel{position:absolute;top:46px;right:0;width:340px;max-height:420px;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(16,24,38,0.18);z-index:20;}
.notif-panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
.notif-panel-head h4{font-size:13px;font-family:var(--sans);font-weight:700;}
.notif-panel-head .mark-read{font-size:11.5px;color:var(--info);font-weight:600;cursor:pointer;}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid #F0F1F4;cursor:pointer;transition:background .12s;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:#F7F8FA;}
.notif-item.unread{background:#FDF8EF;}
.notif-item .ndot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;margin-top:5px;}
.notif-item.read .ndot{background:transparent;}
.notif-item .ntext{font-size:12.5px;line-height:1.45;color:var(--ink);}
.notif-item .ntime{font-size:10.5px;color:var(--faint);margin-top:3px;}
.notif-empty{padding:30px 14px;text-align:center;color:var(--faint);font-size:12.5px;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.02em;}
.badge-admin{background:#EFE6FB;color:#6B3FA0;}
.badge-staff{background:var(--info-bg);color:var(--info);}
.badge-department{background:var(--success-bg);color:var(--success);}
.content{padding:24px 28px 60px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:18px;}
.card h3{font-size:14.5px;margin-bottom:2px;}
.card .card-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}

.metric{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.metric .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:8px;}
.metric .val{font-family:var(--display);font-size:28px;font-weight:700;color:var(--ink);}
.metric .sub{font-size:11.5px;color:var(--faint);margin-top:4px;}
.metric.amber{border-color:var(--warn-bd);background:linear-gradient(180deg,#fff, #FFFBF3);}
.metric.amber .val{color:var(--amber-dark);}
.metric.danger .val{color:var(--danger);}
.metric.success .val{color:var(--success);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--border);background:#FAFBFC;}
td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
.tbl-wrap table{border:none;}
.mono{font-family:var(--mono);font-size:12.5px;}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;}
.tag-asset{background:#EFE6FB;color:#6B3FA0;}
.tag-consumable{background:var(--info-bg);color:var(--info);}
.tag-pending{background:var(--warn-bg);color:var(--warn);}
.tag-approved{background:var(--success-bg);color:var(--success);}
.tag-rejected{background:var(--danger-bg);color:var(--danger);}
.tag-preparing{background:var(--info-bg);color:var(--info);}
.tag-pullout{background:#EFE6FB;color:#6B3FA0;}
.tag-issued{background:var(--success-bg);color:var(--success);}
.tag-forrepair{background:var(--warn-bg);color:var(--warn);}
.tag-repaired{background:var(--success-bg);color:var(--success);}
.tag-backload{background:var(--info-bg);color:var(--info);}
.tag-disposal{background:var(--danger-bg);color:var(--danger);}
.tag-low{background:var(--danger-bg);color:var(--danger);}
.tag-ok{background:var(--success-bg);color:var(--success);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--ink);border-bottom-color:var(--amber);}
.tab:hover{color:var(--ink);}

.empty{padding:36px 20px;text-align:center;color:var(--faint);font-size:13px;}
.empty .ic{font-size:26px;margin-bottom:8px;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.autofill{background:#FAFBFC;color:var(--muted);}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--border);}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
.hint{font-size:11.5px;color:var(--faint);margin-top:4px;}
.suggest-dropdown{display:none;position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,0.12);max-height:220px;overflow-y:auto;margin-top:2px;}
.suggest-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border-light,#f0f1f3);}
.suggest-item:last-child{border-bottom:none;}
.suggest-item:hover{background:var(--bg);}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.25);z-index:999;display:flex;align-items:center;gap:8px;animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.line-items{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;}
.li-row{display:grid;grid-template-columns:110px 1fr 90px 90px 34px;gap:10px;padding:9px 10px;align-items:center;border-bottom:1px solid var(--border);font-size:12.5px;}
.li-row:last-child{border-bottom:none;}
.li-head{background:#FAFBFC;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;}
.icon-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);}
.icon-btn:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd);}
.icon-btn-view{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:none;}
.icon-btn-view:hover{background:var(--info-bg);color:var(--info);border-color:var(--info-bd);}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,38,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:14px;padding:24px 26px;width:440px;max-width:100%;max-height:85vh;overflow-y:auto;}
.modal.modal-wide{width:820px;}
@media print{
  body.printing-transmittal > *:not(#modal-root){display:none !important;}
  body.printing-transmittal #modal-root .modal-bg{position:static;background:none;padding:0;display:block;}
  body.printing-transmittal #modal-root .modal{box-shadow:none;border-radius:0;width:100%;max-width:100%;max-height:none;overflow:visible;padding:0;}
  body.printing-transmittal .no-print{display:none !important;}
}
.modal h3{margin-bottom:4px;}
.modal .close{position:absolute;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.stat-inline{display:flex;gap:8px;align-items:baseline;}
.select-tag select{appearance:none;}
.footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:600;}
.progress{height:6px;background:#EEF0F3;border-radius:3px;overflow:hidden;}
.progress > div{height:100%;background:var(--amber);}
.searchbar{display:flex;gap:10px;margin-bottom:14px;}
.searchbar input{flex:1;}
.small-note{font-size:11.5px;color:var(--faint);}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.list-head h3{margin-bottom:0;}
.dl-btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.status-stack{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
</style>
</head>
<body>

<div id="login-screen">

<!-- SheetJS: lets CSV/Excel import (SKU, Department, Supplier, Accountability,
     Logins, Employees) also accept .xlsx/.xls files, including ones with
     formulas — cells are read using their last-calculated value, not the
     formula text. If this fails to load (e.g. offline), CSV import still
     works; only .xlsx/.xls uploads are affected. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================= STATE / STORAGE ============================= */
/* Shared cloud storage: this file is hosted as a plain static page (not
   inside the Claude Artifact viewer), so there's no built-in window.storage
   backend. Without one, saved data — including newly created user accounts —
   only lived in the current browser's localStorage, which meant a user who
   signed up on one device/browser was completely invisible on any other
   device, even with the correct username and password.

   This block points window.storage at Firebase Firestore (project:
   spx-soc-asset-management) instead, so the same get/set/delete/list calls
   the rest of the app already makes now read/write one shared document that
   every device and browser sees. If Firebase fails to load (offline, ad
   blocker, blocked domain), it falls back to the old localStorage-only
   behavior further below so the app still works solo rather than breaking. */
if(!window.storage){
  const firebaseConfig = {
    apiKey: "AIzaSyC9NknHkluFaWdqQnZWW5--HreG-w7fTZ8",
    authDomain: "spx-soc-asset-management.firebaseapp.com",
    projectId: "spx-soc-asset-management",
    storageBucket: "spx-soc-asset-management.firebasestorage.app",
    messagingSenderId: "261426364010",
    appId: "1:261426364010:web:e0dc8203a4a07c98099413"
  };

  let fsDB = null;
  try{
    if(typeof firebase !== 'undefined'){
      const fbApp = firebase.initializeApp(firebaseConfig);
      fsDB = firebase.firestore(fbApp);
    }
  }catch(e){
    console.warn('Firebase init failed, will fall back to local-only storage:', e);
  }

  if(fsDB){
    const COLLECTION = 'sms_erp_storage';
    const docRef = (key, shared) => fsDB.collection(COLLECTION).doc((shared?'shared__':'local__')+key);
    window.storage = {
      async get(key, shared){
        try{
          const snap = await docRef(key, shared).get();
          if(!snap.exists) return null;
          return {key, value: snap.data().value, shared: !!shared};
        }catch(e){ console.error('storage.get failed:', e); return null; }
      },
      async set(key, value, shared){
        try{
          await docRef(key, shared).set({value, updatedAt: Date.now()});
          return {key, value, shared: !!shared};
        }catch(e){ console.error('storage.set failed:', e); return null; }
      },
      async delete(key, shared){
        try{
          await docRef(key, shared).delete();
          return {key, deleted: true, shared: !!shared};
        }catch(e){ console.error('storage.delete failed:', e); return null; }
      },
      async list(prefix, shared){
        try{
          const snap = await fsDB.collection(COLLECTION).get();
          const marker = (shared?'shared__':'local__');
          const keys = [];
          snap.forEach(doc=>{
            if(doc.id.startsWith(marker)){
              const short = doc.id.slice(marker.length);
              if(!prefix || short.startsWith(prefix)) keys.push(short);
            }
          });
          return {keys, prefix, shared: !!shared};
        }catch(e){ console.error('storage.list failed:', e); return null; }
      }
    };
  }
}

/* Last-resort fallback: only used if Firebase couldn't be reached above.
   Per-browser only — does NOT sync across devices. */
if(!window.storage){
  const LS_PREFIX = 'sms_erp_storage__';
  window.storage = {
    async get(key, shared){
      try{
        const raw = localStorage.getItem(LS_PREFIX+key);
        if(raw===null) return null;
        return {key, value: raw, shared: !!shared};
      }catch(e){ return null; }
    },
    async set(key, value, shared){
      try{
        localStorage.setItem(LS_PREFIX+key, value);
        return {key, value, shared: !!shared};
      }catch(e){ return null; }
    },
    async delete(key, shared){
      try{
        localStorage.removeItem(LS_PREFIX+key);
        return {key, deleted: true, shared: !!shared};
      }catch(e){ return null; }
    },
    async list(prefix, shared){
      try{
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(LS_PREFIX)){
            const short = k.slice(LS_PREFIX.length);
            if(!prefix || short.startsWith(prefix)) keys.push(short);
          }
        }
        return {keys, prefix, shared: !!shared};
      }catch(e){ return null; }
    }
  };
}

function csvVal(v){ const s=(v===undefined||v===null)?'':String(v); return '"'+s.replace(/"/g,'""')+'"'; }
function downloadCSV(filename, headers, rows){
  if(!rows || rows.length===0){ toast('Nothing to download yet.'); return; }
  const lines = [headers.map(csvVal).join(',')].concat(rows.map(r=>r.map(csvVal).join(',')));
  const blob = new Blob(['\uFEFF'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);

function importBtn(fnName, headerHint){
  return `<label class="btn btn-sm" style="margin:0;" title="Expected columns: ${esc(headerHint)}. Accepts .csv or Excel (.xlsx/.xls) — formulas are read as their calculated value.">&#8613; Import<input type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="display:none;" onchange="${fnName}(this)"></label>`;
}
function readFileAsText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsText(file);
  });
}
function readFileAsArrayBuffer(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsArrayBuffer(file);
  });
}
function parseCSVText(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const s = String(text||'').replace(/^\uFEFF/, '');
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inQuotes){
      if(c === '"'){
        if(s[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip, \n handles the break */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===''));
}
function csvRowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=>String(h||'').trim());
  return rows.slice(1).map(r=>{
    const obj={};
    headers.forEach((h,i)=>{ obj[h] = (r[i]!==undefined ? String(r[i]).trim() : ''); });
    return obj;
  }).filter(o=>Object.values(o).some(v=>v!==''));
}
function csvField(row, names){
  const keys = Object.keys(row);
  for(const name of names){
    const k = keys.find(k=>k.toLowerCase().trim()===name.toLowerCase());
    if(k!==undefined) return row[k];
  }
  return '';
}
/* Reads .csv, .xlsx, or .xls files into the same row-object shape either way.
   For Excel files (via the SheetJS library loaded above), each cell is read
   as its last-calculated value — so a column built with a formula (e.g.
   =CONCAT(...) for a full name, or =A2&"-"&B2 for a username) imports the
   result of the formula, not the formula text itself. */
async function importCsvRows(inputEl){
  const file = inputEl.files && inputEl.files[0] ? inputEl.files[0] : null;
  inputEl.value = '';
  if(!file) return null;
  const isExcel = /\.(xlsx|xls)$/i.test(file.name) || /spreadsheetml|ms-excel/i.test(file.type||'');
  try{
    if(isExcel){
      if(typeof XLSX === 'undefined'){ toast('Excel import isn\'t available right now — the spreadsheet library didn\'t load. Try saving as CSV instead.'); return null; }
      const buf = await readFileAsArrayBuffer(file);
      const wb = XLSX.read(buf, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      if(!sheet){ toast('That workbook has no sheets to read.'); return null; }
      // header:1 + raw:false returns each row as an array of the DISPLAYED / CALCULATED
      // value for every cell — formula cells resolve to their result, not the formula.
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
      return csvRowsToObjects(rows.map(r=>r.map(v=>v===null||v===undefined?'':String(v))));
    }
    const text = await readFileAsText(file);
    return csvRowsToObjects(parseCSVText(text));
  }catch(e){
    console.error('Import read error', e);
    toast('Could not read that file — make sure it\'s a valid CSV or Excel file.');
    return null;
  }
}

function fmtDateTime(d){ const dt = d?new Date(d):new Date(); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }

function assetTagsArr(it){
  if(Array.isArray(it.assetTagging)) return it.assetTagging;
  if(typeof it.assetTagging === 'string') return it.assetTagging ? it.assetTagging.split(',').map(t=>t.trim()).filter(t=>t) : [];
  return [];
}
/* Requested qty (it.qty) stays fixed once filed. Approved qty is set by
   the approver and may differ (e.g. partial approval due to stock). Once
   set, it's the quantity that actually flows through tagging, issuance,
   stock deduction, and the transmittal. */
function approvedQtyOf(it){
  return (it.approvedQty!=null && it.approvedQty!=='') ? Number(it.approvedQty) : Number(it.qty);
}
/* Issuance records can represent a batch of several individually-tagged
   units under one line (assetTagging is a comma-joined list). Looking up
   a single physical tag therefore needs a "does this list include the
   tag" check, not an exact-string match against the whole list. */
function issuanceRecordForTag(tag, deptOnly){
  if(!tag) return null;
  const T = tag.trim().toUpperCase();
  return DB.issuance.find(i=>{
    if(!i.assetTagging) return false;
    if(deptOnly && i.department!==session.department) return false;
    return i.assetTagging.split(',').map(t=>t.trim().toUpperCase()).includes(T);
  }) || null;
}
function deptIssuanceRecordForTag(tag){
  if(!tag) return null;
  const T = tag.trim().toUpperCase();
  return DB.deptIssuance.find(d=>d.assetTagging && d.department===session.department && d.assetTagging.split(',').map(t=>t.trim().toUpperCase()).includes(T)) || null;
}
function returnRecordForTag(tag){
  if(!tag) return null;
  const T = tag.trim().toUpperCase();
  return DB.returns.find(r=>r.assetTagging && r.department===session.department && r.assetTagging.split(',').map(t=>t.trim().toUpperCase()).includes(T)) || null;
}
function collectExistingAssetTags(excludeRequestId){
  const set = new Set();
  DB.issuance.forEach(i=>{ if(i.assetTagging) String(i.assetTagging).split(',').map(t=>t.trim()).filter(t=>t).forEach(t=>set.add(t.toUpperCase())); });
  DB.repairs.forEach(rp=>{ if(rp.assetTagging) set.add(String(rp.assetTagging).trim().toUpperCase()); });
  DB.requests.forEach(rq=>{
    if(rq.id===excludeRequestId) return;
    rq.items.forEach(it=>{ assetTagsArr(it).forEach(t=>{ if(t) set.add(t.trim().toUpperCase()); }); });
  });
  return set;
}
function nowISO(){ return new Date().toISOString(); }
function skuInfo(code){ return DB.sku.find(s=>s.sku.toUpperCase()===String(code||'').toUpperCase()); }
/* Daily average consumption: total qty issued for a SKU (from the
   Issuance / Accountability log) spread across the days since its
   earliest issuance. No issuance history yet => 0 (no basis to project). */
function dailyAvgConsumption(sku){
  const records = DB.issuance.filter(i=>i.sku===sku);
  if(records.length===0) return 0;
  const totalQty = records.reduce((s,r)=>s+Number(r.qty||0),0);
  const earliest = Math.min(...records.map(r=>new Date(r.date).getTime()));
  const days = Math.max(1, Math.ceil((Date.now()-earliest)/(1000*60*60*24)));
  return totalQty/days;
}
function safetyStockOf(s){
  const dac = dailyAvgConsumption(s.sku);
  const days = [7,15,30].includes(s.safetyStockDays) ? s.safetyStockDays : 7;
  return Math.ceil(dac*days);
}
function stockStatusRow(s){
  const soh = DB.stock[s.sku]||0;
  const dac = dailyAvgConsumption(s.sku);
  const safety = safetyStockOf(s);
  const sufficient = soh > safety;
  const coverage = dac>0 ? (soh/dac).toFixed(1)+' days' : '—';
  return {soh, dac, safety, sufficient, coverage};
}
function empInfo(opsId){ return DB.employees.find(e=>e.opsId.toUpperCase()===String(opsId||'').toUpperCase()); }

/* ============================= NOTIFICATIONS ============================= */
let notifPanelOpen = false;
function addNotification(message, forPortal, route, sub, forDept){
  if(!DB.notifications) DB.notifications = [];
  const id = 'N'+Date.now()+Math.floor(Math.random()*1000);
  DB.notifications.push({id, message, forPortal, route: route||'', sub: sub||'', forDept: forDept||null, date: nowISO(), read:false});
}
function notifsForSession(){
  if(!DB.notifications) return [];
  return DB.notifications.filter(n=>{
    if(n.forPortal!==portalMode) return false;
    if(portalMode==='department' && n.forDept && n.forDept!==session.department) return false;
    return true;
  }).slice().reverse();
}
function renderNotifBell(){
  const dot = document.getElementById('notif-dot');
  if(!dot) return;
  const unread = notifsForSession().filter(n=>!n.read).length;
  if(unread>0){ dot.textContent = unread>9?'9+':String(unread); dot.style.display='flex'; }
  else{ dot.textContent=''; dot.style.display='none'; }
}
function toggleNotifPanel(e){
  if(e) e.stopPropagation();
  notifPanelOpen = !notifPanelOpen;
  renderNotifPanel();
}
function renderNotifPanel(){
  const panel = document.getElementById('notif-panel');
  if(!panel) return;
  if(!notifPanelOpen){ panel.innerHTML=''; return; }
  const list = notifsForSession();
  panel.innerHTML = `<div class="notif-panel">
    <div class="notif-panel-head"><h4>Notifications</h4><span class="mark-read" onclick="markAllNotifRead(event)">Mark all read</span></div>
    ${list.length===0 ? '<div class="notif-empty">No notifications yet.</div>' :
      list.map(n=>`<div class="notif-item ${n.read?'read':'unread'}" onclick="openNotification('${n.id}')"><span class="ndot"></span><div><div class="ntext">${esc(n.message)}</div><div class="ntime">${fmtDateTime(n.date)}</div></div></div>`).join('')}
  </div>`;
}
async function openNotification(id){
  const n = DB.notifications.find(x=>x.id===id);
  if(!n) return;
  n.read = true;
  await saveDB();
  notifPanelOpen = false;
  renderNotifPanel();
  renderNotifBell();
  if(n.route) navigate(n.route, n.sub);
}
async function markAllNotifRead(e){
  if(e) e.stopPropagation();
  notifsForSession().forEach(n=>{ n.read = true; });
  await saveDB();
  renderNotifPanel();
  renderNotifBell();
}
document.addEventListener('click', function(e){
  if(notifPanelOpen){
    const wrap = document.querySelector('.notif-wrap');
    if(wrap && !wrap.contains(e.target)){ notifPanelOpen=false; renderNotifPanel(); }
  }
});

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const c = document.getElementById('content');
  const tab = subroute || 'asset';

    <div class="tabs">

function requestFrequency(){
  const freq = {};
  DB.requests.forEach(r=> r.items.forEach(it=>{ freq[it.sku] = (freq[it.sku]||0) + Number(it.qty||0); }));
  DB.issuance.forEach(is=>{ freq[is.sku] = (freq[is.sku]||0) + Number(is.qty||0); });
  return freq;
}
function filterStockRows(inputEl, tableId){
  const q = inputEl.value.trim().toLowerCase();
  document.querySelectorAll('#'+tableId+' tr.stock-row').forEach(r=>{
    const s = r.getAttribute('data-search')||'';
    r.style.display = s.includes(q) ? '' : 'none';
  });
}
function stockStatusTableHtml(items, tableId){
  return `
    <div class="field" style="margin-bottom:12px;max-width:340px;">
      <input placeholder="Search by SKU or item description…" oninput="filterStockRows(this,'${tableId}')">
    </div>
    <div class="tbl-wrap"><table id="${tableId}">
      <tr><th>SKU</th><th>Item description</th><th>UOM</th><th style="text-align:right;">SOH</th><th style="text-align:right;">Safety stock</th><th style="text-align:right;">Day coverage</th><th style="text-align:right;">Daily avg. consumption</th><th>Status</th></tr>
      ${items.length===0 ? '<tr><td colspan="8"><div class="empty"><div class="ic">&#9673;</div>No SKUs to show.</div></td></tr>' : items.map(s=>{
        const st = stockStatusRow(s);
        return `<tr class="stock-row" data-search="${esc((s.sku+' '+s.description).toLowerCase())}">
          <td class="mono">${esc(s.sku)}</td><td>${esc(s.description)}</td><td>${esc(s.uom)}</td>
          <td style="text-align:right;font-weight:700;">${st.soh}</td>
          <td style="text-align:right;">${st.safety}</td>
          <td style="text-align:right;">${st.coverage}</td>
          <td style="text-align:right;">${st.dac.toFixed(2)}</td>
          <td>${st.sufficient?'<span class="tag tag-ok">Sufficient Inventory</span>':'<span class="tag tag-low">Below Safety Stock</span>'}</td>
        </tr>`;
      }).join('')}
    </table></div>
  `;
}

function dashAsset(){
  const assets = DB.sku.filter(s=>s.type==='Asset');
  const onHand = assets.reduce((a,s)=>a+(DB.stock[s.sku]||0),0);
  const freq = requestFrequency();
  const top10 = assets.map(s=>({...s, count: freq[s.sku]||0})).sort((a,b)=>b.count-a.count).slice(0,10);
  const rep = DB.repairs;
  const counts = {
    'For Repair': rep.filter(r=>r.status==='For Repair').length,
    'Repaired': rep.filter(r=>r.status==='Repaired').length,
    'For Backload': rep.filter(r=>r.status==='For Backload').length,
    'For Disposal': rep.filter(r=>r.status==='For Disposal').length
  };
  return `
    <div class="grid g4" style="margin-bottom:18px;">
      <div class="metric"><div class="lbl">On-hand asset stock</div><div class="val">${onHand}</div><div class="sub">across ${assets.length} SKUs</div></div>
      <div class="metric amber"><div class="lbl">For repair</div><div class="val">${counts['For Repair']}</div><div class="sub">awaiting repair action</div></div>
      <div class="metric success"><div class="lbl">Repaired</div><div class="val">${counts['Repaired']}</div><div class="sub">returned to service</div></div>
      <div class="metric danger"><div class="lbl">For disposal</div><div class="val">${counts['For Disposal']}</div><div class="sub">${counts['For Backload']} for backload</div></div>
    </div>
    <div class="card">
      <h3>Stock status — assets</h3>
      <div class="card-sub">Per-item inventory health. Safety stock = daily average consumption &times; the SKU's configured coverage window (7 / 15 / 30 days, set in Settings &rarr; SKU code).</div>
      ${stockStatusTableHtml(assets, 'asset-stock-tbl')}
    </div>
    <div class="card">
        <h3>Top 10 most requested assets</h3>
        <div class="card-sub">By cumulative request + issuance quantity</div>
        ${top10.filter(t=>t.count>0).length===0? '<div class="empty"><div class="ic">&#9673;</div>No request activity yet.</div>' :
        top10.map((t,i)=>{
          const max = top10[0].count||1;
          return `<div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
              <span><b>${i+1}.</b> ${esc(t.description)} <span class="mono small-note">${esc(t.sku)}</span></span>
              <span style="font-weight:700;">${t.count}</span>
            </div>
            <div class="progress"><div style="width:${Math.max(4,(t.count/max)*100)}%;"></div></div>
          </div>`;
        }).join('')}
      </div>
    <div class="card">
      <h3>Damaged assets — repair pipeline</h3>
      <div class="card-sub">All assets logged in Repair &amp; Maintenance, grouped by current status</div>
      ${renderRepairPipelineTable()}
    </div>
  `;
}

function renderRepairPipelineTable(){
  if(DB.repairs.length===0) return '<div class="empty"><div class="ic">&#9874;</div>No damaged assets logged yet.</div>';
  const statuses = ['For Repair','Repaired','For Backload','For Disposal'];
  return '<div class="tabs" style="margin-bottom:12px;">' + statuses.map(s=>{
    const n = DB.repairs.filter(r=>r.status===s).length;
    return `<div class="pill">${s} <b>(${n})</b></div>`;
  }).join('') + '</div>' +
  '<div class="tbl-wrap"><table><tr><th>Asset tagging</th><th>SKU</th><th>Item</th><th>Date received</th><th>Status</th><th>Remarks</th></tr>' +
  DB.repairs.slice().reverse().map(r=>`<tr>
    <td class="mono">${esc(r.assetTagging)}</td><td class="mono">${esc(r.sku)}</td><td>${esc(r.description)}</td>
    <td>${fmtDate(r.dateReceived)}</td><td>${statusTag(r.status)}</td><td>${esc(r.remarks||'—')}</td>
  </tr>`).join('') + '</table></div>';
}
function statusTag(s){
  const map = {'For Repair':'tag-forrepair','Repaired':'tag-repaired','For Backload':'tag-backload','For Disposal':'tag-disposal',
    'Pending':'tag-pending','Rejected':'tag-rejected','Approved':'tag-approved','Dept Approval':'tag-pending',
    'Preparing':'tag-preparing','Ready for Pull-out':'tag-pullout','Issued':'tag-issued','Received':'tag-approved',
    'Asset Received':'tag-approved','Added to Inventory':'tag-approved','Disposed':'tag-disposal','Backloaded':'tag-backload'};
  return `<span class="tag ${map[s]||''}">${esc(s)}</span>`;
}
function isDeptApprover(){
  return DB.users.some(u=>u.department===session.department && u.approverUsername && u.approverUsername.toLowerCase()===session.username.toLowerCase());
}

function dashConsumable(){
  const cons = DB.sku.filter(s=>s.type==='Consumable');

    <div class="grid g4" style="margin-bottom:18px;">

      <div class="metric danger"><div class="lbl">Below safety stock</div><div class="val">${low.length}</div><div class="sub">SKUs need reordering</div></div>
      <div class="metric amber"><div class="lbl">Pending requests</div><div class="val">${pendingReq}</div><div class="sub">awaiting admin approval</div></div>
      <div class="metric success"><div class="lbl">Issuance transactions</div><div class="val">${issuedThisLog}</div><div class="sub">total logged</div></div>
    </div>
    <div class="card">
      <h3>Stock status — consumables</h3>
      <div class="card-sub">Per-item inventory health. Safety stock = daily average consumption &times; the SKU's configured coverage window (7 / 15 / 30 days, set in Settings &rarr; SKU code).</div>
      ${stockStatusTableHtml(cons, 'con-stock-tbl')}
    </div>
  `;
}

function toggleReqAcctManual(){
  const sel = document.getElementById('req-acct-select').value;
  const manual = sel === '__manual__';
  document.getElementById('req-acct-manual-wrap').style.display = manual ? 'grid' : 'none';
  const emailEl = document.getElementById('req-acct-email');
  if(!manual){
    const found = DB.accountability.find(a=>a.name===sel);
    emailEl.value = found ? (found.email||'') : '';
  } else {
    emailEl.value = '';
  }
}
function reqDescMatches(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  return DB.sku.filter(s=>s.description.toLowerCase().includes(q) || s.sku.toLowerCase().includes(q)).slice(0,8);
}
function reqDescInput(){
  const v = document.getElementById('req-desc').value;
  // Typing again invalidates any previously auto-filled SKU until a suggestion is picked (or an exact match is typed).
  document.getElementById('req-sku').value = '';
  document.getElementById('req-sku-hint').innerHTML = '';
  const matches = reqDescMatches(v);
  const box = document.getElementById('req-desc-suggest');
  if(!v.trim() || matches.length===0){ box.innerHTML=''; box.style.display='none'; return; }
  box.innerHTML = matches.map(s=>`<div class="suggest-item" onmousedown="reqDescPick('${esc(s.sku).replace(/'/g,"\\'")}')"><span class="mono">${esc(s.sku)}</span> — ${esc(s.description)}</div>`).join('');
  box.style.display='block';
}
function reqDescPick(sku){
  const info = skuInfo(sku);
  if(!info) return;
  document.getElementById('req-desc').value = info.description;
  document.getElementById('req-sku').value = info.sku;
  const onHandPart = portalMode==='department' ? '' : ` &middot; On hand: ${DB.stock[info.sku]||0}`;
  document.getElementById('req-sku-hint').innerHTML = `${info.type} &middot; UOM: ${info.uom}${onHandPart}`;
  const box = document.getElementById('req-desc-suggest');
  box.innerHTML=''; box.style.display='none';
}
function reqDescBlur(){
  // Give the mousedown on a suggestion item time to register before we hide the list.
  setTimeout(()=>{
    const box = document.getElementById('req-desc-suggest');
    if(box){ box.innerHTML=''; box.style.display='none'; }
    // If what's typed exactly matches one item's description, auto-fill the SKU even without a click.
    if(!document.getElementById('req-sku').value){
      const v = document.getElementById('req-desc').value.trim().toLowerCase();
      const exact = DB.sku.find(s=>s.description.toLowerCase()===v);
      if(exact) reqDescPick(exact.sku);
      else if(v) document.getElementById('req-sku-hint').innerHTML = 'No matching item — pick one from the suggestions.';
    }
  }, 150);
}
function addReqItem(){
  const sku = document.getElementById('req-sku').value.trim();
  const qty = Number(document.getElementById('req-qty').value);
  const info = skuInfo(sku);
  if(!info){ toast('Pick an item from the suggestions list first.'); return; }
  if(!qty || qty<=0){ toast('Enter a quantity greater than 0.'); return; }
  reqDraftItems.push({sku:info.sku, description:info.description, type:info.type, uom:info.uom, qty});
  document.getElementById('req-sku').value=''; document.getElementById('req-desc').value=''; document.getElementById('req-qty').value='';
  document.getElementById('req-sku-hint').innerHTML='';
  refreshReqItemsTable();
}
function removeReqItem(i){ reqDraftItems.splice(i,1); refreshReqItemsTable(); }
function refreshReqItemsTable(){
  const el = document.getElementById('req-items-table');
  if(!el) return;
  if(reqDraftItems.length===0){ el.innerHTML = '<div class="empty"><div class="ic">&#9998;</div>No items added yet.</div>'; return; }
  el.innerHTML = '<div class="line-items">' +
    '<div class="li-row li-head"><span>SKU</span><span>Description</span><span>Type</span><span>Qty</span><span></span></div>' +
    reqDraftItems.map((it,i)=>`<div class="li-row"><span class="mono">${esc(it.sku)}</span><span>${esc(it.description)}</span><span>${esc(it.type)}</span><span>${it.qty} ${esc(it.uom)}</span><span><button class="icon-btn" onclick="removeReqItem(${i})">&times;</button></span></div>`).join('')
  + '</div>';
}
function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim()); }
async function submitRequest(){
  if(reqDraftItems.length===0){ toast('Add at least one item before submitting.'); return; }
  const dept = portalMode==='department' ? session.department : document.getElementById('req-dept').value;
  const notes = document.getElementById('req-notes').value;
  const acctSel = document.getElementById('req-acct-select').value;
  let accountableName, accountableEmail;
  if(acctSel==='__manual__'){
    accountableName = document.getElementById('req-acct-manual-name').value.trim();
    if(!accountableName){ toast("Enter the accountable person's full name."); return; }
  }else{
    accountableName = acctSel;
  }
  accountableEmail = document.getElementById('req-acct-email').value.trim();
  if(!accountableEmail || !isValidEmail(accountableEmail)){ toast("Enter the accountable person's working email."); return; }
  const id = nextCode('REQ','req');
  const me = currentUserRecord();
  const approverUsername = me ? me.approverUsername : null;
  const initialStatus = approverUsername ? 'Dept Approval' : 'Pending';
  DB.requests.push({
    id, requestedBy: session.fullName, department: dept, items: reqDraftItems.slice(),
    accountableName, accountableEmail,
    notes, status:initialStatus, dateFiled: nowISO(), decidedBy:null, decidedDate:null,
    requiresApprovalFrom: approverUsername || null
  });
  reqDraftItems = [];
  if(approverUsername){
    addNotification(session.fullName+' filed a request ('+id+') that needs your approval before it goes to Supplies.', 'department', 'dapprovals', 'list', dept);
  } else {
    addNotification(dept+' filed a new supply request ('+id+') by '+session.fullName+'.', 'supplies', 'request', 'list');
  }
  await saveDB();
  toast(approverUsername ? 'Request '+id+' submitted for approval by '+approverUsername+'.' : 'Request '+id+' submitted for approval.');
  navigate(portalMode==='department'?'drequest':'request','list');
}

async function decideDeptApproval(id, decision){
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  if(!r.requiresApprovalFrom || r.requiresApprovalFrom.toLowerCase()!==session.username.toLowerCase()){ toast('You are not the designated approver for this request.'); return; }
  if(decision==='Pending'){
    for(let i=0;i<r.items.length;i++){
      const el = document.getElementById('dapq-'+id+'-'+i);
      const v = el ? Number(el.value) : NaN;
      if(!Number.isFinite(v) || v<0){ toast('Enter a valid quantity for '+r.items[i].sku+'.'); return; }
      r.items[i].approvedQty = v;
    }
  }
  r.status = decision;
  r.deptApprovedBy = session.fullName;
  r.deptApprovedDate = nowISO();
  if(decision==='Pending'){
    addNotification(r.department+' filed a new supply request ('+id+') by '+r.requestedBy+'.', 'supplies', 'request', 'list');
    addNotification('Your request '+id+' was approved by '+session.fullName+' and sent to Supplies.', 'department', 'drequest', 'list', r.department);
  } else {
    addNotification('Your request '+id+' was rejected by '+session.fullName+'.', 'department', 'drequest', 'list', r.department);
  }
  await saveDB();
  toast('Request '+id+' '+(decision==='Pending'?'approved and sent to Supplies.':'rejected.'));
  renderDeptApprovals();
}

async function saveAssetTags(id){
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  const assetItems = r.items.map((it,idx)=>({...it, idx, eq:approvedQtyOf(it)})).filter(it=>it.type==='Asset' && it.eq>0);
  const collected = [];
  let missing = 0;
  assetItems.forEach(it=>{
    const tags = [];
    for(let u=0; u<it.eq; u++){
      const el = document.getElementById('tag-input-'+it.idx+'-'+u);
      const v = el ? el.value.trim() : '';
      if(!v){ missing++; if(el){ el.style.borderColor = 'var(--danger)'; } } else if(el){ el.style.borderColor = ''; }
      tags.push(v);
    }
    collected.push({idx: it.idx, tags});
  });
  if(missing>0){
    toast('Enter an asset tag for every unit — '+missing+' still missing.');
    return;
  }
  const existing = collectExistingAssetTags(r.id);
  const seenHere = new Set();
  const dupes = new Set();
  collected.forEach(c=>{
    c.tags.forEach((t,u)=>{
      const key = t.toUpperCase();
      const el = document.getElementById('tag-input-'+c.idx+'-'+u);
      const isDup = existing.has(key) || seenHere.has(key);
      seenHere.add(key);
      if(isDup){ dupes.add(t); if(el) el.style.borderColor = 'var(--danger)'; }
      else if(el) el.style.borderColor = '';
    });
  });
  if(dupes.size>0){
    toast('These asset tags already exist in the system — use a unique tag per unit: '+[...dupes].join(', '));
    return;
  }
  collected.forEach(c=>{ r.items[c.idx].assetTagging = c.tags; });
  await saveDB();
  closeModal();
  toast('Asset tags saved for '+id+'.');
  navigate(portalMode==='department'?'drequest':'request','list');
}

function showFileModal(name, dataUrl){

    ? `<img src="${dataUrl}" style="max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:8px;">`
    : `<iframe src="${dataUrl}" style="width:100%;height:70vh;border:0;border-radius:8px;"></iframe>`;

    <div class="list-head" style="margin-bottom:14px;">
      <h3 style="margin:0;">${esc(name||'Attached file')}</h3>
      <button class="btn btn-sm" onclick="closeModal()">Close</button>

function downloadTransmittal(id){
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  const html = transmittalStandaloneHtml(r);
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (r.transmittalNo||r.id)+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

    const el = document.getElementById('apq-'+i);
    const v = el ? Number(el.value) : NaN;
    if(!Number.isFinite(v) || v<0){ toast('Enter a valid approved quantity for '+r.items[i].sku+'.'); return; }
    r.items[i].approvedQty = v;
  }
  closeModal();
  await finalizeApproveRequest(r);
}
async function advanceRequestStatus(id, newStatus){
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  r.status = newStatus;
  r.lastUpdatedBy = session.fullName;
  r.lastUpdatedDate = nowISO();
  addNotification('Your request '+id+' is now "'+newStatus+'".', 'department', 'drequest', 'list', r.department);
  await saveDB();
  toast('Request '+id+' marked as '+newStatus+'.');
  navigate(portalMode==='department'?'drequest':'request','list');
}
function requestIssuePreCheck(r){
  const untagged = r.items.filter(it=>it.type==='Asset' && approvedQtyOf(it)>0 && (assetTagsArr(it).length < approvedQtyOf(it) || assetTagsArr(it).some(t=>!t)));
  if(untagged.length){
    toast('Tag every unit of each asset item ("Tag assets") before issuing this request.');
    return false;
  }
  for(const it of r.items){
    if((DB.stock[it.sku]||0) < approvedQtyOf(it)){
      toast('Not enough stock on hand for '+it.sku+' — cannot complete this request.');
      return false;
    }
  }
  return true;
}

/* ---- Issue request flow: real popup window for print/PDF + signed-copy upload -> confirm issuance ---- */
let issueFlowReqId = null;
let issueFlowSignedFile = null; // {name, dataUrl}
function issuePreviewTrnNo(r){
  return r.transmittalNo || ('TRN-'+((DB.counters.trn||100)+1));
}
function issuePreviewObject(r){
  return {...r, transmittalNo: issuePreviewTrnNo(r), issuedBy: r.issuedBy || session.fullName, issuedDate: r.issuedDate || nowISO()};
}
/* Issue request flow now runs entirely in an in-page modal (no pop-up
   window) — printing uses a hidden off-screen iframe, same technique as
   printTransmittal(), so nothing depends on the browser's pop-up permission. */
function openIssueRequestModal(id){
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  if(!requestIssuePreCheck(r)) return;
  issueFlowReqId = id;
  issueFlowSignedFile = null;
  renderIssueModal();
}
function renderIssueModal(){
  const r = DB.requests.find(x=>x.id===issueFlowReqId);
  if(!r) return;
  const preview = issuePreviewObject(r);
  const {styles, body} = transmittalDocParts(preview);
  const signedPreview = issueFlowSignedFile
    ? (/^data:image\//.test(issueFlowSignedFile.dataUrl)
        ? `<img src="${issueFlowSignedFile.dataUrl}" style="max-width:100%;max-height:220px;display:block;border-radius:8px;border:1px solid var(--border);margin-top:8px;">`
        : `<iframe src="${issueFlowSignedFile.dataUrl}" style="width:100%;height:220px;border:1px solid var(--border);border-radius:8px;margin-top:8px;"></iframe>`)
    : '';
  const signedInfo = issueFlowSignedFile ? `&#128206; ${esc(issueFlowSignedFile.name)} attached.` : '';
  showModal(`
    <style>${styles}
      .issue-hint{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
      .issue-btnbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
      .issue-box{border:1px dashed var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
      .issue-box label{display:block;font-weight:700;font-size:12.5px;margin-bottom:8px;}
      .issue-filenote{font-size:12.5px;margin-top:8px;color:var(--ink);}
    </style>
    <div class="no-print">
      <h3 style="margin:0 0 6px;">Issue request — ${esc(r.id)}</h3>
      <div class="issue-hint">1. Print this transmittal or save it as a PDF. 2. Have the requestor sign the printed copy. 3. Upload a photo or scan of the signed copy below (optional, but recommended). 4. Click "Issued request" to finalize.</div>
      <div class="issue-btnbar">
        <button class="btn btn-primary" onclick="printIssuePreview()">&#128438; Print / Save as PDF</button>
        <button class="btn" onclick="downloadIssuePreview()">&#8615; Download HTML</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>
      <div class="issue-box">
        <label>Upload signed transmittal</label>
        <input type="file" accept="image/*,.pdf" onchange="handleSignedFileChange(this.files[0])">
        <div class="issue-hint" style="margin:8px 0 0;">Attach the requestor-signed copy (photo or scan) before confirming issuance.</div>
        <div class="issue-filenote">${signedInfo}</div>
        ${signedPreview}
      </div>
      <div class="issue-btnbar">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-success" id="issue-confirm-btn" onclick="finalizeIssueRequest()">Issued request</button>
      </div>
    </div>
    ${body}
  `);
  const modalEl = document.querySelector('#modal-root .modal');
  if(modalEl) modalEl.classList.add('modal-wide');
}
function printIssuePreview(){
  const r = DB.requests.find(x=>x.id===issueFlowReqId);
  if(!r) return;
  printModalContent();
}
function downloadIssuePreview(){
  const r = DB.requests.find(x=>x.id===issueFlowReqId);
  if(!r) return;
  const html = transmittalStandaloneHtml(issuePreviewObject(r));
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = issuePreviewTrnNo(r)+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function handleSignedFileChange(file){
  if(!file){ issueFlowSignedFile = null; renderIssueModal(); return; }
  if(file.size > 4*1024*1024){ toast('Signed transmittal file is too large (max 4MB).'); return; }
  try{
    const dataUrl = await readFileAsDataURL(file);
    issueFlowSignedFile = {name:file.name, dataUrl};
    renderIssueModal();
  }catch(e){
    console.error('File read error', e);
    toast('Could not read the signed transmittal file.');
  }
}
async function finalizeIssueRequest(){
  const r = DB.requests.find(x=>x.id===issueFlowReqId);
  if(!r) return;
  if(!requestIssuePreCheck(r)) return;
  const id = r.id;
  DB.counters.trn = (DB.counters.trn||100) + 1;
  const transmittalNo = 'TRN-'+DB.counters.trn;
  const empMatch = DB.employees.find(e=>e.fullName===r.accountableName);
  r.items.forEach(it=>{
    const q = approvedQtyOf(it);
    if(q<=0) return;
    const issId = nextCode('ISS','iss');
    DB.issuance.push({
      id: issId, sku: it.sku, description: it.description, type: it.type, uom: it.uom, qty: q, requestedQty: it.qty,
      department: r.department, accountability: r.accountableName||'', accountabilityEmail: r.accountableEmail||'',
      assetTagging: assetTagsArr(it).filter(t=>t).join(', '), opsId: empMatch?empMatch.opsId:'', receivedByName: r.accountableName||'',
      transmittalNo, date: nowISO(), issuedBy: session.fullName, deptReceived:false, sourceRequestId: r.id
    });
    DB.stock[it.sku] -= q;
  });
  r.transmittalNo = transmittalNo;
  r.issuedBy = session.fullName;
  r.issuedDate = nowISO();
  if(issueFlowSignedFile){
    r.signedTransmittalFile = issueFlowSignedFile.dataUrl;
    r.signedTransmittalName = issueFlowSignedFile.name;
  }
  r.status = 'Issued';
  r.lastUpdatedBy = session.fullName;
  r.lastUpdatedDate = nowISO();
  addNotification('Your request '+id+' is now "Issued". It has been registered in the Issuance log — please confirm receipt once the items arrive.', 'department', 'drequest', 'list', r.department);
  await saveDB();
  closeModal();
  issueFlowReqId = null; issueFlowSignedFile = null;
  toast('Request '+id+' issued — registered in Issuance log.');
  navigate(portalMode==='department'?'drequest':'request','list');
}
function viewSignedTransmittal(id){
  const r = DB.requests.find(x=>x.id===id);
  if(!r || !r.signedTransmittalFile){ toast('No signed transmittal attached to this request.'); return; }
  showFileModal(r.signedTransmittalName||r.transmittalNo||r.id, r.signedTransmittalFile);
}

function addRecvItem(){
  const sku = document.getElementById('recv-sku').value.trim();
  const info = skuInfo(sku);

  if(!info){ toast('Enter a valid SKU code first.'); return; }
  if(!qty || qty<=0){ toast('Enter a quantity greater than 0.'); return; }
  recvDraftItems.push({sku:info.sku, description:info.description, type:info.type, uom:info.uom, qty});
  document.getElementById('recv-sku').value=''; document.getElementById('recv-desc').value=''; document.getElementById('recv-type').value=''; document.getElementById('recv-uom').value=''; document.getElementById('recv-qty').value='';

function refreshRecvItemsTable(){
  const el = document.getElementById('recv-items-table');
  if(!el) return;
  if(recvDraftItems.length===0){ el.innerHTML = '<div class="empty"><div class="ic">&#8615;</div>No items added yet.</div>'; return; }
  el.innerHTML = '<div class="line-items">' +
    '<div class="li-row li-head"><span>SKU</span><span>Description</span><span>Type</span><span>Qty</span><span></span></div>' +

  + '</div>';

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function submitReceiving(){
  if(recvDraftItems.length===0){ toast('Add at least one item to the batch first.'); return; }
  const from = document.getElementById('recv-from').value.trim();
  const fileEl = document.getElementById('recv-file');
  const file = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
  if(!from){ toast('Select a supplier — add one in Settings → Supplier if the list is empty.'); return; }
  if(file && file.size > 4*1024*1024){ toast('Transmittal file is too large (max 4MB).'); return; }
  let transmittalFile = '';
  if(file){
    try{ transmittalFile = await readFileAsDataURL(file); }
    catch(e){ console.error('File read error', e); toast('Could not read the attached file — receiving without it.'); }
  }
  const date = nowISO();
  const ids = [];
  recvDraftItems.forEach(it=>{
    const id = nextCode('RCV','recv');
    ids.push(id);
    DB.receiving.push({id, sku:it.sku, description:it.description, type:it.type, uom:it.uom, from, qty:it.qty, date, receivedBy:session.fullName, transmittal:file?file.name:'', transmittalFile});
    DB.stock[it.sku] = (DB.stock[it.sku]||0) + it.qty;
  });
  recvDraftItems = [];
  await saveDB();
  toast(ids.length+' item'+(ids.length===1?'':'s')+' logged ('+ids.join(', ')+') — stock updated.');
  navigate('receiving','list');
}

function repairFormHtml(){
  return `<div class="card">
    <h3>Log a damaged asset</h3>
    <div class="card-sub">Look up by asset tagging to pull the SKU automatically, then set its status.</div>
    <div class="form-row">

let repStatusPick = 'For Repair';
function pickRepStatus(s){ repStatusPick = s; document.querySelectorAll('#rep-status-pills .pill').forEach(p=>p.classList.toggle('active', p.dataset.status===s)); }
function repTagLookup(){
  const tag = document.getElementById('rep-tag').value.trim();
  const found = issuanceRecordForTag(tag, false);
  if(found){ document.getElementById('rep-sku').value = found.sku; repSkuLookup(); }
}
function repSkuLookup(){
  const info = skuInfo(document.getElementById('rep-sku').value);
  document.getElementById('rep-desc').value = info?info.description:'';
}
async function saveRepair(){
  const tag = document.getElementById('rep-tag').value.trim();
  const info = skuInfo(document.getElementById('rep-sku').value);
  const date = document.getElementById('rep-date').value;
  const remarks = document.getElementById('rep-remarks').value.trim();
  if(!tag){ toast('Enter the asset tagging.'); return; }
  if(!info){ toast('Enter a valid SKU code.'); return; }
  const id = nextCode('REP','rep');
  DB.repairs.push({id, assetTagging:tag, sku:info.sku, description:info.description, dateReceived:date, status:repStatusPick, remarks});
  await saveDB();
  toast(id+' logged as "'+repStatusPick+'".');
  repStatusPick='For Repair';
  navigate('repair','list');
}
const REPAIR_EDITABLE_STATUSES = ['For Repair','Repaired','For Backload','For Disposal'];
const REPAIR_TERMINAL_STATUSES = ['Added to Inventory','Disposed','Backloaded'];
function classificationToRepairStatus(cls){
  if(cls==='Disposable') return 'For Disposal';
  if(cls==='Backload') return 'For Backload';
  return 'For Repair';
}
function repairActionCell(r){
  const updateCell = REPAIR_EDITABLE_STATUSES.includes(r.status)
    ? `<select onchange="updateRepairStatus('${r.id}', this.value)" style="padding:5px 8px;font-size:12px;">
        ${REPAIR_EDITABLE_STATUSES.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}
      </select>`
    : `<span class="small-note">${esc(r.status)}</span>`;
  if(session.role!=='admin') return updateCell;
  let actionBtn = '';
  if(r.status==='Repaired') actionBtn = `<button class="btn btn-sm btn-success" onclick="repairAddToInventory('${r.id}')">Add to Inventory</button>`;
  else if(r.status==='For Disposal') actionBtn = `<button class="btn btn-sm btn-danger" onclick="openRepairCompleteModal('${r.id}','dispose')">Dispose</button>`;
  else if(r.status==='For Backload') actionBtn = `<button class="btn btn-sm" onclick="openRepairCompleteModal('${r.id}','backload')">Backloaded</button>`;
  return updateCell + (actionBtn ? '<div style="margin-top:6px;">'+actionBtn+'</div>' : '');
}
function repairListHtml(){
  const header = `<div class="list-head"><h3>Repair register (${DB.repairs.length})</h3>${dlBtn('exportRepairs')}</div>`;
  if(DB.repairs.length===0) return '<div class="card">'+header+'<div class="empty"><div class="ic">&#9874;</div>No damaged assets logged yet.</div></div>';
  return '<div class="card">'+header+'<div class="tbl-wrap"><table>' +
    '<tr><th>Ref #</th><th>Asset tagging</th><th>SKU</th><th>Item</th><th>Date received</th><th>Status</th><th>Remarks</th><th>Transmittal</th><th>Update / Action</th></tr>' +
    DB.repairs.slice().reverse().map(r=>`<tr>
      <td class="mono">${esc(r.id)}</td><td class="mono">${esc(r.assetTagging)}</td><td class="mono">${esc(r.sku)}</td><td>${esc(r.description)}</td>
      <td>${fmtDate(r.dateReceived)}</td><td>${statusTag(r.status)}</td><td>${esc(r.remarks||'—')}</td>
      <td>${repairTransmittalCell(r)}</td>
      <td>${repairActionCell(r)}</td>
    </tr>`).join('') + '</table></div></div>';
}
function repairTransmittalCell(r){
  if(r.transmittalFileData) return `<a href="javascript:void(0)" onclick="viewRepairTransmittal('${esc(r.id)}')" style="color:var(--info);font-weight:600;text-decoration:underline;cursor:pointer;">&#128206; ${esc(r.transmittalFile||'View file')}</a>`;
  return '<span class="small-note">—</span>';
}
function viewRepairTransmittal(id){
  const r = DB.repairs.find(x=>x.id===id);
  if(!r || !r.transmittalFileData){ toast('No transmittal file attached to this record.'); return; }
  showFileModal(r.transmittalFile||r.id, r.transmittalFileData);
}
function exportRepairs(){
  const rows = DB.repairs.map(r=>[r.id,r.assetTagging,r.sku,r.description,fmtDate(r.dateReceived),r.status,r.remarks||'',r.transmittalFile||'']);
  downloadCSV('repair-maintenance.csv', ['Ref #','Asset tagging','SKU','Item','Date received','Status','Remarks','Transmittal'], rows);
}
async function updateRepairStatus(id, status){
  const r = DB.repairs.find(x=>x.id===id);
  if(!r) return;
  r.status = status;
  await saveDB();
  toast(id+' updated to "'+status+'".');
  navigate('repair','list');
}
function removeIssuedAsset(tag){
  if(!tag) return;
  DB.issuance = DB.issuance.filter(i=> !(i.assetTagging && i.assetTagging.toUpperCase()===String(tag).toUpperCase()));
}
async function repairAddToInventory(id){
  if(session.role!=='admin') return;
  const r = DB.repairs.find(x=>x.id===id);
  if(!r) return;
  DB.stock[r.sku] = (DB.stock[r.sku]||0) + 1;
  r.status = 'Added to Inventory';
  r.inventoryBy = session.fullName; r.inventoryDate = nowISO();
  await saveDB();
  toast(r.id+' added back to inventory (+1 '+r.sku+').');
  navigate('repair','list');
}
const REPAIR_TRANSMITTAL_EXT = ['.pdf','.jpg','.jpeg','.png'];
function repairTransmittalFileValid(file){
  if(!file) return false;
  const name = (file.name||'').toLowerCase();
  return REPAIR_TRANSMITTAL_EXT.some(ext=>name.endsWith(ext));
}
function openRepairCompleteModal(id, action){
  if(session.role!=='admin') return;
  const r = DB.repairs.find(x=>x.id===id);
  if(!r) return;
  const isDispose = action==='dispose';
  showModal(`
    <h3>${isDispose?'Confirm disposal':'Confirm backload'}</h3>
    <div class="card-sub mono">${esc(r.id)} &middot; ${esc(r.sku)} &middot; ${esc(r.assetTagging)}</div>
    <div class="field" style="margin-top:14px;"><label>Upload transmittal</label>
      <input type="file" id="repair-transmittal-file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
      <div class="hint">A transmittal file (PDF, JPEG, or PNG) is optional, but recommended, before marking this asset as ${isDispose?'disposed':'backloaded'}.</div>
    </div>
    <div class="footer-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn ${isDispose?'btn-danger':'btn-primary'}" onclick="finalizeRepairAction('${esc(id)}','${action}')">${isDispose?'Confirm dispose':'Confirm backloaded'}</button>
    </div>
  `);
}
async function finalizeRepairAction(id, action){
  const r = DB.repairs.find(x=>x.id===id);
  if(!r) return;
  const fileEl = document.getElementById('repair-transmittal-file');
  const file = fileEl && fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
  if(file){
    if(!repairTransmittalFileValid(file)){ toast('Transmittal must be a PDF, JPEG, or PNG file.'); return; }
    if(file.size > 4*1024*1024){ toast('Transmittal file is too large (max 4MB).'); return; }
    let transmittalFileData = '';
    try{ transmittalFileData = await readFileAsDataURL(file); }
    catch(e){ console.error('File read error', e); toast('Could not read the transmittal file — try again.'); return; }
    r.transmittalFile = file.name; r.transmittalFileData = transmittalFileData;
  }
  if(action==='dispose'){
    r.status = 'Disposed';
    r.disposedBy = session.fullName; r.disposedDate = nowISO();
    removeIssuedAsset(r.assetTagging);
    await saveDB();
    closeModal();
    toast(r.id+' marked disposed and removed from issued assets.');
  } else {
    r.status = 'Backloaded';
    r.backloadBy = session.fullName; r.backloadDate = nowISO();
    removeIssuedAsset(r.assetTagging);
    await saveDB();
    closeModal();
    toast(r.id+' marked backloaded and removed from issued assets.');
  }
  navigate('repair','list');
}

async function receiveReturn(id){
  const r = DB.returns.find(x=>x.id===id);
  if(!r) return;
  if(r.condition==='Good'){
    DB.stock[r.sku] = (DB.stock[r.sku]||0) + r.qty;
  }else{
    const repId = nextCode('REP','rep');
    const info = skuInfo(r.sku);
    const initStatus = r.category==='Asset' ? classificationToRepairStatus(info&&info.assetCondition) : 'For Repair';
    DB.repairs.push({
      id:repId, assetTagging:r.assetTagging||'', sku:r.sku, description:r.description,
      dateReceived: nowISO(), status:initStatus,
      remarks: 'Returned by '+r.department+(r.remarks?(' — '+r.remarks):'')+(r.irFile?(' — IR: '+r.irFile):'')
    });
  }
  r.status = r.category==='Asset' ? 'Asset Received' : 'Received';
  r.receivedBy = session.fullName; r.dateReceived = nowISO();
  await saveDB();
  toast(r.condition==='Good' ? (id+' received — stock updated (+'+r.qty+' '+r.uom+').') : (id+' received — routed to repair register.'));
  navigate('returns','incoming');
}

function dissuTagLookup(){
  const tag = document.getElementById('dissu-assettag').value.trim();
  const skuEl=document.getElementById('dissu-sku-auto'), descEl=document.getElementById('dissu-desc'),
        qtyEl=document.getElementById('dissu-qty-auto'), hintEl=document.getElementById('dissu-tag-hint');
  dissuAutoFound = null;
  if(!tag){ skuEl.value=''; descEl.value=''; qtyEl.value=''; if(hintEl) hintEl.textContent=''; return; }
  const invRec = issuanceRecordForTag(tag, true);
  if(!invRec){
    skuEl.value=''; descEl.value=''; qtyEl.value='';
    if(hintEl) hintEl.textContent = 'No matching asset found in your department\'s current inventory for that tag.';
    return;
  }
  if(deptIssuanceRecordForTag(tag)){
    skuEl.value=''; descEl.value=''; qtyEl.value='';
    if(hintEl) hintEl.textContent = 'This asset has already been issued to a staff member.';
    return;
  }
  if(returnRecordForTag(tag)){
    skuEl.value=''; descEl.value=''; qtyEl.value='';
    if(hintEl) hintEl.textContent = 'This asset has already been returned to Supplies.';
    return;
  }
  dissuAutoFound = {sku:invRec.sku, description:invRec.description, uom:invRec.uom};
  skuEl.value=invRec.sku; descEl.value=invRec.description; qtyEl.value='1';
  if(hintEl) hintEl.textContent = 'Asset found in your department\'s inventory. Auto-filled.';
}

}
function dissuOpsLookup(){

  document.getElementById('dissu-opsname').value = emp?emp.fullName:'';
}
async function submitDeptIssuance(){
  if(!dissuCategory){ toast('Select a category — Asset or Consumables.'); return; }
  const opsId = document.getElementById('dissu-opsid').value.trim();
  const emp = empInfo(opsId);
  const remarks = document.getElementById('dissu-remarks').value.trim();
  let info, qty, assetTagging='', deployedArea='';
  if(dissuCategory==='Asset'){
    const tag = document.getElementById('dissu-assettag').value.trim();
    if(!tag){ toast('Enter the asset tagging to look it up.'); return; }
    if(!dissuAutoFound){ toast('No available asset was found for that tag in your department\'s inventory.'); return; }
    deployedArea = document.getElementById('dissu-deployed-area').value.trim();
    if(!deployedArea){ toast('Enter the deployed area for this asset.'); return; }
    info = skuInfo(dissuAutoFound.sku);
    if(!info){ toast('That asset\'s SKU is no longer in the master list.'); return; }
    qty = 1;
    assetTagging = tag;
  } else {
    info = skuInfo(document.getElementById('dissu-sku').value.trim());
    qty = Number(document.getElementById('dissu-qty').value);
    if(!info){ toast('Enter a valid SKU code first.'); return; }
    if(!qty || qty<=0){ toast('Enter a quantity greater than 0.'); return; }
  }
  if(!opsId || !emp){ toast('Enter a valid Ops ID for the receiving staff member.'); return; }
  const id = nextCode('DI','di');
  DB.deptIssuance.push({id, department:session.department, sku:info.sku, description:info.description, uom:info.uom, qty, assetTagging, deployedArea, opsId, receivedByName:emp.fullName, remarks, date:nowISO(), issuedBy:session.fullName});
  await saveDB();
  toast(id+' issued to '+emp.fullName+'.');
  dissuCategory=null; dissuAutoFound=null;
  navigate('dissuance','list');
}

function dretSkuLookup(){
  const info = skuInfo(document.getElementById('dret-sku').value);
  document.getElementById('dret-desc').value = info?info.description:'';
}
function dretTagAutoLookup(){
  const tag = document.getElementById('dret-assettag-lookup').value.trim();
  let found = null, foundSource = '';
  if(tag){
    let rec = issuanceRecordForTag(tag, true);
    if(rec){ found = {sku:rec.sku, description:rec.description, uom:rec.uom, qty:1, department:rec.department}; foundSource = 'inventory'; }
    if(!found){
      const drec = deptIssuanceRecordForTag(tag);
      if(drec){ found = {sku:drec.sku, description:drec.description, uom:drec.uom, qty:1, department:drec.department}; foundSource = 'issued'; }
    }
    if(!found){
      rec = issuanceRecordForTag(tag, false);
      if(rec){ found = {sku:rec.sku, description:rec.description, uom:rec.uom, qty:1, department:rec.department}; foundSource = 'inventory'; }
    }
  }
  dretAutoFound = found || null;
  const skuEl=document.getElementById('dret-sku-auto'), descEl=document.getElementById('dret-desc'),
        qtyEl=document.getElementById('dret-qty-auto'), uomEl=document.getElementById('dret-uom-auto'),
        deptEl=document.getElementById('dret-dept-auto'), hintEl=document.getElementById('dret-tag-hint');
  if(found){
    skuEl.value=found.sku; descEl.value=found.description; qtyEl.value=found.qty; uomEl.value=found.uom; deptEl.value=found.department;
    if(hintEl) hintEl.textContent = foundSource==='issued'
      ? 'Asset found — currently issued to staff within your department. Auto-filled.'
      : 'Asset found in your department\'s inventory. Auto-filled.';
  } else {
    skuEl.value=''; descEl.value=''; qtyEl.value=''; uomEl.value=''; deptEl.value=session.department;
    if(hintEl) hintEl.textContent = tag ? 'No matching asset found in your inventory or issued records for that tag — check it, or switch to "No Tagging".' : '';
  }
}
async function submitDeptReturn(){
  if(!dretCategory){ toast('Select a category — Asset or Consumables.'); return; }
  if(!dretCondition){ toast('Select a condition — Good or Damaged.'); return; }
  const usingTagLookup = dretCategory==='Asset' && dretCondition==='Damaged' && dretTagMode==='with';
  let info, qty, assetTagging='', irFile='';
  if(usingTagLookup){
    const tag = document.getElementById('dret-assettag-lookup').value.trim();
    if(!tag){ toast('Enter the asset tagging to look it up.'); return; }
    if(!dretAutoFound){ toast('No matching asset was found in your inventory or issued records for that tag — check it, or switch to "No Tagging".'); return; }
    info = skuInfo(dretAutoFound.sku);
    qty = Number(dretAutoFound.qty)||1;
    assetTagging = tag;
    if(!info){ toast('That asset\'s SKU is no longer in the master list.'); return; }
    const fileEl = document.getElementById('dret-ir-file');
    const irFileObj = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
    if(!irFileObj){ toast('Upload the Incident Report (IR) before completing.'); return; }
    if(irFileObj.size > 4*1024*1024){ toast('IR file is too large (max 4MB).'); return; }
    irFile = irFileObj.name;
  } else {
    info = skuInfo(document.getElementById('dret-sku').value.trim());
    qty = Number(document.getElementById('dret-qty').value);
    if(!info){ toast('Enter a valid SKU code first.'); return; }
    if(!qty || qty<=0){ toast('Enter a quantity greater than 0.'); return; }
    if(dretCondition==='Damaged'){
      assetTagging = document.getElementById('dret-assettag').value.trim();
      const fileEl = document.getElementById('dret-ir-file');
      const irFileObj = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
      if(!irFileObj){ toast('Upload the Incident Report (IR) before completing.'); return; }
      if(irFileObj.size > 4*1024*1024){ toast('IR file is too large (max 4MB).'); return; }
      irFile = irFileObj.name;
    }
  }
  let irFileData = '';
  if(dretCondition==='Damaged'){
    const fileEl = document.getElementById('dret-ir-file');
    const irFileObj = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
    if(irFileObj){
      try{ irFileData = await readFileAsDataURL(irFileObj); }
      catch(e){ console.error('File read error', e); toast('Could not read the IR file — completing the return without it attached for viewing.'); }
    }
  }
  const remarks = document.getElementById('dret-remarks').value.trim();
  if(!remarks){ toast('Enter a remark / reason for the return.'); return; }
  const id = nextCode('RET','ret');
  DB.returns.push({
    id, department:session.department, category:dretCategory, condition:dretCondition,
    sku:info.sku, description:info.description, uom:info.uom, qty, assetTagging, irFile, irFileData, remarks,
    status:'Pending', dateReturned:nowISO(), returnedBy:session.fullName, receivedBy:null, dateReceived:null
  });
  addNotification(session.department+' returned '+info.sku+' ('+id+')'+(dretCondition==='Damaged'?' — damaged, IR attached':'')+'.', 'supplies', 'returns', 'incoming');
  await saveDB();
  toast(id+' completed — returned to Supplies for pickup.');
  dretCategory=null; dretCondition=null; dretTagMode='with'; dretAutoFound=null;
  navigate('dreturn','list');
}

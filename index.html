// For a Staff/Hub login this is their fixed home site. For an admin it's
// whichever SOC they've currently switched the view to (via socSwitcherHtml) —
// so records an admin creates while "viewing" a SOC get tagged to that SOC,
// same as a real login for that site would. Admin on "All SOCs" gets '' (shared/untagged).
function currentSoc(){
  if(session && session.role==='admin') return adminViewSoc || '';
  return (session && session.site) ? session.site : '';
}
function socOf(recSoc){ return recSoc ? `<span class="small-note">${esc(recSoc)}</span>` : '<span class="small-note">—</span>'; }
function socKey(value){ return String(value||'').trim().toUpperCase(); }
function departmentEntries(name){
  const key = String(name||'').trim().toLowerCase();
  return (DB.departments||[]).filter(d=>String(d.name||'').trim().toLowerCase()===key);
}
function socVisible(recSoc){
  if(!session) return true;
  const recordSoc = socKey(recSoc);
  if(session.role==='admin'){
    if(adminViewSoc) return !recordSoc || recordSoc===socKey(adminViewSoc); // admin narrowed to one SOC: that SOC + untagged/legacy records
    return true; // admin, no filter picked: everything
  }
  if(session.role==='department') return true;
  if(!recordSoc) return true;
  return recordSoc === socKey(session.site);
}
function socFilter(arr){ return (arr||[]).filter(x=>socVisible(x.soc)); }
/* Request records inherit their site's SOC from the department master. This
   repairs visibility for older submissions whose department login had a
   stale SOC saved, while keeping duplicate department names site-specific. */
function requestSoc(r){
  const recordedSoc = r && r.soc ? String(r.soc) : '';
  // The transaction's supply site must survive changes to department settings.
  if(recordedSoc.trim()) return recordedSoc.trim();
  const matches = departmentEntries(r&&r.department);
  if(matches.length===1) return matches[0].soc||'';
  if(matches.length>1){
    if(matches.some(d=>(d.soc||'')===recordedSoc)) return recordedSoc;
    const legacySoc = (DB.departmentSoc||{})[r.department]||'';
    return matches.some(d=>(d.soc||'')===legacySoc) ? legacySoc : null;
  }
  return recordedSoc;
}
function requestVisible(r){
  const soc = requestSoc(r);
  if(soc===null) return !!session && session.role==='admin' && !adminViewSoc;
  return socVisible(soc);
}
function socFilterRequests(arr){ return (arr||[]).filter(requestVisible); }
function resolvedDepartmentSoc(name, preferredSoc){
  const preferred = preferredSoc||'';
  const matches = departmentEntries(name);
  if(matches.some(d=>(d.soc||'')===preferred)) return preferred;
  if(matches.length===1) return matches[0].soc||'';
  const legacySoc = (DB.departmentSoc||{})[name]||'';
  if(matches.some(d=>(d.soc||'')===legacySoc)) return legacySoc;
  return preferred;
}
// ---- Per-SOC stock quantities ----
// DB.stock is nested: DB.stock[soc][sku] = on-hand qty. The soc key '' is the
// shared/legacy bucket — stock that predates per-site tracking, or stock an
// admin adds while "viewing" All SOCs. A specific site's on-hand always
// includes that shared bucket too (same convention socVisible/socFilter use
// for untagged records: visible everywhere). Viewing "All SOCs" (soc==='')
// sums every site's bucket for a true company-wide total.
function stockQuantityForSku(bucket, sku){
  const target=String(sku||'').trim().toUpperCase();
  if(!target) return 0;
  return Object.keys(bucket||{}).reduce((total,key)=>
    total+(String(key||'').trim().toUpperCase()===target?(Number(bucket[key])||0):0),0);
}
function stockOf(sku, soc){
  if(soc===undefined) soc = currentSoc();
  if(!DB.stock) DB.stock = {};
  if(!soc){
    // '' means "All SOCs combined" — but that combined, cross-site total is
    // only ever meant for an admin who has deliberately left the SOC
    // switcher on "All SOCs". A Staff/Hub login should never land here
    // through its own site being blank/misconfigured, since that would leak
    // every other site's on-hand stock into their dashboard. So: real admin
    // all-view sums every SOC; anything else with a blank soc only sees the
    // shared/legacy bucket, exactly like a specific site would.
    if(session && session.role==='admin'){
      let total = 0;
      Object.keys(DB.stock).forEach(k=>{ total += stockQuantityForSku(DB.stock[k],sku); });
      return total;
    }
    let shared = 0;
    Object.keys(DB.stock).filter(k=>!socKey(k)).forEach(k=>{ shared += stockQuantityForSku(DB.stock[k],sku); });
    return shared;
  }
  let own = 0, shared = 0;
  Object.keys(DB.stock).forEach(k=>{
    if(socKey(k)===socKey(soc)) own += stockQuantityForSku(DB.stock[k],sku);
    else if(!socKey(k)) shared += stockQuantityForSku(DB.stock[k],sku);
  });
  return own + shared;
}
function setStock(sku, qty, soc){
  if(soc===undefined) soc = currentSoc();
  if(!DB.stock) DB.stock = {};
  if(!DB.stock[soc]) DB.stock[soc] = {};
  DB.stock[soc][sku] = Number(qty)||0;
}
function addStock(sku, delta, soc){
  if(soc===undefined) soc = currentSoc();
  if(!DB.stock) DB.stock = {};
  if(!DB.stock[soc]) DB.stock[soc] = {};
  DB.stock[soc][sku] = Number(DB.stock[soc][sku]||0) + Number(delta);
}
function deleteStockAllSocs(sku){
  Object.keys(DB.stock||{}).forEach(k=>{ delete DB.stock[k][sku]; });
}

async function navigate(r, sub){
  if(r==='settings' && session.role==='hub'){
    toast('Settings is not available in the HUB portal.');
    const landing=defaultLandingRoute();
    r=landing.route==='settings'?'dashboard':landing.route;
    sub=landing.route==='settings'?'asset':landing.sub;
  }
  if(r==='cageloading' && sub==='masterlist' && !canViewCageMasterlist()){
    toast('Cage Masterlist is available to SOC users only.');
    r='cageloading';sub='receive';
  }
  if(r==='reusablesacks' && sub==='masterlist' && !canViewReusableSackMasterlist()){
    toast('Reusable Sack Masterlist is available to SOC users only.');
    r='reusablesacks';sub='receive';
  }
  if(portalMode!=='department' && ROUTE_PROCESS[r] && !sessionHasProcess(ROUTE_PROCESS[r])){
    toast('You don\'t have access to '+processLabel(ROUTE_PROCESS[r])+'.');
    r = 'dashboard'; sub = '';
  }
  document.body.classList.add('app-theme');
  route = r; subroute = sub || '';
  const titles = portalMode==='department' ? TITLES_DEPT : TITLES;
  renderShell();
  document.getElementById('page-title').textContent = titles[r][0];
  document.getElementById('page-crumb').textContent = titles[r][1];
  const badgeClass = roleBadgeClass(session.role);
  const badge = '<span class="badge '+badgeClass+'">'+session.role.toUpperCase()+'</span>';
  document.getElementById('topbar-right').innerHTML = badge;
  const generation = ++navigationGeneration;
  document.getElementById('content').innerHTML = '<div class="empty">Loading current data…</div>';
  try{
    await ensureRouteData(r,subroute);
  }catch(e){
    console.error('Route data load failed:', e);
    if(generation===navigationGeneration) document.getElementById('content').innerHTML = '<div class="empty">Could not load this screen. Reload once the database connection is back.</div>';
    return;
  }
  if(generation!==navigationGeneration) return;
  const map = {
    dashboard: renderDashboard, request: renderRequest, receiving: renderReceiving,
    issuance: renderIssuance, returns: renderReturns, cyclecount: renderCycleCount, repair: renderRepair,
    cageloading: renderCageLoading, reusablesacks: renderReusableSacks, itassets: renderITAssets, parcelretrieval: renderParcelRetrieval, settings: renderSettings,
    ddashboard: renderDeptDashboard, dreceiving: renderDeptReceiving, dissuance: renderDeptIssuance, dreturn: renderDeptReturn, drequest: renderRequest, dapprovals: renderDeptApprovals
  };
  const fallback = portalMode==='department' ? renderDeptDashboard : renderDashboard;
  (map[r]||fallback)();
  renderAppFontControls();
  renderNotifBell();
  if(session) saveUiSession();
}

let notifPanelOpen = false;
function addNotification(message, forPortal, route, sub, forDept){
  if(!DB.notifications) DB.notifications = [];
  const id = 'N'+Date.now()+Math.floor(Math.random()*1000);
  DB.notifications.push({id, message, forPortal, route: route||'', sub: sub||'', forDept: forDept||null, date: nowISO(), read:false});
}
function notifsForSession(){
  if(!DB.notifications) return [];
  return DB.notifications.filter(n=>{
    if(n.forPortal!==portalMode) return false;
    if(portalMode==='department' && n.forDept && n.forDept!==session.department) return false;
    return true;
  }).slice().reverse();
}
function renderNotifBell(){
  const dot = document.getElementById('notif-dot');
  if(!dot) return;
  const unread = notifsForSession().filter(n=>!n.read).length;
  if(unread>0){ dot.textContent = unread>9?'9+':String(unread); dot.style.display='flex'; }
  else{ dot.textContent=''; dot.style.display='none'; }
}
function toggleNotifPanel(e){
  if(e) e.stopPropagation();
  notifPanelOpen = !notifPanelOpen;
  renderNotifPanel();
}
function renderNotifPanel(){
  const panel = document.getElementById('notif-panel');
  if(!panel) return;
  if(!notifPanelOpen){ panel.innerHTML=''; return; }
  const list = notifsForSession();
  panel.innerHTML = `<div class="notif-panel">
    <div class="notif-panel-head"><h4>Notifications</h4><span class="mark-read" onclick="markAllNotifRead(event)">Mark all read</span></div>
    ${list.length===0 ? '<div class="notif-empty">No notifications yet.</div>' :
      list.map(n=>`<div class="notif-item ${n.read?'read':'unread'}" onclick="openNotification('${n.id}')"><span class="ndot"></span><div><div class="ntext">${esc(n.message)}</div><div class="ntime">${fmtDateTime(n.date)}</div></div></div>`).join('')}
  </div>`;
}
async function openNotification(id){
  const n = DB.notifications.find(x=>x.id===id);
  if(!n) return;
  n.read = true;
  await saveDB();
  notifPanelOpen = false;
  renderNotifPanel();
  renderNotifBell();
  if(n.route) navigate(n.route, n.sub);
}
async function markAllNotifRead(e){
  if(e) e.stopPropagation();
  notifsForSession().forEach(n=>{ n.read = true; });
  await saveDB();
  renderNotifPanel();
  renderNotifBell();
}
document.addEventListener('click', function(e){
  if(notifPanelOpen){
    const wrap = document.querySelector('.notif-wrap');
    if(wrap && !wrap.contains(e.target)){ notifPanelOpen=false; renderNotifPanel(); }
  }
});

function isAdminAllSocView(){ return !!session && session.role==='admin' && !adminViewSoc; }
function dashboardSocEntries(sourceNames){
  const entries = [];
  const seen = new Set();
  let hasShared = false;
  const add = value => {
    const label = String(value||'').trim();
    if(!label) return;
    const key = socKey(label);
    if(seen.has(key)) return;
    seen.add(key);
    entries.push({key:label, label});
  };
  (DB.warehouses||[]).forEach(add);
  Object.keys(DB.stock||{}).forEach(add);
  (sourceNames||[]).forEach(name=>{
    if(name==='requests') return;
    (DB[name]||[]).forEach(row=>{ if(row.soc) add(row.soc); else hasShared = true; });
  });
  if((sourceNames||[]).includes('requests')) (DB.requests||[]).forEach(row=>{
    const value = requestSoc(row);
    if(value===null) return;
    if(value) add(value); else hasShared = true;
  });
  const sharedStock = DB.stock&&DB.stock['']||{};
  if(!(sourceNames||[]).length && Object.values(sharedStock).some(q=>Number(q)>0)) hasShared = true;
  if(hasShared) entries.push({key:'', label:'Shared / unassigned'});
  return entries;
}
function dashboardSocKey(value){ return String(value||'').trim() ? socKey(value) : ''; }
function dashboardStockOf(sku, soc){
  const key = dashboardSocKey(soc);
  const stored=Object.keys(DB.stock||{}).reduce((total,k)=>
    total+(dashboardSocKey(k)===key?stockQuantityForSku(DB.stock[k],sku):0),0);
  const info=skuInfo(sku);
  return info&&info.type==='Asset' ? Math.max(stored,availableAssetCodesForDashboard(sku,soc,true).length) : stored;
}
function inventoryBySocHtml(items, label){
  const socs = dashboardSocEntries([]);
  const totals = socs.map(site=>({site, qty:items.reduce((sum,s)=>sum+dashboardStockOf(s.sku,site.key),0), active:items.filter(s=>dashboardStockOf(s.sku,site.key)>0).length}));
  const detail = [];
  totals.forEach(({site})=>items.forEach(s=>detail.push({site,sku:s.sku,description:s.description,uom:s.uom,qty:dashboardStockOf(s.sku,site.key)})));
  return `<div class="card">
    <h3>${label} on-hand inventory by SOC</h3>
    <div class="card-sub">Site-specific stock is shown by SOC. Shared and legacy stock appears in its own row so it is not counted twice across sites.</div>
    <div class="tbl-wrap"><table><tr><th>SOC</th><th style="text-align:right;">On hand</th><th style="text-align:right;">SKUs with stock</th></tr>
      ${totals.map(x=>`<tr><td>${esc(x.site.label)}</td><td style="text-align:right;font-weight:700;">${x.qty}</td><td style="text-align:right;">${x.active}</td></tr>`).join('')}
      ${totals.length===0?'<tr><td colspan="3"><div class="empty">No SOCs configured.</div></td></tr>':''}
    </table></div>
    <div class="section-title">Item detail</div>
    <div class="tbl-wrap"><table><tr><th>SOC</th><th>SKU</th><th>Item description</th><th>UOM</th><th style="text-align:right;">On hand</th></tr>
      ${detail.length?detail.map(x=>`<tr><td>${esc(x.site.label)}</td><td class="mono">${esc(x.sku)}</td><td>${esc(x.description)}</td><td>${esc(x.uom||'—')}</td><td style="text-align:right;font-weight:700;">${x.qty}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No items to show.</div></td></tr>'}
    </table></div>
  </div>`;
}
function requestFrequencyForSoc(soc){
  const freq = {};
  const target = dashboardSocKey(soc);
  (DB.requests||[]).forEach(r=>{
    const resolved = requestSoc(r);
    if(resolved===null || dashboardSocKey(resolved)!==target) return;
    (r.items||[]).forEach(it=>{ freq[it.sku]=(freq[it.sku]||0)+Number(it.qty||0); });
  });
  (DB.issuance||[]).filter(row=>dashboardSocKey(row.soc)===target).forEach(row=>{ freq[row.sku]=(freq[row.sku]||0)+Number(row.qty||0); });
  return freq;
}
function top10ItemsBySocHtml(items,label){
  const sections = dashboardSocEntries(['requests','issuance']).map(site=>{
    const freq = requestFrequencyForSoc(site.key);
    const top = items.map(s=>({...s,count:freq[s.sku]||0})).sort((a,b)=>b.count-a.count).slice(0,10).filter(s=>s.count>0);
    return `<div class="card"><h3>${esc(site.label)} — top 10 most requested ${esc(label)}</h3>
      ${top.length?'<div class="tbl-wrap"><table><tr><th>#</th><th>SKU</th><th>Item</th><th style="text-align:right;">Requested + issued</th></tr>'+top.map((s,i)=>`<tr><td>${i+1}</td><td class="mono">${esc(s.sku)}</td><td>${esc(s.description)}</td><td style="text-align:right;font-weight:700;">${s.count}</td></tr>`).join('')+'</table></div>':'<div class="empty"><div class="ic">&#9673;</div>No request activity for this SOC yet.</div>'}
    </div>`;
  });
  return sections.join('');
}

  const top10 = assets.map(s=>({...s, count: freq[s.sku]||0})).sort((a,b)=>b.count-a.count).slice(0,10);
  const rep = socFilter(DB.repairs);
  const counts = {
    'For Repair': rep.filter(r=>r.status==='For Repair').length,
    'Repaired': rep.filter(r=>r.status==='Repaired').length,

      ${stockStatusTableHtml(assets, 'asset-stock-tbl')}

    <div class="card" style="display:${isAdminAllSocView()?'none':''};">
        <h3>Top 10 most requested assets</h3>
        <div class="card-sub">By cumulative request + issuance quantity</div>
        ${top10.filter(t=>t.count>0).length===0? '<div class="empty"><div class="ic">&#9673;</div>No request activity yet.</div>' :
        top10.map((t,i)=>{
          const max = top10[0].count||1;
          return `<div style="margin-bottom:10px;">

              <span style="font-weight:700;">${t.count}</span>
            </div>

      <h3>Damaged assets — repair pipeline</h3>
      <div class="card-sub">All assets logged in Repair &amp; Maintenance, grouped by current status</div>

}

function renderRepairPipelineTable(){
  const repairs = socFilter(DB.repairs);
  if(repairs.length===0) return '<div class="empty"><div class="ic">&#9874;</div>No damaged assets logged yet.</div>';
  const statuses = ['For Repair','Repaired','For Backload','For Disposal'];
  return '<div class="tabs" style="margin-bottom:12px;">' + statuses.map(s=>{
    const n = repairs.filter(r=>r.status===s).length;
    return `<div class="pill">${s} <b>(${n})</b></div>`;
  }).join('') + '</div>' +
  '<div class="tbl-wrap"><table><tr><th>Asset tagging</th><th>SKU</th><th>Item</th><th>Date received</th><th>Status</th><th>Remarks</th></tr>' +
  repairs.slice().reverse().map(r=>`<tr>
    <td class="mono">${esc(r.assetTagging)}</td><td class="mono">${esc(r.sku)}</td><td>${esc(r.description)}</td>
    <td>${fmtDate(r.dateReceived)}</td><td>${statusTag(r.status)}</td><td>${esc(r.remarks||'—')}</td>
  </tr>`).join('') + '</table></div>';
}
function statusTag(s){
  const map = {'For Repair':'tag-forrepair','Repaired':'tag-repaired','For Backload':'tag-backload','For Disposal':'tag-disposal',
    'Pending':'tag-pending','Rejected':'tag-rejected','Approved':'tag-approved','Dept Approval':'tag-pending',
    'Preparing':'tag-preparing','Ready for Pull-out':'tag-pullout','Issued':'tag-issued','Received':'tag-approved',
    'Asset Received':'tag-approved','Added to Inventory':'tag-approved','Disposed':'tag-disposal','Backloaded':'tag-backload'};
  return `<span class="tag ${map[s]||''}">${esc(s)}</span>`;
}
function isDeptApprover(){
  return DB.users.some(u=>u.department===session.department && u.approverUsername && u.approverUsername.toLowerCase()===session.username.toLowerCase());
}

function dashConsumable(){
  const cons = DB.sku.filter(s=>s.type==='Consumable');
  const onHand = cons.reduce((a,s)=>a+stockOf(s.sku),0);
  const low = cons.filter(s=>!stockStatusRow(s).sufficient);
  const pendingReq = socFilterRequests(DB.requests).filter(r=>r.status==='Pending' && r.items.some(it=>{const info=skuInfo(it.sku);return info&&info.type==='Consumable';})).length;
  const issuedThisLog = socFilter(DB.issuance).filter(is=>{const info=skuInfo(is.sku);return info&&info.type==='Consumable';}).length;
  return `
    <div class="grid g4" style="margin-bottom:18px;">
      <div class="metric"><div class="lbl">On-hand consumable stock</div><div class="val">${onHand}</div><div class="sub">across ${cons.length} SKUs</div></div>
      <div class="metric danger"><div class="lbl">Below safety stock</div><div class="val">${low.length}</div><div class="sub">SKUs need reordering</div></div>
      <div class="metric amber"><div class="lbl">Pending requests</div><div class="val">${pendingReq}</div><div class="sub">awaiting admin approval</div></div>

      <h3>Stock status — consumables</h3>
      <div class="card-sub">Per-item inventory health. Safety stock = daily average consumption &times; the SKU's configured coverage window (7 / 15 / 30 days, set in Settings &rarr; SKU code).</div>
      ${stockStatusTableHtml(cons, 'con-stock-tbl')}
    </div>
  `;
}

function reqAcctMatches(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  return DB.accountability.filter(a=>a.name.toLowerCase().includes(q)).slice(0,8);
}
function reqAcctInput(){
  const v = document.getElementById('req-acct-name').value;
  const matches = reqAcctMatches(v);
  const box = document.getElementById('req-acct-suggest');
  if(!v.trim() || matches.length===0){ box.innerHTML=''; box.style.display='none'; return; }
  box.innerHTML = matches.map(a=>`<div class="suggest-item" onmousedown="reqAcctPick('${esc(a.name).replace(/'/g,"\\'")}')">${esc(a.name)}${a.email?' <span class="small-note">'+esc(a.email)+'</span>':''}</div>`).join('');
  box.style.display='block';
}
function reqAcctPick(name){
  const found = DB.accountability.find(a=>a.name===name);
  if(!found) return;
  document.getElementById('req-acct-name').value = found.name;
  document.getElementById('req-acct-email').value = found.email||'';
  const box = document.getElementById('req-acct-suggest');
  box.innerHTML=''; box.style.display='none';
}
function reqAcctBlur(){
  setTimeout(()=>{
    const box = document.getElementById('req-acct-suggest');
    if(box){ box.innerHTML=''; box.style.display='none'; }
  }, 150);
}
function reqDescMatches(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  return DB.sku.filter(s=>s.description.toLowerCase().includes(q) || s.sku.toLowerCase().includes(q)).slice(0,8);
}
function reqDescInput(){
  const v = document.getElementById('req-desc').value;
  // Typing again invalidates any previously auto-filled SKU until a suggestion is picked (or an exact match is typed).
  document.getElementById('req-sku').value = '';
  document.getElementById('req-sku-hint').innerHTML = '';
  const matches = reqDescMatches(v);
  const box = document.getElementById('req-desc-suggest');
  if(!v.trim() || matches.length===0){ box.innerHTML=''; box.style.display='none'; return; }
  box.innerHTML = matches.map(s=>`<div class="suggest-item" onmousedown="reqDescPick('${esc(s.sku).replace(/'/g,"\\'")}')"><span class="mono">${esc(s.sku)}</span> — ${esc(s.description)}</div>`).join('');
  box.style.display='block';
}
function reqDescPick(sku){
  const info = skuInfo(sku);
  if(!info) return;
  document.getElementById('req-desc').value = info.description;
  document.getElementById('req-sku').value = info.sku;
  const onHandPart = portalMode==='department' ? '' : ` &middot; On hand: ${stockOf(info.sku)}`;
  document.getElementById('req-sku-hint').innerHTML = `${info.type} &middot; UOM: ${info.uom}${onHandPart}`;
  const box = document.getElementById('req-desc-suggest');
  box.innerHTML=''; box.style.display='none';
}
function reqDescBlur(){
  // Give the mousedown on a suggestion item time to register before we hide the list.
  setTimeout(()=>{
    const box = document.getElementById('req-desc-suggest');
    if(box){ box.innerHTML=''; box.style.display='none'; }
    // If what's typed exactly matches one item's description, auto-fill the SKU even without a click.
    if(!document.getElementById('req-sku').value){
      const v = document.getElementById('req-desc').value.trim().toLowerCase();
      const exact = DB.sku.find(s=>s.description.toLowerCase()===v);
      if(exact) reqDescPick(exact.sku);
      else if(v) document.getElementById('req-sku-hint').innerHTML = 'No matching item — pick one from the suggestions.';
    }
  }, 150);
}
function addReqItem(){
  const sku = document.getElementById('req-sku').value.trim();
  const qty = Number(document.getElementById('req-qty').value);
  const info = skuInfo(sku);
  if(!info){ toast('Pick an item from the suggestions list first.'); return; }
  if(!qty || qty<=0){ toast('Enter a quantity greater than 0.'); return; }
  if(info.type==='Asset' && !Number.isInteger(qty)){ toast('Enter a whole number of assets.'); return; }
  reqDraftItems.push({sku:info.sku, description:info.description, type:info.type, uom:info.uom, qty});
  document.getElementById('req-sku').value=''; document.getElementById('req-desc').value=''; document.getElementById('req-qty').value='';
  document.getElementById('req-sku-hint').innerHTML='';
  refreshReqItemsTable();
}
function removeReqItem(i){ reqDraftItems.splice(i,1); refreshReqItemsTable(); }
function refreshReqItemsTable(){
  const el = document.getElementById('req-items-table');
  if(!el) return;
  if(reqDraftItems.length===0){ el.innerHTML = '<div class="empty"><div class="ic">&#9998;</div>No items added yet.</div>'; return; }
  el.innerHTML = '<div class="line-items">' +
    '<div class="li-row li-head"><span>SKU</span><span>Description</span><span>Type</span><span>Qty</span><span></span></div>' +
    reqDraftItems.map((it,i)=>`<div class="li-row"><span class="mono">${esc(it.sku)}</span><span>${esc(it.description)}</span><span>${esc(it.type)}</span><span>${it.qty} ${esc(it.uom)}</span><span><button class="icon-btn" onclick="removeReqItem(${i})">&times;</button></span></div>`).join('')
  + '</div>';
}
function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim()); }
async function submitRequest(){
  if(reqDraftItems.length===0){ toast('Add at least one item before submitting.'); return; }
  let deptSel;
  if(portalMode==='department'){
    const socSelect = document.getElementById('req-dept-soc');
    if(socSelect && !socSelect.value){ toast('Choose the department SOC so the request reaches the correct Supplies portal.'); return; }
    const selectedSoc = socSelect ? parseDeptKey(socSelect.value).soc : session.departmentSoc||'';
    deptSel = {name:session.department, soc:resolvedDepartmentSoc(session.department, selectedSoc)};
  } else {
    deptSel = parseDeptKey(document.getElementById('req-dept').value);
  }
  const dept = deptSel.name;
  const notes = document.getElementById('req-notes').value;
  const acctName = document.getElementById('req-acct-name').value.trim();
  if(!acctName){ toast("Enter the accountable person's full name."); return; }
  const accountableName = acctName;
  const accountableEmail = document.getElementById('req-acct-email').value.trim();
  if(!accountableEmail || !isValidEmail(accountableEmail)){ toast("Enter the accountable person's working email."); return; }
  const me = currentUserRecord();
  const approverUsername = me ? me.approverUsername : null;
  const initialStatus = approverUsername ? 'Dept Approval' : 'Pending';
  const items = reqDraftItems.map(it=>({...it}));
  const dateFiled = nowISO();
  let id = '';
  const saved = await saveDBWithRetry(()=>{
    id = nextCode('REQ','req');
    DB.requests.push({
      id, requestedBy: session.fullName, department: dept, items: items.map(it=>({...it})),
      accountableName, accountableEmail,
      notes, status:initialStatus, dateFiled, decidedBy:null, decidedDate:null,
      requiresApprovalFrom: approverUsername || null,
      soc: deptSel.soc || ''
    });
    syncOpenRequestAssetCodes();
    if(approverUsername){
      addNotification(session.fullName+' filed a request ('+id+') that needs your approval before it goes to Supplies.', 'department', 'dapprovals', 'list', dept);
      addNotification('New request ('+id+') from '+dept+' is awaiting department approval by '+approverUsername+'.', 'supplies', 'request', 'list');
    } else {
      addNotification(dept+' filed a new supply request ('+id+') by '+session.fullName+'.', 'supplies', 'request', 'list');
    }
  });
  if(!saved) return;
  reqDraftItems = [];

async function decideDeptApproval(id, decision){
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  if(!r.requiresApprovalFrom || r.requiresApprovalFrom.toLowerCase()!==session.username.toLowerCase()){ toast('You are not the designated approver for this request.'); return; }
  let approvedQuantities = [];
  if(decision==='Pending'){
    for(let i=0;i<r.items.length;i++){
      const el = document.getElementById('dapq-'+id+'-'+i);
      const v = el ? Number(el.value) : NaN;
      if(!Number.isFinite(v) || v<0){ toast('Enter a valid quantity for '+r.items[i].sku+'.'); return; }
      if(r.items[i].type==='Asset' && !Number.isInteger(v)){ toast('Enter a whole number of assets for '+r.items[i].sku+'.'); return; }
      approvedQuantities.push(v);
    }
  }
  const decidedAt = nowISO();
  let applied = false;
  const saved = await saveDBWithRetry(()=>{
    applied = false;
    const current = DB.requests.find(x=>x.id===id);
    if(!current || current.status!=='Dept Approval' || !current.requiresApprovalFrom || current.requiresApprovalFrom.toLowerCase()!==session.username.toLowerCase()) return;
    if(decision==='Pending'){
      if(current.items.length!==approvedQuantities.length) return;
      current.items.forEach((it,i)=>{ it.approvedQty = approvedQuantities[i]; });
    }
    current.status = decision;
    current.deptApprovedBy = session.fullName;
    current.deptApprovedDate = decidedAt;
    syncOpenRequestAssetCodes();
    if(decision==='Pending'){
      addNotification(current.department+' filed a new supply request ('+id+') by '+current.requestedBy+'.', 'supplies', 'request', 'list');
      addNotification('Your request '+id+' was approved by '+session.fullName+' and sent to Supplies.', 'department', 'drequest', 'list', current.department);
    } else {
      addNotification('Your request '+id+' was rejected by '+session.fullName+'.', 'department', 'drequest', 'list', current.department);
    }
    applied = true;
  });
  if(!saved) return;
  if(!applied){ toast('This request was already changed. Refresh the approvals list before trying again.'); renderDeptApprovals(); return; }
  toast('Request '+id+' '+(decision==='Pending'?'approved and sent to Supplies.':'rejected.'));
  renderDeptApprovals();
}
function requestStatusCell(r){
  // Shows visibility of both the "Issued" milestone and the department's "Received" confirmation,

  if(r.status==='Issued' || r.status==='Received'){
    return `<div class="status-stack">${statusTag('Issued')}${r.status==='Received'?statusTag('Received'):'<span class="tag tag-pending">Awaiting receipt confirmation</span>'}</div>`;
  }

}
function receivedAmsTagForAssetCode(assetTag){
  const key = String(assetTag||'').trim().toUpperCase();
  if(!key) return '';
  for(const r of DB.receiving||[]){
    if(r.type!=='Asset') continue;
    const codes = recvAssetCodesOf(r);
    const index = codes.findIndex(code=>String(code).trim().toUpperCase()===key);
    if(index<0) continue;
    const amsTags = Array.isArray(r.amsTags) ? r.amsTags : assetCodeValues(r.amsTags);
    return String(amsTags[index]||'').trim();
  }
  return '';
}
/* QR labels must contain the physical Asset Tag, never the separate AMS tag.
   For older open requests that only stored an AMS value, recover the physical
   tag by matching it to the receiving record that paired the two identifiers. */
function physicalAssetCodesForRequestItem(it){
  if(!it) return [];
  const directCodes=assetCodeValues(Array.isArray(it.assetCodes)?it.assetCodes.join('\n'):(it.assetCode||''));
  if(directCodes.length) return directCodes;
  return assetTagsArr(it).map(amsTag=>{
    const key=String(amsTag||'').trim().toUpperCase();
    if(!key) return '';
    for(const received of DB.receiving||[]){
      if(received.type!=='Asset') continue;
      const tags=Array.isArray(received.amsTags)?received.amsTags:assetCodeValues(received.amsTags||'');
      const index=tags.findIndex(tag=>String(tag||'').trim().toUpperCase()===key);
      const codes=recvAssetCodesOf(received);
      if(index>=0&&codes[index]) return codes[index];
    }
    return '';
  }).filter(Boolean);
}
function requestAssetLabelRows(r){
  const labels = [];
  (r&&Array.isArray(r.items)?r.items:[]).forEach(it=>{
    if(it.type!=='Asset') return;
    const qty = Math.max(0,Math.floor(approvedQtyOf(it)||0));
    physicalAssetCodesForRequestItem(it).slice(0,qty).forEach(assetTag=>labels.push({
      assetTag,
      itemName:it.description||(skuInfo(it.sku)||{}).description||it.sku,
      department:r.department||'',
      accountablePerson:r.accountableName||'',
      amsTag:receivedAmsTagForAssetCode(assetTag)
    }));
  });
  return labels;
}

      .asset-tag-sheet:not(:last-child){break-after:page;page-break-after:always;}
      .asset-tag-label{width:2in;height:1in;box-sizing:border-box;display:grid;grid-template-columns:.92in 1fr;border:.6pt solid #111;background:#fff;color:#000;overflow:hidden;break-inside:avoid;page-break-inside:avoid;}
      .asset-tag-qr{width:.92in;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0!important;border-right:.6pt solid #111;overflow:hidden;background:#fff;}
      .asset-tag-qr-frame{width:.90in;height:.90in;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0;background:transparent;border:0;border-radius:0;overflow:hidden;}
      .asset-tag-qr-inset{width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:transparent;overflow:hidden;}
      .asset-tag-qr-code{width:.90in;height:.90in;box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;}
      .asset-tag-qr-code canvas{display:block!important;width:.90in!important;height:.90in!important;min-width:.90in!important;min-height:.90in!important;max-width:.90in!important;max-height:.90in!important;margin:0!important;flex:0 0 .90in!important;image-rendering:pixelated;box-sizing:border-box!important;}
      .asset-tag-details{min-width:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));}
      .asset-tag-row{min-width:0;display:flex;align-items:center;gap:.025in;padding:0 .025in;border-bottom:.5pt solid #111;overflow:hidden;white-space:nowrap;line-height:1;}
      .asset-tag-row:last-child{border-bottom:0;}
      .asset-tag-value{min-width:0;flex:1;font-size:8pt;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      @media print{
        html,body{width:auto!important;min-width:0!important;margin:0!important;padding:0!important;background:#fff!important;}
        body.printing-transmittal #modal-root .modal.asset-tag-modal{width:8in!important;max-width:8in!important;min-height:0!important;max-height:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;background:#fff!important;}
        body.printing-transmittal #modal-root .modal-bg{position:static!important;display:block!important;padding:0!important;background:#fff!important;}
        body.printing-transmittal #modal-root .asset-tag-sheet{width:8in!important;height:11in!important;gap:0!important;margin:0!important;}
        body.printing-transmittal #modal-root .asset-tag-label{width:2in!important;height:1in!important;margin:0!important;}
      }
    </style>
    <div class="asset-tag-toolbar no-print">

    ${sheetHtml.join('')}
  `);
  const modalEl = document.querySelector('#modal-root .modal');
  if(modalEl){ modalEl.classList.add('asset-tag-modal'); modalEl.classList.add('modal-wide'); }
  labels.forEach((label,index)=>{
    const qrEl = document.getElementById('asset-tag-qr-'+index);
    const assetTagPayload = String(label.assetTag||'').trim();
    if(!qrEl || !assetTagPayload) return;
    const qr = new QRCode(qrEl,{text:assetTagPayload,width:600,height:600,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    const model = qr && qr._oQRCode;
    const moduleCount = model && typeof model.getModuleCount==='function' ? model.getModuleCount() : 0;
    if(!moduleCount || typeof model.isDark!=='function') return;
    /* The QR symbol needs four clear modules on every side. Draw the matrix
       ourselves so its modules stay square and the white quiet zone survives
       both the rounded label frame and printer scaling. */
    const quietModules=4, pixelsPerModule=24, canvas=document.createElement('canvas');
    const fullSize=(moduleCount+quietModules*2)*pixelsPerModule;
    canvas.width=fullSize; canvas.height=fullSize;
    canvas.setAttribute('role','img');
    canvas.setAttribute('aria-label','QR code encoding asset tag '+assetTagPayload);
    const ctx=canvas.getContext('2d');
    if(!ctx) return;
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,fullSize,fullSize);
    ctx.fillStyle='#000000';
    for(let row=0;row<moduleCount;row++) for(let col=0;col<moduleCount;col++){
      if(model.isDark(row,col)) ctx.fillRect((col+quietModules)*pixelsPerModule,(row+quietModules)*pixelsPerModule,pixelsPerModule,pixelsPerModule);
    }
    while(qrEl.firstChild) qrEl.removeChild(qrEl.firstChild);
    qrEl.appendChild(canvas);
  });
}

function deleteRequest(id){
  if(session.role!=='admin') return;
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  const stockAffecting = ['Issued','Received'].includes(r.status);
  const warning = stockAffecting
    ? 'Delete '+r.id+'? This request has already been issued — deleting it will NOT reverse the related Issuance log entries or stock. Remove those separately from the Issuance log if needed.'
    : 'Delete '+r.id+'? This cannot be undone.';
  confirmAction(warning, async ()=>{
    DB.requests = DB.requests.filter(x=>x.id!==id);
    syncOpenRequestAssetCodes();
    await saveDB();
    toast('Request deleted.');
    navigate(portalMode==='department'?'drequest':'request','list');

function transmittalDocParts(r){
  const itemRows = r.items.map(it=>{
    const tags = requestAssetCodesArr(it).filter(Boolean);
    const qty = approvedQtyOf(it);
    return `<tr>
      <td>${esc(it.sku)}</td>
      <td>${esc(it.description)}</td>
      <td>${esc(it.uom||'')}</td>
      <td>${qty}</td>
      <td class="trn-asset-tag">${tags.map(esc).join('<br>')}</td>
    </tr>`;
  }).join('');
  const styles = `
  @page{size:A4 landscape;margin:5mm;}
  :root{color-scheme:light;}
  *{box-sizing:border-box;}
  .trn-copy-stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5mm;width:100%;height:auto;align-items:start;}
  .trn-copy-page{position:relative;isolation:isolate;box-sizing:border-box;min-width:0;width:100%;height:auto;min-height:0;padding:4mm;border:1px solid #9aa3ad;background:#fff;break-inside:avoid;page-break-inside:avoid;overflow:visible;}
  .trn-watermark{position:absolute;z-index:0;width:58%;max-width:80mm;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.10;mix-blend-mode:multiply;pointer-events:none;}
  .trn-doc{position:relative;z-index:1;height:auto;display:flex;flex-direction:column;font-family:Arial, Helvetica, sans-serif;color:#10182a;line-height:1.25;font-size:8px;}
  .trn-doc h1{font-size:10px;line-height:1.15;margin:0 0 1mm;}
  .trn-doc h2{font-size:8px;margin:0 0 1mm;}
  .trn-doc .sub{color:#4b5568;margin:0 0 2mm;font-size:7px;}
  .trn-doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:2mm 4mm;margin:0 0 2mm;font-size:7px;}
  .trn-doc .meta div{min-width:0;overflow-wrap:anywhere;}
  .trn-doc .meta div span{display:inline;color:#303846;font-weight:700;font-size:6.5px;text-transform:none;letter-spacing:0;margin:0 1mm 0 0;}
  .trn-doc .trn-items{margin-top:1mm;}
  .trn-doc table{width:100%;table-layout:fixed;border-collapse:collapse;margin:0;}
  .trn-doc th,.trn-doc td{border:1px solid #c5c9ce;padding:1mm 1.2mm;text-align:left;font-size:7px;line-height:1.15;vertical-align:middle;overflow-wrap:anywhere;}
  .trn-doc th{background:#414141;color:#000!important;text-align:center;font-size:7.5px;}
  .trn-doc th:nth-child(1){width:18%;}
  .trn-doc th:nth-child(2){width:31%;}
  .trn-doc th:nth-child(3){width:12%;}
  .trn-doc th:nth-child(4){width:9%;text-align:center;}
  .trn-doc th:nth-child(5){width:30%;}
  .trn-doc td:nth-child(4){text-align:center;}
  .trn-doc .trn-asset-tag{font-size:6.5px;word-break:break-word;}
  .trn-doc .trn-signature-section{margin-top:5mm;}
  .trn-doc .trn-signatures{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:2mm;border-top:1px solid #aeb4bc;padding:2mm 2mm 0;font-size:7px;}
  .trn-doc .trn-signatures strong{font-weight:700;}
  @media print{
    html,body{width:auto!important;max-width:none!important;margin:0!important;padding:0!important;background:#fff!important;}
    body{font-size:8pt!important;}
    .trn-copy-stack{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:auto!important;gap:5mm!important;width:100%!important;height:auto!important;align-items:start!important;}
    .trn-copy-page{width:100%!important;height:auto!important;min-height:0!important;margin:0!important;padding:4mm!important;background:#fff!important;break-inside:avoid-page;page-break-inside:avoid;overflow:visible!important;}
    .trn-watermark{width:58%!important;max-width:80mm!important;opacity:.10!important;}
    .trn-doc{font-size:8pt;line-height:1.2;}
    .trn-doc h1{font-size:10pt;margin:0 0 1mm;}
    .trn-doc h2{font-size:8pt;margin:0 0 1mm;}
    .trn-doc .sub{font-size:7pt;margin:0 0 2mm;}
    .trn-doc .meta{gap:2mm 4mm;margin-bottom:2mm;font-size:7pt;}
    .trn-doc .meta div span{font-size:6.5pt;}
    .trn-doc th,.trn-doc td{padding:1mm 1.1mm;font-size:7pt;}
    .trn-doc th{font-size:7.5pt;}
    .trn-doc .trn-asset-tag{font-size:6.5pt;}
    .trn-doc .trn-signatures{gap:4mm;margin-top:2mm;padding:2mm 2mm 0;font-size:7pt;}
  }`;
  const copyHtml = copyNumber => `
  <section class="trn-copy-page" aria-label="Transmittal copy ${copyNumber}">
    <img class="trn-watermark" src="${SPX_TRANSMITTAL_LOGO_DATA_URL}" alt="" aria-hidden="true">
    <main class="trn-doc" role="main" aria-labelledby="trn-doc-title-${copyNumber}">
      <h1 id="trn-doc-title-${copyNumber}">Supply Transmittal &amp; Accountability Record</h1>
      <p class="sub">Transmittal No. <strong>${esc(r.transmittalNo)}</strong> &middot; Source request <strong>${esc(r.id)}</strong></p>
      <section aria-label="Transmittal details">
        <div class="meta">
          <div><span>Department:</span>${esc(r.department)}</div>
          <div><span>Date issued:</span>${fmtDateOrBlank(r.issuedDate)||'—'}</div>
          <div><span>Requested by:</span>${esc(r.requestedBy)}</div>
          <div><span>Issued by:</span>${esc(r.issuedBy||'—')}</div>
          <div><span>Accountable person:</span>${esc(r.accountableName||'—')}</div>
          <div><span>Accountable email:</span>${esc(r.accountableEmail||'—')}</div>
        </div>
      </section>
      <section class="trn-items" aria-label="Items issued">
        <h2>Items issued</h2>
        <table>
          <caption class="visually-hidden">List of issued items and assigned asset tags</caption>
          <thead>
            <tr><th scope="col">SKU</th><th scope="col">Description</th><th scope="col">UOM</th><th scope="col">Qty</th><th scope="col">Asset tag</th></tr>
          </thead>
          <tbody>${itemRows}</tbody>
        </table>
      </section>
      <section class="trn-signature-section" aria-label="Signatures">
        <div class="trn-signatures">
          <div><strong>Released by:</strong> ${esc(r.issuedBy||'')}</div>
          <div><strong>Received by:</strong> ${esc(r.accountableName||'')}</div>
        </div>
      </section>
    </main>
  </section>`;
  const body = `<div class="trn-copy-stack">${copyHtml(1)}${copyHtml(2)}</div>`;
  return {styles, body};
}function transmittalStandaloneHtml(r){
  const {styles, body} = transmittalDocParts(r);
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmittal ${esc(r.transmittalNo)} — ${esc(r.id)}</title>
<style>body{max-width:820px;margin:24px auto;padding:0 20px 40px;}${styles}</style>
</head>
<body>${body}</body>
</html>`;
}
/* In-page file viewer — replaces the old window.open()-based viewers so
   nothing depends on the browser's pop-up permission. Renders straight into
   the existing modal system. Works for both image and PDF data URLs. */
function showFileModal(name, dataUrl){
  if(!dataUrl){ toast('No file attached.'); return; }
  const isImage = /^data:image\//.test(dataUrl);
  const preview = isImage
    ? `<img src="${dataUrl}" style="max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:8px;">`
    : `<iframe src="${dataUrl}" style="width:100%;height:70vh;border:0;border-radius:8px;"></iframe>`;
  showModal(`
    <div class="list-head" style="margin-bottom:14px;">
      <h3 style="margin:0;">${esc(name||'Attached file')}</h3>
      <button class="btn btn-sm" onclick="closeModal()">Close</button>
    </div>
    ${preview}
  `);
  const modalEl = document.querySelector('#modal-root .modal');
  if(modalEl) modalEl.classList.add('modal-wide');
}
function openTransmittal(id){
  const r = DB.requests.find(x=>x.id===id);
  if(!r || !r.transmittalNo){ toast('No transmittal has been generated for this request yet.'); return; }
  const {styles, body} = transmittalDocParts(r);
  showModal(`
    <style>${styles}</style>
    <div class="footer-actions no-print" style="margin-bottom:16px;">
      <button class="btn" onclick="closeModal()">Close</button>
      <button class="btn" onclick="downloadTransmittal('${r.id}')">&#8615; Download HTML</button>
      <button class="btn btn-primary" onclick="printTransmittal('${r.id}')">&#128438; Print 2 copies on one A4 / Save as PDF</button>
    </div>
    ${body}
  `);
  const modalEl = document.querySelector('#modal-root .modal');
  if(modalEl){ modalEl.classList.add('modal-wide'); modalEl.id = 'trn-modal'; }
}
function printTransmittal(id){
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  // Print the transmittal that's already rendered in the open modal, using
  // the printing-transmittal print stylesheet (hides everything else on the
  // page). This is far more reliable than printing from a hidden iframe,
  // which many browsers silently refuse to do since the iframe is never
  // actually visible/rendered.
  printModalContent();
}

async function confirmApproveRequest(id){
  if(actionInFlight) return;
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  const supplySite=requestSoc(r)||document.getElementById('approve-supply-soc')?.value||'';
  if(!supplySite){toast('Choose the supplying SOC before approving this request.');return;}
  if(session.role!=='admin' && socKey(supplySite)!==socKey(currentSoc())){
    toast('Approve this request from its supplying SOC.');return;
  }
  if(['Preparing','Ready for Pull-out','Approved','Issued','Received','Rejected'].includes(r.status)){
    toast('This request has already been processed.'); return;
  }
  const quantities=[];
  for(let i=0;i<r.items.length;i++){
    const el = document.getElementById('apq-'+i);
    const v = el ? Number(el.value) : NaN;
    if(!Number.isFinite(v) || v<0){ toast('Enter a valid approved quantity for '+r.items[i].sku+'.'); return; }
    if(r.items[i].type==='Asset' && !Number.isInteger(v)){ toast('Enter a whole number of assets for '+r.items[i].sku+'.'); return; }
    quantities.push(v);
  }
  const beforeRequests=JSON.parse(JSON.stringify(DB.requests));
  const beforeNotifications=JSON.parse(JSON.stringify(DB.notifications));
  const requestSnapshot=lastKnownSnapshot.requests;
  const notificationSnapshot=lastKnownSnapshot.notifications;
  r.soc=supplySite;
  r.items.forEach((it,i)=>{it.approvedQty=quantities[i];});
  // Allocate received tags when Supplies approves this request.
  r.status = 'Preparing';
  syncOpenRequestAssetCodes();
  const shortAsset = r.items.find(it=>it.type==='Asset' && requestAssetCodesArr(it).length<approvedQtyOf(it));
  if(shortAsset){
    const available=requestAssetCodesArr(shortAsset).length;
    DB.requests=beforeRequests;
    toast('Only '+available+' unassigned received asset tag(s) are available for '+shortAsset.sku+' at this SOC; '+approvedQtyOf(shortAsset)+' requested for approval. Tags already assigned to approved requests or issued assets cannot be reused.');
    return;
  }
  actionInFlight=true;
  try{
    if(!await finalizeApproveRequest(r)){
      // Keep freshly loaded conflict data; otherwise undo the unsaved approval.
      if(lastKnownSnapshot.requests===requestSnapshot) DB.requests=beforeRequests;
      if(lastKnownSnapshot.notifications===notificationSnapshot) DB.notifications=beforeNotifications;
    }
  }finally{actionInFlight=false;}
}
async function advanceRequestStatus(id, newStatus){
  const r = DB.requests.find(x=>x.id===id);
  if(!r) return;
  r.status = newStatus;
  r.lastUpdatedBy = session.fullName;
  r.lastUpdatedDate = nowISO();
  addNotification('Your request '+id+' is now "'+newStatus+'".', 'department', 'drequest', 'list', r.department);
  await saveDB();
  toast('Request '+id+' marked as '+newStatus+'.');
  navigate(portalMode==='department'?'drequest':'request','list');
}
function requestIssuePreCheck(r){
  const unassigned = r.items.find(it=>it.type==='Asset' && approvedQtyOf(it)>0 && requestAssetCodesArr(it).length < approvedQtyOf(it));
  if(unassigned){
    toast('Not enough asset tags are assigned for '+unassigned.sku+'. Asset tags are assigned from available received inventory when Supplies approves a request.');
    return false;
  }
  for(const it of r.items){
    if(stockOf(it.sku, r.soc) < approvedQtyOf(it)){
      toast('Not enough stock on hand for '+it.sku+' — cannot complete this request.');
      return false;
    }
  }
  return true;
}

async function handleSignedFileChange(file){
  if(!file){ issueFlowSignedFile = null; renderIssueModal(); return; }
  if(file.size > 4*1024*1024){ toast('Signed transmittal file is too large (max 4MB).'); return; }
  try{
    const dataUrl = await readFileAsDataURL(file);
    issueFlowSignedFile = {name:file.name, dataUrl};
    renderIssueModal();
  }catch(e){
    console.error('File read error', e);
    toast('Could not read the signed transmittal file.');
  }
}
async function finalizeIssueRequest(){
  const r = DB.requests.find(x=>x.id===issueFlowReqId);
  if(!r) return;
  if(!issueFlowSignedFile){ toast('Upload the signed transmittal before confirming.'); return; }
  if(!requestIssuePreCheck(r)) return;
  const id = r.id;
  DB.counters.trn = (DB.counters.trn||100) + 1;
  const transmittalNo = 'TRN-'+DB.counters.trn;
  const empMatch = DB.employees.find(e=>e.fullName===r.accountableName);
  r.items.forEach(it=>{
    const q = approvedQtyOf(it);
    if(q<=0) return;
    const assetCodes = it.type==='Asset' ? physicalAssetCodesForRequestItem(it).slice(0,q) : [];
    const issId = nextCode('ISS','iss');
    DB.issuance.push({
      id: issId, sku: it.sku, description: it.description, type: it.type, uom: it.uom, qty: q, requestedQty: it.qty,
      department: r.department, accountability: r.accountableName||'', accountabilityEmail: r.accountableEmail||'',
      assetCodes, assetTagging: assetTagsArr(it).slice(0,q).join(', '), opsId: empMatch?empMatch.opsId:'', receivedByName: r.accountableName||'',
      transmittalNo, date: nowISO(), issuedBy: session.fullName, deptReceived:false, sourceRequestId: r.id, soc: r.soc||''
    });
    addStock(it.sku, -q, r.soc||'');
  });
  r.transmittalNo = transmittalNo;
  r.issuedBy = session.fullName;
  r.issuedDate = nowISO();
  r.signedTransmittalFile = issueFlowSignedFile.dataUrl;
  r.signedTransmittalName = issueFlowSignedFile.name;
  r.status = 'Issued';
  r.lastUpdatedBy = session.fullName;
  r.lastUpdatedDate = nowISO();
  syncOpenRequestAssetCodes();
  addNotification('Your request '+id+' is now "Issued". It has been registered in the Issuance log — please confirm receipt once the items arrive.', 'department', 'drequest', 'list', r.department);
  await saveDB();
  closeModal();
  issueFlowReqId = null; issueFlowSignedFile = null;
  toast('Request '+id+' issued — registered in Issuance log.');
  navigate(portalMode==='department'?'drequest':'request','list');
}

function recvDescMatches(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  return DB.sku.filter(s=>s.description.toLowerCase().includes(q) || s.sku.toLowerCase().includes(q)).slice(0,8);
}
function recvDescInput(){
  const v = document.getElementById('recv-desc').value;
  const exact = DB.sku.filter(s=>s.description.toLowerCase()===v.trim().toLowerCase());
  const box = document.getElementById('recv-desc-suggest');
  const hintEl = document.getElementById('recv-sku-hint');
  if(exact.length===1){ recvDescPick(exact[0].sku); return; }
  recvApplySkuInfo(null, false);
  if(hintEl) hintEl.innerHTML = exact.length>1 ? 'Several items share this description — choose the correct one from the suggestions.' : '';
  const matches = recvDescMatches(v);
  if(!v.trim() || matches.length===0){ box.innerHTML=''; box.style.display='none'; return; }
  box.innerHTML = matches.map(s=>`<div class="suggest-item" onmousedown="recvDescPick('${esc(s.sku).replace(/'/g,"\\'")}')"><span class="mono">${esc(s.sku)}</span> — ${esc(s.description)}</div>`).join('');
  box.style.display='block';

  const info = skuInfo(sku);
  if(!info) return;
  document.getElementById('recv-sku').value = info.sku;
  recvSkuLookup();
  const box = document.getElementById('recv-desc-suggest');
  box.innerHTML=''; box.style.display='none';

function recvDescBlur(){
  setTimeout(()=>{
    const box = document.getElementById('recv-desc-suggest');
    if(box){ box.innerHTML=''; box.style.display='none'; }
    if(document.getElementById('recv-sku').value) return;
    const v = document.getElementById('recv-desc').value.trim().toLowerCase();
    const exact = DB.sku.filter(s=>s.description.toLowerCase()===v);
    const matches = recvDescMatches(v);
    const hintEl = document.getElementById('recv-sku-hint');
    if(exact.length===1) recvDescPick(exact[0].sku);
    else if(exact.length>1 && hintEl) hintEl.innerHTML = 'Several items share this description — choose the correct one from the suggestions.';
    else if(v && hintEl) hintEl.innerHTML = matches.length ? 'Choose an item from the suggestions to fill its SKU.' : 'No matching item in the SKU master list.';
  }, 150);
}

function recvAssetCodes(value){
  const seen = new Set();
  return String(value||'').split(/[,;\n]+/).map(code=>code.trim()).filter(code=>{
    if(!code) return false;
    const key = code.toUpperCase();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function recvAssetCodesOf(r){
  if(!r) return [];
  const arrayCodes = Array.isArray(r.assetCodes) ? r.assetCodes : [];
  return recvAssetCodes(arrayCodes.concat([r.assetCode||'']).join('\n'));
}
function recvAssetTagPrefix(soc, description){
  const socCode = String(soc||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const itemCode = String(description||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(!socCode || !itemCode) return '';
  return 'SPX'+socCode[0]+socCode[socCode.length-1]+'-'+itemCode[0]+itemCode[itemCode.length-1];
}
function recvGeneratedAssetTags(soc, description, qty){
  const prefix = recvAssetTagPrefix(soc, description);
  const count = Math.floor(Number(qty)||0);
  if(!prefix || count<1) return [];
  let maxSequence = 0;
  const inspect = code=>{
    const value = String(code||'').trim().toUpperCase();
    if(!value.startsWith(prefix)) return;
    const suffix = value.slice(prefix.length);
    if(/^\d+$/.test(suffix)) maxSequence = Math.max(maxSequence,Number(suffix)||0);
  };
  (DB.receiving||[]).forEach(record=>recvAssetCodesOf(record).forEach(inspect));
  (recvDraftItems||[]).forEach(item=>(item.assetCodes||[]).forEach(inspect));
  return Array.from({length:count},(_,index)=>prefix+String(maxSequence+index+1).padStart(3,'0'));
}
function recvRefreshAssetTagPreview(){
  const field = document.getElementById('recv-asset-code');
  if(!field) return;
  const info = skuInfo((document.getElementById('recv-sku')?.value||'').trim());
  const hint = document.getElementById('recv-tag-hint');
  field.value = '';
  if(!info || info.type!=='Asset') return;
  const soc = currentSoc();
  if(!soc){ if(hint) hint.textContent='Select an SOC in the site selector before receiving assets.'; return; }
  const qty = Number(document.getElementById('recv-qty')?.value);
  if(!Number.isInteger(qty) || qty<1){ if(hint) hint.textContent='Enter the quantity to preview the generated asset tags.'; return; }
  const tags = recvGeneratedAssetTags(soc,info.description,qty);
  field.value = tags.join('\n');
  if(hint) hint.textContent=tags.length?'Tags are generated for '+soc+' and this item.':'Could not generate tags; check the SOC and item description.';
}
function scheduleRecvAutoAdd(){
  clearTimeout(recvAutoAddTimer);
  recvAutoAddTimer = setTimeout(()=>{
    const info = skuInfo((document.getElementById('recv-sku')?.value||'').trim());
    if(!info) return;
    if(info.type==='Asset'){
      const qty = Number(document.getElementById('recv-qty').value);
      const amsTags = document.getElementById('recv-ams-tagging').value.split(/[,;\n]+/).map(t=>t.trim()).filter(Boolean);
      if(Number.isInteger(qty) && qty>0 && amsTags.length) addRecvItem(true);
    } else if(Number(document.getElementById('recv-qty').value)>0){
      addRecvItem(true);
    }
  }, 650);

function addRecvItem(automatic=false){
  const sku = document.getElementById('recv-sku').value.trim();
  const info = skuInfo(sku);
  if(!info){ if(!automatic) toast('Select an item description from the matching items.'); return; }
  const qty = Number(document.getElementById('recv-qty').value);
  if(info.type==='Asset' && (!Number.isInteger(qty) || qty<1)){ if(!automatic) toast('Enter a whole number quantity greater than 0.'); return; }
  if(!qty || qty<=0){ if(!automatic) toast('Enter a quantity greater than 0.'); return; }
  const itemSoc = currentSoc();
  if(info.type==='Asset' && !itemSoc){
    const hint=document.getElementById('recv-tag-hint'); if(hint) hint.textContent='Select an SOC in the site selector before receiving assets.';
    if(!automatic) toast('Select an SOC in the site selector before receiving assets.');
    return;
  }
  const assetCodes = info.type==='Asset' ? recvGeneratedAssetTags(itemSoc,info.description,qty) : [];
  if(info.type==='Asset' && assetCodes.length!==qty){ if(!automatic) toast('Could not generate asset tags for this item.'); return; }
  const assetCode = info.type==='Asset' ? assetCodes.join(', ') : '';
  const amsTags = info.type==='Asset' ? document.getElementById('recv-ams-tagging').value.split(/[,;\n]+/).map(t=>t.trim()).filter(Boolean) : [];
  if(info.type==='Asset' && amsTags.length===0){ if(!automatic) toast('Enter an AMS Asset Tag.'); return; }
  clearTimeout(recvAutoAddTimer);
  recvAutoAddTimer = null;
  recvDraftItems.push({sku:info.sku, description:info.description, type:info.type, uom:info.uom, qty, assetCode, assetCodes, amsTags, soc:itemSoc});
  document.getElementById('recv-sku').value=''; document.getElementById('recv-desc').value=''; document.getElementById('recv-type').value=''; document.getElementById('recv-uom').value=''; document.getElementById('recv-qty').value='';
  document.getElementById('recv-asset-code').value=''; document.getElementById('recv-ams-tagging').value='';
  recvHideDescSuggestions();
  recvSkuLookup();
  const hintEl = document.getElementById('recv-sku-hint'); if(hintEl) hintEl.innerHTML='';
  recvRefreshAssetTagPreview();
  refreshRecvItemsTable();
  const descEl = document.getElementById('recv-desc'); if(descEl) descEl.focus();
  if(automatic) toast(info.type==='Asset'?'Asset with generated tags added to delivery batch.':'Consumable added to delivery batch.');
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function restoreReceivingStateAfterFailedSave(){
  ['stock','counters'].forEach(key=>{
    if(!lastKnownSnapshot||lastKnownSnapshot[key]===undefined) return;
    DB[key]=lastKnownSnapshot[key]===null?defaultDB()[key]:JSON.parse(lastKnownSnapshot[key]);
  });
  ['receiving','requests'].forEach(key=>{
    if(recordModeActive){
      DB[key]=Object.values(recordSnapshots[key]||{}).map(value=>JSON.parse(value));
    }else if(lastKnownSnapshot&&lastKnownSnapshot[key]!==undefined){
      DB[key]=lastKnownSnapshot[key]===null?defaultDB()[key]:JSON.parse(lastKnownSnapshot[key]);
    }
  });
  migrateDB();
}
async function submitReceiving(){
  if(recvDraftItems.length===0){ toast('Add at least one item to the batch first.'); return; }
  const from = document.getElementById('recv-from').value.trim();
  const fileEl = document.getElementById('recv-file');
  const file = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
  if(!from){ toast('Select a supplier — add one in Settings → Supplier if the list is empty.'); return; }
  if(!file){ toast('Attach the transmittal / delivery receipt before receiving this batch.'); return; }
  if(file && file.size > 4*1024*1024){ toast('Transmittal file is too large (max 4MB).'); return; }
  let transmittalFile = '';
  if(file){
    try{ transmittalFile = await readFileAsDataURL(file); }
    catch(e){ console.error('File read error', e); toast('Could not read the attached transmittal — batch was not received.'); return; }
  }
  const date = nowISO();
  let ids = [];
  const attemptedRecords = new Map();
  const items = recvDraftItems.map(it=>({...it, assetCodes:[...(it.assetCodes||[])], amsTags:[...(it.amsTags||[])]}));
  const soc = currentSoc();
  if(items.some(it=>it.type==='Asset' && (!soc || socKey(it.soc)!==socKey(soc)))){
    toast('The selected SOC changed after asset tags were generated. Select the SOC used for those tags, or remove and re-add the asset lines.');
    return;
  }
  const applyReceivingBatch=()=>{
    const previousRecords = new Map(ids.map(id=>[id,attemptedRecords.get(id)]));
    ids = [];
    const records = items.map(it=>{
      const id = nextCode('RCV','recv');
      ids.push(id);
      const itemSoc = it.type==='Asset' ? it.soc : soc;
      addStock(it.sku, it.qty, itemSoc);
      return {id, sku:it.sku, assetCode:it.assetCode||'', assetCodes:it.assetCodes||[], amsTags:it.amsTags||[], description:it.description, type:it.type, uom:it.uom, from, qty:it.qty, date, receivedBy:session.fullName, transmittal:file?file.name:'', transmittalFile, soc:itemSoc};
    });
    DB.receiving = (DB.receiving||[]).filter(r=>{
      const previous=previousRecords.get(r.id);
      return previous===undefined||JSON.stringify(r)!==previous;
    }).concat(records);
    records.forEach(record=>attemptedRecords.set(record.id,JSON.stringify(record)));
    syncOpenRequestAssetCodes();
  };
  const saved = await saveDBWithRetry(applyReceivingBatch);
  if(!saved){ restoreReceivingStateAfterFailedSave(); return; }
  recvDraftItems = [];
  toast(ids.length+' item'+(ids.length===1?'':'s')+' logged ('+ids.join(', ')+') — stock updated.');
  navigate('receiving','list');
}

function receivingAssetStatuses(r){
  if(r.type!=='Asset') return [];
  const codes=recvAssetCodesOf(r);
  const available=new Set(availableAssetCodes(r.sku,r.soc||'').map(code=>code.toUpperCase()));
  const amsTags=Array.isArray(r.amsTags)?r.amsTags:assetCodeValues(r.amsTags);
  const issued=new Set();
  (DB.issuance||[]).forEach(i=>{
    if(String(i.sku||'').trim().toUpperCase()!==String(r.sku||'').trim().toUpperCase()) return;
    if(socKey(i.soc)&&socKey(r.soc)&&socKey(i.soc)!==socKey(r.soc)) return;
    [...assetCodeValues(i.assetCodes||[]),...assetCodeValues(i.assetTagging||'')].forEach(tag=>issued.add(tag.toUpperCase()));
  });
  return codes.map((code,index)=>{
    const onhand=available.has(code.toUpperCase());
    const wasIssued=issued.has(code.toUpperCase())||issued.has(String(amsTags[index]||'').trim().toUpperCase());
    return {code,label:onhand?'Available onhand':wasIssued?'Issued asset':'Unavailable',style:onhand?'tag-approved':wasIssued?'tag-asset':'tag-pending'};
  });
}

async function saveReceivingEdit(id){
  const r = DB.receiving.find(x=>x.id===id);
  if(!r) return;
  const from = document.getElementById('edit-recv-from').value;
  const assetCodes = r.type==='Asset' ? recvAssetCodes(document.getElementById('edit-recv-asset-codes').value) : [];
  if(r.type==='Asset' && assetCodes.length===0 && recvAssetCodesOf(r).length>0){ toast('Enter at least one Asset Tag. Quantity is based on the asset tags entered.'); return; }
  const qty = r.type==='Asset' ? (assetCodes.length||Number(r.qty)||0) : Number(document.getElementById('edit-recv-qty').value);
  if(!Number.isFinite(qty) || qty<0){ toast('Enter a valid quantity.'); return; }
  const delta = qty - r.qty;
  if(delta!==0) addStock(r.sku, delta, r.soc||'');
  r.from = from; r.qty = qty;
  if(r.type==='Asset'){
    r.assetCodes = assetCodes;
    r.assetCode = assetCodes.join(', ');
  }
  r.amsTags = document.getElementById('edit-recv-ams-tagging').value.split(/[,;\n]+/).map(t=>t.trim()).filter(Boolean);
  syncOpenRequestAssetCodes();
  if(!await saveDB()){ restoreReceivingStateAfterFailedSave(); return; }
  closeModal();
  toast('Receiving record updated.');
  navigate('receiving','list');
}
function deleteReceiving(id){
  const r = DB.receiving.find(x=>x.id===id);
  if(!r) return;
  confirmAction('Delete '+r.id+'? This will also remove the '+r.qty+' '+r.uom+' it added to the stock of '+r.sku+'.', async ()=>{
    addStock(r.sku, -r.qty, r.soc||'');
    DB.receiving = DB.receiving.filter(x=>x.id!==id);
    syncOpenRequestAssetCodes();
    if(!await saveDB()){ restoreReceivingStateAfterFailedSave(); return; }
    toast('Receiving record deleted.');
    navigate('receiving','list');
  });
}

/* Asset Cycle Count scans physical Asset Tag codes. Expected assets are the
   current, unique physical codes either still issued to departments or on hand. */
let assetCycleScanned = [];
let assetCycleScanTimer = null;
function assetCycleExpectedItems(){
  const codeInfo = new Map();
  const amsCodeMap = new Map();
  const events = [];
  const addEvent = (code, skuCode, eventSoc, date, kind, order, record)=>{
    const rawKey = String(code||'').trim().toUpperCase();
    const key = codeInfo.has(rawKey) ? rawKey : (amsCodeMap.get(rawKey)||rawKey);
    if(!key || !codeInfo.has(key)) return;
    const info = codeInfo.get(key);
    if(skuCode && String(info.sku||'').trim().toUpperCase()!==String(skuCode).trim().toUpperCase()) return;
    if(socKey(eventSoc) && socKey(info.soc) && socKey(eventSoc)!==socKey(info.soc)) return;
    const parsed = Date.parse(date||'');
    events.push({key,time:Number.isFinite(parsed)?parsed:0,kind,order,record:record||null});
  };
  (DB.receiving||[]).forEach((r,idx)=>{
    if(r.type!=='Asset') return;
    const codes = recvAssetCodesOf(r);
    const amsTags = Array.isArray(r.amsTags) ? r.amsTags : assetCodeValues(r.amsTags);
    codes.forEach((code,unitIdx)=>{
      const key=String(code).toUpperCase();
      if(codeInfo.has(key)) return;
      codeInfo.set(key,{code,sku:String(r.sku||''),description:r.description||skuInfo(r.sku)?.description||'',soc:r.soc||'',order:idx*1000+unitIdx});
      events.push({key,time:Number.isFinite(Date.parse(r.date||''))?Date.parse(r.date):0,kind:'onhand',order:idx*1000+unitIdx,record:r});
      if(amsTags[unitIdx] && !amsCodeMap.has(amsTags[unitIdx].toUpperCase())) amsCodeMap.set(amsTags[unitIdx].toUpperCase(),key);
    });
  });
  (DB.issuance||[]).forEach((i,idx)=>{
    if(i.type!=='Asset') return;
    const codes = Array.isArray(i.assetCodes)&&i.assetCodes.length ? i.assetCodes : assetCodeValues(i.assetTagging);
    codes.forEach((code,unitIdx)=>addEvent(code,i.sku,i.soc,i.date,'issued',1000000+idx*1000+unitIdx,i));
  });
  (DB.returns||[]).forEach((r,idx)=>{
    if(r.category!=='Asset' || r.condition!=='Good' || !['Received','Asset Received'].includes(r.status)) return;
    const codes = Array.isArray(r.assetCodes)&&r.assetCodes.length ? r.assetCodes : assetCodeValues(r.assetTagging);
    codes.forEach((code,unitIdx)=>addEvent(code,r.sku,r.soc,r.dateReceived||r.dateReturned,'onhand',2000000+idx*1000+unitIdx,r));
  });
  (DB.repairs||[]).forEach((r,idx)=>{
    if(r.status==='Added to Inventory') addEvent(r.assetTagging,r.sku,r.soc,r.inventoryDate||r.dateReceived,'onhand',3000000+idx,r);
    else if(r.status==='Disposed'||r.status==='Backloaded') addEvent(r.assetTagging,r.sku,r.soc,r.disposedDate||r.backloadDate,'disposed',3000000+idx,r);
  });
  events.sort((a,b)=>a.time-b.time || a.order-b.order);
  const state = new Map();
  events.forEach(e=>{
    if(e.kind==='disposed') state.delete(e.key);
    else state.set(e.key,{kind:e.kind,record:e.record});
  });
  const site = currentSoc();
  return Array.from(state.entries()).map(([key,status])=>{
    const info=codeInfo.get(key), rec=status.record||{};
    return {code:info.code,sku:info.sku,description:rec.description||info.description||'',status:status.kind,
      department:status.kind==='issued'?(rec.department||''):'',accountable:status.kind==='issued'?(rec.accountability||rec.receivedByName||''):'',soc:info.soc||''};
  }).filter(item=>{
    const info=codeInfo.get(item.code.toUpperCase());
    return info && String(info.sku||'').trim() && String(info.sku||'').trim().toUpperCase()===String(item.sku||'').trim().toUpperCase()
      && (socKey(site) ? (!socKey(info.soc)||socKey(info.soc)===socKey(site)) : !socKey(info.soc));
  }).sort((a,b)=>(a.status===b.status?0:(a.status==='issued'?-1:1)) || a.sku.localeCompare(b.sku) || a.code.localeCompare(b.code,undefined,{numeric:true}));
}

function onAssetCycleScanInput(){
  const el=document.getElementById('cc-asset-scan');
  if(!el) return;
  clearTimeout(assetCycleScanTimer);
  const value=el.value.trim();
  if(!value) return;
  assetCycleScanTimer=setTimeout(()=>{ const cur=document.getElementById('cc-asset-scan'); if(cur&&cur.value.trim()===value) addAssetCycleScan(); },150);
}
function addAssetCycleScan(){
  clearTimeout(assetCycleScanTimer);
  const el=document.getElementById('cc-asset-scan');
  const value=normalizeAssetTagScan(el?el.value:'');
  if(!value){ toast('Scan or enter an asset tag first.'); return; }
  if(assetCycleScanned.some(code=>normalizeAssetTagScan(code).toUpperCase()===value.toUpperCase())){ toast('That asset tag has already been scanned in this count.'); if(el){el.value='';el.focus();} return; }
  const expected=assetCycleExpectedItems().find(item=>normalizeAssetTagScan(item.code).toUpperCase()===value.toUpperCase());
  assetCycleScanned.push(expected?expected.code:value);
  if(el){el.value='';el.focus();}
  refreshAssetCycleCountView();
}
function removeAssetCycleScan(index){ assetCycleScanned.splice(index,1); refreshAssetCycleCountView(); }
function refreshAssetCycleCountView(){
  const dashboardEl=document.getElementById('cc-asset-summary');
  const detailEl=document.getElementById('cc-asset-detail-report');
  if(!dashboardEl||!detailEl) return;
  const expected=assetCycleExpectedItems();
  const expectedByCode=new Map(expected.map(item=>[item.code.toUpperCase(),item]));
  const matchedItems=assetCycleScanned.map((code,index)=>({code,index,item:expectedByCode.get(code.toUpperCase())})).filter(row=>row.item);
  const matched=assetCycleScanned.filter(code=>expectedByCode.has(code.toUpperCase()));
  const unexpected=assetCycleScanned.filter(code=>!expectedByCode.has(code.toUpperCase()));
  const scanned=new Set(assetCycleScanned.map(code=>code.toUpperCase()));
  const missing=expected.filter(item=>!scanned.has(item.code.toUpperCase()));
  const foundCodes=new Set(matched.map(code=>code.toUpperCase()));
  const foundPercent=expected.length?Math.round(matched.length/expected.length*1000)/10:0;
  const byDeptItem=new Map();
  expected.forEach(item=>{
    const department=item.status==='issued'?(item.department||'Unassigned'):'On hand (Supplies)';
    const key=department.toUpperCase()+'::'+item.sku.toUpperCase();
    if(!byDeptItem.has(key)) byDeptItem.set(key,{department,sku:item.sku,item:item.description||item.sku,qty:0,found:0,missing:0});
    const row=byDeptItem.get(key);
    row.qty++;
    if(foundCodes.has(item.code.toUpperCase())) row.found++; else row.missing++;
  });
  const deptItemRows=[...byDeptItem.values()].sort((a,b)=>a.department.localeCompare(b.department)||a.item.localeCompare(b.item));
  dashboardEl.innerHTML=`<div class="card">
    <h3>Asset cycle count dashboard</h3>
    <div style="display:flex;flex-wrap:nowrap;gap:12px;margin-bottom:14px;overflow-x:auto;">
      <div class="metric" style="flex:1 0 180px;"><div class="lbl">For cycle count</div><div class="val">${expected.length}</div><div class="sub">issued or on hand</div></div>
      <div class="metric success" style="flex:1 0 180px;"><div class="lbl">Found</div><div class="val">${matched.length}</div><div class="sub">expected tags scanned</div></div>
      <div class="metric ${missing.length?'danger':''}" style="flex:1 0 180px;"><div class="lbl">Missing</div><div class="val">${missing.length}</div><div class="sub">not scanned yet</div></div>
      <div class="metric" style="flex:1 0 180px;"><div class="lbl">Found progress</div><div class="val">${foundPercent.toFixed(1)}%</div><div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${foundPercent}" style="height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0;"><div style="height:100%;width:${foundPercent}%;background:var(--success);border-radius:99px;"></div></div><div class="sub">${matched.length} of ${expected.length} assets</div></div>
    </div>
  </div>`;
  detailEl.innerHTML=`<div class="card">
    <div class="section-title">Assets by department and item</div>
    ${deptItemRows.length===0?'<div class="empty"><div class="ic">&#9673;</div>No assets are recorded for cycle count.</div>':'<div class="tbl-wrap"><table><tr><th>Department</th><th>SKU</th><th>Item</th><th>Qty</th><th>Found</th><th>Missing</th></tr>'+deptItemRows.map(row=>`<tr><td>${esc(row.department)}</td><td class="mono">${esc(row.sku)}</td><td>${esc(row.item)}</td><td>${row.qty}</td><td>${row.found}</td><td>${row.missing}</td></tr>`).join('')+'</table></div>'}
    <div class="section-title">Found (${matchedItems.length})</div>
    ${matchedItems.length===0?'<div class="empty"><div class="ic">&#128247;</div>No expected asset tags found yet.</div>':'<div class="tbl-wrap" style="max-height:220px;overflow-y:auto;"><table><tr><th>Asset Tag</th><th>Item</th><th>Location status</th><th>Department</th><th></th></tr>'+matchedItems.map(row=>{const item=row.item;return `<tr><td class="mono">${esc(row.code)}</td><td>${esc(item.description||'—')}</td><td>${item.status==='issued'?'Issued':'On hand'}</td><td>${esc(item.department||'—')}</td><td><button class="icon-btn" onclick="removeAssetCycleScan(${row.index})" title="Remove">&times;</button></td></tr>`;}).join('')+'</table></div>'}
    ${missing.length?'<div class="section-title">Missing ('+missing.length+') — expected but not scanned</div><div class="tbl-wrap" style="max-height:220px;overflow-y:auto;"><table><tr><th>Asset Tag</th><th>Item</th><th>Location status</th><th>Department</th><th>Accountable person</th></tr>'+missing.map(item=>`<tr><td class="mono">${esc(item.code)}</td><td>${esc(item.description||'—')}</td><td>${item.status==='issued'?'Issued':'On hand'}</td><td>${esc(item.department||'—')}</td><td>${esc(item.accountable||'—')}</td></tr>`).join('')+'</table></div>':''}
    ${unexpected.length?'<div class="section-title">Unexpected scans ('+unexpected.length+')</div><div class="tbl-wrap"><table><tr><th>Asset Tag</th><th>Action</th></tr>'+unexpected.map(code=>{const i=assetCycleScanned.findIndex(v=>v.toUpperCase()===code.toUpperCase());return `<tr><td class="mono">${esc(code)}</td><td><button class="icon-btn" onclick="removeAssetCycleScan(${i})" title="Remove">&times;</button></td></tr>`;}).join('')+'</table></div>':''}
  </div>`;
}
async function saveAssetCycleCount(){
  const expected=assetCycleExpectedItems();
  const expectedByCode=new Map(expected.map(item=>[item.code.toUpperCase(),item]));
  const matched=assetCycleScanned.filter(code=>expectedByCode.has(code.toUpperCase()));
  const unexpected=assetCycleScanned.filter(code=>!expectedByCode.has(code.toUpperCase()));
  const scanned=new Set(assetCycleScanned.map(code=>code.toUpperCase()));
  const missing=expected.filter(item=>!scanned.has(item.code.toUpperCase()));
  if(!expected.length&&!assetCycleScanned.length){toast('Nothing to count — there are no issued or on-hand asset tags for this site.');return;}
  const byEl=document.getElementById('cc-asset-by');
  const countedBy=(byEl&&byEl.value.trim())||session.fullName;
  DB.cycleCountAsset.push({id:nextCode('CC','ccasset'),expectedCount:expected.length,scannedCount:assetCycleScanned.length,matchedCount:matched.length,
    expected:expected.map(item=>({code:item.code,sku:item.sku,description:item.description,status:item.status,department:item.department,accountable:item.accountable})),
    scanned:assetCycleScanned.slice(),missing:missing.map(item=>item.code),unexpected:unexpected.slice(),countedBy,date:nowISO(),soc:currentSoc()});
  assetCycleScanned=[];
  await saveDB();
  toast('Asset cycle count saved — '+matched.length+' matched, '+missing.length+' missing, '+unexpected.length+' unexpected.');
  refreshAssetCycleCountView();
  const hist=document.getElementById('cc-asset-history');
  if(hist) hist.innerHTML=assetCycleCountHistoryHtml();
}
function assetCycleCountHistoryHtml(){
  const rows=socFilter(DB.cycleCountAsset).slice().reverse().slice(0,15);
  if(!rows.length) return '<div class="empty"><div class="ic">&#8635;</div>No counts recorded yet.</div>';
  return '<div class="tbl-wrap"><table><tr><th>Date</th><th>Expected</th><th>Scanned</th><th>Matched</th><th>Missing</th><th>Unexpected</th><th>Counted by</th></tr>'+rows.map(r=>{
    const isScan=Array.isArray(r.scanned), missing=isScan?(r.missing||[]):[], unexpected=isScan?(r.unexpected||[]):[];

  }).join('')+'</table></div>';
}
function exportCycleCountAsset(){

function removeIssuedAsset(tag){
  if(!tag) return;
  const target = String(tag).trim().toUpperCase();
  DB.issuance = DB.issuance.flatMap(i=>{
    const codes = Array.isArray(i.assetCodes) ? i.assetCodes.slice() : [];
    const tags = assetCodeValues(i.assetTagging||'');
    let codeIndex = codes.findIndex(value=>String(value).trim().toUpperCase()===target);
    const tagIndex = tags.findIndex(value=>value.toUpperCase()===target);
    if(codeIndex<0 && tagIndex>=0){
      codeIndex = codes.findIndex(value=>{
        const amsTag = assetAmsTagsForCodes([value])[0];
        return amsTag && amsTag.toUpperCase()===target;
      });
    }
    const unitIndex = codeIndex>=0 ? codeIndex : tagIndex;
    if(unitIndex<0) return [i];
    if(codes.length){
      const tagsWereAligned = tags.length===codes.length;
      if(codeIndex>=0) codes.splice(codeIndex,1);
      if(tagIndex>=0) tags.splice(tagIndex,1);
      else if(tagsWereAligned && unitIndex<tags.length) tags.splice(unitIndex,1);
      i.assetCodes = codes;
      i.assetTagging = tags.join(', ');
    } else {
      tags.splice(tagIndex,1);
      i.assetTagging = tags.join(', ');
    }
    i.qty = Math.max(0,Number(i.qty||0)-1);
    return i.qty>0 ? [i] : [];
  });
}

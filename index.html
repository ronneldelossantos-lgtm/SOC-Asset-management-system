async function submitDeptReturn(){
  if(!dretCategory){ toast('Select a category — Asset or Consumables.'); return; }
  if(!dretCondition){ toast('Select a condition — Good or Damaged.'); return; }
  const usingTagLookup = dretCategory==='Asset' && dretCondition==='Damaged' && dretTagMode==='with';
  let info, qty, assetTagging='', irFile='';
  if(usingTagLookup){
    const tag = document.getElementById('dret-assettag-lookup').value.trim();
    if(!tag){ toast('Enter the asset tagging to look it up.'); return; }
    if(!dretAutoFound){ toast('No matching asset was found in your inventory or issued records for that tag — check it, or switch to "No Tagging".'); return; }
    info = skuInfo(dretAutoFound.sku);
    qty = Number(dretAutoFound.qty)||1;
    assetTagging = tag;
    if(!info){ toast('That asset\'s SKU is no longer in the master list.'); return; }
    const fileEl = document.getElementById('dret-ir-file');
    const irFileObj = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
    if(!irFileObj){ toast('Upload the Incident Report (IR) before completing.'); return; }
    if(irFileObj.size > 4*1024*1024){ toast('IR file is too large (max 4MB).'); return; }
    irFile = irFileObj.name;
  } else {
    info = skuInfo(document.getElementById('dret-sku').value.trim());
    qty = Number(document.getElementById('dret-qty').value);
    if(!info){ toast('Enter a valid SKU code first.'); return; }
    if(!qty || qty<=0){ toast('Enter a quantity greater than 0.'); return; }
    if(dretCondition==='Damaged'){
      assetTagging = document.getElementById('dret-assettag').value.trim();
      const fileEl = document.getElementById('dret-ir-file');
      const irFileObj = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
      if(!irFileObj){ toast('Upload the Incident Report (IR) before completing.'); return; }
      if(irFileObj.size > 4*1024*1024){ toast('IR file is too large (max 4MB).'); return; }
      irFile = irFileObj.name;
    }
  }
  let irFileData = '';
  if(dretCondition==='Damaged'){
    const fileEl = document.getElementById('dret-ir-file');
    const irFileObj = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
    if(irFileObj){
      try{ irFileData = await readFileAsDataURL(irFileObj); }
      catch(e){ console.error('File read error', e); toast('Could not read the IR file — completing the return without it attached for viewing.'); }
    }
  }
  const remarks = document.getElementById('dret-remarks').value.trim();
  if(!remarks){ toast('Enter a remark / reason for the return.'); return; }
  const id = nextCode('RET','ret');
  DB.returns.push({
    id, department:session.department, category:dretCategory, condition:dretCondition,
    sku:info.sku, description:info.description, uom:info.uom, qty, assetTagging, irFile, irFileData, remarks,
    status:'Pending', dateReturned:nowISO(), returnedBy:session.fullName, receivedBy:null, dateReceived:null,
    soc:(DB.departmentSoc && DB.departmentSoc[session.department]) || ''
  });
  addNotification(session.department+' returned '+info.sku+' ('+id+')'+(dretCondition==='Damaged'?' — damaged, IR attached':'')+'.', 'supplies', 'returns', 'incoming');
  await saveDB();
  toast(id+' completed — returned to Supplies for pickup.');
  dretCategory=null; dretCondition=null; dretTagMode='with'; dretAutoFound=null;
  navigate('dreturn','list');
}

async function importSkuCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0, skipped = 0;
  rows.forEach(row=>{
    const sku = csvField(row, ['SKU','SKU Code']).trim();
    const desc = csvField(row, ['Description','Item Description']).trim();
    let type = csvField(row, ['Type']).trim();
    const uom = csvField(row, ['UOM']).trim();
    const qtyRaw = csvField(row, ['Qty','Quantity','On Hand','Initial on-hand qty']).trim();
    type = /^asset$/i.test(type) ? 'Asset' : (/^consumable$/i.test(type) ? 'Consumable' : '');
    if(!sku || !desc || !type || !uom || skuInfo(sku)){ skipped++; return; }
    const qty = type==='Consumable' ? 0 : (Number(qtyRaw)||0);
    DB.sku.push({sku, description:desc, type, uom, assetCondition: type==='Asset' ? 'Repairable' : undefined, safetyStockDays: 7});
    DB.stock[sku] = qty;
    DB.reorderPoint[sku] = 0;
    added++;
  });
  if(added){ await saveDB(); }
  toast('Imported '+added+' SKU'+(added===1?'':'s')+(skipped?(', skipped '+skipped+' (missing/duplicate/invalid).'):'.'));
  renderSettings();
}

// Renaming a department in Settings must update every record across the system
// that stores that department name as a plain string, so nothing is left
// pointing at the old name.
function cascadeDepartmentRename(oldName, newName){
  DB.users.forEach(u=>{
    if(u.department===oldName) u.department = newName;
    if(u.departmentScope && u.departmentScope.includes(oldName)){
      u.departmentScope = u.departmentScope.map(d=>d===oldName?newName:d);
    }
  });
  (DB.employees||[]).forEach(e=>{ if(e.department===oldName) e.department = newName; });
  (DB.requests||[]).forEach(r=>{ if(r.department===oldName) r.department = newName; });
  (DB.deptIssuance||[]).forEach(d=>{ if(d.department===oldName) d.department = newName; });
  (DB.returns||[]).forEach(r=>{ if(r.department===oldName) r.department = newName; });
  (DB.pdaLogs||[]).forEach(l=>{ if(l.borrowerDepartment===oldName) l.borrowerDepartment = newName; });
  (DB.notifications||[]).forEach(n=>{ if(n.forDept===oldName) n.forDept = newName; });
  if(DB.pdaDeptBuckets){
    DB.pdaDeptBuckets = DB.pdaDeptBuckets.map(b=>b===oldName?newName:b);
  }
  if(DB.pdaAllocations && Object.prototype.hasOwnProperty.call(DB.pdaAllocations, oldName)){
    DB.pdaAllocations[newName] = DB.pdaAllocations[oldName];
    delete DB.pdaAllocations[oldName];
  }
  if(DB.departmentSoc && Object.prototype.hasOwnProperty.call(DB.departmentSoc, oldName)){
    DB.departmentSoc[newName] = DB.departmentSoc[oldName];
    delete DB.departmentSoc[oldName];
  }
}

async function importAcctCsv(inputEl){

async function saveUserEdit(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  const fullName = document.getElementById('edit-user-name').value.trim();
  const username = document.getElementById('edit-user-username').value.trim();
  const pass = document.getElementById('edit-user-pass').value;
  if(!fullName || !username){ toast('Full name and username are required.'); return; }
  if(DB.users.some(x=>x.id!==id && x.username.toLowerCase()===username.toLowerCase())){ toast('That username is taken.'); return; }
  const oldUsername = u.username;
  u.fullName = fullName;
  u.username = username;
  if(oldUsername.toLowerCase()!==username.toLowerCase()){
    DB.users.forEach(x=>{ if(x.approverUsername && x.approverUsername.toLowerCase()===oldUsername.toLowerCase()) x.approverUsername = username; });
    DB.requests.forEach(r=>{ if(r.requiresApprovalFrom && r.requiresApprovalFrom.toLowerCase()===oldUsername.toLowerCase()) r.requiresApprovalFrom = username; });
  }
  if(pass) u.password = pass;
  if(u.role==='department'){
    u.department = document.getElementById('edit-user-dept').value;
    const approverUsername = document.getElementById('edit-user-approver').value;
    if(approverUsername) u.approverUsername = approverUsername; else delete u.approverUsername;
  } else {
    const site = document.getElementById('edit-user-site').value;
    if(site) u.site = site; else delete u.site;
    if(u.role==='staff' || u.role==='hub'){
      u.processAccess = readProcessAccessCheckboxes('edit-user-proc');
    }
    if(u.role==='staff'){
      u.skuScope = Array.from(document.getElementById('edit-user-sku-scope').selectedOptions).map(o=>o.value);
      u.departmentScope = Array.from(document.getElementById('edit-user-dept-scope').selectedOptions).map(o=>o.value);
      u.accountabilityScope = Array.from(document.getElementById('edit-user-acct-scope').selectedOptions).map(o=>o.value);
    }
  }
  await saveDB();
  logAudit('user_edited', {id, oldUsername, newUsername: username});
  closeModal();
  toast('User updated.');
  renderSettings();
}

async function saveEmployeeEdit(i){

  const fullName = document.getElementById('edit-emp-name').value.trim();

async function removeEmployee(i){

  DB.employees.splice(i,1);
  const ok = await saveDBWithRetry(()=>{
    const idx = DB.employees.findIndex(x=>x.opsId.toUpperCase()===opsId.toUpperCase());
    if(idx>-1) DB.employees.splice(idx,1);
  });
  if(ok) toast('Employee removed.');
  renderSettings();
}
async function importEmployeeCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0, skipped = 0;
  const newRecs = [];
  rows.forEach(row=>{
    const opsId = csvField(row, ['Ops ID','OpsId','Ops Id']).trim();
    const fullName = csvField(row, ['Full Name','Name']).trim();
    const agency = csvField(row, ['Agency']).trim();
    const department = csvField(row, ['Department']).trim();
    if(!opsId || !fullName || !department || empInfo(opsId) || newRecs.some(r=>r.opsId.toUpperCase()===opsId.toUpperCase())){ skipped++; return; }
    const rec = {opsId, fullName, agency, department};
    newRecs.push(rec);
    DB.employees.push(rec);
    added++;
  });
  if(added){
    const ok = await saveDBWithRetry(()=>{
      newRecs.forEach(rec=>{ if(!empInfo(rec.opsId)) DB.employees.push(rec); });
    });
    if(!ok){ renderSettings(); return; }
  }
  toast('Imported '+added+' employee'+(added===1?'':'s')+(skipped?(', skipped '+skipped+' (missing/duplicate).'):'.'));
  renderSettings();
}
function normalizeRole(raw){
  const r = String(raw||'').trim().toLowerCase();
  if(!r) return '';
  if(r==='admin' || r.includes('admin')) return 'admin';
  if(r==='department' || r.includes('department') || r.includes('dept')) return 'department';
  if(r==='hub' || r.includes('hub')) return 'hub';
  if(r==='staff' || r.includes('staff')) return 'staff';
  return '';
}
function parseProcessAccessField(raw){
  const vals = String(raw||'').split(';').map(x=>x.trim().toLowerCase()).filter(x=>x);
  if(vals.length===0) return [];
  return PROCESS_LIST.map(p=>p.key).filter(key=>{
    const label = processLabel(key).toLowerCase();
    return vals.some(v=> key===v || label===v || label.includes(v) || v.includes(key));
  });
}
async function importUserCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0;
  const problems = [];
  rows.forEach((row, idx)=>{
    const rowNum = idx+2; // header is row 1, data starts at row 2
    const fullName = csvField(row, ['Full Name','Fullname','Name']).trim();
    const username = csvField(row, ['Username','User Name','Login']).trim();
    const roleRaw = csvField(row, ['Role','Portal Role']).trim();
    const role = normalizeRole(roleRaw);
    const password = csvField(row, ['Password','Pass']).trim();
    const deptRaw = csvField(row, ['Department','Dept']).trim();
    const siteRaw = csvField(row, ['Site','SOC','Warehouse']).trim();
    if(!fullName || !username || !password){
      problems.push('Row '+rowNum+': missing full name, username, or password.');
      return;
    }
    if(!role){
      problems.push('Row '+rowNum+': role "'+(roleRaw||'(blank)')+'" isn\'t recognized — use admin, staff, hub, or department.');
      return;
    }
    if(DB.users.find(u=>u.username.toLowerCase()===username.toLowerCase())){
      problems.push('Row '+rowNum+': username "'+username+'" already exists.');
      return;
    }
    let department;
    if(role==='department'){
      department = DB.departments.find(d=>d.toLowerCase()===deptRaw.toLowerCase());
      if(!department){
        problems.push('Row '+rowNum+': department "'+(deptRaw||'(blank)')+'" doesn\'t match any department on file.');
        return;
      }
    }
    const id = Math.max(0,...DB.users.map(u=>u.id),0)+1;
    const portal = role==='department' ? 'department' : 'supplies';
    const newUser = {id, username, password, role, fullName, portal};
    if(department) newUser.department = department;
    if(role!=='department' && siteRaw){
      const site = DB.warehouses.find(w=>w.toLowerCase()===siteRaw.toLowerCase());
      if(site) newUser.site = site;
    }
    if(role==='staff' || role==='hub'){
      const processRaw = csvField(row, ['Process Access','Process','Processes']);
      if(processRaw.trim()) newUser.processAccess = parseProcessAccessField(processRaw);
    }
    if(role==='staff'){
      const splitScope = v => v.split(';').map(x=>x.trim()).filter(x=>x);
      const skuScopeRaw = splitScope(csvField(row, ['SKU Scope']));
      const deptScopeRaw = splitScope(csvField(row, ['Department Scope']));
      const acctScopeRaw = splitScope(csvField(row, ['Accountability Scope']));
      newUser.skuScope = skuScopeRaw.filter(v=>skuInfo(v));
      newUser.departmentScope = deptScopeRaw.filter(v=>DB.departments.includes(v));
      newUser.accountabilityScope = acctScopeRaw.filter(v=>DB.accountability.some(a=>a.name===v));
    }
    DB.users.push(newUser);
    added++;
  });
  if(added){ await saveDB(); logAudit('user_import', {added, skipped:problems.length}); }
  if(problems.length){
    showModal(`
      <h3>Import results</h3>
      <p style="font-size:13.5px;color:var(--muted);margin:8px 0 14px;line-height:1.5;">Imported <b>${added}</b> login${added===1?'':'s'}. ${problems.length} row${problems.length===1?'':'s'} skipped — here's why:</p>
      <div style="max-height:300px;overflow-y:auto;font-size:12.5px;line-height:1.8;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fbfbfc;">
        ${problems.slice(0,60).map(m=>`<div>&bull; ${esc(m)}</div>`).join('')}
        ${problems.length>60?'<div class="small-note" style="margin-top:6px;">…and '+(problems.length-60)+' more row'+(problems.length-60===1?'':'s')+'.</div>':''}
      </div>
      <div class="footer-actions"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>
    `);
  } else {
    toast('Imported '+added+' login'+(added===1?'':'s')+'.');
  }
  renderSettings();
}

function pickPdaReturnCondition(c){
  pdaReturnCondition = c;

// Once the Ops ID fully matches AND a condition that needs no IR upload is set
// (Good is the default), the return records itself — no button press needed.
// Damaged conditions still need a manual Confirm click since a file must be attached.
let pdaReturnInProgress = false;
function checkPdaAutoReturn(){
  if(pdaActiveMode!=='return' || pdaReturnInProgress) return;
  const opsEl = document.getElementById('pda-ops-input');
  if(!opsEl) return;
  const opsIdRaw = opsEl.value.trim();
  const emp = empInfo(opsIdRaw);
  if(!emp || opsIdRaw.toUpperCase()!==emp.opsId.toUpperCase()) return;
  if(pdaConditionNeedsIR(pdaReturnCondition)) return;
  confirmPdaReturn();
}
async function confirmPdaReturn(){
  const pda = pdaModalTarget!=null ? DB.pdas[pdaModalTarget] : null;
  const opsIdEl = document.getElementById('pda-ops-input');
  if(!pda || !opsIdEl) return;
  const opsId = opsIdEl.value.trim();
  const emp = empInfo(opsId);
  if(!opsId || !emp){ toast('Enter a valid Ops ID for who is returning it.'); return; }
  const pdaNo = pda.pdaNo;
  const log = DB.pdaLogs.slice().reverse().find(l=>l.pdaNo===pdaNo && l.soc===pda.soc && l.status==='Borrowed');
  if(!log) return;
  pdaReturnInProgress = true;
  let irFile='', irFileData='';
  if(pdaConditionNeedsIR(pdaReturnCondition)){
    const fileEl = document.getElementById('pda-return-ir-file');
    const irFileObj = fileEl && fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
    if(!irFileObj){ toast('Upload the Incident Report before completing this return.'); pdaReturnInProgress = false; return; }
    if(irFileObj.size > 4*1024*1024){ toast('IR file is too large (max 4MB).'); pdaReturnInProgress = false; return; }
    irFile = irFileObj.name;
    try{ irFileData = await readFileAsDataURL(irFileObj); }
    catch(e){ console.error('File read error', e); toast('Could not read the IR file — completing the return without it attached for viewing.'); }
  }
  log.returnedAt = nowISO();
  log.returnedByOpsId = opsId; log.returnedByName = emp.fullName; log.returnedByAgency = emp.agency||''; log.returnedByDepartment = emp.department||'';
  log.conditionOnReturn = pdaReturnCondition; log.status = 'Returned'; log.irFile = irFile; log.irFileData = irFileData;
  pda.status = 'Available'; pda.condition = pdaReturnCondition;
  await saveDB();
  pdaReturnInProgress = false;
  pdaActiveMode = null; pdaModalTarget = null;
  toast(pdaNo+' returned by '+emp.fullName+' — logged as '+pdaConditionLabel(pdaReturnCondition)+'.');
  renderITAssets();
}

// A PDA number only has to be unique within the SOCs it's actually visible in:
// two specific sites can each run their own "PDA-001", but a shared/untagged
// (soc==='') entry is visible everywhere, so it still conflicts with any site.
function pdaNoConflict(pdaNo, soc, excludeIdx){
  const upper = pdaNo.toUpperCase();
  return DB.pdas.some((p,idx)=> idx!==excludeIdx && p.pdaNo.toUpperCase()===upper && (!p.soc || !soc || p.soc===soc));
}

function parsePdaConditionCsv(raw){
  const r = String(raw||'').trim().toLowerCase();
  if(!r) return 'Good';
  if(r.includes('not working')) return 'DamagedNotWorking';
  if(r.includes('damaged')) return 'DamagedWorking';
  return 'Good';
}
async function importPdaCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  const isAdmin = session.role==='admin';
  const ownSoc = currentSoc();
  let added=0, skipped=0;
  rows.forEach(row=>{
    const pdaNo = csvField(row, ['PDA No','PDA Number','PDA','PDA#']).trim();
    const serial = csvField(row, ['Serial','Serial Number']).trim();
    const condition = parsePdaConditionCsv(csvField(row, ['Condition']));
    let soc = ownSoc;
    if(isAdmin){
      const socRaw = csvField(row, ['SOC','Site','Site (SOC)']).trim();
      const match = DB.warehouses.find(w=>w.toLowerCase()===socRaw.toLowerCase());
      soc = match || '';
    }
    if(!pdaNo || pdaNoConflict(pdaNo, soc, -1)){ skipped++; return; }
    DB.pdas.push({pdaNo, serial, condition, soc, exceptionStatus:'', status:'Available'});
    added++;
  });
  if(added){ await saveDB(); }
  toast('Imported '+added+' PDA'+(added===1?'':'s')+(skipped?(', skipped '+skipped+' (blank/duplicate for that SOC).'):'.'));
  renderITAssets();
}

/* ------------------------- PDA reports (AM/PM shift + department allocation) ------------------------- */
function localDateStr(d){
  const dt = d ? new Date(d) : new Date();
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
// AM shift: 6:00 AM – 5:59 PM. PM shift: 6:00 PM – 5:59 AM. Based on local issue time.
function pdaShiftOf(dateObj){
  const h = dateObj.getHours();
  return (h>=6 && h<18) ? 'AM' : 'PM';
}
let pdaShiftReportDate = localDateStr();

  const amCount = dayLogs.filter(l=>pdaShiftOf(new Date(l.borrowedAt))==='AM').length;
  const pmCount = dayLogs.filter(l=>pdaShiftOf(new Date(l.borrowedAt))==='PM').length;

    <div class="field" style="max-width:220px;"><label>Date</label><input type="date" id="pda-shift-date" value="${dateStr}" onchange="onPdaShiftDateChange()"></div>
    <div class="grid g2" style="margin:14px 0 18px;">
      <div class="metric"><div class="lbl">AM shift issuances</div><div class="val">${amCount}</div><div class="sub">6:00 AM – 5:59 PM</div></div>
      <div class="metric"><div class="lbl">PM shift issuances</div><div class="val">${pmCount}</div><div class="sub">6:00 PM – 5:59 AM</div></div>
    </div>
    ${dayLogs.length===0 ? '<div class="empty"><div class="ic">&#128241;</div>No PDA issuances on this date.</div>' :
      '<div class="tbl-wrap"><table><tr><th>Shift</th><th>PDA #</th><th>Borrowed by</th><th>Department</th><th>Borrowed</th><th>Returned</th><th>Status</th></tr>' +
      dayLogs.map(l=>{
        const shift = pdaShiftOf(new Date(l.borrowedAt));
        return `<tr><td><span class="tag ${shift==='AM'?'tag-ok':'tag-pullout'}">${shift}</span></td>
          <td class="mono">${esc(l.pdaNo)}</td>
          <td>${esc(l.borrowerName)} <span class="small-note">(${esc(l.opsId)})</span></td>
          <td>${esc(l.borrowerDepartment||'—')}</td>
          <td>${fmtDateTime(l.borrowedAt)}</td>
          <td>${l.returnedAt?fmtDateTime(l.returnedAt):'—'}</td>
          <td>${l.status==='Borrowed'?'<span class="tag tag-pending">Borrowed</span>':'<span class="tag tag-ok">Returned</span>'}</td></tr>`;
      }).join('') + '</table></div>'}
  </div>`;
}
function onPdaShiftDateChange(){
  const el = document.getElementById('pda-shift-date');
  if(!el) return;
  pdaShiftReportDate = el.value || localDateStr();
  const wrap = document.getElementById('pda-shift-report-wrap');
  if(wrap) wrap.innerHTML = pdaShiftReportHtml();
}
function exportPdaShiftReport(){
  const dateStr = pdaShiftReportDate;
  const dayLogs = socFilter(DB.pdaLogs).filter(l=>localDateStr(l.borrowedAt)===dateStr).slice().sort((a,b)=>new Date(a.borrowedAt)-new Date(b.borrowedAt));
  const rows = dayLogs.map(l=>[pdaShiftOf(new Date(l.borrowedAt)), l.pdaNo, l.opsId, l.borrowerName, l.borrowerDepartment||'', fmtDateTime(l.borrowedAt), l.returnedAt?fmtDateTime(l.returnedAt):'', l.status]);
  downloadCSV('pda-shift-report-'+dateStr+'.csv', ['Shift','PDA #','Ops ID','Borrower','Department','Borrowed','Returned','Status'], rows);
}
function PDA_DEPT_BUCKETS(){ return DB.pdaDeptBuckets || []; }
function pdaDeptBucket(deptName){
  if(!deptName) return 'Other Department';
  const found = PDA_DEPT_BUCKETS().find(b=>b.toLowerCase()===deptName.trim().toLowerCase());
  return found || 'Other Department';
}
function pdaDeptAllocationReportHtml(){
  const pdas = socFilter(DB.pdas);
  const pdaLogs = socFilter(DB.pdaLogs);
  const totalPdas = pdas.length;
  const borrowed = pdas.filter(p=>p.status==='Borrowed');
  const available = pdas.filter(p=>p.status!=='Borrowed');
  const buckets = [...PDA_DEPT_BUCKETS(), 'Other Department'];
  const byBucket = {}; buckets.forEach(b=>byBucket[b]=[]);
  borrowed.forEach(p=>{
    const log = pdaLogs.slice().reverse().find(l=>l.pdaNo===p.pdaNo && l.soc===p.soc && l.status==='Borrowed');
    byBucket[pdaDeptBucket(log?log.borrowerDepartment:'')].push({pda:p, log});
  });
  const allocOf = b => Number((DB.pdaAllocations||{})[b])||0;
  const totalAllocated = PDA_DEPT_BUCKETS().reduce((s,b)=>s+allocOf(b),0);
  return `<div class="card">
    <div class="list-head"><h3>Allocated vs. borrowed vs. remaining</h3>${dlBtn('exportPdaDeptReport')}</div>
    <div class="card-sub">PDAs allocated per department (set on PDA Masterlist) compared against what's currently borrowed and what's still available (${totalPdas} in the masterlist).</div>
    <div class="grid g3" style="margin:14px 0 18px;">
      ${buckets.map(b=>`<div class="metric"><div class="lbl">${esc(b)}</div><div class="val">${byBucket[b].length}</div><div class="sub">borrowed${b!=='Other Department'?' of '+allocOf(b)+' allocated':''}</div></div>`).join('')}
      <div class="metric success"><div class="lbl">Remaining (available)</div><div class="val">${available.length}</div><div class="sub">of ${totalPdas} total</div></div>
    </div>
    <div class="tbl-wrap"><table><tr><th>Category</th><th>Allocated</th><th>Borrowed</th><th>Remaining</th></tr>
      ${buckets.map(b=>{
        const isOther = b==='Other Department';
        const alloc = allocOf(b);
        const remaining = isOther ? '—' : (alloc - byBucket[b].length);
        return `<tr><td>${esc(b)}</td><td>${isOther?'—':alloc}</td><td>${byBucket[b].length}</td><td${!isOther && remaining<0?' style="color:var(--danger);font-weight:600;"':''}>${remaining}</td></tr>`;
      }).join('')}
      <tr><td>Remaining (available)</td><td>—</td><td>${available.length}</td><td>—</td></tr>
      <tr><td><strong>Total</strong></td><td><strong>${totalAllocated}</strong></td><td><strong>${borrowed.length}</strong></td><td><strong>${totalAllocated - PDA_DEPT_BUCKETS().reduce((s,b)=>s+byBucket[b].length,0)}</strong></td></tr>
    </table></div>
    <div class="section-title">Borrowed — by department</div>
    ${borrowed.length===0 ? '<div class="empty"><div class="ic">&#128241;</div>No PDAs currently out.</div>' :
      '<div class="tbl-wrap"><table><tr><th>Department</th><th>PDA #</th><th>Serial</th><th>Borrowed by</th><th>Since</th></tr>' +
      buckets.filter(b=>byBucket[b].length).map(b=>byBucket[b].map(x=>`<tr><td>${esc(b)}</td><td class="mono">${esc(x.pda.pdaNo)}</td><td class="mono">${esc(x.pda.serial||'—')}</td>
        <td>${x.log?esc(x.log.borrowerName)+' <span class="small-note">('+esc(x.log.opsId)+')</span>':'—'}</td>
        <td>${x.log?fmtDateTime(x.log.borrowedAt):'—'}</td></tr>`).join('')).join('') + '</table></div>'}
  </div>`;
}
function pdaAllocBarRow(label, count, total, isRemaining){
  const pct = total>0 ? Math.round((count/total)*100) : 0;
  return `<div class="alloc-bar-row">
    <div class="alloc-bar-label">${esc(label)}</div>
    <div class="alloc-bar-track"><div class="alloc-bar-fill${isRemaining?' remaining':''}" style="width:${pct}%"></div></div>
    <div class="alloc-bar-value">${count} <span class="small-note">(${pct}%)</span></div>
  </div>`;
}
function exportPdaDeptReport(){
  const pdas = socFilter(DB.pdas);
  const pdaLogs = socFilter(DB.pdaLogs);
  const borrowed = pdas.filter(p=>p.status==='Borrowed');
  const available = pdas.filter(p=>p.status!=='Borrowed');
  const rows = borrowed.map(p=>{
    const log = pdaLogs.slice().reverse().find(l=>l.pdaNo===p.pdaNo && l.soc===p.soc && l.status==='Borrowed');
    return [pdaDeptBucket(log?log.borrowerDepartment:''), 'Borrowed', p.pdaNo, p.serial||'', log?log.borrowerName:'', log?log.opsId:'', log?fmtDateTime(log.borrowedAt):''];
  });
  available.forEach(p=>{ rows.push(['Remaining (available)', 'Available', p.pdaNo, p.serial||'', '', '', '']); });
  downloadCSV('pda-department-allocation.csv', ['Department bucket','Status','PDA #','Serial','Borrower','Ops ID','Borrowed since'], rows);
}

/* ============================= PARCEL RETRIEVAL MODULE ============================= */
function renderParcelRetrieval(){
  const c = document.getElementById('content');
  const tab = subroute || 'scan';
  c.innerHTML = `
    <div class="tabs">
      <div class="tab ${tab==='scan'?'active':''}" onclick="navigate('parcelretrieval','scan')">Retrieve</div>
      <div class="tab ${tab==='list'?'active':''}" onclick="navigate('parcelretrieval','list')">Retrieval Log (${socFilter(DB.parcels).length})</div>
    </div>
    <div id="parcel-body"></div>
  `;
  document.getElementById('parcel-body').innerHTML = tab==='scan' ? parcelScanHtml() : parcelLogHtml();
  if(tab==='scan'){ refreshParcelSessionTable(); }
}
function stationOptions(){
  return '<option value="">Select station…</option>' + (DB.sortingStations.length ? DB.sortingStations.map(s=>`<option value="${esc(s)}" ${s===parcelSessionStation?'selected':''}>${esc(s)}</option>`).join('') : '');
}
function parcelScanHtml(){
  return `<div class="card">
    <h3>Retrieval session</h3>
    <div class="card-sub">Select the sorting station once, then scan each parcel as you retrieve it.</div>
    <div class="form-row">
      <div class="field"><label>Sorting station</label><select id="parcel-station" onchange="parcelSessionStation=this.value;">${stationOptions()}</select></div>
      <div class="field"><label>Parcel ID</label><input id="parcel-id-input" placeholder="e.g. PCL-2044" onkeydown="if(event.key==='Enter'){event.preventDefault();addParcelScan();}"></div>
    </div>
    <div class="footer-actions"><button class="btn btn-primary" onclick="addParcelScan()">Scan</button></div>
  </div>
  <div class="card">
    <h3>Scanned this session</h3>
    <div id="parcel-session-table"></div>
  </div>`;
}
let parcelSessionScans = [];
function refreshParcelSessionTable(){
  const el = document.getElementById('parcel-session-table');
  if(!el) return;
  if(parcelSessionScans.length===0){ el.innerHTML = '<div class="empty"><div class="ic">&#128233;</div>No parcels scanned yet this session.</div>'; return; }
  el.innerHTML = '<div class="tbl-wrap"><table><tr><th>Parcel ID</th><th>Station</th><th>Retrieved</th></tr>' +
    parcelSessionScans.slice().reverse().map(p=>`<tr><td class="mono">${esc(p.parcelId)}</td><td>${esc(p.station)}</td><td>${fmtDateTime(p.retrievedAt)}</td></tr>`).join('') +
    '</table></div>';
}
async function addParcelScan(){
  const station = document.getElementById('parcel-station').value;
  const input = document.getElementById('parcel-id-input');
  const code = input.value.trim();
  if(!station){ toast('Select a sorting station first.'); return; }
  if(!code) return;
  if(DB.parcels.some(p=>p.parcelId.toUpperCase()===code.toUpperCase())){ toast('That Parcel ID was already retrieved.'); input.value=''; return; }
  const rec = {id: nextCode('PCL','pl'), parcelId: code, station, retriever: session.fullName, retrievedAt: nowISO(), soc:currentSoc()};
  DB.parcels.push(rec);
  parcelSessionScans.push(rec);
  await saveDB();
  input.value='';
  refreshParcelSessionTable();
  input.focus();
}
function parcelLogHtml(){
  const rows = socFilter(DB.parcels);
  const header = `<div class="list-head"><h3>Parcel retrieval log (${rows.length})</h3>${dlBtn('exportParcels')}</div>`;
  if(rows.length===0) return '<div class="card">'+header+'<div class="empty"><div class="ic">&#128233;</div>No parcels retrieved yet.</div></div>';
  return '<div class="card">'+header+'<div class="tbl-wrap"><table>' +
    '<tr><th>Ref #</th><th>Parcel ID</th><th>Station</th><th>Retriever</th><th>Retrieved</th></tr>' +
    rows.slice().reverse().map(p=>`<tr><td class="mono">${esc(p.id)}</td><td class="mono">${esc(p.parcelId)}</td><td>${esc(p.station)}</td><td>${esc(p.retriever)}</td><td>${fmtDateTime(p.retrievedAt)}</td></tr>`).join('') +
    '</table></div></div>';
}
function exportParcels(){
  const rows = socFilter(DB.parcels).map(p=>[p.id,p.parcelId,p.station,p.retriever,fmtDateTime(p.retrievedAt)]);
  downloadCSV('parcel-retrieval-log.csv', ['Ref #','Parcel ID','Station','Retriever','Retrieved'], rows);
}

/* ============================= INIT ============================= */
(async function init(){
  await loadDB();
  const saved = loadUiSession();
  if(saved && saved.session){
    const stillExists = DB.users.find(u=>u.id===saved.session.id);
    if(stillExists){
      portalMode = saved.portalMode || stillExists.portal || 'supplies';
      session = {id:stillExists.id, username:stillExists.username, fullName:stillExists.fullName, role:stillExists.role, portal:stillExists.portal, department:stillExists.department||null, site:stillExists.site||null, processAccess:stillExists.processAccess||null};
      route = saved.route || (portalMode==='department' ? 'ddashboard' : 'dashboard');
      subroute = saved.subroute || '';
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      renderShell();
      navigate(route, subroute);
      startAutoRefresh();
      return;
    }
    clearUiSession();
  }
  document.getElementById('login-username').focus();
})();
</script>

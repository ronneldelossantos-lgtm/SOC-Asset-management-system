// Barcode scanners act like a very fast typist that ends with a brief pause
// (whether or not they're configured to send a trailing Enter). We watch the
// input for that pause and treat it as "scan finished" so the parcel drops
// into the pending list automatically — no Enter required. A person typing
// by hand can still press Enter to add it immediately; that click clears
// this timer first so the parcel is never added twice.
let parcelScanIdleTimer = null;
const PARCEL_SCAN_IDLE_MS = 300;
function onParcelIdInput(){
  const input = document.getElementById('parcel-id-input');
  if(!input) return;
  if(parcelScanIdleTimer) clearTimeout(parcelScanIdleTimer);
  const snapshot = input.value;
  if(!snapshot.trim()) return;
  parcelScanIdleTimer = setTimeout(()=>{
    parcelScanIdleTimer = null;
    const cur = document.getElementById('parcel-id-input');
    // Only auto-add if the field still holds exactly what it held when the
    // pause started (i.e. nothing was typed/scanned in the meantime).
    if(cur && cur.value === snapshot && cur.value.trim()) addPendingParcel();
  }, PARCEL_SCAN_IDLE_MS);
}
function addPendingParcel(){
  if(parcelScanIdleTimer){ clearTimeout(parcelScanIdleTimer); parcelScanIdleTimer = null; }
  const input = document.getElementById('parcel-id-input');
  const code = input.value.trim();
  if(!code) return;
  if(DB.parcels.some(p=>p.parcelId.toUpperCase()===code.toUpperCase()) || parcelPendingIds.some(c=>c.toUpperCase()===code.toUpperCase())){
    toast('That Parcel ID was already scanned — not added again.');
    input.value='';
    input.focus();
    return;
  }
  parcelPendingIds.push(code);
  input.value='';
  refreshPendingList();
  input.focus();
}
function removePendingParcel(i){
  parcelPendingIds.splice(i,1);
  refreshPendingList();
}
let parcelSessionScans = [];
function refreshParcelSessionTable(){
  const el = document.getElementById('parcel-session-table');
  if(!el) return;
  if(parcelSessionScans.length===0){ el.innerHTML = '<div class="empty"><div class="ic">&#128233;</div>No parcels scanned yet this session.</div>'; return; }
  el.innerHTML = '<div class="tbl-wrap"><table><tr><th>Parcel ID</th><th>Station</th><th>Hand over to</th><th>Retrieved</th></tr>' +
    parcelSessionScans.slice().reverse().map(p=>`<tr><td class="mono">${esc(p.parcelId)}</td><td>${esc(p.station)}</td><td>${esc(p.handOverTo||'—')}</td><td>${fmtDateTime(p.retrievedAt)}</td></tr>`).join('') +
    '</table></div>';
}
async function commitParcelBatch(){
  const station = document.getElementById('parcel-station').value;
  const handOverTo = document.getElementById('parcel-handover').value;
  if(parcelPendingIds.length===0){ toast('Scan at least one Parcel ID first.'); return; }
  if(!station){ toast('Select a sorting station first.'); return; }
  if(!handOverTo){ toast('Select who these parcels are handed over to.'); return; }
  const retrievedAt = nowISO();
  const soc = currentSoc();
  const recs = parcelPendingIds
    .filter(code=>!DB.parcels.some(p=>p.parcelId.toUpperCase()===code.toUpperCase()))
    .map(code=>({id: nextCode('PCL','pl'), parcelId: code, station, handOverTo, retriever: session.fullName, retrievedAt, soc}));
  recs.forEach(rec=>{ DB.parcels.push(rec); parcelSessionScans.push(rec); });
  await saveDB();
  parcelPendingIds = [];
  refreshPendingList();
  refreshParcelSessionTable();
  toast('Saved '+recs.length+' parcel'+(recs.length===1?'':'s')+' to the retrieval log.');
  const focusInput = document.getElementById('parcel-id-input');
  if(focusInput) focusInput.focus();
}
function parcelLogHtml(){
  const rows = socFilter(DB.parcels);
  const header = `<div class="list-head"><h3>Parcel retrieval log (${rows.length})</h3>${dlBtn('exportParcels')}</div>`;
  if(rows.length===0) return '<div class="card">'+header+'<div class="empty"><div class="ic">&#128233;</div>No parcels retrieved yet.</div></div>';
  return '<div class="card">'+header+'<div class="tbl-wrap"><table>' +
    '<tr><th>Ref #</th><th>Parcel ID</th><th>Station</th><th>Hand over to</th><th>Retriever</th><th>Retrieved</th></tr>' +
    rows.slice().reverse().map(p=>`<tr><td class="mono">${esc(p.id)}</td><td class="mono">${esc(p.parcelId)}</td><td>${esc(p.station)}</td><td>${esc(p.handOverTo||'—')}</td><td>${esc(p.retriever)}</td><td>${fmtDateTime(p.retrievedAt)}</td></tr>`).join('') +
    '</table></div></div>';
}
function exportParcels(){
  const rows = socFilter(DB.parcels).map(p=>[p.id,p.parcelId,p.station,p.handOverTo||'',p.retriever,fmtDateTime(p.retrievedAt)]);
  downloadCSV('parcel-retrieval-log.csv', ['Ref #','Parcel ID','Station','Hand over to','Retriever','Retrieved'], rows);
}

/* ------------------------- Parcel Retrieval Dashboard (AM/PM shift, by station) ------------------------- */
// AM shift buckets: 6-8,8-10,10-12,12-14,14-16,16-18 (6am-6pm).
// PM shift buckets: 18-20,20-22,22-24,24-26,26-28,28-30 (6pm to 6am the next calendar day).
const PARCEL_BUCKET_RANGES = [[6,8],[8,10],[10,12],[12,14],[14,16],[16,18],[18,20],[20,22],[22,24],[24,26],[26,28],[28,30]];
function parcelBucketHourLabel(h){
  const hh = ((h%24)+24)%24;
  const period = hh<12 ? 'am' : 'pm';
  let disp = hh%12; if(disp===0) disp = 12;
  return disp+period;
}
function parcelBucketLabels(){ return PARCEL_BUCKET_RANGES.map(r=>parcelBucketHourLabel(r[0])+'-'+parcelBucketHourLabel(r[1])); }
function parcelBucketIndexFor(dateObj, shiftDateStr){
  const origin = new Date(shiftDateStr+'T00:00:00');
  const diffH = (dateObj - origin) / 3600000;
  for(let i=0;i<PARCEL_BUCKET_RANGES.length;i++){
    if(diffH>=PARCEL_BUCKET_RANGES[i][0] && diffH<PARCEL_BUCKET_RANGES[i][1]) return i;
  }
  return -1;
}
let parcelShiftReportDate = localDateStr();
function parcelShiftReportRows(shiftDateStr){
  const labels = parcelBucketLabels();
  const cs = currentSoc();
  const stationList = stationsForCurrentSoc();
  const rows = stationList.map(s=>({station:s.name, soc:s.soc, buckets:new Array(labels.length).fill(0), total:0}));
  const totals = new Array(labels.length).fill(0);
  socFilter(DB.parcels).forEach(p=>{
    const idx = parcelBucketIndexFor(new Date(p.retrievedAt), shiftDateStr);
    if(idx<0) return;
    // Scoped to one SOC: match by station name (already unambiguous). Viewing
    // "All SOCs": match by station name AND soc, since the same station name
    // can exist at more than one site.
    let row = cs
      ? rows.find(r=>r.station===p.station)
      : rows.find(r=>r.station===p.station && (r.soc||'')===(p.soc||''));
    if(!row){
      row = {station:p.station||'—', soc:p.soc||'', buckets:new Array(labels.length).fill(0), total:0};
      rows.push(row);
    }
    row.buckets[idx]++;
    row.total++;
    totals[idx]++;
  });
  return {rows, totals, labels, showSocColumn: !cs};
}
function parcelSocShiftSummaryRows(shiftDateStr){
  const sites=dashboardSocEntries(['parcels']);
  const summary={};
  sites.forEach(site=>summary[dashboardSocKey(site.key)]={site:site.label,am:0,pm:0,total:0});
  (DB.parcels||[]).forEach(parcel=>{
    const idx=parcelBucketIndexFor(new Date(parcel.retrievedAt),shiftDateStr);
    if(idx<0) return;
    const key=dashboardSocKey(parcel.soc);
    if(!summary[key]) summary[key]={site:parcel.soc||'Shared / unassigned',am:0,pm:0,total:0};
    summary[key][idx<6?'am':'pm']++;
    summary[key].total++;
  });
  return Object.values(summary);
}
function parcelDashboardHtml(){
  return `<div id="parcel-shift-report-wrap">${parcelShiftReportHtml()}</div>`;
}
function parcelShiftReportHtml(){
  const dateStr = parcelShiftReportDate;
  const {rows, totals, labels, showSocColumn} = parcelShiftReportRows(dateStr);
  const amTotal = totals.slice(0,6).reduce((a,b)=>a+b,0);
  const pmTotal = totals.slice(6).reduce((a,b)=>a+b,0);
  const grand = amTotal+pmTotal;
  const leadCols = showSocColumn ? 2 : 1;
  const socSummary=showSocColumn?parcelSocShiftSummaryRows(dateStr):[];
  return `<div class="card">
    <div class="list-head"><h3>Parcels retrieved — AM / PM shift report</h3>${dlBtn('exportParcelShiftReport')}</div>
    <div class="card-sub">Sorting station (each tied to its own SOC) on the left, 2-hour retrieval buckets across the top. AM shift 6:00 AM – 5:59 PM, PM shift 6:00 PM – 5:59 AM (spans into the next calendar day).${currentSoc()?'':' Viewing all SOCs combined — station names are grouped with the SOC they belong to.'}</div>
    <div class="field" style="max-width:220px;"><label>Shift date</label><input type="date" id="parcel-shift-date" value="${dateStr}" onchange="onParcelShiftDateChange()"></div>
    <div class="grid g3" style="margin:14px 0 18px;">
      <div class="metric"><div class="lbl">AM shift</div><div class="val">${amTotal}</div><div class="sub">6:00 AM – 5:59 PM</div></div>
      <div class="metric"><div class="lbl">PM shift</div><div class="val">${pmTotal}</div><div class="sub">6:00 PM – 5:59 AM</div></div>
      <div class="metric success"><div class="lbl">Total retrieved</div><div class="val">${grand}</div><div class="sub">this shift date</div></div>
    </div>
    ${showSocColumn?'<div class="section-title">Retrieval totals by SOC</div><div class="tbl-wrap"><table><tr><th>SOC</th><th style="text-align:right;">AM shift</th><th style="text-align:right;">PM shift</th><th style="text-align:right;">Total retrieved</th></tr>'+socSummary.map(r=>`<tr><td>${esc(r.site)}</td><td style="text-align:right;">${r.am}</td><td style="text-align:right;">${r.pm}</td><td style="text-align:right;font-weight:700;">${r.total}</td></tr>`).join('')+'</table></div>':''}
    ${rows.length===0 ? '<div class="empty"><div class="ic">&#128233;</div>No sorting stations configured yet — add one in Settings &rarr; Sorting Station.</div>' :
      '<div class="tbl-wrap"><table><tr><th rowspan="2">Station</th>'+(showSocColumn?'<th rowspan="2">SOC</th>':'')+'<th colspan="6">AM shift</th><th colspan="6">PM shift</th><th rowspan="2">Total</th></tr>' +
      '<tr>' + labels.map(l=>`<th>${l}</th>`).join('') + '</tr>' +
      rows.map(r=>`<tr><td>${esc(r.station)}</td>${showSocColumn?`<td>${r.soc?esc(r.soc):'<span class="small-note">Unassigned</span>'}</td>`:''}${r.buckets.map(v=>`<td style="text-align:right;">${v||0}</td>`).join('')}<td style="text-align:right;font-weight:700;">${r.total}</td></tr>`).join('') +
      `<tr><td colspan="${leadCols}"><strong>Total</strong></td>${totals.map(v=>`<td style="text-align:right;"><strong>${v||0}</strong></td>`).join('')}<td style="text-align:right;"><strong>${grand}</strong></td></tr>` +
      '</table></div>'}
  </div>`;
}
function onParcelShiftDateChange(){
  const el = document.getElementById('parcel-shift-date');
  if(!el) return;
  parcelShiftReportDate = el.value || localDateStr();
  const wrap = document.getElementById('parcel-shift-report-wrap');
  if(wrap) wrap.innerHTML = parcelShiftReportHtml();
}
function exportParcelShiftReport(){
  const dateStr = parcelShiftReportDate;
  const {rows, totals, labels, showSocColumn} = parcelShiftReportRows(dateStr);
  const rowsCsv = rows.map(r=>showSocColumn ? [r.station, r.soc||'', ...r.buckets, r.total] : [r.station, ...r.buckets, r.total]);
  const totalRow = showSocColumn ? ['Total', '', ...totals, totals.reduce((a,b)=>a+b,0)] : ['Total', ...totals, totals.reduce((a,b)=>a+b,0)];
  rowsCsv.push(totalRow);
  const headers = showSocColumn ? ['Station','SOC', ...labels, 'Total'] : ['Station', ...labels, 'Total'];
  downloadCSV('parcel-shift-report-'+dateStr+'.csv', headers, rowsCsv);
}

/* ============================= INIT ============================= */
document.addEventListener('visibilitychange',syncLiveListenersForVisibility);
(async function init(){
  await loadDB();
  if(lastKnownSnapshot && loadedSections.has('stock') && loadedRecordSections.has('requests') && loadedRecordSections.has('issuance')){
    const requestsBeforeAllocation = JSON.stringify(DB.requests);
    syncOpenRequestAssetCodes();
    if(JSON.stringify(DB.requests)!==requestsBeforeAllocation) await saveDBWithRetry(syncOpenRequestAssetCodes);
  }
  const saved = loadUiSession();
  if(saved && saved.session){
    const stillExists = DB.users.find(u=>u.id===saved.session.id);
    if(stillExists){
      portalMode = saved.portalMode || stillExists.portal || 'supplies';
      adminViewSoc = saved.adminViewSoc || '';
      session = {id:stillExists.id, username:stillExists.username, fullName:stillExists.fullName, role:stillExists.role, portal:stillExists.portal, department:stillExists.department||null, departmentSoc:stillExists.departmentSoc||null, site:stillExists.site||null, hubName:stillExists.hubName||null, processAccess:stillExists.processAccess||null};
      route = saved.route || (portalMode==='department' ? 'ddashboard' : 'dashboard');
      subroute = saved.subroute || '';
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      renderShell();
      navigate(route, subroute);
      syncLiveListenersForVisibility();
      return;
    }
    clearUiSession();
  }
  document.getElementById('login-username').focus();
})();
</script>

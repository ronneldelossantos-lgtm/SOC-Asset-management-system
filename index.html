async function addSku(){
  const sku = document.getElementById('new-sku-code').value.trim();
  const desc = document.getElementById('new-sku-desc').value.trim();
  const type = document.getElementById('new-sku-type').value;
  const uom = document.getElementById('new-sku-uom').value.trim();
  const qty = type==='Consumable' ? 0 : (Number(document.getElementById('new-sku-qty').value)||0);
  if(!sku || !desc || !uom){ toast('Fill out SKU code, description, and UOM.'); return; }
  if(skuInfo(sku)){ toast('That SKU code already exists.'); return; }
  DB.sku.push({sku, description:desc, type, uom, assetCondition: type==='Asset' ? 'Repairable' : undefined, safetyStockDays: 7});
  DB.stock[sku] = qty;
  DB.reorderPoint[sku] = 0;
  await saveDB();
  toast('SKU '+sku+' added'+(type==='Consumable'?' — starts at 0 on-hand; receive stock via Receiving.':'.'));
  renderSettings();
}
function deleteSku(sku){
  confirmAction('Remove SKU '+sku+' from the master list? This will also clear its stock and reorder-point records.', async ()=>{
    DB.sku = DB.sku.filter(s=>s.sku!==sku);
    delete DB.stock[sku]; delete DB.reorderPoint[sku];
    await saveDB();
    toast('SKU '+sku+' removed.');
    renderSettings();
  });
}
async function importSkuCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0, skipped = 0;
  rows.forEach(row=>{
    const sku = csvField(row, ['SKU','SKU Code']).trim();
    const desc = csvField(row, ['Description','Item Description']).trim();
    let type = csvField(row, ['Type']).trim();
    const uom = csvField(row, ['UOM']).trim();
    const qtyRaw = csvField(row, ['Qty','Quantity','On Hand','Initial on-hand qty']).trim();
    type = /^asset$/i.test(type) ? 'Asset' : (/^consumable$/i.test(type) ? 'Consumable' : '');
    if(!sku || !desc || !type || !uom || skuInfo(sku)){ skipped++; return; }
    const qty = type==='Consumable' ? 0 : (Number(qtyRaw)||0);
    DB.sku.push({sku, description:desc, type, uom, assetCondition: type==='Asset' ? 'Repairable' : undefined, safetyStockDays: 7});
    DB.stock[sku] = qty;
    DB.reorderPoint[sku] = 0;
    added++;
  });
  if(added){ await saveDB(); }
  toast('Imported '+added+' SKU'+(added===1?'':'s')+(skipped?(', skipped '+skipped+' (missing/duplicate/invalid).'):'.'));
  renderSettings();
}

  if(isDept) refreshNewUserApproverOptions();
}
async function addUser(){
  const fullName = document.getElementById('new-user-name').value.trim();
  const username = document.getElementById('new-user-username').value.trim();
  const role = document.getElementById('new-user-role').value;
  const isDept = role === 'department';
  const isStaff = role === 'staff';
  const pass = isDept ? document.getElementById('new-user-pass-dept').value : document.getElementById('new-user-pass').value;
  const department = isDept ? document.getElementById('new-user-dept').value : undefined;
  const site = !isDept ? document.getElementById('new-user-site').value : undefined;
  if(!fullName||!username||!pass){ toast('Fill out all fields.'); return; }
  if(DB.users.find(u=>u.username.toLowerCase()===username.toLowerCase())){ toast('That username is taken.'); return; }
  const id = Math.max(0,...DB.users.map(u=>u.id))+1;
  const portal = isDept ? 'department' : 'supplies';
  const newUser = {id, username, password:pass, role, fullName, portal};
  if(isDept) newUser.department = department;
  if(isDept){
    const approverSel = document.getElementById('new-user-approver');
    const approverUsername = approverSel ? approverSel.value : '';
    if(approverUsername) newUser.approverUsername = approverUsername;
  }
  if(site) newUser.site = site;
  if(isStaff){
    newUser.skuScope = Array.from(document.getElementById('new-user-sku-scope').selectedOptions).map(o=>o.value);
    newUser.departmentScope = Array.from(document.getElementById('new-user-dept-scope').selectedOptions).map(o=>o.value);
    newUser.accountabilityScope = Array.from(document.getElementById('new-user-acct-scope').selectedOptions).map(o=>o.value);
  }
  DB.users.push(newUser);
  await saveDB();
  toast('Login added.');
  renderSettings();
}
function openEditUser(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  const isDept = u.role==='department';
  const isStaff = u.role==='staff';
  const deptFieldsHtml = isDept ? `
    <div class="field"><label>Department</label><select id="edit-user-dept" onchange="refreshEditUserApproverOptions(${id})">${DB.departments.map(d=>`<option ${d===u.department?'selected':''}>${esc(d)}</option>`).join('')}</select></div>
    <div class="field"><label>Requires approval from</label><select id="edit-user-approver"></select></div>
  ` : `
    <div class="field"><label>Site (SOC)</label><select id="edit-user-site">
      <option value="" ${!u.site?'selected':''}>— Not site-specific —</option>
      ${DB.warehouses.map(w=>`<option value="${esc(w)}" ${w===u.site?'selected':''}>${esc(w)}</option>`).join('')}
    </select></div>
  `;
  const scopeHtml = isStaff ? `
    <div class="section-title">Access scope</div>
    <div class="card-sub" style="margin-bottom:10px;">Optional — limit this staff login's visibility. Leave a selector empty for full access on that dimension.</div>
    <div class="form-row3">
      <div class="field"><label>SKU code</label><select id="edit-user-sku-scope" multiple size="6">${DB.sku.map(s=>`<option value="${esc(s.sku)}" ${(u.skuScope||[]).includes(s.sku)?'selected':''}>${esc(s.sku)} — ${esc(s.description)}</option>`).join('')}</select></div>
      <div class="field"><label>Department</label><select id="edit-user-dept-scope" multiple size="6">${DB.departments.map(d=>`<option value="${esc(d)}" ${(u.departmentScope||[]).includes(d)?'selected':''}>${esc(d)}</option>`).join('')}</select></div>
      <div class="field"><label>Accountability</label><select id="edit-user-acct-scope" multiple size="6">${DB.accountability.map(a=>`<option value="${esc(a.name)}" ${(u.accountabilityScope||[]).includes(a.name)?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
    </div>
  ` : '';
  showModal(`
    <h3>Edit user</h3>
    <div class="card-sub">Role is fixed once created — remove and re-add the login to change it. Leave password blank to keep the current one.</div>
    <div class="form-row">
      <div class="field"><label>Full name</label><input id="edit-user-name" value="${esc(u.fullName)}"></div>
      <div class="field"><label>Username</label><input id="edit-user-username" value="${esc(u.username)}"></div>
    </div>
    <div class="form-row">
      ${deptFieldsHtml}
      <div class="field"><label>New password (optional)</label><input id="edit-user-pass" type="text" placeholder="Leave blank to keep current"></div>
    </div>
    ${scopeHtml}
    <div class="footer-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUserEdit(${id})">Save changes</button>
    </div>
  `);
  if(isDept) refreshEditUserApproverOptions(id);
}
function refreshEditUserApproverOptions(id){
  const sel = document.getElementById('edit-user-approver');
  const deptSel = document.getElementById('edit-user-dept');
  if(!sel || !deptSel) return;
  const u = DB.users.find(x=>x.id===id);
  const dept = deptSel.value;
  const candidates = DB.users.filter(x=>x.role==='department' && x.department===dept && x.id!==id);
  sel.innerHTML = '<option value="">— No additional approval —</option>' +
    candidates.map(x=>`<option value="${esc(x.username)}" ${u && u.approverUsername===x.username?'selected':''}>${esc(x.fullName)} (${esc(x.username)})</option>`).join('');
}
async function saveUserEdit(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  const fullName = document.getElementById('edit-user-name').value.trim();
  const username = document.getElementById('edit-user-username').value.trim();
  const pass = document.getElementById('edit-user-pass').value;
  if(!fullName || !username){ toast('Full name and username are required.'); return; }
  if(DB.users.some(x=>x.id!==id && x.username.toLowerCase()===username.toLowerCase())){ toast('That username is taken.'); return; }
  const oldUsername = u.username;
  u.fullName = fullName;
  u.username = username;
  if(oldUsername.toLowerCase()!==username.toLowerCase()){
    DB.users.forEach(x=>{ if(x.approverUsername && x.approverUsername.toLowerCase()===oldUsername.toLowerCase()) x.approverUsername = username; });
    DB.requests.forEach(r=>{ if(r.requiresApprovalFrom && r.requiresApprovalFrom.toLowerCase()===oldUsername.toLowerCase()) r.requiresApprovalFrom = username; });
  }
  if(pass) u.password = pass;
  if(u.role==='department'){
    u.department = document.getElementById('edit-user-dept').value;
    const approverUsername = document.getElementById('edit-user-approver').value;
    if(approverUsername) u.approverUsername = approverUsername; else delete u.approverUsername;
  } else {
    const site = document.getElementById('edit-user-site').value;
    if(site) u.site = site; else delete u.site;
    if(u.role==='staff'){
      u.skuScope = Array.from(document.getElementById('edit-user-sku-scope').selectedOptions).map(o=>o.value);
      u.departmentScope = Array.from(document.getElementById('edit-user-dept-scope').selectedOptions).map(o=>o.value);
      u.accountabilityScope = Array.from(document.getElementById('edit-user-acct-scope').selectedOptions).map(o=>o.value);
    }
  }
  await saveDB();
  closeModal();
  toast('User updated.');
  renderSettings();
}
function deleteUser(id){
  confirmAction('Remove this user?', async ()=>{
    DB.users = DB.users.filter(u=>u.id!==id);
    await saveDB();
    toast('User removed.');
    renderSettings();
  });
}
async function addEmployee(){

  const fullName = document.getElementById('new-emp-name').value.trim();
  const department = document.getElementById('new-emp-dept').value;

  if(empInfo(opsId)){ toast('That Ops ID already exists.'); return; }

}

  if(!e) return;

    <h3>Edit employee</h3>
    <div class="form-row3">
      <div class="field"><label>Ops ID</label><input id="edit-emp-ops" value="${esc(e.opsId)}"></div>
      <div class="field"><label>Full name</label><input id="edit-emp-name" value="${esc(e.fullName)}"></div>
      <div class="field"><label>Department</label><select id="edit-emp-dept">${DB.departments.map(d=>`<option ${d===e.department?'selected':''}>${esc(d)}</option>`).join('')}</select></div>
    </div>

async function saveEmployeeEdit(i){
  const e = DB.employees[i];
  if(!e) return;
  const opsId = document.getElementById('edit-emp-ops').value.trim();
  const fullName = document.getElementById('edit-emp-name').value.trim();

async function removeEmployee(i){
  DB.employees.splice(i,1);
  await saveDB();
  toast('Employee removed.');
  renderSettings();
}
async function importEmployeeCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0, skipped = 0;
  rows.forEach(row=>{
    const opsId = csvField(row, ['Ops ID','OpsId','Ops Id']).trim();
    const fullName = csvField(row, ['Full Name','Name']).trim();
    const deptRaw = csvField(row, ['Department']).trim();
    const dept = DB.departments.find(d=>d.toLowerCase()===deptRaw.toLowerCase());
    if(!opsId || !fullName || !dept || empInfo(opsId)){ skipped++; return; }
    DB.employees.push({opsId, fullName, department:dept});
    added++;
  });
  if(added){ await saveDB(); }
  toast('Imported '+added+' employee'+(added===1?'':'s')+(skipped?(', skipped '+skipped+' (missing/duplicate/unknown department).'):'.'));
  renderSettings();
}
function normalizeRole(raw){
  const r = String(raw||'').trim().toLowerCase();
  if(!r) return '';
  if(r==='admin' || r.includes('admin')) return 'admin';
  if(r==='department' || r.includes('department') || r.includes('dept')) return 'department';
  if(r==='staff' || r.includes('staff')) return 'staff';
  return '';
}
async function importUserCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0;
  const problems = [];
  rows.forEach((row, idx)=>{
    const rowNum = idx+2; // header is row 1, data starts at row 2
    const fullName = csvField(row, ['Full Name','Fullname','Name']).trim();
    const username = csvField(row, ['Username','User Name','Login']).trim();
    const roleRaw = csvField(row, ['Role','Portal Role']).trim();
    const role = normalizeRole(roleRaw);
    const password = csvField(row, ['Password','Pass']).trim();
    const deptRaw = csvField(row, ['Department','Dept']).trim();
    const siteRaw = csvField(row, ['Site','SOC','Warehouse']).trim();
    if(!fullName || !username || !password){
      problems.push('Row '+rowNum+': missing full name, username, or password.');
      return;
    }
    if(!role){
      problems.push('Row '+rowNum+': role "'+(roleRaw||'(blank)')+'" isn\'t recognized — use admin, staff, or department.');
      return;
    }
    if(DB.users.find(u=>u.username.toLowerCase()===username.toLowerCase())){
      problems.push('Row '+rowNum+': username "'+username+'" already exists.');
      return;
    }
    let department;
    if(role==='department'){
      department = DB.departments.find(d=>d.toLowerCase()===deptRaw.toLowerCase());
      if(!department){
        problems.push('Row '+rowNum+': department "'+(deptRaw||'(blank)')+'" doesn\'t match any department on file.');
        return;
      }
    }
    const id = Math.max(0,...DB.users.map(u=>u.id),0)+1;
    const portal = role==='department' ? 'department' : 'supplies';
    const newUser = {id, username, password, role, fullName, portal};
    if(department) newUser.department = department;
    if(role!=='department' && siteRaw){
      const site = DB.warehouses.find(w=>w.toLowerCase()===siteRaw.toLowerCase());
      if(site) newUser.site = site;
    }
    if(role==='staff'){
      const splitScope = v => v.split(';').map(x=>x.trim()).filter(x=>x);
      const skuScopeRaw = splitScope(csvField(row, ['SKU Scope']));
      const deptScopeRaw = splitScope(csvField(row, ['Department Scope']));
      const acctScopeRaw = splitScope(csvField(row, ['Accountability Scope']));
      newUser.skuScope = skuScopeRaw.filter(v=>skuInfo(v));
      newUser.departmentScope = deptScopeRaw.filter(v=>DB.departments.includes(v));
      newUser.accountabilityScope = acctScopeRaw.filter(v=>DB.accountability.some(a=>a.name===v));
    }
    DB.users.push(newUser);
    added++;
  });
  if(added){ await saveDB(); }
  if(problems.length){
    showModal(`
      <h3>Import results</h3>
      <p style="font-size:13.5px;color:var(--muted);margin:8px 0 14px;line-height:1.5;">Imported <b>${added}</b> login${added===1?'':'s'}. ${problems.length} row${problems.length===1?'':'s'} skipped — here's why:</p>
      <div style="max-height:300px;overflow-y:auto;font-size:12.5px;line-height:1.8;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fbfbfc;">
        ${problems.slice(0,60).map(m=>`<div>&bull; ${esc(m)}</div>`).join('')}
        ${problems.length>60?'<div class="small-note" style="margin-top:6px;">…and '+(problems.length-60)+' more row'+(problems.length-60===1?'':'s')+'.</div>':''}
      </div>
      <div class="footer-actions"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>
    `);
  } else {
    toast('Imported '+added+' login'+(added===1?'':'s')+'.');
  }
  renderSettings();
}

/* ============================= INIT ============================= */
(async function init(){
  await loadDB();
  const saved = loadUiSession();
  if(saved && saved.session){
    const stillExists = DB.users.find(u=>u.id===saved.session.id);
    if(stillExists){
      portalMode = saved.portalMode || stillExists.portal || 'supplies';
      session = {id:stillExists.id, username:stillExists.username, fullName:stillExists.fullName, role:stillExists.role, portal:stillExists.portal, department:stillExists.department||null, site:stillExists.site||null};
      route = saved.route || (portalMode==='department' ? 'ddashboard' : 'dashboard');
      subroute = saved.subroute || '';
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      renderShell();
      navigate(route, subroute);
      startAutoRefresh();
      return;
    }
    clearUiSession();
  }
  document.getElementById('login-username').focus();
})();
</script>

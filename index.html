<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplies Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003049; --navy-2:#0A4463; --navy-3:#155A80;
  --amber:#F77F00; --amber-light:#FAB266; --amber-dark:#944C00;
  --bg:#F1F3F6; --card:#FFFFFF; --ink:#1B2430; --muted:#6B7686; --faint:#9AA3B0;
  --border:#E2E5EA;
  --success:#2F855A; --success-bg:#E7F5EC; --success-bd:#BFE3CD;
  --danger:#C1443D; --danger-bg:#FBEAEA; --danger-bd:#F1C3C0;
  --warn:#B7791F; --warn-bg:#FDF3DE; --warn-bd:#F2DBA5;
  --info:#2B6CB0; --info-bg:#E8F1FB; --info-bd:#BFDAF3;
  --mono:'JetBrains Mono',monospace; --sans:'Inter',system-ui,sans-serif; --display:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:600;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}
a{color:inherit;}
::placeholder{color:var(--faint);}

/* ---------- Login ---------- */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}
.login-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateY(-16px);}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
.login-brand .login-logo-wrap{width:68px;height:68px;border-radius:50%;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,0.3);}
.login-brand .login-logo{width:114%;height:114%;object-fit:cover;display:block;margin:-7% 0 0 -7%;}
.login-brand-text{width:fit-content;box-sizing:border-box;}
.login-brand .title{font-family:var(--sans);font-weight:700;-webkit-text-stroke:0.5px currentColor;font-size:22px;letter-spacing:-0.01em;color:#EE4D2D;line-height:1.3;white-space:nowrap;}
.login-brand .sub{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#fff;margin-top:3px;}
.login-card{width:380px;box-sizing:border-box;background:rgba(255,255,255,0.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.3);border-radius:14px;padding:30px 32px;box-shadow:0 20px 60px rgba(0,0,0,0.35);}
.login-card h2{font-size:19px;margin-bottom:4px;color:#fff;}
.login-card .lead{color:rgba(255,255,255,0.85);font-size:13px;margin-bottom:22px;}
.login-card .field label{color:rgba(255,255,255,0.85);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fbfbfc;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);background:#fff;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--ink);font-size:13px;font-weight:600;transition:all .12s;}
.btn:hover{border-color:var(--faint);}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);}
#login-screen .btn-primary{background:#EE4D2D;border-color:#EE4D2D;}
#login-screen .btn-primary:hover{background:#d4431f;border-color:#d4431f;}
.btn-primary:hover{background:var(--navy-2);}
.btn-amber{background:var(--amber);color:var(--navy);border-color:var(--amber);}
.btn-amber:hover{background:var(--amber-light);}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd);}
.btn-danger:hover{background:#f7d9d7;}
.btn-success{background:var(--success-bg);color:var(--success);border-color:var(--success-bd);}
.btn-success:hover{background:#d7f0e0;}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
.login-error{background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger);padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}
.login-hint{margin-top:18px;padding-top:16px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--faint);line-height:1.6;}
.login-hint code{background:#f0f1f4;padding:1px 5px;border-radius:4px;font-family:var(--mono);}
.back-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;margin-bottom:16px;}
.back-link:hover{color:var(--ink);}
.back-link-onDark{color:#9AA6BC;}
.back-link-onDark:hover{color:#fff;}

/* ---------- App shell ---------- */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:236px;flex-shrink:0;background:#000;color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;}
.side-brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.side-brand .side-logo-wrap{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.side-brand .side-logo{width:114%;height:114%;object-fit:cover;display:block;margin:-7% 0 0 -7%;}
.side-brand .t1{font-family:var(--display);font-weight:600;font-size:13.5px;color:#fff;line-height:1.25;}
.side-brand .t2{font-size:10px;color:#fff;letter-spacing:0.05em;text-transform:uppercase;}
.nav{flex:1;overflow-y:auto;padding:14px 10px;scrollbar-color:#fff #000;scrollbar-width:thin;}
.nav::-webkit-scrollbar{width:8px;}
.nav::-webkit-scrollbar-track{background:#000;}
.nav::-webkit-scrollbar-thumb{background:#fff;border:2px solid #000;border-radius:8px;}
.nav::-webkit-scrollbar-thumb:hover{background:#fff;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:#fff;padding:14px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:2px;border-left:3px solid transparent;transition:all .12s;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:rgba(247,127,0,0.14);color:#fff;border-left-color:var(--amber);}
.nav-item .ic{width:18px;text-align:center;font-size:14px;flex-shrink:0;}
.nav-item .nav-label{flex:1;min-width:0;}
.nav-group{margin-bottom:2px;}
.nav-parent .nav-chevron{flex-shrink:0;font-size:9px;color:#8891A3;transition:transform .15s ease;}
.nav-parent.open .nav-chevron{transform:rotate(180deg);}
.nav-parent.has-active:not(.open){color:#fff;}
.nav-parent.has-active:not(.open) .ic{color:var(--amber);}
.nav-children{overflow:hidden;padding-left:4px;}
.nav-child{display:flex;align-items:center;padding:8px 12px 8px 32px;border-radius:8px;color:#B7BECC;font-size:12.5px;font-weight:500;cursor:pointer;margin-bottom:1px;border-left:3px solid transparent;transition:all .12s;position:relative;}
.nav-child::before{content:'';position:absolute;left:19px;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.1);}
.nav-child:last-child::before{bottom:50%;}
.nav-child:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-child.active{background:rgba(247,127,0,0.14);color:#fff;border-left-color:var(--amber);font-weight:600;}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);}
.side-user{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.side-user .av{width:30px;height:30px;border-radius:50%;background:var(--navy-3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.side-user .nm{font-size:12.5px;font-weight:600;color:#fff;line-height:1.3;}
.side-user .rl{font-size:10.5px;color:#fff;text-transform:uppercase;letter-spacing:0.04em;}
.logout-btn{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:8px;border-radius:7px;font-size:12px;font-weight:600;}
.logout-btn:hover{background:rgba(255,255,255,0.1);color:#fff;}

.main{margin-left:236px;flex:1;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
.topbar h1{font-size:19px;}
.topbar .crumbs{font-size:12px;color:var(--muted);margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:16px;}
.notif-wrap{position:relative;}
.notif-bell{width:38px;height:38px;border-radius:9px;background:#F5F6F8;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative;color:var(--ink);transition:all .12s;}
.notif-bell:hover{border-color:var(--faint);background:#EFF1F4;}
.notif-dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:20px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--sans);line-height:1;}
.notif-panel{position:absolute;top:46px;right:0;width:340px;max-height:420px;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(16,24,38,0.18);z-index:20;}
.soc-switcher{display:flex;align-items:center;gap:8px;background:#F5F6F8;border:1px solid var(--border);border-radius:9px;padding:6px 8px 6px 12px;}
.soc-switcher label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);white-space:nowrap;}
.soc-switcher select{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;}
.soc-switcher select:focus{outline:none;border-color:var(--amber);}
.notif-panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
.notif-panel-head h4{font-size:13px;font-family:var(--sans);font-weight:700;}
.notif-panel-head .mark-read{font-size:11.5px;color:var(--info);font-weight:600;cursor:pointer;}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid #F0F1F4;cursor:pointer;transition:background .12s;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:#F7F8FA;}
.notif-item.unread{background:#FDF8EF;}
.notif-item .ndot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;margin-top:5px;}
.notif-item.read .ndot{background:transparent;}
.notif-item .ntext{font-size:12.5px;line-height:1.45;color:var(--ink);}
.notif-item .ntime{font-size:10.5px;color:var(--faint);margin-top:3px;}
.notif-empty{padding:30px 14px;text-align:center;color:var(--faint);font-size:12.5px;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.02em;}
.badge-admin{background:#EFE6FB;color:#6B3FA0;}
.badge-staff{background:var(--info-bg);color:var(--info);}
.badge-department{background:var(--success-bg);color:var(--success);}
.badge-hub{background:var(--warn-bg);color:var(--warn);}
.proc-access-wrap{display:flex;flex-wrap:wrap;gap:8px 16px;padding:10px 12px;background:#fbfbfc;border:1px solid var(--border);border-radius:8px;}
.proc-access-item{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink);}
.proc-access-item input{margin:0;}
.proc-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;background:var(--bg);border:1px solid var(--border);color:var(--muted);margin:1px 3px 1px 0;}
.content{padding:24px 28px 60px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:18px;}
.card h3{font-size:14.5px;margin-bottom:2px;}
.card .card-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}

.metric{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.metric .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:8px;}
.metric .val{font-family:var(--display);font-size:28px;font-weight:700;color:var(--ink);}
.metric .sub{font-size:11.5px;color:var(--faint);margin-top:4px;}
.metric.amber{border-color:var(--warn-bd);background:linear-gradient(180deg,#fff, #FFFBF3);}
.metric.amber .val{color:var(--amber-dark);}
.metric.danger .val{color:var(--danger);}
.metric.success .val{color:var(--success);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--border);background:#FAFBFC;}
td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
.tbl-wrap table{border:none;}
.mono{font-family:var(--mono);font-size:12.5px;}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;}
.tag-asset{background:#EFE6FB;color:#6B3FA0;}
.tag-consumable{background:var(--info-bg);color:var(--info);}
.tag-pending{background:var(--warn-bg);color:var(--warn);}
.tag-approved{background:var(--success-bg);color:var(--success);}
.tag-rejected{background:var(--danger-bg);color:var(--danger);}
.tag-preparing{background:var(--info-bg);color:var(--info);}
.tag-pullout{background:#EFE6FB;color:#6B3FA0;}
.tag-issued{background:var(--success-bg);color:var(--success);}
.tag-forrepair{background:var(--warn-bg);color:var(--warn);}
.tag-repaired{background:var(--success-bg);color:var(--success);}
.tag-backload{background:var(--info-bg);color:var(--info);}
.tag-disposal{background:var(--danger-bg);color:var(--danger);}
.tag-low{background:var(--danger-bg);color:var(--danger);}
.tag-ok{background:var(--success-bg);color:var(--success);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--ink);border-bottom-color:var(--amber);}
.tab:hover{color:var(--ink);}

.empty{padding:36px 20px;text-align:center;color:var(--faint);font-size:13px;}
.empty .ic{font-size:26px;margin-bottom:8px;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.autofill{background:#FAFBFC;color:var(--muted);}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--border);}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
.hint{font-size:11.5px;color:var(--faint);margin-top:4px;}
.hint.hint-error{color:var(--danger);}
.hint.hint-active{color:var(--info);}
.scan-divider{height:1px;background:var(--border);margin:18px 0;}
.scan-field input:disabled{background:#FAFBFC;color:var(--muted);}
.alloc-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
.alloc-bar-label{width:150px;flex-shrink:0;color:var(--ink);font-weight:600;}
.alloc-bar-track{flex:1;height:10px;background:#EEF0F3;border-radius:6px;overflow:hidden;}
.alloc-bar-fill{height:100%;border-radius:6px;background:var(--navy-3);}
.alloc-bar-fill.remaining{background:var(--success);}
.alloc-bar-value{width:110px;text-align:right;flex-shrink:0;color:var(--muted);}
.suggest-dropdown{display:none;position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,0.12);max-height:220px;overflow-y:auto;margin-top:2px;}
.suggest-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border-light,#f0f1f3);}
.suggest-item:last-child{border-bottom:none;}
.suggest-item:hover{background:var(--bg);}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.25);z-index:999;display:flex;align-items:center;gap:8px;animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(-8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.line-items{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;}
.li-row{display:grid;grid-template-columns:110px 1fr 90px 90px 34px;gap:10px;padding:9px 10px;align-items:center;border-bottom:1px solid var(--border);font-size:12.5px;}
.li-row:last-child{border-bottom:none;}
.li-head{background:#FAFBFC;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;}
.icon-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);}
.icon-btn:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd);}
.icon-btn-view{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:none;}
.icon-btn-view:hover{background:var(--info-bg);color:var(--info);border-color:var(--info-bd);}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,38,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:14px;padding:24px 26px;width:440px;max-width:100%;max-height:85vh;overflow-y:auto;}
.modal.modal-wide{width:820px;}
@media print{
  body.printing-transmittal > *:not(#modal-root){display:none !important;}
  body.printing-transmittal #modal-root .modal-bg{position:static;background:none;padding:0;display:block;}
  body.printing-transmittal #modal-root .modal{box-shadow:none;border-radius:0;width:100%;max-width:100%;max-height:none;overflow:visible;padding:0;}
  body.printing-transmittal .no-print{display:none !important;}
}
.modal h3{margin-bottom:4px;}
.modal .close{position:absolute;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
.pill:disabled{opacity:.45;cursor:not-allowed;}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
body.app-theme{--sans:'Roboto',sans-serif;--display:'Roboto',sans-serif;--app-font-adjust:0px;font-family:'Roboto',sans-serif;background:#F3F4F6;}
body.app-theme .main,body.app-theme .content{background:#F3F4F6;font-family:'Roboto',sans-serif;}
body.app-theme h1,body.app-theme h2,body.app-theme h3,body.app-theme h4{font-family:'Roboto',sans-serif;}
body.app-theme .topbar h1{font-size:calc(18px + var(--app-font-adjust));}
body.app-theme .topbar .crumbs{font-size:calc(11px + var(--app-font-adjust));}
body.app-theme .nav-item{font-size:calc(12px + var(--app-font-adjust));}
body.app-theme .content{font-size:calc(12px + var(--app-font-adjust));}
body.app-theme .content>.tabs{border-bottom-color:var(--border);}
body.app-theme .content>.tabs .tab{color:var(--muted);font-size:calc(12px + var(--app-font-adjust))!important;}
body.app-theme .content>.tabs .tab.active{color:#D0011B;border-bottom-color:#D0011B;}
body.app-theme .content>.tabs .tab:hover{color:var(--ink);}
body.app-theme .card,body.app-theme .metric,body.app-theme .modal,
body.app-theme .tbl-wrap,body.app-theme .line-items,body.app-theme .proc-access-wrap,
body.app-theme .suggest-dropdown,body.app-theme .notif-panel{
  background:#fff;border-color:#E1E5EA;box-shadow:0 2px 9px rgba(17,24,39,.08);
}
body.app-theme .metric.amber{background:#fff;}
body.app-theme .tbl-wrap table{background:#fff;}
body.app-theme th,body.app-theme .li-head{background:#F3F4F6;}
body.app-theme input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]):not(:disabled),
body.app-theme select:not(:disabled),body.app-theme textarea:not(:disabled){
  background:#fff;border-color:#D1D5DB;
}
body.app-theme input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]):not(:disabled):focus,
body.app-theme select:not(:disabled):focus,body.app-theme textarea:not(:disabled):focus{
  background:#fff;border-color:#D0011B;box-shadow:0 0 0 2px rgba(208,1,27,.12);outline:none;
}
body.app-theme input:disabled,body.app-theme select:disabled,body.app-theme textarea:disabled{background:#fff;border-color:#E6C9CD;color:var(--muted);}
body.app-theme input.autofill,body.app-theme select.autofill,body.app-theme textarea.autofill,body.app-theme .autofill{background:#F1F3F6!important;border-color:#D9DEE5;color:var(--muted);}
body.app-theme .content table,body.app-theme .content button,
body.app-theme .content input,body.app-theme .content select,body.app-theme .content textarea,
body.app-theme .modal table,body.app-theme .modal button,
body.app-theme .modal input,body.app-theme .modal select,body.app-theme .modal textarea{font-size:calc(12px + var(--app-font-adjust))!important;}
body.app-theme .content .mono,body.app-theme .content .empty,body.app-theme .content .alloc-bar-row,
body.app-theme .content .alloc-bar-label,body.app-theme .content .alloc-bar-value,
body.app-theme .content .metric .sub,body.app-theme .content .kv,body.app-theme .content .li-row,
body.app-theme .content .icon-btn,body.app-theme .content .icon-btn-view,body.app-theme .content .stat-inline,
body.app-theme .modal .mono{font-size:calc(12px + var(--app-font-adjust))!important;}
body.app-theme .content h3,body.app-theme .modal h3{font-size:calc(13.5px + var(--app-font-adjust))!important;}
body.app-theme .content th,body.app-theme .content .card-sub:not(.mono),body.app-theme .content .hint,
body.app-theme .content .small-note,body.app-theme .content .field label,body.app-theme .content .section-title,
body.app-theme .content .tag,body.app-theme .content .badge,body.app-theme .content .metric .lbl,
body.app-theme .modal .field label,body.app-theme .modal .hint,body.app-theme .modal .small-note{
  font-size:calc(10.5px + var(--app-font-adjust))!important;
}
body.app-theme .content .metric .val{font-size:calc(24px + var(--app-font-adjust))!important;}
body.app-theme #topbar-right{display:flex;align-items:center;gap:10px;}
body.app-theme .content .card-sub:not(.mono),body.app-theme .modal .card-sub:not(.mono),
body.app-theme .content .issue-hint,body.app-theme .modal .issue-hint,
body.app-theme .content .empty .small-note,
body.app-theme .content .hint:empty,body.app-theme .modal .hint:empty,
body.app-theme .content .hint:not(.hint-error):not(.hint-active):not([id]),
body.app-theme .modal .hint:not(.hint-error):not(.hint-active):not([id]):not(#pda-return-employee-details .hint):not(.pda-return-modal .hint){display:none!important;}
.app-font-control{display:flex;align-items:center;gap:3px;white-space:nowrap;}
.app-font-control .font-size-text{color:#111;font-size:9px;font-weight:600;}
.app-font-control .btn{background:#111;color:#fff;border-color:#111;border-radius:5px;padding:3px 5px;font-size:9px;line-height:1.1;box-shadow:none;}
.app-font-control .btn:hover{background:#fff;color:#111;border-color:#111;}
.app-font-control .btn:focus-visible{outline:2px solid #111;outline-offset:1px;}
.pda-return-modal #pda-return-employee-details .hint{display:block;padding:10px 12px;border:1px solid #E1E5EA;border-radius:8px;background:#fff;box-shadow:0 2px 9px rgba(17,24,39,.08);}
.pda-return-modal .pill.active,.pda-return-modal .btn-primary,.pda-return-mismatch .btn-primary{background:#D0011B;border-color:#D0011B;color:#fff;}
@media(max-width:900px){
  body.app-theme .topbar{align-items:flex-start;gap:10px;flex-wrap:wrap;}
  body.app-theme .topbar-actions{flex-wrap:wrap;}
  .app-font-control .font-size-text{display:none;}
}
.stat-inline{display:flex;gap:8px;align-items:baseline;}
.select-tag select{appearance:none;}
.footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:600;}
.progress{height:6px;background:#EEF0F3;border-radius:3px;overflow:hidden;}
.progress > div{height:100%;background:var(--amber);}
.searchbar{display:flex;gap:10px;margin-bottom:14px;}
.searchbar input{flex:1;}
.small-note{font-size:11.5px;color:var(--faint);}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.list-head h3{margin-bottom:0;}
.dl-btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.status-stack{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
/* ---------- PM checklist / weekly count ---------- */
.pm-item{padding:12px 0;border-bottom:1px solid var(--border);}
.pm-item:last-child{border-bottom:none;}
.pm-item-text{font-size:13.5px;font-weight:500;margin-bottom:8px;line-height:1.4;}
.pm-res{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.pm-opt{cursor:pointer;}
.pm-opt input{position:absolute;opacity:0;pointer-events:none;}
.pm-opt span{display:inline-block;padding:5px 16px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);background:#fff;transition:all .12s;}
.pm-opt:hover span{border-color:var(--faint);}
.pm-opt.pass input:checked + span{background:var(--success-bg);border-color:var(--success-bd);color:var(--success);}
.pm-opt.fail input:checked + span{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger);}
.pm-opt.na input:checked + span{background:#DDE2E8;border-color:#C3CAD3;color:var(--ink);}
.pm-opt input:focus-visible + span{outline:2px solid var(--amber);outline-offset:2px;}
.pmcl-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fbfbfc;font-size:13.5px;}
.pmcl-n{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>

<!-- SheetJS: lets CSV/Excel import (SKU, Department, Supplier, Accountability,
     Logins, Employees) also accept .xlsx/.xls files, including ones with
     formulas — cells are read using their last-calculated value, not the
     formula text. If this fails to load (e.g. offline), CSV import still
     works; only .xlsx/.xls uploads are affected. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================= STATE / STORAGE ============================= */
/* Shared cloud storage: this file is hosted as a plain static page (not
   inside the Claude Artifact viewer), so there's no built-in window.storage
   backend. Without one, saved data — including newly created user accounts —
   only lived in the current browser's localStorage, which meant a user who
   signed up on one device/browser was completely invisible on any other
   device, even with the correct username and password.

   This block points window.storage at Firebase Firestore (project:
   spx-soc-asset-management) instead, so the same get/set/delete/list calls
   the rest of the app already makes now read/write one shared document that
   every device and browser sees. If Firebase fails to load (offline, ad
   blocker, blocked domain), it falls back to the old localStorage-only
   behavior further below so the app still works solo rather than breaking. */
if(!window.storage){
  const firebaseConfig = {
    apiKey: "AIzaSyC9NknHkluFaWdqQnZWW5--HreG-w7fTZ8",
    authDomain: "spx-soc-asset-management.firebaseapp.com",
    projectId: "spx-soc-asset-management",
    storageBucket: "spx-soc-asset-management.firebasestorage.app",
    messagingSenderId: "261426364010",
    appId: "1:261426364010:web:e0dc8203a4a07c98099413"
  };

  let fsDB = null;
  try{
    if(typeof firebase !== 'undefined'){
      const fbApp = firebase.initializeApp(firebaseConfig);
      fsDB = firebase.firestore(fbApp);
    }
  }catch(e){
    console.warn('Firebase init failed, will fall back to local-only storage:', e);
  }

  if(fsDB){
    const COLLECTION = 'sms_erp_storage';
    const STORAGE_VERSION = 'pilot_v2';
    const docRef = (key, shared) => fsDB.collection(COLLECTION).doc((shared?'shared__':'local__')+STORAGE_VERSION+'__'+key);
    const legacyDocRef = (key, shared) => fsDB.collection(COLLECTION).doc((shared?'shared__':'local__')+key);
    const recordRef = (section, id) => fsDB.collection(STORAGE_VERSION+'_'+section).doc(id);
    const recordChunkRef = (section, id, index) => recordRef(section,id).collection('__chunks').doc(String(index));
    /* Firestore limits every document to 1 MiB.  Employees has already grown
       to the edge of that limit, and request records can contain signed
       transmittals (base64) that grow just as quickly.  Keep the storage API
       unchanged for the rest of the application, but transparently store a
       large value as several sub-documents.  The primary document contains
       only this small manifest; old single-value documents remain readable
       and are converted on their next save. */
    const CHUNK_BYTES = 240 * 1024;
    const utf8Bytes = value => new TextEncoder().encode(value).length;
    const chunkKey = (key, index) => key+'__chunk__'+index;
    function splitValue(value){
      if(utf8Bytes(value) <= CHUNK_BYTES) return [value];
      const chunks = [];
      let start = 0;

           largest safe character boundary instead of assuming one byte per
           character (names and notes may contain non-ASCII text). */
        while(low <= high){

          if(utf8Bytes(value.slice(start, middle)) <= CHUNK_BYTES){ end = middle; low = middle + 1; }

               last silently wins and erases anything another admin added
               since this client's last read — no error, just missing data.
               A transaction (not a get-then-set check) is required to close
               the race, since a plain check-then-write still leaves a gap
               between the check and the write. */
            let conflictValue;
            await fsDB.runTransaction(async tx=>{
              const snap = await tx.get(docRef(key, shared));
              const cur = snap.exists ? snap.data().value : null;

         one user action (e.g. filing a request bumps both DB.requests and
         DB.counters), and that has to stay all-or-nothing exactly like the

          const pendingWrites = []; // {ref, data, size} that didn't fit in the transaction
          const pendingDeletes = []; // refs that didn't fit in the transaction

              if(!Number.isInteger(count) || count < 0) throw new Error('Invalid Firestore chunk manifest for '+entries[i].key+'.');

              const data = snap.exists ? snap.data() : null;
              const count = data && data.chunked ? data.chunks : 0;

                ? oldChunkSnaps[i].map(part=>{

            });
            const localRecordConflicts = {};
            recordSnaps.forEach((snap, i)=>{
              const data = snap.exists ? snap.data() : null;
              const cur = !snap.exists ? null : (data.chunked
                ? oldRecordChunkSnaps[i].map(part=>{

                    return part.data().value;
                  }).join('')

            });

              conflicts = localConflicts;
              recordConflicts = localRecordConflicts;
              return;
            }
            const updatedAt = Date.now();
            let budget = MAX_GROUP_BYTES;

            // value, or one chunk) is by construction <= CHUNK_BYTES
            // (240KB, see splitValue), so it always fits in a fresh budget -
            // no need to special-case "doesn't fit even alone".
            const spend = (ref, data, size)=>{
              if(size<=budget){ tx.set(ref, data); budget -= size; }
              else pendingWrites.push({ref, data, size});
            };

              if(budget>0){ tx.delete(ref); budget -= 1; }
              else pendingDeletes.push(ref);
            };

              const chunks = splitValue(entry.value);
              if(chunks.length === 1){
                spend(refs[i], {value: entry.value, updatedAt}, utf8Bytes(entry.value));
                oldChunkSnaps[i].forEach((part, n)=>spendDelete(docRef(chunkKey(entry.key, n), shared)));

                tx.set(refs[i], {chunked:true, chunks:chunks.length, updatedAt}); // manifest: always transactional, claims this update

                oldChunkSnaps[i].slice(chunks.length).forEach((part, n)=>spendDelete(docRef(chunkKey(entry.key, chunks.length+n), shared)));

            });

              if(entry.value===null){
                tx.delete(recordRefs[i]);

                return;
              }

              const chunks = splitValue(entry.value);
              const data = {
                status:String(record.status||''),
                archived:recordIsArchived(entry.section,record),
                updatedAt
              };
              if(chunks.length===1){
                spend(recordRefs[i], {...data, value:entry.value}, utf8Bytes(entry.value));
                oldRecordChunkSnaps[i].forEach((part,n)=>spendDelete(recordChunkRef(entry.section,entry.id,n)));

             transaction would already see the new manifest and correctly
             conflict against it, rather than racing past this update. */

              const op = ops[offset];

        }catch(e){ console.error('storage.setMulti failed:', e); throw e; }
      },

}

/* Last-resort fallback: only used if Firebase couldn't be reached above.
   Per-browser only — does NOT sync across devices. */
if(!window.storage){
  const LS_PREFIX = 'sms_erp_storage__';
  window.storage = {
    async get(key, shared){
      try{
        const raw = localStorage.getItem(LS_PREFIX+key);
        if(raw===null) return null;
        return {key, value: raw, shared: !!shared};
      }catch(e){ return null; }
    },
    async set(key, value, shared){
      try{
        localStorage.setItem(LS_PREFIX+key, value);
        return {key, value, shared: !!shared};
      }catch(e){ return null; }
    },
    /* No real conflicts possible against a single browser's own localStorage,
       so this just writes every entry — kept for interface parity with the
       Firestore-backed setMulti() so loadDB()/saveDB() don't need to branch
       on which backend is active. */
    async setMulti(entries, shared){
      try{
        entries.forEach(e=>{ localStorage.setItem(LS_PREFIX+e.key, e.value); });
        return {ok:true, updatedAt: Date.now()};
      }catch(e){ return null; }
    },
    async delete(key, shared){
      try{
        localStorage.removeItem(LS_PREFIX+key);
        return {key, deleted: true, shared: !!shared};
      }catch(e){ return null; }
    },
    async list(prefix, shared){
      try{
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(LS_PREFIX)){
            const short = k.slice(LS_PREFIX.length);
            if(!prefix || short.startsWith(prefix)) keys.push(short);
          }
        }
        return {keys, prefix, shared: !!shared};
      }catch(e){ return null; }
    }
  };
}

function recordIsArchived(section, record){

function recordSnapshot(records){

function recordChanges(section){

function issuanceMetricDate(record){
  const value = String(record.date||record.dateIssued||'').slice(0,10);

function changeIssuanceMetricBucket(bucket, record, direction){
  if(!record || !record.sku) return;
  const sku = String(record.sku);
  const qty = Number(record.qty||0) * direction;
  if(!qty) return;
  const metric = bucket[sku] || {totalQty:0, dates:{}};
  const day = issuanceMetricDate(record);
  metric.totalQty = Number(metric.totalQty||0) + qty;
  metric.dates[day] = Number(metric.dates[day]||0) + qty;
  if(metric.dates[day]===0) delete metric.dates[day];
  const dates = Object.keys(metric.dates).filter(key=>metric.dates[key]>0 && key!=='unknown').sort();
  if(metric.totalQty<=0 || !Object.keys(metric.dates).length){ delete bucket[sku]; return; }

  bucket[sku] = metric;
}
function changeIssuanceMetric(metrics, record, direction){
  if(!metrics.all) metrics.all = {};
  if(!metrics.bySoc) metrics.bySoc = {};
  const soc = String((record&&record.soc)||'');
  if(!metrics.bySoc[soc]) metrics.bySoc[soc] = {};
  changeIssuanceMetricBucket(metrics.all,record,direction);
  changeIssuanceMetricBucket(metrics.bySoc[soc],record,direction);
  if(!Object.keys(metrics.bySoc[soc]).length) delete metrics.bySoc[soc];
}

function refreshIssuanceMetrics(records){

  let base = {};
  try{ base = lastKnownSnapshot.issuanceMetrics ? JSON.parse(lastKnownSnapshot.issuanceMetrics) : {}; }
  catch(e){ base = {}; }
  issuanceRecords.forEach(record=>{
    if(record.expectedPrevious!==null) changeIssuanceMetric(base,JSON.parse(record.expectedPrevious),-1);
    if(record.value!==null) changeIssuanceMetric(base,JSON.parse(record.value),1);
  });
  DB.issuanceMetrics = base;
}

function migrateDB(){

function isRecordSection(key){ return RECORD_SECTION_KEYS.includes(key); }
function normalizeRecordSection(key, records){
  DB[key] = Array.isArray(records) ? records : [];
  recordSnapshots[key] = recordSnapshot(DB[key]);
  loadedRecordSections.add(key);
}
async function readLegacyDatabase(){
  const legacy = await Promise.all(SECTION_KEYS.map(key=>window.storage.getLegacy('section__'+key,true)));
  const old = legacy.some(Boolean) ? null : await window.storage.getLegacy(STORE_KEY,true);
  if(!legacy.some(Boolean) && !old) return null;
  const oldDB = old ? JSON.parse(old.value) : {};
  const defaults = defaultDB();
  const data = {};
  SECTION_KEYS.forEach((key,index)=>{
    data[key] = legacy[index] ? JSON.parse(legacy[index].value)
      : (oldDB[key]!==undefined ? oldDB[key] : defaults[key]);
  });
  return data;
}
async function ensurePilotMigration(){
  if(!window.storage || !window.storage.supportsRecordCollections) return false;
  let state = await window.storage.getMigrationState();
  if(state && state.state==='complete') return true;
  const migrationLeaseMs = 10*60*1000;
  if(state && state.state==='migrating' && Date.now()-Number(state.startedAt||0)<migrationLeaseMs){
    for(let attempt=0; attempt<30; attempt++){
      await new Promise(resolve=>setTimeout(resolve,1000));
      state = await window.storage.getMigrationState();
      if(state && state.state==='complete') return true;
      if(!state || state.state!=='migrating' || Date.now()-Number(state.startedAt||0)>=migrationLeaseMs) break;
    }
    if(state && state.state==='migrating' && Date.now()-Number(state.startedAt||0)<migrationLeaseMs) throw new Error('Legacy data migration is still in progress. Reload shortly.');
  }
  const legacy = await readLegacyDatabase();
  if(!legacy) return false;
  const owner = 'tab_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  const claim = await window.storage.claimMigration(owner);
  if(claim==='complete') return true;
  if(claim!=='owner'){
    for(let attempt=0; attempt<30; attempt++){
      await new Promise(resolve=>setTimeout(resolve,1000));
      state = await window.storage.getMigrationState();
      if(state && state.state==='complete') return true;
    }
    throw new Error('Legacy data migration is still in progress. Reload shortly.');
  }
  const sections = SECTION_KEYS.filter(key=>!isRecordSection(key)).map(key=>({
    key:'section__'+key, value:JSON.stringify(legacy[key])
  }));
  const records = RECORD_SECTION_KEYS.flatMap(section=>(legacy[section]||[]).map(record=>{
    if(!record || !record.id) throw new Error('Cannot migrate a '+section+' record without an id.');
    const value = JSON.stringify(record);
    if(new TextEncoder().encode(value).length>900*1024) throw new Error(section+' '+record.id+' is too large for a Firestore record document.');
    return {section,id:record.id,value};
  }));
  await window.storage.finishMigration(owner, sections, records);
  return true;
}
async function ensureRecordSchema(){
  return !!(window.storage && window.storage.supportsRecordCollections);
}
async function loadRecordSection(key, includeArchived){
  normalizeRecordSection(key, await window.storage.getRecords(key, !!includeArchived));
  if(includeArchived) loadedRecordArchives.add(key);
}
async function loadRecordChanges(key, ids){
  if(!ids || !ids.length) return loadRecordSection(key, loadedRecordArchives.has(key));
  const byId = new Map((DB[key]||[]).map(record=>[record.id,record]));
  (await window.storage.getRecordChanges(key, ids)).forEach(change=>{
    if(change.value===null){ byId.delete(change.id); return; }
    const record = JSON.parse(change.value);
    if(recordIsArchived(key,record) && !loadedRecordArchives.has(key)) byId.delete(record.id);
    else byId.set(record.id,record);
  });
  normalizeRecordSection(key, Array.from(byId.values()));
}
async function loadSections(keys){
  const selected = [...new Set(keys)];
  const results = await Promise.all(selected.map(key=>window.storage.get('section__'+key, true)));
  const data = {}, snap = {};
  let anyExists = false;
  selected.forEach((key,index)=>{
    const result = results[index];
    if(result){ anyExists = true; data[key] = JSON.parse(result.value); snap[key] = result.value; }
    else { data[key] = null; snap[key] = null; }
  });
  return {anyExists, data, snap};
}
async function hydrateSections(keys){
  const wanted = [...new Set(keys.filter(key=>!isRecordSection(key) && !loadedSections.has(key)))];
  if(!wanted.length) return;
  const sections = await loadSections(wanted);
  const defaults = defaultDB();
  const missing = [];
  wanted.forEach(key=>{
    if(sections.data[key]!==null){
      DB[key] = sections.data[key];
      lastKnownSnapshot[key] = sections.snap[key];
    }else{
      DB[key] = defaults[key];
      lastKnownSnapshot[key] = null;
      missing.push(key);
    }
    loadedSections.add(key);
  });
  migrateDB();
  if(missing.length) await saveDB();
}
function routeArchiveSections(routeKey, routeSub){
  if((routeKey==='request' || routeKey==='drequest') && routeSub!=='list') return [];
  if(routeKey==='dapprovals' && routeSub!=='history') return [];
  return ARCHIVE_RECORD_SECTIONS[routeKey] || [];
}
async function ensureRouteData(routeKey, routeSub){
  await hydrateSections([...CORE_SECTION_KEYS, ...(ROUTE_SECTIONS[routeKey]||[])]);
  if(recordModeActive){
    const records = ROUTE_RECORD_SECTIONS[routeKey] || [];
    await Promise.all(records.filter(key=>!loadedRecordSections.has(key)).map(key=>loadRecordSection(key,false)));
    await Promise.all(routeArchiveSections(routeKey,routeSub).filter(key=>!loadedRecordArchives.has(key)).map(key=>loadRecordSection(key,true)));
  }
  await syncOpsIdSheetOnce();
}

/* Retries once before giving up: a transient read error (a momentary
   network blip, or a security-rules propagation delay right after Firestore
   is first set up) must never be treated the same as "no data exists yet" —
   doing so used to fall through to defaultDB() and immediately overwrite the
   shared document, silently wiping every real user/record. Only an actually
   empty set of sections (no error, nothing there yet) seeds defaults.
   IMPORTANT: this function (and saveDB() below) has already been reverted
   back to an unsafe version once by a direct edit that started from an
   older local copy of this file instead of `git pull`-ing first. If you're
   about to replace this file wholesale, pull latest first — overwriting
   this logic silently re-enables real data loss for every user.

   The app state used to live in one Firestore document. That hit Firestore's
   1 MiB per-document hard limit once requests/returns/pdas history
   accumulated (they alone were ~87% of it) — every save started failing
   outright, size limit or not, conflict or not. It's now one document per
   top-level DB section instead, each with its own 1 MiB budget. */
async function loadDB(){
  let sections, lastErr;
  for(let attempt=0; attempt<2; attempt++){
    try{
      recordModeActive = await ensureRecordSchema();
      if(recordModeActive) await ensurePilotMigration();
      const initialKeys = recordModeActive ? CORE_SECTION_KEYS : [...CORE_SECTION_KEYS, ...RECORD_SECTION_KEYS];
      sections = await loadSections(initialKeys);
      lastErr = null;
      break;
    }catch(e){
      lastErr = e;
      if(attempt===0) await new Promise(r=>setTimeout(r,1000));
    }
  }
  if(lastErr){
    console.error('loadDB: could not reach shared storage, using local defaults without overwriting shared data', lastErr);
    DB = defaultDB();
    lastKnownSnapshot = null;
    toast('Could not reach shared storage — showing local defaults. Reload once connection is back.');
    return;
  }
  DB = defaultDB();
  lastKnownSnapshot = {};
  sectionVersions = {};
  loadedSections = new Set();
  loadedRecordSections = new Set();
  loadedRecordArchives = new Set();
  recordSnapshots = {};
  recordVersions = {};
  if(!sections.anyExists){
    migrateDB();
    if(!recordModeActive || typeof window.storage.seedSections!=='function'){
      loadedSections = new Set(SECTION_KEYS);
      Object.keys(DB).forEach(key=>{ lastKnownSnapshot[key] = null; });
      await saveDB();
      return;
    }
    const seedEntries = SECTION_KEYS.filter(key=>!isRecordSection(key)).map(key=>({
      key:'section__'+key, value:JSON.stringify(DB[key])
    }));
    if(!await window.storage.seedSections(seedEntries, true)) return loadDB();
    loadedSections = new Set(SECTION_KEYS.filter(key=>!isRecordSection(key)));
    RECORD_SECTION_KEYS.forEach(key=>normalizeRecordSection(key, DB[key]));
    Object.keys(DB).forEach(key=>{ if(!isRecordSection(key)) lastKnownSnapshot[key] = JSON.stringify(DB[key]); });
    return;
  }
  const selected = Object.keys(sections.data);
  selected.forEach(key=>{
    if(sections.data[key]!==null){
      DB[key] = sections.data[key];
      lastKnownSnapshot[key] = sections.snap[key];
    } else lastKnownSnapshot[key] = null;
    loadedSections.add(key);
  });
  migrateDB();
  if(selected.some(key=>sections.data[key]===null)) await saveDB();
}

let saving = false;
/* Per-section, not a single string, since the app state is now split across
   one Firestore document per top-level DB field (see setMulti()'s comment).
   {sectionKey: rawJsonStringOrNull}. null after a failed initial load. */
let lastKnownSnapshot = null;
let sectionVersions = {};
/* Set true around any action that reads a file (await) before saving to keep
   a visibility refresh from replacing an in-progress edit. */
let actionInFlight = false;
/* Applies a conflict response's per-section current values back onto DB and
   lastKnownSnapshot. Shared between saveDB() and saveDBWithRetry() so the
   two can't drift out of sync on how a conflict gets resolved. */
function applySectionConflicts(conflicts){
  Object.keys(conflicts).forEach(fullKey=>{
    const k = fullKey.replace(/^section__/, '');
    const cur = conflicts[fullKey];
    DB[k] = cur!==null ? JSON.parse(cur) : defaultDB()[k];
    lastKnownSnapshot[k] = cur;
  });
  migrateDB();
}
function applyRecordConflicts(conflicts){
  Object.keys(conflicts||{}).forEach(key=>{
    const split = key.indexOf('__');
    const section = key.slice(0,split);
    const id = key.slice(split+2);
    const value = conflicts[key];
    const records = new Map((DB[section]||[]).map(record=>[record.id,record]));
    if(value===null) records.delete(id);
    else {
      const record = JSON.parse(value);
      if(recordIsArchived(section,record) && !loadedRecordArchives.has(section)) records.delete(id);
      else records.set(id,record);
    }
    DB[section] = Array.from(records.values());
    if(!recordSnapshots[section]) recordSnapshots[section] = {};
    if(value===null) delete recordSnapshots[section][id];
    else recordSnapshots[section][id] = value;
  });
  migrateDB();
}
function changedSections(){
  return [...loadedSections].filter(key=>JSON.stringify(DB[key]) !== lastKnownSnapshot[key]);
}
function changedRecords(){
  return recordModeActive ? RECORD_SECTION_KEYS.flatMap(recordChanges) : [];
}
function markSaved(changed, records, updatedAt){
  changed.forEach(key=>{
    lastKnownSnapshot[key] = JSON.stringify(DB[key]);
    sectionVersions['section__'+key] = updatedAt;
  });
  records.forEach(record=>{
    if(!recordSnapshots[record.section]) recordSnapshots[record.section] = {};
    if(record.value===null) delete recordSnapshots[record.section][record.id];
    else recordSnapshots[record.section][record.id] = record.value;
    recordVersions[record.section] = updatedAt;
  });
}
function showSharedSaveError(error){
  const code=String(error&&error.code||'unknown').replace(/^firestore\//,'');
  const detail=String(error&&error.message||'No database error details were returned.');
  const guidance={
    'resource-exhausted':'The database quota or capacity has been exceeded. Check Firebase usage and billing.',
    'permission-denied':'The database rejected this write. Check the deployed Firestore permissions.',
    'unauthenticated':'The database requires authentication. Check the Firebase sign-in configuration.',
    'unavailable':'The database is temporarily unreachable. Check the connection and retry.',
    'deadline-exceeded':'The database request timed out. Retry once the connection is stable.',
    'aborted':'Another save interrupted this transaction. Reload the latest data before retrying.',
    'failed-precondition':'The database rejected the transaction requirements.',
    'invalid-argument':'The database rejected the submitted data.'
  }[code]||'The database could not complete this save.';
  showModal('<h3>Save failed</h3><p>'+esc(guidance)+'</p><p class="small-note">The save was not confirmed. Do not assume this change has been stored.</p><div class="field"><label>Error code</label><div class="mono">'+esc(code)+'</div></div><div class="field"><label>Database details</label><div style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;">'+esc(detail)+'</div></div><div class="footer-actions"><button class="btn" onclick="closeModal()">Close</button></div>');
  toast('Save failed ('+code+'). See the database error details.');
}
async function saveDB(){
  if(!lastKnownSnapshot){showSharedSaveError({code:'unavailable',message:'Shared data has not loaded. Reload the app before saving.'});return false;}
  try{
    /* Only the sections that actually changed get written — both to avoid
       needless Firestore writes, and because an unchanged section should
       never be able to conflict (nothing to lose by not touching it). */
    const records = changedRecords();
    refreshIssuanceMetrics(records);
    const changed = changedSections();
    if(!changed.length && !records.length) return true;
    const entries = changed.map(key=>({key:'section__'+key, value:JSON.stringify(DB[key]), expectedPrevious:lastKnownSnapshot[key]}));
    const res = await window.storage.setMulti(entries, true, records);
    /* window.storage.setMulti swallows its own Firestore errors internally
       and returns null instead of throwing — so a null result has to be
       treated as a failed save here, not fall through to the success path
       below. Before this check existed (on the old single-document save),
       a null result silently marked lastKnownSnapshot as if the write had
       landed: whatever was just added kept showing on screen for the rest
       of the session, then quietly vanished on the next fresh load. */
    if(!res){
      showSharedSaveError({code:'unknown',message:'Storage returned no confirmation for this save.'});
      return false;
    }
    if(res.conflict){
      applySectionConflicts(res.conflicts);
      applyRecordConflicts(res.recordConflicts);
      navigate(route, subroute);
      toast('Someone else just saved changes here — your last action was NOT saved. Please redo it.');
      logAudit('save_conflict_rejected', {});
      return false;
    }
    markSaved(changed,records,res.updatedAt);
    return true;
  }catch(e){
    console.error('Storage error', e);
    showSharedSaveError(e);
    return false;
  }
}
/* Same shared save as saveDB(), but resilient to a *benign* self-collision:
   two saves fired back-to-back from this same tab (e.g. adding several
   employees in quick succession) can race, since the second save's
   expectedPrevious was captured before the first one's write committed.
   Plain saveDB() treats that exactly like a real conflict with another
   admin — it discards the in-memory change and shows "your last action was
   NOT saved," which silently drops the second edit. Here, instead of giving
   up on the first conflict, we pull the fresh sections, re-apply the
   caller's intended change on top of them via mutate(), and retry — only
   falling back to the same user-facing conflict message (and giving up) if
   that keeps failing across every attempt, which by then is far more likely
   a genuine concurrent edit from someone else.
   actionInFlight blocks the 4s auto-refresh poll from swapping out DB out
   from under us for the same reason it already does around other
   multi-step saves (see the flag's definition above). */
async function saveDBWithRetry(mutate, maxAttempts){
  if(!lastKnownSnapshot){showSharedSaveError({code:'unavailable',message:'Shared data has not loaded. Reload the app before saving.'});return false;}
  maxAttempts = maxAttempts || 4;
  actionInFlight = true;
  let mutationApplied = false;
  try{
    for(let attempt=0; attempt<maxAttempts; attempt++){
      try{
        let records = changedRecords();
        refreshIssuanceMetrics(records);
        let changed = changedSections();
        /* Some actions pass their change only as a replay callback. Apply it
           before the first diff check so an untouched DB is never reported
           as a successful save. Other callers already apply their change
           before calling this helper, so they proceed directly to saving. */
        if(!changed.length && !records.length && !mutationApplied){
          mutate();
          mutationApplied = true;
          records = changedRecords();
          refreshIssuanceMetrics(records);
          changed = changedSections();
        }
        if(!changed.length && !records.length) return true;
        const entries = changed.map(key=>({key:'section__'+key, value:JSON.stringify(DB[key]), expectedPrevious:lastKnownSnapshot[key]}));
        const res = await window.storage.setMulti(entries, true, records);
        /* Same gap as in saveDB(): a null result means the write never
           reached Firestore and must not be reported as a success. */
        if(!res){
          showSharedSaveError({code:'unknown',message:'Storage returned no confirmation for this save.'});
          return false;
        }
        if(res.conflict){
          const conflictKeys = new Set(Object.keys(res.conflicts||{}).map(key=>key.replace(/^section__/, '')));
          applySectionConflicts(res.conflicts||{});
          applyRecordConflicts(res.recordConflicts||{});
          /* The transaction wrote nothing. Restore every attempted section
             that did not conflict to its last known shared value as well,
             then replay the action once on that consistent base. */
          changed.forEach(key=>{
            if(conflictKeys.has(key)) return;
            const snapshot = lastKnownSnapshot[key];
            DB[key] = snapshot!==null ? JSON.parse(snapshot) : defaultDB()[key];
          });
          migrateDB();
          mutate();
          mutationApplied = true;
          continue;
        }
        markSaved(changed,records,res.updatedAt);
        return true;
      }catch(e){
        console.error('Storage error', e);
        showSharedSaveError(e);
        return false;
      }
    }
    navigate(route, subroute);
    toast('Someone else just saved changes here — your last action was NOT saved. Please redo it.');
    logAudit('save_conflict_rejected', {});
    return false;
  } finally {
    actionInFlight = false;
  }
}

/* Google Sheets publishes a staging document when its Ops ID tab changes.
   The app merges those rows into the shared employee directory using the same
   compare-and-swap save as manual directory edits, so every open browser sees
   the update through the normal section heartbeat. */
function mergeOpsIdSheetRows(rows){
  const merged = Array.isArray(DB.employees) ? DB.employees.slice() : [];
  const indexById = new Map();
  merged.forEach((employee, index)=>{
    const key = String(employee.opsId||'').trim().toUpperCase();
    if(key && !indexById.has(key)) indexById.set(key, index);
  });
  let changed = false;
  rows.forEach(row=>{
    const key = row.opsId.toUpperCase();
    const index = indexById.get(key);
    if(index===undefined){
      indexById.set(key, merged.length);
      merged.push(row);
      changed = true;
      return;
    }
    const next = {...merged[index], ...row};
    if(JSON.stringify(next)!==JSON.stringify(merged[index])){
      merged[index] = next;
      changed = true;
    }
  });
  if(changed) DB.employees = merged;
  return changed;
}
function setOpsIdSheetSyncStatus(message){
  opsIdSheetStatus = message;
  const el = document.getElementById('opsid-sheet-sync-status');
  if(el) el.textContent = message;
}
async function applyOpsIdSheetSnapshot(snapshot){
  if(!snapshot || typeof snapshot.value!=='string'){
    setOpsIdSheetSyncStatus('Waiting for the first sync from the Google Sheet.');
    return;
  }
  if(!lastKnownSnapshot){
    setOpsIdSheetSyncStatus('Waiting for the Supplies database connection.');
    return;
  }
  if(snapshot.value===opsIdSheetLastPayload) return;
  let sourceRows;
  try{
    const raw = JSON.parse(snapshot.value);
    if(!Array.isArray(raw)) throw new Error('Expected an array of employees.');
    const byId = new Map();
    raw.forEach(employee=>{
      const opsId = String(employee && employee.opsId || '').trim();
      const fullName = String(employee && employee.fullName || '').trim();
      if(!opsId || !fullName) return;
      byId.set(opsId.toUpperCase(), {
        opsId,
        fullName,
        agency: String(employee.agency||'').trim(),
        department: String(employee.department||'').trim()
      });
    });
    sourceRows = Array.from(byId.values());
  }catch(e){
    console.error('Invalid Ops ID sheet sync payload:', e);
    setOpsIdSheetSyncStatus('The Google Sheet sync data could not be read. Check the sheet headers and try a resync.');
    return;
  }
  if(!sourceRows.length){
    opsIdSheetLastPayload = snapshot.value;
    setOpsIdSheetSyncStatus('Connected to the Google Sheet. No complete Ops ID rows were found.');
    return;
  }
  while(actionInFlight) await new Promise(resolve=>setTimeout(resolve, 100));
  setOpsIdSheetSyncStatus('Importing '+sourceRows.length+' Ops ID records from the Google Sheet…');
  const apply = ()=>{ mergeOpsIdSheetRows(sourceRows); };
  apply();
  const saved = await saveDBWithRetry(apply);
  if(saved){
    opsIdSheetLastPayload = snapshot.value;
    setOpsIdSheetSyncStatus('Connected to the Google Sheet · '+sourceRows.length+' Ops ID record'+(sourceRows.length===1?'':'s')+' synced.');
  }else{
    setOpsIdSheetSyncStatus('The sheet was downloaded, but saving the directory failed. Reload Supplies to retry.');
  }
}

/* Append-only forensic trail for account changes — kept separate from the

}

function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function csvVal(v){ const s=(v===undefined||v===null)?'':String(v); return '"'+s.replace(/"/g,'""')+'"'; }
function downloadCSV(filename, headers, rows){
  if(!rows || rows.length===0){ toast('Nothing to download yet.'); return; }

function importBtn(fnName, headerHint){
  return `<label class="btn btn-sm" style="margin:0;" title="Expected columns: ${esc(headerHint)}. Accepts .csv or Excel (.xlsx/.xls) — formulas are read as their calculated value.">&#8613; Import<input type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="display:none;" onchange="${fnName}(this)"></label>`;

function readFileAsText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsText(file);
  });
}
function readFileAsArrayBuffer(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsArrayBuffer(file);
  });
}
function parseCSVText(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const s = String(text||'').replace(/^\uFEFF/, '');
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inQuotes){
      if(c === '"'){
        if(s[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip, \n handles the break */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===''));
}
function csvRowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=>String(h||'').trim());
  return rows.slice(1).map(r=>{
    const obj={};
    headers.forEach((h,i)=>{ obj[h] = (r[i]!==undefined ? String(r[i]).trim() : ''); });
    return obj;
  }).filter(o=>Object.values(o).some(v=>v!==''));
}
function csvField(row, names){
  const keys = Object.keys(row);
  for(const name of names){
    const k = keys.find(k=>k.toLowerCase().trim()===name.toLowerCase());
    if(k!==undefined) return row[k];
  }
  return '';
}
/* Reads .csv, .xlsx, or .xls files into the same row-object shape either way.
   For Excel files (via the SheetJS library loaded above), each cell is read
   as its last-calculated value — so a column built with a formula (e.g.
   =CONCAT(...) for a full name, or =A2&"-"&B2 for a username) imports the
   result of the formula, not the formula text itself. */
async function importCsvRows(inputEl){
  const file = inputEl.files && inputEl.files[0] ? inputEl.files[0] : null;
  inputEl.value = '';
  if(!file) return null;
  const isExcel = /\.(xlsx|xls)$/i.test(file.name) || /spreadsheetml|ms-excel/i.test(file.type||'');
  try{
    if(isExcel){
      if(typeof XLSX === 'undefined'){ toast('Excel import isn\'t available right now — the spreadsheet library didn\'t load. Try saving as CSV instead.'); return null; }
      const buf = await readFileAsArrayBuffer(file);
      const wb = XLSX.read(buf, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      if(!sheet){ toast('That workbook has no sheets to read.'); return null; }
      // header:1 + raw:false returns each row as an array of the DISPLAYED / CALCULATED
      // value for every cell — formula cells resolve to their result, not the formula.
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
      return csvRowsToObjects(rows.map(r=>r.map(v=>v===null||v===undefined?'':String(v))));
    }
    const text = await readFileAsText(file);
    return csvRowsToObjects(parseCSVText(text));

    console.error('Import read error', e);

/* QR readers may paste a plain asset tag, a URL containing the tag, or a
   human-readable prefix such as "Asset tag: SPX-001". Normalize those forms
   before comparing a scan against inventory. */
function normalizeAssetTagScan(value){
  let text=String(value||'').replace(/[\u200B-\u200D\uFEFF]/g,'').trim();
  if(!text)return '';
  try{if(/%[0-9a-f]{2}/i.test(text))text=decodeURIComponent(text);}catch(e){}
  if(/^https?:\/\//i.test(text)){
    try{
      const parsed=new URL(text);
      const params=parsed.searchParams;
      const queryTag=params.get('assetTag')||params.get('asset-tag')||params.get('tag')||params.get('code');
      if(queryTag)text=queryTag;
      else if(parsed.hash)text=parsed.hash.replace(/^#(?:assetTag|asset-tag|tag|code)=?/i,'');
      else text=parsed.pathname.split('/').filter(Boolean).pop()||text;
    }catch(e){}
  }
  text=text.trim().replace(/^(?:asset\s*tag(?:ging)?|tag)\s*[:=#]\s*/i,'').replace(/^["']|["']$/g,'').trim();
  return text;
}

function assetAmsTagsForCodes(codes){

    const amsTags = Array.isArray(r.amsTags) ? r.amsTags : assetCodeValues(r.amsTags);
    receivedCodes.forEach((code,i)=>{
      const key=code.toUpperCase();

/* Current asset stock comes from the codes recorded on receipt. Each code
   moves through receiving, issuance, return, and repair events; the latest
   event determines whether it is available. Results are ordered by the time
   each code most recently entered inventory, then by receiving order. */
function availableAssetCodes(sku, soc){
  const codeInfo = new Map();
  const amsCodeMap = new Map();
  const events = [];
  const addEvent = (code, skuCode, eventSoc, date, kind, order)=>{
    const rawKey = String(code||'').trim().toUpperCase();
    const key = codeInfo.has(rawKey) ? rawKey : (amsCodeMap.get(rawKey)||rawKey);
    if(!key || !codeInfo.has(key)) return;
    const info = codeInfo.get(key);
    if(skuCode && String(info.sku||'').trim().toUpperCase()!==String(skuCode).trim().toUpperCase()) return;
    if(socKey(eventSoc) && socKey(info.soc) && socKey(eventSoc)!==socKey(info.soc)) return;
    const parsed = Date.parse(date||'');
    events.push({key, time:Number.isFinite(parsed)?parsed:0, kind, order});
  };
  (DB.receiving||[]).forEach((r,idx)=>{
    if(canonicalSupplyType(r.type)!=='Asset') return;
    const codes = recvAssetCodesOf(r);
    const amsTags = Array.isArray(r.amsTags) ? r.amsTags : assetCodeValues(r.amsTags);
    codes.forEach((code,unitIdx)=>{
      const key = code.toUpperCase();
      if(codeInfo.has(key)) return;
      codeInfo.set(key,{code,sku:String(r.sku||''),soc:r.soc||'',order:idx*1000+unitIdx});
      events.push({key,time:Number.isFinite(Date.parse(r.date||''))?Date.parse(r.date):0,kind:'add',order:idx*1000+unitIdx});
      if(amsTags[unitIdx] && !amsCodeMap.has(amsTags[unitIdx].toUpperCase())) amsCodeMap.set(amsTags[unitIdx].toUpperCase(),key);
    });
  });
  (DB.issuance||[]).forEach((i,idx)=>{
    const codes = Array.isArray(i.assetCodes)&&i.assetCodes.length ? i.assetCodes : assetCodeValues(i.assetTagging);
    codes.forEach((code,unitIdx)=>addEvent(code,i.sku,i.soc,i.date,'remove',1000000+idx*1000+unitIdx));
  });
  (DB.returns||[]).forEach((r,idx)=>{
    if(r.category!=='Asset' || r.condition!=='Good' || !['Received','Asset Received'].includes(r.status)) return;
    const codes = Array.isArray(r.assetCodes)&&r.assetCodes.length ? r.assetCodes : assetCodeValues(r.assetTagging);
    codes.forEach((code,unitIdx)=>addEvent(code,r.sku,r.soc,r.dateReceived||r.dateReturned,'add',2000000+idx*1000+unitIdx));
  });
  (DB.repairs||[]).forEach((r,idx)=>{
    const kind = r.status==='Added to Inventory' ? 'add' : (r.status==='Disposed'||r.status==='Backloaded' ? 'remove' : '');
    if(!kind) return;
    addEvent(r.assetTagging,r.sku,r.soc,kind==='add'?(r.inventoryDate||r.dateReceived):(r.disposedDate||r.backloadDate),kind,3000000+idx);
  });
  events.sort((a,b)=>a.time-b.time || a.order-b.order);
  const availableAt = new Map();
  events.forEach(e=>{ if(e.kind==='add') availableAt.set(e.key,e.time); else availableAt.delete(e.key); });
  return Array.from(availableAt.keys()).map(key=>codeInfo.get(key))
    .filter(info=>String(info.sku||'').trim().toUpperCase()===String(sku||'').trim().toUpperCase() && (socKey(soc) ? (!socKey(info.soc)||socKey(info.soc)===socKey(soc)) : !socKey(info.soc)))
    .sort((a,b)=>(availableAt.get(a.code.toUpperCase())-availableAt.get(b.code.toUpperCase())) || a.order-b.order)
    .map(info=>info.code);
}

    recvAssetCodesOf(r).forEach(code=>{

function availableAssetCodesForDashboard(sku,soc,exactSoc){

/* Open requests reserve assets in filing order. Rebuilding these reservations
   after each relevant change makes returned/newly received codes flow to the
   earliest waiting request and prevents two requests claiming the same code.

   This used to unconditionally recompute every open request's every item on
   every call, re-scanning the full receiving/issuance/returns/repairs
   history per item (availableAssetCodes) regardless of what actually
   changed. At real data volumes that was both slow (the full history scan
   happening dozens of times per action) and a growing Firestore cost (every
   open request's full record, attachments included, re-saved on every
   cascade) - see setMulti()'s per-commit size comment above.

   syncOpenRequestAssetCodes() now only re-evaluates the specific (sku, site)
   pools actually touched by whatever changed in this action, via
   syncOpenRequestAssetCodesScoped(). This is safe because
   availableAssetCodes(sku, site) already filters strictly to that sku and
   site before returning candidates - an item for one sku/site can never
   compete for, or be affected by, a code belonging to a different sku/site -
   so leaving untouched pools completely alone changes nothing about the
   (unchanged, still sequential-by-filing-order) result for the pools that
   did change. Verified against real production data and hand-built scarcity/
   contention scenarios in scripts/test-allocator/ before this replaced the

   after changing this function. */
function skuSiteKey(sku, site){ return String(sku||'').trim().toUpperCase()+'||'+socKey(site); }
function syncOpenRequestAssetCodesScoped(affectedSkuSites){
  const inScope = (sku, site) => affectedSkuSites===null || affectedSkuSites.has(skuSiteKey(sku, site));
  (DB.requests||[]).filter(r=>r.status==='Rejected').forEach(r=>(r.items||[]).forEach(it=>{
    if(it.type==='Asset' && Array.isArray(it.assetCodes) && inScope(it.sku, requestSoc(r))){ it.assetCodes=[]; it.assetTagging=''; }
  }));
  const active = (DB.requests||[]).map((r,index)=>({r,index}))
    .filter(x=>!['Rejected','Issued','Received'].includes(x.r.status))
    .sort((a,b)=>{
      const aId=String(a.r.id||'').match(/^REQ-(\d+)$/i), bId=String(b.r.id||'').match(/^REQ-(\d+)$/i);
      if(aId&&bId&&Number(aId[1])!==Number(bId[1])) return Number(aId[1])-Number(bId[1]);
      const at=Date.parse(a.r.dateFiled||'')||0, bt=Date.parse(b.r.dateFiled||'')||0;
      return at-bt || a.index-b.index;
    });
  const reserved = new Set();
  const approved = active.filter(({r})=>['Preparing','Ready for Pull-out','Approved'].includes(r.status));
  // Pending requests do not reserve inventory before Supplies approval.
  active.filter(({r})=>!['Preparing','Ready for Pull-out','Approved'].includes(r.status)).forEach(({r})=>{
    (r.items||[]).filter(it=>it.type==='Asset' && inScope(it.sku, requestSoc(r))).forEach(it=>{it.assetCodes=[];it.assetTagging='';});
  });
  // Preserve valid assignments before filling gaps, so later approvals cannot steal tags.
  approved.forEach(({r})=>{
    (r.items||[]).forEach(it=>{
      if(it.type!=='Asset') return;
      const site=requestSoc(r);
      if(!inScope(it.sku, site)) return;
      const available=site===null?[]:availableAssetCodes(it.sku,site||'');
      const canonical=new Map(available.map(code=>[code.toUpperCase(),code]));
      const qty=Math.max(0,Math.floor(approvedQtyOf(it)||0));
      const kept=[];
      requestAssetCodesArr(it).forEach(code=>{
        const key=code.toUpperCase();
        if(kept.length<qty && canonical.has(key) && !reserved.has(key)){
          kept.push(canonical.get(key)); reserved.add(key);
        }

      it.assetCodes=kept;
    });
  });
  approved.forEach(({r})=>{
    (r.items||[]).forEach(it=>{
      if(it.type!=='Asset') return;
      const requestSite = requestSoc(r);
      if(!inScope(it.sku, requestSite)) return;
      const qty = Math.max(0,Math.floor(approvedQtyOf(it)||0));
      const candidates = requestSite===null ? [] : availableAssetCodes(it.sku,requestSite||'').filter(code=>!reserved.has(code.toUpperCase()));
      const allocatedTags = candidates.slice(0,Math.max(0,qty-it.assetCodes.length));
      it.assetCodes = it.assetCodes.concat(allocatedTags);
      it.assetTagging = assetAmsTagsForCodes(it.assetCodes).join(', ');
      allocatedTags.forEach(code=>reserved.add(code.toUpperCase()));
    });
  });
}
/* Figures out which (sku, site) pools could need re-evaluation from
   whatever has changed in DB so far in the current action, reusing the same
   diffing saveDB() already relies on to know what to write: recordChanges()
   (against recordSnapshots) for the record-collection sections, and a plain
   id-keyed diff against lastKnownSnapshot for the two that are still a
   single blob document (receiving, repairs). Falls back to "everything" -
   the old, safe, unconditional behavior - if record mode isn't active (e.g.
   the localStorage-only fallback) or the relevant snapshots aren't
   available yet, rather than risk under-scoping against an unknown state. */
function computePendingAssetCodeScope(){
  if(!recordModeActive) return null;
  const keys = new Set();
  const addRequest = r=>{ if(!r) return; const site=requestSoc(r); (r.items||[]).forEach(it=>{ if(it.type==='Asset') keys.add(skuSiteKey(it.sku,site)); }); };
  const addDirect = rec=>{ if(rec) keys.add(skuSiteKey(rec.sku, rec.soc)); };
  const parseOrNull = v => v==null ? null : JSON.parse(v);
  recordChanges('requests').forEach(c=>{ addRequest(parseOrNull(c.expectedPrevious)); addRequest(parseOrNull(c.value)); });
  recordChanges('returns').forEach(c=>{ addDirect(parseOrNull(c.expectedPrevious)); addDirect(parseOrNull(c.value)); });
  recordChanges('issuance').forEach(c=>{ addDirect(parseOrNull(c.expectedPrevious)); addDirect(parseOrNull(c.value)); });
  ['receiving','repairs'].forEach(key=>{
    if(!lastKnownSnapshot || lastKnownSnapshot[key]===undefined) return;
    const before = new Map((JSON.parse(lastKnownSnapshot[key]||'[]')||[]).map(rec=>[rec.id,rec]));
    const after = new Map((DB[key]||[]).map(rec=>[rec.id,rec]));
    const ids = new Set([...before.keys(), ...after.keys()]);
    ids.forEach(id=>{
      const b = before.get(id), a = after.get(id);
      if(JSON.stringify(b)!==JSON.stringify(a)){ addDirect(b); addDirect(a); }
    });
  });
  return keys;
}
function syncOpenRequestAssetCodes(){
  syncOpenRequestAssetCodesScoped(computePendingAssetCodeScope());

}

/* Daily average consumption: total qty issued for a SKU (from the
   Accountability log) spread across the days since its
   earliest issuance. No issuance history yet => 0 (no basis to project). */
function dailyAvgConsumption(sku){
  const metrics = DB.issuanceMetrics || {};
  const scope = isAdminAllSocView() ? (metrics.all||metrics) : ((metrics.bySoc&&metrics.bySoc[currentSoc()])||{});
  const metric = scope[sku];
  if(metric && Number(metric.totalQty||0)>0 && metric.earliest){
    const days = Math.max(1, Math.ceil((Date.now()-new Date(metric.earliest).getTime())/(1000*60*60*24)));
    return Number(metric.totalQty||0)/days;
  }
  const records = socFilter(DB.issuance).filter(i=>i.sku===sku);
  if(records.length===0) return 0;
  const totalQty = records.reduce((s,r)=>s+Number(r.qty||0),0);
  const earliest = Math.min(...records.map(r=>new Date(r.date).getTime()));
  const days = Math.max(1, Math.ceil((Date.now()-earliest)/(1000*60*60*24)));
  return totalQty/days;
}
function safetyStockOf(s){
  const dac = dailyAvgConsumption(s.sku);
  const days = [7,15,30].includes(s.safetyStockDays) ? s.safetyStockDays : 7;
  return Math.ceil(dac*days);
}
function stockStatusRow(s){
  const soh = s.type==='Asset' ? dashboardAssetOnHand(s.sku) : stockOf(s.sku);
  const dac = dailyAvgConsumption(s.sku);
  const safety = safetyStockOf(s);
  const sufficient = soh > safety;
  const coverage = dac>0 ? (soh/dac).toFixed(1)+' days' : '—';
  return {soh, dac, safety, sufficient, coverage};
}

// ------------------------- SOC (site) data segmentation -------------------------
// Every transactional record carries a `soc` field — the site (from DB.warehouses,
// e.g. SOC5/SOC6/...) it belongs to. Admins always see everything. Staff/Hub logins
// only see records tagged with their own site, plus any legacy/untagged records

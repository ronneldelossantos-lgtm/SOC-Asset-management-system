async function finalizeRepairAction(id, action){
  let r = DB.repairs.find(x=>x.id===id);
  if(!r) return;
  const fileEl = document.getElementById('repair-transmittal-file');
  const file = fileEl && fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
  let transmittalFile, transmittalFileData;
  actionInFlight = true;
  if(file){
    if(!repairTransmittalFileValid(file)){ toast('Transmittal must be a PDF, JPEG, or PNG file.'); actionInFlight = false; return; }
    if(file.size > 4*1024*1024){ toast('Transmittal file is too large (max 4MB).'); actionInFlight = false; return; }
    try{ transmittalFileData = await readFileAsDataURL(file); }
    catch(e){ console.error('File read error', e); toast('Could not read the transmittal file — try again.'); actionInFlight = false; return; }
    transmittalFile = file.name;
  }
  /* The file read above can take a moment, and the shared DB may have been
     refreshed by auto-poll while we were waiting (a new DB object replaces
     the old one). Re-find the record in whatever is CURRENT now, instead of
     writing onto the stale object captured before the await — otherwise the
     status change below is applied to a detached copy and silently lost on
     save, even though the record still looks "processed" to the user. */
  r = DB.repairs.find(x=>x.id===id);
  if(!r){ actionInFlight = false; toast('This record changed elsewhere — please reopen it and try again.'); closeModal(); navigate('repair','list'); return; }
  if(file){ r.transmittalFile = transmittalFile; r.transmittalFileData = transmittalFileData; }
  if(action==='inventory'){
    addStock(r.sku, 1, r.soc||'');
    r.status = 'Added to Inventory';
    r.inventoryBy = session.fullName; r.inventoryDate = nowISO();
    syncOpenRequestAssetCodes();
    await saveDB();
    actionInFlight = false;
    closeModal();
    toast(r.id+' added back to inventory (+1 '+r.sku+').');
  } else if(action==='dispose'){
    r.status = 'Disposed';
    r.disposedBy = session.fullName; r.disposedDate = nowISO();
    removeIssuedAsset(r.assetTagging);
    syncOpenRequestAssetCodes();
    await saveDB();
    actionInFlight = false;
    closeModal();
    toast(r.id+' marked disposed and removed from issued assets.');
  } else {
    r.status = 'Backloaded';
    r.backloadBy = session.fullName; r.backloadDate = nowISO();
    removeIssuedAsset(r.assetTagging);
    syncOpenRequestAssetCodes();
    await saveDB();
    actionInFlight = false;
    closeModal();
    toast(r.id+' marked backloaded and removed from issued assets.');
  }
  navigate('repair','list');
}

/* ============================= PM: WEEKLY ASSET COUNT & PM CHECKLIST (under Repair & Maintenance) ============================= */
/* Which assets are "for preventive maintenance" is set per SKU (Settings → SKU code → PM).
   The checklist each PM asset goes through lives in DB.pmChecklists[sku] = [{id,text}, ...]
   (Settings → PM Checklist) — one checklist per asset SKU. Weekly counts live in DB.pmCounts
   and completed checklists in DB.pmInspections (each keeps a snapshot of the checklist
   wording at the time, so later edits to a checklist never rewrite history). */
function skuIsPM(s){ return !!(s && s.type==='Asset' && s.pm===true); }
function pmChecklistOf(sku){ const l = DB.pmChecklists && DB.pmChecklists[sku]; return Array.isArray(l) ? l : []; }
let pmWeekStart = '';
let pmDeptFilter = '';
let pmRowCache = [];
let pmModalRow = null;
let pmiRepairTouched = false;
function pmMondayOf(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function pmCurrentWeekKey(){ return localDateStr(pmMondayOf(new Date())); }
function pmWeekLabel(key){
  const a = new Date(key+'T00:00:00'); const b = new Date(a); b.setDate(b.getDate()+6);
  const f = (d,y)=>d.toLocaleDateString('en-US', y ? {month:'short',day:'numeric',year:'numeric'} : {month:'short',day:'numeric'});
  return f(a)+' – '+f(b,true);
}
function pmShiftWeek(delta){
  const d = new Date((pmWeekStart||pmCurrentWeekKey())+'T00:00:00');
  d.setDate(d.getDate()+delta*7);
  const key = localDateStr(d);
  if(key > pmCurrentWeekKey()) return;
  pmWeekStart = key;
  refreshPmWeekly();
}
function pmThisWeek(){ pmWeekStart = pmCurrentWeekKey(); refreshPmWeekly(); }
function pmSetDept(v){ pmDeptFilter = v; refreshPmWeekly(); }

/* PM assets currently sitting with a department. Source of truth is the Issuance log:
   a tagged asset is one row per tag (its latest issuance decides which department holds it);
   an untagged asset line is one row with its issued qty. A tag drops out once the department's
   return is received (or it was repaired and put back into inventory) after that issuance. */
function pmIssuedAssetRows(){
  const recs = socFilter(DB.issuance).filter(i=>i.type==='Asset' && skuIsPM(skuInfo(i.sku)))
    .slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const left = (tagUp, sinceMs)=>{
    const returned = (DB.returns||[]).some(r=>(r.status==='Received'||r.status==='Asset Received') && r.assetTagging
      && String(r.assetTagging).split(',').map(t=>t.trim().toUpperCase()).includes(tagUp)
      && new Date(r.dateReceived||r.dateReturned||0).getTime() >= sinceMs);
    if(returned) return true;
    return (DB.repairs||[]).some(rp=>rp.status==='Added to Inventory' && String(rp.assetTagging||'').trim().toUpperCase()===tagUp
      && new Date(rp.inventoryDate||0).getTime() >= sinceMs);
  };
  const latest = {};
  const rows = [];
  recs.forEach(r=>{
    const tags = String(r.assetTagging||'').split(',').map(t=>t.trim()).filter(t=>t);
    if(!tags.length){
      rows.push({key:'ISS:'+r.id, issuanceId:r.id, sku:r.sku, description:r.description, department:r.department, tag:'', qtyIssued:Number(r.qty)||0, issuedDate:r.date, soc:r.soc||'', inRepair:false});
    } else {
      tags.forEach(t=>{ latest[t.toUpperCase()] = {rec:r, tag:t}; });
    }
  });
  Object.keys(latest).forEach(T=>{
    const {rec, tag} = latest[T];
    if(left(T, new Date(rec.date).getTime())) return;
    const inRepair = (DB.repairs||[]).some(rp=>REPAIR_EDITABLE_STATUSES.includes(rp.status) && String(rp.assetTagging||'').trim().toUpperCase()===T);
    rows.push({key:'TAG:'+T, issuanceId:rec.id, sku:rec.sku, description:rec.description, department:rec.department, tag, qtyIssued:1, issuedDate:rec.date, soc:rec.soc||'', inRepair});
  });
  rows.sort((a,b)=>(a.department||'').localeCompare(b.department||'') || a.sku.localeCompare(b.sku) || (a.tag||'').localeCompare(b.tag||'', undefined, {numeric:true}));
  return rows;
}
function pmLastInspection(key){
  const list = (DB.pmInspections||[]).filter(p=>p.key===key).sort((a,b)=>new Date(b.date)-new Date(a.date));
  return list[0] || null;
}
/* The weekly count is automatic — nobody picks Found/Missing. For each PM asset in scope
   during a week: PM checklist done that week => counted (found); no PM => recorded as missing.
   pmSyncCounts() writes that outcome into DB.pmCounts (one record per asset per week, with a
   fixed id so repeated syncs never create duplicates) so the history and CSV stay accurate. */
function pmWeekEndMs(key){ const d = new Date(key+'T00:00:00'); d.setDate(d.getDate()+7); return d.getTime(); }
function pmPrevWeekKey(key){ const d = new Date(key+'T00:00:00'); d.setDate(d.getDate()-7); return localDateStr(d); }
function pmSyncCounts(weekKey, allRows){
  let changed = false;
  const endMs = pmWeekEndMs(weekKey);
  allRows.forEach(r=>{
    if(new Date(r.issuedDate).getTime() >= endMs) return;   // issued after that week — not in scope yet
    const insp = DB.pmInspections.find(p=>p.weekStart===weekKey && p.key===r.key);
    if(r.inRepair && !insp) return;                           // in repair with no PM this week — not counted
    const want = insp ? r.qtyIssued : 0;
    const ex = DB.pmCounts.find(c=>c.weekStart===weekKey && c.key===r.key);
    if(ex && ex.countedQty===want && ex.qtyIssued===r.qtyIssued) return;
    const rec = {weekStart:weekKey, key:r.key, issuanceId:r.issuanceId, sku:r.sku, description:r.description, department:r.department,
      assetTagging:r.tag, qtyIssued:r.qtyIssued, countedQty:want,
      remarks: insp ? ('Auto — PM done ('+insp.id+')') : 'Auto — no PM recorded',
      countedBy: insp ? insp.performedBy : 'System (auto)', date: insp ? insp.date : nowISO(), soc:r.soc||currentSoc()};
    if(ex) Object.assign(ex, rec);
    else DB.pmCounts.push(Object.assign({id:'WC-'+weekKey+'-'+r.key.replace(/[^A-Za-z0-9]+/g,'-')}, rec));
    changed = true;
  });
  return changed;
}
function pmWeeklyHtml(){
  if(!pmWeekStart) pmWeekStart = pmCurrentWeekKey();
  const all = pmIssuedAssetRows();
  let synced = pmSyncCounts(pmWeekStart, all);
  if(pmWeekStart===pmCurrentWeekKey()) synced = pmSyncCounts(pmPrevWeekKey(pmWeekStart), all) || synced;   // close out last week too
  if(synced) saveDB();
  const depts = Array.from(new Set(all.map(r=>r.department))).sort();
  if(pmDeptFilter && !depts.includes(pmDeptFilter)) pmDeptFilter = '';
  const rows = all.filter(r=>!pmDeptFilter || r.department===pmDeptFilter);
  pmRowCache = rows;
  const isCurrent = pmWeekStart===pmCurrentWeekKey();
  const endMs = pmWeekEndMs(pmWeekStart);
  const inspOf = r=>DB.pmInspections.find(p=>p.weekStart===pmWeekStart && p.key===r.key);
  const inScope = r=>new Date(r.issuedDate).getTime() < endMs && (!r.inRepair || !!inspOf(r));
  const scope = rows.filter(inScope);
  const counted = scope.filter(r=>inspOf(r));
  const missing = scope.filter(r=>!inspOf(r));
  const pmFindings = rows.filter(r=>{ const p = inspOf(r); return p && p.failCount>0; }).length;
  const controls = `<div class="list-head" style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">

        ${isCurrent ? '<span class="tag tag-ok">This week</span>' : '<button class="btn btn-sm" onclick="pmThisWeek()">Back to this week</button>'}
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <select onchange="pmSetDept(this.value)" style="padding:6px 10px;font-size:12.5px;border:1px solid var(--border);border-radius:8px;background:#fff;">
          <option value="">All departments</option>
          ${depts.map(d=>`<option value="${esc(d)}" ${d===pmDeptFilter?'selected':''}>${esc(d)}</option>`).join('')}
        </select>
      </div>
    </div>`;
  let body;
  if(all.length===0){
    body = `<div class="empty"><div class="ic">&#9874;</div>No PM assets are currently issued to a department.<br><span class="small-note">Flag an asset SKU as <b>Preventive maintenance = Yes</b> in Settings &rarr; SKU code, then issue it to a department.</span></div>`;
  } else if(rows.length===0){
    body = '<div class="empty"><div class="ic">&#9874;</div>Nothing to show for this department.</div>';
  } else {
    body = `<div class="tbl-wrap"><table>
      <tr><th>Department</th><th>SKU</th><th>Item</th><th>Asset tag</th><th>Qty issued</th><th>This week's count</th><th>Last PM</th><th>PM checklist</th></tr>
      ${rows.map((r,i)=>{
        const p = inspOf(r), cl = pmChecklistOf(r.sku), last = pmLastInspection(r.key);
        let statusCell;
        if(!inScope(r)) statusCell = r.inRepair ? '<span class="tag tag-forrepair">In repair</span><div class="small-note" style="margin-top:3px;">not counted</div>' : '<span class="small-note">Not issued yet this week</span>';
        else if(p) statusCell = `<span class="tag tag-ok">Counted</span><div class="small-note" style="margin-top:3px;">via PM · ${fmtDate(p.date)}${r.inRepair?' · now in repair':''}</div>`;
        else statusCell = '<span class="tag tag-rejected">Missing</span><div class="small-note" style="margin-top:3px;">no PM recorded</div>';
        let pmCell;
        if(p) pmCell = `<span class="tag ${p.failCount?'tag-forrepair':'tag-ok'}">${p.failCount?('Findings ('+p.failCount+')'):'Done'}</span> <button class="btn btn-sm" onclick="viewPmInspection('${esc(p.id)}')">View</button>`;
        else if(!inScope(r)) pmCell = '<span class="small-note">—</span>';
        else if(cl.length) pmCell = `<button class="btn btn-sm btn-amber" onclick="openPmChecklist(${i})">Start PM</button> <span class="small-note">${cl.length} items</span>`;
        else pmCell = '<span class="small-note" style="color:var(--warn);">No checklist set</span>';
        return `<tr>
          <td>${esc(r.department)}</td><td class="mono">${esc(r.sku)}</td><td>${esc(r.description)}</td>
          <td class="mono">${r.tag?esc(r.tag):'<span class="small-note">untagged</span>'}</td><td>${r.qtyIssued}</td>
          <td>${statusCell}</td>
          <td>${last?fmtDate(last.date):'<span class="small-note">Never</span>'}</td>
          <td>${pmCell}</td>
        </tr>`;
      }).join('')}
    </table></div>`;
  }
  const hist = socFilter(DB.pmCounts).slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,15);
  return `<div class="card">
    <h3>Weekly cycle count — PM assets issued to departments</h3>
    <div class="card-sub">Every asset flagged for preventive maintenance that is currently issued to a department. The count is automatic: once an asset's PM checklist is done for the week (Monday–Sunday) it is counted; an asset with no PM recorded is recorded as missing.</div>
    ${controls}
    <div class="grid g4" style="margin-bottom:16px;">
      <div class="metric"><div class="lbl">Assets in scope</div><div class="val">${scope.length}</div><div class="sub">issued to departments${rows.length!==scope.length?' · '+(rows.length-scope.length)+' not counted':''}</div></div>
      <div class="metric success"><div class="lbl">Counted</div><div class="val">${counted.length}</div><div class="sub">PM done this week</div></div>
      <div class="metric ${missing.length?'danger':''}"><div class="lbl">Missing</div><div class="val">${missing.length}</div><div class="sub">no PM recorded yet</div></div>
      <div class="metric amber"><div class="lbl">PM with findings</div><div class="val">${pmFindings}</div><div class="sub">failed at least one item</div></div>

/* ---- PM checklist: fill in ---- */
function openPmChecklist(i){
  const r = pmRowCache[i]; if(!r) return;
  const items = pmChecklistOf(r.sku);
  if(!items.length){ toast('No PM checklist set for '+r.sku+' — add one in Settings → PM Checklist.'); return; }
  if(DB.pmInspections.find(p=>p.weekStart===pmWeekStart && p.key===r.key)){ toast('PM is already recorded for this asset this week.'); refreshPmWeekly(); return; }
  pmModalRow = r; pmiRepairTouched = false;
  showModal(`
    <h3>PM checklist</h3>
    <div class="card-sub"><span class="mono">${esc(r.tag||r.sku)}</span> · ${esc(r.description)} · ${esc(r.department)}<br>Week of ${esc(pmWeekLabel(pmWeekStart))}</div>
    <div>${items.map((it,k)=>`
      <div class="pm-item">
        <div class="pm-item-text">${k+1}. ${esc(it.text)}</div>
        <div class="pm-res">${['Pass','Fail','N/A'].map(v=>`<label class="pm-opt ${v==='Pass'?'pass':(v==='Fail'?'fail':'na')}"><input type="radio" name="pmi-res-${k}" value="${v}" onchange="pmiOnChange()"><span>${v}</span></label>`).join('')}</div>
      </div>`).join('')}</div>
    <div class="field" style="margin-top:14px;"><label>Remarks</label><textarea id="pmi-remarks" rows="2" placeholder="Optional — one remark for the whole checklist"></textarea></div>
    <label class="proc-access-item"><input type="checkbox" id="pmi-repair" onchange="pmiRepairTouched=true"> Also log this asset in the Repair register (For Repair)</label>
    <div class="hint">Ticks itself if any item is marked Fail — untick it if the fault doesn't need a repair.</div>
    <div class="footer-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="savePmInspection()">Save PM record</button>
    </div>`);
  const m = document.querySelector('#modal-root .modal'); if(m) m.classList.add('modal-wide');
}
function pmiOnChange(){
  if(pmiRepairTouched) return;
  const anyFail = !!document.querySelector('#modal-root input[type=radio][value="Fail"]:checked');
  const cb = document.getElementById('pmi-repair'); if(cb) cb.checked = anyFail;
}
async function savePmInspection(){
  const r = pmModalRow; if(!r) return;
  const tpl = pmChecklistOf(r.sku);
  if(!tpl.length){ toast('This checklist is empty now — reopen it.'); closeModal(); return; }
  const items = [];
  for(let k=0;k<tpl.length;k++){
    const sel = document.querySelector('input[name="pmi-res-'+k+'"]:checked');
    if(!sel){ toast('Mark every item Pass, Fail or N/A — item '+(k+1)+' is still blank.'); return; }
    items.push({text:tpl[k].text, result:sel.value});
  }
  if(DB.pmInspections.find(p=>p.weekStart===pmWeekStart && p.key===r.key)){ toast('PM was just recorded for this asset by someone else.'); closeModal(); refreshPmWeekly(); return; }
  const fails = items.filter(x=>x.result==='Fail');
  const remarks = (document.getElementById('pmi-remarks').value||'').trim();
  const id = nextCode('PMI','pmi');
  let repairId = '';
  if(document.getElementById('pmi-repair').checked){
    const T = String(r.tag||'').trim().toUpperCase();
    const alreadyOpen = T && DB.repairs.some(rp=>REPAIR_EDITABLE_STATUSES.includes(rp.status) && String(rp.assetTagging||'').trim().toUpperCase()===T);
    if(alreadyOpen){
      toast('This asset already has an open repair record — not logging a second one.');
    } else {
      repairId = nextCode('REP','rep');
      DB.repairs.push({id:repairId, assetTagging:r.tag, sku:r.sku, description:r.description, dateReceived:nowISO(), status:'For Repair',
        remarks:'From PM '+id+(fails.length ? (' — failed: '+fails.map(f=>f.text).join('; ')) : '')+(remarks?(' — '+remarks):''), soc:r.soc||currentSoc()});
    }
  }
  DB.pmInspections.push({id, weekStart:pmWeekStart, key:r.key, sku:r.sku, description:r.description, department:r.department, assetTagging:r.tag,
    items, failCount:fails.length, overall: fails.length ? 'With findings' : 'Passed', remarks, performedBy:session.fullName, date:nowISO(), soc:r.soc||currentSoc(), repairId});
  await saveDB();
  closeModal();
  toast(id+' saved — '+(fails.length ? (fails.length+' item'+(fails.length===1?'':'s')+' failed'+(repairId?', logged to repair register':'')) : 'all clear')+'.');
  refreshPmWeekly();
}

let pmclSku = '';
function pmNewItemId(){ return 'c'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36); }
function pmclPick(sku){ pmclSku = sku; renderSettings(); }
function settingsPmChecklistHtml(){

    </div>

          <button class="btn btn-sm" onclick="pmclMove(${k},1)" ${k===items.length-1?'disabled style="opacity:.4;"':''} title="Move down">&darr;</button>
          <button class="btn btn-sm" onclick="pmclEdit(${k})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="pmclDelete(${k})">Delete</button>

    <div style="display:flex;gap:10px;align-items:flex-end;margin-top:14px;">
      <div class="field" style="flex:1;margin:0;"><label>Add checklist item</label><input id="pmcl-new" placeholder="e.g. Clean air filter and check for damage" onkeydown="if(event.key==='Enter'){pmclAdd();}"></div>

async function pmclAdd(){
  const el = document.getElementById('pmcl-new'); if(!el) return;
  const text = el.value.trim();
  if(!text){ toast('Type a checklist item first.'); return; }
  const list = pmChecklistOf(pmclSku).slice();
  if(list.some(x=>x.text.toLowerCase()===text.toLowerCase())){ toast('That item is already on this checklist.'); return; }
  list.push({id:pmNewItemId(), text});
  DB.pmChecklists[pmclSku] = list;
  await saveDB();
  renderSettings();
  const n = document.getElementById('pmcl-new'); if(n) n.focus();
}
async function pmclMove(k, dir){
  const list = pmChecklistOf(pmclSku).slice();
  const j = k+dir;
  if(j<0 || j>=list.length) return;
  const t = list[k]; list[k] = list[j]; list[j] = t;
  DB.pmChecklists[pmclSku] = list;
  await saveDB();
  renderSettings();
}
function pmclEdit(k){
  const it = pmChecklistOf(pmclSku)[k]; if(!it) return;
  showModal(`
    <h3>Edit checklist item</h3>
    <div class="card-sub mono">${esc(pmclSku)} · item ${k+1}</div>
    <div class="field"><label>Checklist item</label><textarea id="pmcl-edit-text" rows="3">${esc(it.text)}</textarea></div>
    <div class="hint">Past PM records keep the wording they were done with.</div>
    <div class="footer-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="pmclSaveEdit(${k})">Save</button></div>`);
}
async function pmclSaveEdit(k){
  const text = document.getElementById('pmcl-edit-text').value.trim();
  if(!text){ toast('The item can\'t be blank.'); return; }
  const list = pmChecklistOf(pmclSku).slice();
  if(!list[k]) return;
  if(list.some((x,i)=>i!==k && x.text.toLowerCase()===text.toLowerCase())){ toast('That item is already on this checklist.'); return; }
  list[k] = Object.assign({}, list[k], {text});
  DB.pmChecklists[pmclSku] = list;
  await saveDB();
  closeModal();
  renderSettings();
}
function pmclDelete(k){
  const it = pmChecklistOf(pmclSku)[k]; if(!it) return;
  confirmAction('Remove "'+it.text+'" from this checklist? PM records already completed are not affected.', async ()=>{
    DB.pmChecklists[pmclSku] = pmChecklistOf(pmclSku).filter((x,i)=>i!==k);
    await saveDB();
    renderSettings();
  });
}
async function pmclCopy(){
  const from = document.getElementById('pmcl-copy-from').value;
  const src = pmChecklistOf(from);
  const list = pmChecklistOf(pmclSku).slice();
  let n = 0;
  src.forEach(it=>{
    if(!list.some(x=>x.text.toLowerCase()===it.text.toLowerCase())){ list.push({id:pmNewItemId(), text:it.text}); n++; }
  });
  if(!n){ toast('Nothing new to copy — those items are already here.'); return; }
  DB.pmChecklists[pmclSku] = list;
  await saveDB();
  toast(n+' item'+(n===1?'':'s')+' copied from '+from+'.');
  renderSettings();
}
async function importPmChecklistCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0, skipped = 0;
  rows.forEach(row=>{
    const sku = csvField(row, ['SKU','SKU Code']).trim();
    const text = csvField(row, ['Checklist item','Checklist','Item','Task']).trim();
    const info = skuInfo(sku);
    if(!text || !skuIsPM(info)){ skipped++; return; }
    const list = pmChecklistOf(info.sku).slice();
    if(list.some(x=>x.text.toLowerCase()===text.toLowerCase())){ skipped++; return; }
    list.push({id:pmNewItemId(), text});
    DB.pmChecklists[info.sku] = list;
    added++;
  });
  if(added) await saveDB();
  toast('Imported '+added+' checklist item'+(added===1?'':'s')+(skipped?(', skipped '+skipped+' (blank, duplicate, or SKU not flagged PM).'):'.'));
  renderSettings();
}
async function updateSkuPM(sku, value){
  const info = skuInfo(sku); if(!info) return;
  info.pm = (info.type==='Asset' && value==='Yes');
  await saveDB();
  toast(sku+(info.pm ? ' flagged for preventive maintenance — build its checklist under PM Checklist.' : ' no longer flagged for preventive maintenance.'));
  renderSettings();
}
function skuPmCellHtml(s){
  if(s.type!=='Asset') return '<span class="small-note">—</span>';
  const n = pmChecklistOf(s.sku).length;
  return `<select onchange="updateSkuPM('${esc(s.sku)}', this.value)" style="padding:5px 8px;font-size:12px;">

function openEditReturn(id){
  if(session.role!=='admin') return;
  const r = DB.returns.find(x=>x.id===id);
  if(!r) return;
  showModal(`
    <h3>Edit return record</h3>
    <div class="card-sub mono">${esc(r.id)} &middot; ${esc(r.sku)} &middot; ${esc(r.description)}</div>
    <div class="form-row" style="margin-top:14px;">
      <div class="field"><label>Quantity</label><input type="number" min="0" id="edit-ret-qty" value="${r.qty}"></div>
      <div class="field"><label>Remarks</label><input id="edit-ret-remarks" value="${esc(r.remarks||'')}"></div>
    </div>
    ${(r.condition==='Good' && (r.status==='Received'||r.status==='Asset Received')) ? `<div class="hint">This was received as Good condition — changing the quantity will adjust current stock for ${esc(r.sku)} by the difference.</div>` : `<div class="hint">Condition/status can't be changed here. For a Damaged item, any linked repair register entry is not updated automatically.</div>`}
    <div class="footer-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveReturnEdit('${esc(id)}')">Save changes</button>
    </div>
  `);
}
async function saveReturnEdit(id){
  const r = DB.returns.find(x=>x.id===id);
  if(!r) return;
  const qty = Number(document.getElementById('edit-ret-qty').value);
  const remarks = document.getElementById('edit-ret-remarks').value.trim();
  if(!Number.isFinite(qty) || qty<0){ toast('Enter a valid quantity.'); return; }
  const stockAffecting = r.condition==='Good' && (r.status==='Received'||r.status==='Asset Received');
  if(stockAffecting){
    const delta = qty - r.qty;
    if(delta!==0) addStock(r.sku, delta, r.soc||'');
  }
  r.qty = qty; r.remarks = remarks;
  await saveDB();
  closeModal();
  toast('Return record updated.');
  navigate('returns','log');
}
function deleteReturn(id){
  const r = DB.returns.find(x=>x.id===id);
  if(!r) return;
  const stockAffecting = r.condition==='Good' && (r.status==='Received'||r.status==='Asset Received');
  const warning = stockAffecting
    ? 'Delete '+r.id+'? This will remove the '+r.qty+' '+r.uom+' it added back to the stock of '+r.sku+'.'
    : 'Delete '+r.id+'? Note: if this was routed to the Repair register, that entry will NOT be removed automatically.';
  confirmAction(warning, async ()=>{
    if(stockAffecting) addStock(r.sku, -r.qty, r.soc||'');
    DB.returns = DB.returns.filter(x=>x.id!==id);
    await saveDB();
    toast('Return record deleted.');
    navigate('returns','log');
  });
}
function exportReturns(){
  const rows = socFilter(DB.returns).map(r=>[r.id,r.department,r.sku,r.description,r.category,r.condition,r.qty,r.uom,r.status,r.returnedBy,fmtDate(r.dateReturned),r.receivedBy||'']);
  downloadCSV('department-returns.csv', ['Ref #','Department','SKU','Item','Category','Condition','Qty','UOM','Status','Returned by','Date returned','Received by'], rows);
}
async function receiveReturn(id){
  const r = DB.returns.find(x=>x.id===id);
  if(!r) return;
  if(r.condition==='Good'){
    addStock(r.sku, r.qty, r.soc||'');
  }else{
    const repId = nextCode('REP','rep');
    const info = skuInfo(r.sku);
    const initStatus = r.category==='Asset' ? classificationToRepairStatus(info&&info.assetCondition) : 'For Repair';
    DB.repairs.push({
      id:repId, assetTagging:r.assetTagging||'', sku:r.sku, description:r.description,
      dateReceived: nowISO(), status:initStatus,
      remarks: 'Returned by '+r.department+(r.remarks?(' — '+r.remarks):'')+(r.irFile?(' — IR: '+r.irFile):''),
      soc:r.soc||''
    });
  }
  r.status = r.category==='Asset' ? 'Asset Received' : 'Received';
  r.receivedBy = session.fullName; r.dateReceived = nowISO();
  syncOpenRequestAssetCodes();
  await saveDB();
  toast(r.condition==='Good' ? (id+' received — stock updated (+'+r.qty+' '+r.uom+').') : (id+' received — routed to repair register.'));
  navigate('returns','incoming');
}

/* ---- Dept Receiving (from Supplies) ---- */
function syncRequestReceipts(){
  // A request-level receipt confirms every issuance line linked to that request.
  // Also reconcile older records that were confirmed before this synchronization existed.
  const receivedRequests=new Map((DB.requests||[]).filter(r=>r.status==='Received').map(r=>[r.id,r]));
  (DB.issuance||[]).forEach(i=>{
    const r=receivedRequests.get(i.sourceRequestId);
    if(!r) return;
    if(!i.deptReceived){
      i.deptReceived=true;
      i.deptReceivedBy=r.receivedBy||'';
      i.deptReceivedDate=r.receivedDate||'';
    }else{
      if(!i.deptReceivedBy) i.deptReceivedBy=r.receivedBy||'';
      if(!i.deptReceivedDate) i.deptReceivedDate=r.receivedDate||'';
    }
  });
}
function renderDeptReceiving(){
  syncRequestReceipts();

    '<tr><th>Ref #</th><th>SKU</th><th>Item</th><th>Type</th><th>Qty</th><th>Asset tag</th><th>Transmittal</th><th>Date sent</th><th>Receipt</th></tr>' +
    list.slice().reverse().map(i=>`<tr>
      <td class="mono">${esc(i.id)}</td><td class="mono">${esc(i.sku)}</td><td>${esc(i.description)}</td>

      <td style="font-weight:700;">${i.qty} ${esc(i.uom)}</td><td class="mono">${esc(Array.isArray(i.assetCodes)&&i.assetCodes.length?i.assetCodes.join(', '):(i.assetTagging||'—'))}</td>
      <td class="mono">${i.sourceRequestId&&i.transmittalNo?`<button class="btn btn-sm" onclick="openTransmittal('${esc(i.sourceRequestId)}')">${esc(i.transmittalNo)}</button>`:esc(i.transmittalNo||'—')}</td><td>${fmtDate(i.date)}</td>

function dissuTagLookup(){
  const tag = normalizeAssetTagScan(document.getElementById('dissu-assettag').value);
  const skuEl=document.getElementById('dissu-sku-auto'), descEl=document.getElementById('dissu-desc'),
        qtyEl=document.getElementById('dissu-qty-auto'), hintEl=document.getElementById('dissu-tag-hint');
  dissuAutoFound = null;
  if(!tag){ skuEl.value=''; descEl.value=''; qtyEl.value=''; if(hintEl) hintEl.textContent=''; return; }
  const invRec = issuanceRecordForTag(tag, true);
  if(!invRec){
    skuEl.value=''; descEl.value=''; qtyEl.value='';
    if(hintEl) hintEl.textContent = 'No matching asset found in your department\'s current inventory for that tag.';
    return;
  }
  if(deptIssuanceRecordForTag(tag)){
    skuEl.value=''; descEl.value=''; qtyEl.value='';
    if(hintEl) hintEl.textContent = 'This asset has already been issued to a staff member.';
    return;
  }
  if(returnRecordForTag(tag)){
    skuEl.value=''; descEl.value=''; qtyEl.value='';
    if(hintEl) hintEl.textContent = 'This asset has already been returned to Supplies.';
    return;
  }
  dissuAutoFound = {sku:invRec.sku, description:invRec.description, uom:invRec.uom, assetTag:assetTagForRecord(invRec,tag)||tag};
  skuEl.value=invRec.sku; descEl.value=invRec.description; qtyEl.value='1';
  if(hintEl) hintEl.textContent = 'Asset found in your department\'s inventory. Auto-filled.';
}
function dissuSkuLookup(){
  const info = skuInfo(document.getElementById('dissu-sku').value);
  document.getElementById('dissu-desc').value = info?info.description:'';
}
function dissuOpsLookup(){
  const emp = empInfo(document.getElementById('dissu-opsid').value);
  document.getElementById('dissu-opsname').value = emp?emp.fullName:'';
}
async function submitDeptIssuance(){
  if(!dissuCategory){ toast('Select a category — Asset or Consumables.'); return; }
  const opsId = document.getElementById('dissu-opsid').value.trim();
  const emp = empInfo(opsId);
  const remarks = document.getElementById('dissu-remarks').value.trim();
  let info, qty, assetTagging='', deployedArea='';
  if(dissuCategory==='Asset'){
    const scannedTag = normalizeAssetTagScan(document.getElementById('dissu-assettag').value);
    const tag = dissuAutoFound&&dissuAutoFound.assetTag?dissuAutoFound.assetTag:scannedTag;
    if(!tag){ toast('Enter the asset tagging to look it up.'); return; }
    if(!dissuAutoFound){ toast('No available asset was found for that tag in your department\'s inventory.'); return; }
    deployedArea = document.getElementById('dissu-deployed-area').value.trim();
    if(!deployedArea){ toast('Enter the deployed area for this asset.'); return; }
    info = skuInfo(dissuAutoFound.sku);
    if(!info){ toast('That asset\'s SKU is no longer in the master list.'); return; }
    qty = 1;
    assetTagging = tag;
  } else {
    info = skuInfo(document.getElementById('dissu-sku').value.trim());
    qty = Number(document.getElementById('dissu-qty').value);
    if(!info){ toast('Enter a valid SKU code first.'); return; }
    if(!qty || qty<=0){ toast('Enter a quantity greater than 0.'); return; }
  }
  if(!opsId || !emp){ toast('Enter a valid Ops ID for the receiving staff member.'); return; }
  const id = nextCode('DI','di');
  DB.deptIssuance.push({id, department:session.department, sku:info.sku, description:info.description, uom:info.uom, qty, assetTagging, deployedArea, opsId, receivedByName:emp.fullName, remarks, date:nowISO(), issuedBy:session.fullName, soc:session.departmentSoc || ''});
  await saveDB();
  toast(id+' issued to '+emp.fullName+'.');
  dissuCategory=null; dissuAutoFound=null;
  navigate('dissuance','list');
}

function dretTagAutoLookup(){
  const tag = normalizeAssetTagScan(document.getElementById('dret-assettag-lookup').value);
  let found = null, foundSource = '';
  if(tag){
    let rec = issuanceRecordForTag(tag, true);
    if(rec){ found = {sku:rec.sku, description:rec.description, uom:rec.uom, qty:1, department:rec.department, assetTag:assetTagForRecord(rec,tag)||tag}; foundSource = 'inventory'; }
    if(!found){
      const drec = deptIssuanceRecordForTag(tag);
      if(drec){ found = {sku:drec.sku, description:drec.description, uom:drec.uom, qty:1, department:drec.department, assetTag:assetTagForRecord(drec,tag)||tag}; foundSource = 'issued'; }
    }
    if(!found){
      rec = issuanceRecordForTag(tag, false);
      if(rec){ found = {sku:rec.sku, description:rec.description, uom:rec.uom, qty:1, department:rec.department, assetTag:assetTagForRecord(rec,tag)||tag}; foundSource = 'inventory'; }
    }
  }
  dretAutoFound = found || null;
  const skuEl=document.getElementById('dret-sku-auto'), descEl=document.getElementById('dret-desc'),

  if(found){
    skuEl.value=found.sku; descEl.value=found.description; qtyEl.value=found.qty; uomEl.value=found.uom; deptEl.value=found.department;
    if(hintEl) hintEl.textContent = foundSource==='issued'
      ? 'Asset found — currently issued to staff within your department. Auto-filled.'
      : 'Asset found in your department\'s inventory. Auto-filled.';
  } else {
    skuEl.value=''; descEl.value=''; qtyEl.value=''; uomEl.value=''; deptEl.value=session.department;
    if(hintEl) hintEl.textContent = tag ? 'No matching asset found in your inventory or issued records for that tag — check it, or switch to "No Tagging".' : '';
  }

async function submitDeptReturn(){
  if(!dretCategory){ toast('Select a category — Asset or Consumables.'); return; }
  if(!dretCondition){ toast('Select a condition — Good or Damaged.'); return; }
  const usingTagLookup = dretCategory==='Asset' && dretCondition==='Damaged' && dretTagMode==='with';
  let info, qty, assetTagging='', irFile='';
  if(usingTagLookup){
    const scannedTag = normalizeAssetTagScan(document.getElementById('dret-assettag-lookup').value);
    if(!scannedTag){ toast('Enter the asset tagging to look it up.'); return; }
    if(!dretAutoFound){ toast('No matching asset was found in your inventory or issued records for that tag — check it, or switch to "No Tagging".'); return; }
    info = skuInfo(dretAutoFound.sku);
    qty = Number(dretAutoFound.qty)||1;
    assetTagging = dretAutoFound.assetTag||scannedTag;
    if(!info){ toast('That asset\'s SKU is no longer in the master list.'); return; }
    const fileEl = document.getElementById('dret-ir-file');
    const irFileObj = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
    if(!irFileObj){ toast('Upload the Incident Report (IR) before completing.'); return; }
    if(irFileObj.size > 4*1024*1024){ toast('IR file is too large (max 4MB).'); return; }
    irFile = irFileObj.name;
  } else {
    info = skuInfo(document.getElementById('dret-sku').value.trim());
    qty = Number(document.getElementById('dret-qty').value);
    if(!info){ toast('Enter a valid SKU code first.'); return; }
    if(!qty || qty<=0){ toast('Enter a quantity greater than 0.'); return; }
    if(dretCondition==='Damaged'){
      assetTagging = document.getElementById('dret-assettag').value.trim();
      const fileEl = document.getElementById('dret-ir-file');
      const irFileObj = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
      if(!irFileObj){ toast('Upload the Incident Report (IR) before completing.'); return; }
      if(irFileObj.size > 4*1024*1024){ toast('IR file is too large (max 4MB).'); return; }
      irFile = irFileObj.name;
    }
  }
  let irFileData = '';
  if(dretCondition==='Damaged'){
    const fileEl = document.getElementById('dret-ir-file');
    const irFileObj = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
    if(irFileObj){
      try{ irFileData = await readFileAsDataURL(irFileObj); }
      catch(e){ console.error('File read error', e); toast('Could not read the IR file — completing the return without it attached for viewing.'); }
    }
  }
  const remarks = document.getElementById('dret-remarks').value.trim();
  if(!remarks){ toast('Enter a remark / reason for the return.'); return; }
  const id = nextCode('RET','ret');
  DB.returns.push({
    id, department:session.department, category:dretCategory, condition:dretCondition,
    sku:info.sku, description:info.description, uom:info.uom, qty, assetTagging, irFile, irFileData, remarks,
    status:'Pending', dateReturned:nowISO(), returnedBy:session.fullName, receivedBy:null, dateReceived:null,
    soc:session.departmentSoc || ''
  });
  addNotification(session.department+' returned '+info.sku+' ('+id+')'+(dretCondition==='Damaged'?' — damaged, IR attached':'')+'.', 'supplies', 'returns', 'incoming');
  await saveDB();
  toast(id+' completed — returned to Supplies for pickup.');
  dretCategory=null; dretCondition=null; dretTagMode='with'; dretAutoFound=null;
  navigate('dreturn','list');
}

async function importSkuCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0, skipped = 0;
  rows.forEach(row=>{
    const sku = csvField(row, ['SKU','SKU Code']).trim();
    const desc = csvField(row, ['Description','Item Description']).trim();
    let type = csvField(row, ['Type']).trim();
    const uom = csvField(row, ['UOM']).trim();
    const pmRaw = csvField(row, ['PM','Preventive Maintenance','For PM']).trim();
    type = /^asset$/i.test(type) ? 'Asset' : (/^consumable$/i.test(type) ? 'Consumable' : '');
    if(!sku || !desc || !type || !uom || skuInfo(sku)){ skipped++; return; }
    const pm = type==='Asset' && /^(y|yes|true|1)$/i.test(pmRaw);
    DB.sku.push({sku, description:desc, type, uom, assetCondition: type==='Asset' ? 'Repairable' : undefined, pm, safetyStockDays: 7});
    setStock(sku, 0, currentSoc());
    DB.reorderPoint[sku] = 0;
    added++;
  });
  if(added){ await saveDB(); }
  toast('Imported '+added+' SKU'+(added===1?'':'s')+(skipped?(', skipped '+skipped+' (missing/duplicate/invalid).'):'.'));
  renderSettings();
}
// A department is now a {name, soc} entry — the same name can be added more
// than once, once per different SOC. `deptKey`/`parseDeptKey` round-trip a
// specific entry through a <select> option value so pickers stay unambiguous
// even when several entries share a name. `deptNames()` gives the deduped
// name list for pickers that only ever cared about the name (scope filters,
// accountability, issuance re-labelling).
const DEPT_KEY_SEP = '\u241F';
function deptKey(d){ return (d.name||'') + DEPT_KEY_SEP + (d.soc||''); }
function parseDeptKey(key){
  const idx = (key||'').lastIndexOf(DEPT_KEY_SEP);
  if(idx<0) return {name:key||'', soc:''};
  return {name:key.slice(0,idx), soc:key.slice(idx+1)};
}
function deptLabel(d){ return d.soc ? `${d.name} — ${d.soc}` : `${d.name} — Not site-specific`; }
function deptOptionsHtml(selectedKey){
  return DB.departments.map(d=>{
    const k = deptKey(d);
    return `<option value="${esc(k)}" ${k===selectedKey?'selected':''}>${esc(deptLabel(d))}</option>`;
  }).join('');
}
function deptNames(){ return Array.from(new Set(DB.departments.map(d=>d.name))); }
function deptSocOptionsHtml(selectedSoc){
  return '<option value="">— Not site-specific —</option>' + DB.warehouses.map(w=>`<option value="${esc(w)}" ${w===(selectedSoc||'')?'selected':''}>${esc(w)}</option>`).join('');
}
let departmentListSearch = '';
function departmentListMatches(department){
  const query=departmentListSearch.trim().toLowerCase();

}

}

const STATION_KEY_SEP = '\u241F';
function stationKey(s){ return (s.name||'') + STATION_KEY_SEP + (s.soc||''); }
function parseStationKey(key){

// Renaming a department in Settings must update every record across the system
// that stores that department name as a plain string, so nothing is left
// pointing at the old name.
function cascadeDepartmentRename(oldName, newName){
  DB.users.forEach(u=>{
    if(u.department===oldName) u.department = newName;
    if(u.departmentScope && u.departmentScope.includes(oldName)){
      u.departmentScope = u.departmentScope.map(d=>d===oldName?newName:d);
    }
  });
  (DB.employees||[]).forEach(e=>{ if(e.department===oldName) e.department = newName; });
  (DB.requests||[]).forEach(r=>{ if(r.department===oldName) r.department = newName; });
  (DB.deptIssuance||[]).forEach(d=>{ if(d.department===oldName) d.department = newName; });
  (DB.returns||[]).forEach(r=>{ if(r.department===oldName) r.department = newName; });
  (DB.pdaLogs||[]).forEach(l=>{ if(l.borrowerDepartment===oldName) l.borrowerDepartment = newName; });
  (DB.notifications||[]).forEach(n=>{ if(n.forDept===oldName) n.forDept = newName; });
  if(DB.pdaDeptBuckets){
    DB.pdaDeptBuckets = DB.pdaDeptBuckets.map(b=>b===oldName?newName:b);
  }
  if(DB.pdaAllocations && Object.prototype.hasOwnProperty.call(DB.pdaAllocations, oldName)){
    DB.pdaAllocations[newName] = DB.pdaAllocations[oldName];
    delete DB.pdaAllocations[oldName];
  }
  Object.values(DB.pdaAllocationsBySoc||{}).forEach(allocations=>{
    if(Object.prototype.hasOwnProperty.call(allocations,oldName)){
      allocations[newName]=allocations[oldName];
      delete allocations[oldName];
    }
  });
}

async function addUser(){
  const fullName = document.getElementById('new-user-name').value.trim();
  const username = document.getElementById('new-user-username').value.trim();
  const role = document.getElementById('new-user-role').value;
  const isDept = role === 'department';
  const isStaff = role === 'staff';
  const isHub = role === 'hub';
  const pass = isDept ? document.getElementById('new-user-pass-dept').value : document.getElementById('new-user-pass').value;
  const deptSel = isDept ? parseDeptKey(document.getElementById('new-user-dept').value) : undefined;
  const site = !isDept ? document.getElementById('new-user-site').value : undefined;
  const hubName = isHub ? document.getElementById('new-user-hub-name').value.trim() : '';
  if(!fullName||!username||!pass){ toast('Fill out all fields.'); return; }
  if((isStaff||isHub) && !site){ toast('Pick a Site (SOC) for this Staff/Hub login — required so their dashboard and inventory are scoped to that one SOC.'); return; }
  if(isHub&&!hubName){toast('Assign a HUB name so the portal can show only its destination cage transactions.');return;}
  if(isDept && !deptSel.name){ toast('Add a department in Settings first.'); return; }
  if(DB.users.find(u=>u.username.toLowerCase()===username.toLowerCase())){ toast('That username is taken.'); return; }
  const id = Math.max(0,...DB.users.map(u=>u.id))+1;
  const portal = isDept ? 'department' : 'supplies';
  const newUser = {id, username, password:pass, role, fullName, portal};
  if(isDept){ newUser.department = deptSel.name; newUser.departmentSoc = deptSel.soc; }
  if(isDept){
    const approverSel = document.getElementById('new-user-approver');
    const approverUsername = approverSel ? approverSel.value : '';
    if(approverUsername) newUser.approverUsername = approverUsername;
  }
  if(site) newUser.site = site;
  if(hubName) newUser.hubName = hubName;
  if(isStaff || isHub){
    newUser.processAccess = readProcessAccessCheckboxes('new-user-proc');
  }
  if(isStaff){
    newUser.skuScope = Array.from(document.getElementById('new-user-sku-scope').selectedOptions).map(o=>o.value);
    newUser.departmentScope = Array.from(document.getElementById('new-user-dept-scope').selectedOptions).map(o=>o.value);
    newUser.accountabilityScope = Array.from(document.getElementById('new-user-acct-scope').selectedOptions).map(o=>o.value);
  }
  DB.users.push(newUser);
  const ok = await saveDBWithRetry(()=>{
    if(!DB.users.find(u=>u.id===id)) DB.users.push(newUser);
  });
  if(ok){ logAudit('user_added', {id, username, role}); toast('Login added.'); }
  renderSettings();
}

async function saveUserEdit(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  const fullName = document.getElementById('edit-user-name').value.trim();
  const username = document.getElementById('edit-user-username').value.trim();
  const pass = document.getElementById('edit-user-pass').value;
  if(!fullName || !username){ toast('Full name and username are required.'); return; }
  if(DB.users.some(x=>x.id!==id && x.username.toLowerCase()===username.toLowerCase())){ toast('That username is taken.'); return; }
  const oldUsername = u.username;
  /* Captured once here (not read from the DOM again inside applyEdit) so
     the exact same edit can be safely replayed against a freshly-fetched
     DB after a save conflict, without re-reading form fields that may no
     longer reflect what the user actually submitted. */
  const role = u.role;
  const deptSel = role==='department' ? parseDeptKey(document.getElementById('edit-user-dept').value) : null;
  const approverUsername = role==='department' ? document.getElementById('edit-user-approver').value : null;
  const site = role!=='department' ? document.getElementById('edit-user-site').value : null;
  const hubName = role==='hub' ? document.getElementById('edit-user-hub-name').value.trim() : '';
  if((role==='staff'||role==='hub') && !site){ toast('Pick a Site (SOC) for this Staff/Hub login — required so their dashboard and inventory are scoped to that one SOC.'); return; }
  if(role==='hub'&&!hubName){toast('Assign a HUB name so the portal can show only its destination cage transactions.');return;}
  const processAccess = (role==='staff'||role==='hub') ? readProcessAccessCheckboxes('edit-user-proc') : null;
  const skuScope = role==='staff' ? Array.from(document.getElementById('edit-user-sku-scope').selectedOptions).map(o=>o.value) : null;
  const departmentScope = role==='staff' ? Array.from(document.getElementById('edit-user-dept-scope').selectedOptions).map(o=>o.value) : null;
  const accountabilityScope = role==='staff' ? Array.from(document.getElementById('edit-user-acct-scope').selectedOptions).map(o=>o.value) : null;
  const applyEdit = ()=>{
    const x = DB.users.find(y=>y.id===id);
    if(!x) return;
    x.fullName = fullName;
    x.username = username;
    if(oldUsername.toLowerCase()!==username.toLowerCase()){
      DB.users.forEach(y=>{ if(y.approverUsername && y.approverUsername.toLowerCase()===oldUsername.toLowerCase()) y.approverUsername = username; });
      DB.requests.forEach(r=>{ if(r.requiresApprovalFrom && r.requiresApprovalFrom.toLowerCase()===oldUsername.toLowerCase()) r.requiresApprovalFrom = username; });
    }
    if(pass) x.password = pass;
    if(role==='department'){
      x.department = deptSel.name;
      x.departmentSoc = deptSel.soc;
      if(approverUsername) x.approverUsername = approverUsername; else delete x.approverUsername;
    } else {
      if(site) x.site = site; else delete x.site;
      if(role==='hub') x.hubName=hubName; else delete x.hubName;
      if(role==='staff' || role==='hub') x.processAccess = processAccess;
      if(role==='staff'){
        x.skuScope = skuScope;
        x.departmentScope = departmentScope;
        x.accountabilityScope = accountabilityScope;
      }
    }
  };
  applyEdit();
  const ok = await saveDBWithRetry(applyEdit);
  if(ok){ logAudit('user_edited', {id, oldUsername, newUsername: username}); closeModal(); toast('User updated.'); }
  renderSettings();
}
function deleteUser(id){
  const target = DB.users.find(u=>u.id===id);

    });

  });
}

async function saveEmployeeEdit(i){
  const e = DB.employees[i];
  if(!e) return;
  const opsId = document.getElementById('edit-emp-ops').value.trim();
  const fullName = document.getElementById('edit-emp-name').value.trim();
  const agency = document.getElementById('edit-emp-agency').value.trim();
  const department = document.getElementById('edit-emp-dept').value.trim();

  const originalOpsId = e.opsId;
  const applyEdit = ()=>{
    const target = DB.employees.find(x=>x.opsId.toUpperCase()===originalOpsId.toUpperCase());

    else DB.employees.push({opsId, fullName, agency, department});
  };

  const ok = await saveDBWithRetry(applyEdit);

}
async function removeEmployee(i){

  if(!e) return;
  const opsId = e.opsId;
  DB.employees.splice(i,1);
  const ok = await saveDBWithRetry(()=>{
    const idx = DB.employees.findIndex(x=>x.opsId.toUpperCase()===opsId.toUpperCase());
    if(idx>-1) DB.employees.splice(idx,1);
  });
  if(ok) toast('Employee removed.');
  renderSettings();
}
async function importEmployeeCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0, skipped = 0;
  const newRecs = [];
  rows.forEach(row=>{
    const opsId = csvField(row, ['Ops ID','OpsId','Ops Id']).trim();
    const fullName = csvField(row, ['Full Name','Name']).trim();
    const agency = csvField(row, ['Agency']).trim();
    const department = csvField(row, ['Department']).trim();
    if(!opsId || !fullName || !department || empInfo(opsId) || newRecs.some(r=>r.opsId.toUpperCase()===opsId.toUpperCase())){ skipped++; return; }
    const rec = {opsId, fullName, agency, department};
    newRecs.push(rec);
    DB.employees.push(rec);
    added++;
  });
  if(added){
    const ok = await saveDBWithRetry(()=>{
      newRecs.forEach(rec=>{ if(!empInfo(rec.opsId)) DB.employees.push(rec); });
    });
    if(!ok){ renderSettings(); return; }
  }
  toast('Imported '+added+' employee'+(added===1?'':'s')+(skipped?(', skipped '+skipped+' (missing/duplicate).'):'.'));
  renderSettings();
}
function normalizeRole(raw){
  const r = String(raw||'').trim().toLowerCase();
  if(!r) return '';
  if(r==='admin' || r.includes('admin')) return 'admin';
  if(r==='department' || r.includes('department') || r.includes('dept')) return 'department';
  if(r==='hub' || r.includes('hub')) return 'hub';
  if(r==='staff' || r.includes('staff')) return 'staff';
  return '';
}
function parseProcessAccessField(raw){
  const vals = String(raw||'').split(';').map(x=>x.trim().toLowerCase()).filter(x=>x);
  if(vals.length===0) return [];
  return PROCESS_LIST.map(p=>p.key).filter(key=>{
    const label = processLabel(key).toLowerCase();
    return vals.some(v=> key===v || label===v || label.includes(v) || v.includes(key));
  });
}
async function importUserCsv(inputEl){
  const rows = await importCsvRows(inputEl);
  if(!rows) return;
  let added = 0;
  const problems = [];
  const addedUsers = [];
  rows.forEach((row, idx)=>{
    const rowNum = idx+2; // header is row 1, data starts at row 2
    const fullName = csvField(row, ['Full Name','Fullname','Name']).trim();
    const username = csvField(row, ['Username','User Name','Login']).trim();
    const roleRaw = csvField(row, ['Role','Portal Role']).trim();
    const role = normalizeRole(roleRaw);
    const password = csvField(row, ['Password','Pass']).trim();
    const deptRaw = csvField(row, ['Department','Dept']).trim();
    const deptSocRaw = csvField(row, ['Department SOC','Dept SOC']).trim();
    const siteRaw = csvField(row, ['Site','SOC','Warehouse']).trim();
    const hubNameRaw = csvField(row, ['HUB Name','Hub Name','Destination HUB']).trim();
    if(!fullName || !username || !password){
      problems.push('Row '+rowNum+': missing full name, username, or password.');
      return;
    }
    if(!role){
      problems.push('Row '+rowNum+': role "'+(roleRaw||'(blank)')+'" isn\'t recognized — use admin, staff, hub, or department.');
      return;
    }
    if(role==='hub'&&!hubNameRaw){problems.push('Row '+rowNum+': HUB Name is required for a Hub login.');return;}
    if(DB.users.find(u=>u.username.toLowerCase()===username.toLowerCase())){
      problems.push('Row '+rowNum+': username "'+username+'" already exists.');
      return;
    }
    let deptMatch;
    if(role==='department'){
      if(deptSocRaw){
        deptMatch = DB.departments.find(d=>d.name.toLowerCase()===deptRaw.toLowerCase() && (d.soc||'').toLowerCase()===deptSocRaw.toLowerCase());
      }
      if(!deptMatch) deptMatch = DB.departments.find(d=>d.name.toLowerCase()===deptRaw.toLowerCase());
      if(!deptMatch){
        problems.push('Row '+rowNum+': department "'+(deptRaw||'(blank)')+'" doesn\'t match any department on file.');
        return;
      }
    }
    const id = Math.max(0,...DB.users.map(u=>u.id),0)+1;
    const portal = role==='department' ? 'department' : 'supplies';
    const newUser = {id, username, password, role, fullName, portal};
    if(deptMatch){ newUser.department = deptMatch.name; newUser.departmentSoc = deptMatch.soc||''; }
    if(role!=='department' && siteRaw){
      const site = DB.warehouses.find(w=>w.toLowerCase()===siteRaw.toLowerCase());
      if(site) newUser.site = site;
    }
    if(role==='hub') newUser.hubName=hubNameRaw;
    if(role==='staff' || role==='hub'){
      const processRaw = csvField(row, ['Process Access','Process','Processes']);
      if(processRaw.trim()) newUser.processAccess = parseProcessAccessField(processRaw);
    }
    if(role==='staff'){
      const splitScope = v => v.split(';').map(x=>x.trim()).filter(x=>x);
      const skuScopeRaw = splitScope(csvField(row, ['SKU Scope']));
      const deptScopeRaw = splitScope(csvField(row, ['Department Scope']));
      const acctScopeRaw = splitScope(csvField(row, ['Accountability Scope']));
      newUser.skuScope = skuScopeRaw.filter(v=>skuInfo(v));
      newUser.departmentScope = deptScopeRaw.filter(v=>deptNames().includes(v));
      newUser.accountabilityScope = acctScopeRaw.filter(v=>DB.accountability.some(a=>a.name===v));
    }
    DB.users.push(newUser);
    addedUsers.push(newUser);
    added++;
  });
  let saveOk = true;
  if(added){
    saveOk = await saveDBWithRetry(()=>{
      addedUsers.forEach(nu=>{ if(!DB.users.find(u=>u.id===nu.id)) DB.users.push(nu); });
    });
    if(saveOk) logAudit('user_import', {added, skipped:problems.length});
  }
  if(added && !saveOk){
    toast('Import did not save — please try again.');
  } else if(problems.length){
    showModal(`
      <h3>Import results</h3>
      <p style="font-size:13.5px;color:var(--muted);margin:8px 0 14px;line-height:1.5;">Imported <b>${added}</b> login${added===1?'':'s'}. ${problems.length} row${problems.length===1?'':'s'} skipped — here's why:</p>
      <div style="max-height:300px;overflow-y:auto;font-size:12.5px;line-height:1.8;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fbfbfc;">
        ${problems.slice(0,60).map(m=>`<div>&bull; ${esc(m)}</div>`).join('')}
        ${problems.length>60?'<div class="small-note" style="margin-top:6px;">…and '+(problems.length-60)+' more row'+(problems.length-60===1?'':'s')+'.</div>':''}
      </div>
      <div class="footer-actions"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>
    `);
  } else {
    toast('Imported '+added+' login'+(added===1?'':'s')+'.');
  }
  renderSettings();
}

/* ============================= CAGE LOADING MODULE ============================= */
// Destination portals see only loads addressed to their assigned HUB/SOC.
function cageDestinationType(cage){ return String(cage&&cage.destinationType||((cage&&cage.hubName)?'HUB':'SOC')).trim().toUpperCase(); }
function cageDestinationName(cage){ return String(cage&&(cage.destinationName||cage.hubName||cage.receivedHubName||cage.soc)||'').trim(); }
function cageDestinationLabel(cage){ const name=cageDestinationName(cage);return name?name+' ('+cageDestinationType(cage)+')':'—'; }
function cageLogRouteLabel(cage){
  const destination=cageDestinationLabel(cage);
  return String(cage&&cage.sourceType||'').toUpperCase()==='HUB'?cageDestinationName({destinationName:cage.sourceName, destinationType:'HUB'})+' (HUB) → '+destination:destination;
}
function cageCurrentDestinationName(){
  if(!session) return currentSoc();
  if(session.role!=='hub') return currentSoc();
  const account=(DB.users||[]).find(user=>String(user.id)===String(session.id)||String(user.username||'').toLowerCase()===String(session.username||'').toLowerCase());
  return String(session.hubName||(account&&account.hubName)||currentSoc()||'').trim();
}
function cageMatchesCurrentDestination(cage){
  if(!session||session.role==='admin') return true;
  const assignedDestination=session.role==='hub'?cageCurrentDestinationName():currentSoc();
  return cageDestinationType(cage)===String(session.role==='hub'?'HUB':'SOC')&&cageAssetTagKey(cageDestinationName(cage))===cageAssetTagKey(assignedDestination);
}
function cageMatchesCurrentHubSource(cage){
  return !!(session&&session.role==='hub'&&cage&&String(cage.sourceType||'').toUpperCase()==='HUB'&&cageAssetTagKey(cage.sourceName)===cageAssetTagKey(cageCurrentDestinationName()));
}
function cageLogVisibleRows(){
  if(session&&session.role==='hub') return (DB.cages||[]).filter(cage=>cageMatchesCurrentDestination(cage)||cageMatchesCurrentHubSource(cage));
  return socFilter(DB.cages);
}
function cagePendingList(){ return (DB.cages||[]).filter(cg=>cg.status!=='Received'&&cageMatchesCurrentDestination(cg)); }
function cageBatchSignature(cage){
  const trip=String(cage&&cage.lhTripNumber||'').trim();
  const destinationType=cageDestinationType(cage);
  const destination=cageDestinationName(cage);
  const plate=String(cage&&cage.plateNumber||'').trim();
  const date=Date.parse(cage&&cage.dispatchedAt||'');
  if(!trip||!destination||!plate||!Number.isFinite(date)) return 'record:'+String(cage&&cage.id||'');
  return [trip,destinationType,destination,plate,new Date(date).toISOString().slice(0,10)].map(cageAssetTagKey).join('|');
}
function cageBatchRecords(cage){
  if(!cage) return [];
  if(cage.batchId) return (DB.cages||[]).filter(item=>item.batchId===cage.batchId);
  const signature=cageBatchSignature(cage);
  return (DB.cages||[]).filter(item=>!item.batchId&&cageBatchSignature(item)===signature);
}
function cageBatchIdForIssue(cage){
  const signature=cageBatchSignature(cage);
  const matching=(DB.cages||[]).filter(item=>cageBatchSignature(item)===signature);
  const active=matching.filter(item=>item.status!=='Received');
  let batchId=active.find(item=>item.batchId)?.batchId||'';
  if(!batchId&&active.length) batchId='CB-'+active[0].id;
  if(!batchId) batchId='CB-'+cage.id;
  matching.forEach(item=>{
    if(!item.batchId&&active.length) item.batchId=batchId;
  });
  return batchId;
}
function updateCageBatchReceiptProgress(cage){
  const members=cageBatchRecords(cage);
  if(!members.length) return {received:0,total:0,complete:false};
  const received=members.filter(item=>item.status==='Received').length;
  const complete=received===members.length;
  const batchStatus=complete?'Received':(received?'Receiving':'In Transit');
  members.forEach(item=>{item.batchReceivedCount=received;item.batchCageCount=members.length;item.batchStatus=batchStatus;});
  return {received,total:members.length,complete};
}
function cageBatchSummaries(){
  const groups=new Map();
  cageLogVisibleRows().forEach(cage=>{
    const key=cage.batchId?'batch:'+cage.batchId:'signature:'+cageBatchSignature(cage);
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(cage);
  });
  return [...groups.values()].map(members=>{
    const received=members.filter(item=>item.status==='Received').length;
    return {members,total:members.length,received,remaining:members.length-received,complete:received===members.length};
  }).filter(batch=>batch.total>1).sort((a,b)=>String(a.members[0].dispatchedAt||'').localeCompare(String(b.members[0].dispatchedAt||'')));
}
function cageBatchProgressHtml(){
  const batches=cageBatchSummaries();
  if(!batches.length) return '';
  return '<div class="card"><h3>Batch receipt progress</h3><div class="card-sub">Cages issued on the same LH trip, truck, and destination are grouped together. Each scanned cage is recorded as received; the batch is complete after every tag is received.</div><div class="tbl-wrap"><table><tr><th>LH Trip #</th><th>Destination</th><th>Plate #</th><th>Cages</th><th>Received</th><th>Remaining</th><th>Batch status</th></tr>'+batches.map(batch=>{
    const first=batch.members[0];
    const status=batch.complete?'<span class="tag tag-ok">Received</span>':batch.received?'<span class="tag tag-pending">Receiving</span>':'<span class="tag tag-pending">In Transit</span>';
    return `<tr><td class="mono">${esc(first.lhTripNumber||'—')}</td><td>${esc(cageLogRouteLabel(first))}</td><td class="mono">${esc(first.plateNumber||'—')}</td><td>${batch.total}</td><td>${batch.received}/${batch.total}</td><td>${batch.remaining}</td><td>${status}</td></tr>`;
  }).join('')+'</table></div></div>';
}

function cageStatusTag(cg){
  if(cg.status==='Received') return '<span class="tag tag-ok">Received</span>';
  return '<span class="tag tag-pending">'+esc(cg.status||'In Transit')+'</span>';
}
function amsTagsSummary(cg){
  const tags = cageCargoAmsTagsOf(cg);
  if(tags.length===0) return '<span class="small-note">—</span>';
  if(tags.length<=3) return tags.map(t=>esc(t)).join(', ');
  return tags.slice(0,3).map(t=>esc(t)).join(', ')+' <span class="small-note">+'+(tags.length-3)+' more</span>';
}
function cageCargoAmsTagsOf(cg){
  const raw = cg && cg.amsTags;
  const tags = Array.isArray(raw) ? raw : (raw ? String(raw).split(/[,;\n]+/) : []);
  return tags.map(tag=>String(tag||'').trim()).filter(Boolean);
}

}

function onCageReturnScanInput(){
  const el=document.getElementById('cage-return-scan');if(!el)return;
  clearTimeout(cageReturnScanTimer);const value=el.value.trim();if(!value)return;
  cageReturnScanTimer=setTimeout(()=>{const current=document.getElementById('cage-return-scan');if(current&&current.value.trim()===value)addCageToReturnBatch();},150);
}
function addCageToReturnBatch(){
  if(!session||session.role!=='hub'){toast('Only a HUB account can start a return-to-SOC trip.');return;}
  clearTimeout(cageReturnScanTimer);const el=document.getElementById('cage-return-scan');const value=(el?el.value:'').trim();
  if(!value){toast('Scan a cage asset tag first.');return;}
  const key=cageAssetTagKey(value);const cage=(DB.cageMasterlist||[]).find(item=>cageAssetTagKey(item.assetTag)===key);
  if(!cage){toast('Cage '+value+' is not on the source SOC masterlist.');if(el){el.value='';el.focus();}return;}
  if(cageInventoryEffectiveStatus(cage)!=='At HUB'||cageAssetTagKey(cageInventoryCurrentLocation(cage))!==cageAssetTagKey(cageCurrentDestinationName())){
    toast(cageInventoryEffectiveStatus(cage)==='In Transit'?'Cage '+value+' must be received at this HUB before it can be returned.':'Cage '+value+' is not currently at this HUB.');
    if(el){el.value='';el.focus();}return;
  }
  if(cageReturnBatch.includes(cage.id)){toast('That cage is already in this return trip.');if(el){el.value='';el.focus();}return;}
  cageReturnBatch.push(cage.id);if(el){el.value='';el.focus();}refreshCageReturnBatchTable();

async function scanCageAssetTagToReceive(){
  clearTimeout(cageReceiveScanTimer);
  const el = document.getElementById('receive-cage-asset-scan');
  const v = (el?el.value:'').trim();
  if(!v){ toast('Scan a cage asset tag first.'); return; }
  if(actionInFlight){ toast('Wait for the current cage receipt to finish.'); if(el){el.value='';el.focus();} return; }
  const key=cageAssetTagKey(v);
  // Scanner input can fire the debounce and Enter handlers for the same scan.
  // Ignore that second submission even if the first receipt has just finished.
  const now=Date.now();
  if(key && key===cageReceiveLastSubmittedKey && now-cageReceiveLastSubmittedAt<2000){
    if(el){el.value='';el.focus();}
    return;
  }
  const pending=cagePendingList();
  const cg=pending.find(c=>cageAssetTagKey(c.cageAssetTag||c.cageId)===key);
  if(!cg){
    const matches=(DB.cages||[]).filter(c=>cageAssetTagKey(c.cageAssetTag||c.cageId)===key)
      .sort((a,b)=>Date.parse(b.dispatchedAt||b.createdAt||0)-Date.parse(a.dispatchedAt||a.createdAt||0));
    const known=matches[0];
    if(known&&known.status==='Received'){
      const batch=cageBatchRecords(known);
      const received=batch.filter(item=>item.status==='Received').length;
      const total=batch.length;
      toast(total>1?`Cage ${v} was already received. Batch progress: ${received}/${total}.`:`Cage ${v} was already received.`);
    }else if(known){
      toast(`Cage ${v} is not awaiting receipt. Current status: ${known.status||'Unknown'}.`);
    }else{
      toast(`No issued cage matches ${v}. Scan the physical cage asset tag.`);
    }
    if(el){el.value='';el.focus();}
    return;
  }
  cageReceiveLastSubmittedKey=key;
  cageReceiveLastSubmittedAt=now;
  if(el) el.value='';
  if(el) el.disabled=true;
  await receiveScannedCage(cg.id);
}
function returnCageToMasterlist(shipment,receivedLocation,receivedAt){
  const assetTag=shipment.cageAssetTag||shipment.cageId||'';
  let item=(DB.cageMasterlist||[]).find(c=>c.id===shipment.cageAssetId);
  if(!item && assetTag) item=(DB.cageMasterlist||[]).find(c=>cageAssetTagKey(c.assetTag)===cageAssetTagKey(assetTag));
  if(!item && assetTag){
    item={id:nextCode('CGA','cga'),assetTag,soc:shipment.soc||'',status:'Available',addedAt:receivedAt,addedBy:'Received cage',currentShipmentId:'',location:receivedLocation||shipment.soc||'',lastReceivedAt:receivedAt,lastIssuedAt:''};
    DB.cageMasterlist.push(item);
  }
  if(!item) return;
  const ownerSoc=item.soc||shipment.soc||'';
  if(!item.soc&&ownerSoc) item.soc=ownerSoc;
  const destinationType=cageDestinationType(shipment);
  const destinationName=receivedLocation||cageDestinationName(shipment)||ownerSoc;
  item.status=destinationType==='HUB'?'At HUB':(cageAssetTagKey(destinationName)===cageAssetTagKey(ownerSoc)?'Available':'At SOC');
  item.currentShipmentId='';
  item.lastReceivedAt=receivedAt;
  item.location=destinationName||ownerSoc||item.location||'';
}
async function receiveScannedCage(cageId){
  const now=nowISO();

  let outcome='pending';
  const applyReceive=()=>{
    receipt=null;
    const current=DB.cages.find(cg=>cg.id===cageId);
    if(!current){outcome='missing';return;}
    if(current.status==='Received'){outcome='received';return;}
    if(!cageMatchesCurrentDestination(current)){outcome='notAllowed';return;}
    const destinationName=cageDestinationName(current)||currentSoc()||'';
    current.status='Received';current.receivedBy=session.fullName;current.receivedByRole=session.role;current.receivedAt=now;current.receivedLhTripNumber=current.lhTripNumber||'';current.receivedHubName=destinationName;
    returnCageToMasterlist(current,destinationName,now);

  };
  const saved=await saveDBWithRetry(applyReceive);
  if(!saved){restoreCageSectionsAfterFailedSave();navigate('cageloading','receive');return;}
  if(outcome==='missing'){toast('This cage record no longer exists. Refreshing the list.');navigate('cageloading','receive');return;}
  if(outcome==='notAllowed'){toast('This cage is assigned to a different destination.');navigate('cageloading','receive');return;}
  if(!receipt){toast('This cage was already received. Refreshing the list.');navigate('cageloading','receive');return;}
  cageReceiveLastReceipt=receipt;
  toast(receipt.batchCageCount>1?(receipt.batchComplete?'Batch receipt complete — all '+receipt.batchCageCount+' cages received.':'Cage '+receipt.cageAssetTag+' received ('+receipt.batchReceivedCount+'/'+receipt.batchCageCount+'). Batch is still awaiting '+(receipt.batchCageCount-receipt.batchReceivedCount)+' cage(s).'):'Cage '+receipt.cageAssetTag+' received. LH Trip '+(receipt.lhTripNumber||'—')+' · Destination '+(receipt.destinationName||'—')+'.');
  navigate('cageloading','receive');
  const input=document.getElementById('receive-cage-asset-scan');
  if(input)input.focus();
}

function deleteCageLog(id){
  if(!session||session.role!=='admin') return;
  const record=DB.cages.find(cage=>cage.id===id);
  if(!record) return;
  const warning=record.status==='Received'
    ? `Delete cage log ${id} for ${record.cageAssetTag||record.cageId}? The masterlist asset will remain. This cannot be undone.`
    : `Delete in-transit cage log ${id} for ${record.cageAssetTag||record.cageId}? The cage will remain on the masterlist at ${cageDestinationName(record)||'its destination'}, and this log cannot be restored.`;
  confirmAction(warning,async()=>{
    let missing=false;
    const saved=await saveDBWithRetry(()=>{
      const current=DB.cages.find(cage=>cage.id===id);
      if(!current){missing=true;return;}
      const batchMembers=cageBatchRecords(current);
      const inventory=DB.cageMasterlist.find(cage=>cage.id===current.cageAssetId)||DB.cageMasterlist.find(cage=>cageAssetTagKey(cage.assetTag)===cageAssetTagKey(current.cageAssetTag||current.cageId));
      if(inventory&&inventory.currentShipmentId===id){
        inventory.currentShipmentId='';
        if(current.status!=='Received'){
          inventory.status=cageDestinationType(current)==='HUB'?'At HUB':'At SOC';
          inventory.location=cageDestinationName(current)||inventory.location||inventory.soc||'';
        }
      }
      DB.cages=DB.cages.filter(cage=>cage.id!==id);
      const remaining=batchMembers.find(member=>member.id!==id&&DB.cages.some(cage=>cage.id===member.id));
      if(remaining) updateCageBatchReceiptProgress(remaining);
    });
    if(!saved){restoreCageSectionsAfterFailedSave();return;}
    if(missing){toast('This cage log was already removed.');return;}
    toast('Cage log deleted.');
    navigate('cageloading','list');
  });
}
